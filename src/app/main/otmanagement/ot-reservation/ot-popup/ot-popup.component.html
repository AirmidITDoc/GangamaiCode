<div class="page-layout modal-wrapper grid-container">
    <div class="modal-header accent">
        <div class="modal-header-content" fxLayout="row"
            style="height:50px; justify-content: space-between;width: 100%;">
            <div class="modal-header-title" fxLayout="row" fxLayoutAlign="start center">

                <mat-icon class="logo-icon mr-16" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}"
                    style="color: white;">account_box
                </mat-icon>
                <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}"
                    style="color: white;">
                    OT Reservation Date Postpone
                </span>
            </div>
            <div class="close-icon">
                <button mat-icon-button tabIndex="-1" (click)="onClose()" aria-label="Close dialog">
                    <mat-icon>close</mat-icon>
                </button>
            </div>
        </div>
    </div>
    <div class="modal-body">
        <form [formGroup]="reservationDateForm">
            <div fxLayout="column" fxLayoutGap="10px" fxFlexFill>
                <div fxLayout="row" fxLayoutGap="4px">
                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>Patient Name</mat-label>
                        <input name="PatientName" formControlName="PatientName" placeholder="PatientName" matInput
                            type="text" [(ngModel)]="vPatientName" readonly>
                    </mat-form-field>

                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>Surgery Date</mat-label>
                        <input name="Surgerydate" matInput [matDatepicker]="picker1" formControlName="surgeryDate"
                            #surgeryDateInput />
                        <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
                        <mat-datepicker #picker1></mat-datepicker>
                    </mat-form-field>
                </div>

                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Enter Reason...</mat-label>
                    <textarea rows="5" name="Reason" formControlName="reason" placeholder="Enter Reason...." matInput
                        type="text"></textarea>
                </mat-form-field>
            </div>
        </form>
    </div>
    <div class="modal-footer" class="p-12">
        <div class="footer-navigation-container" fxLayoutAlign="end">
            <div class="modal-footer-buttons" fxLayoutGap="6px">
                <button class="btn btn-danger-outline" (click)="onClose()">Cancel</button>
                <button class="btn btn-primary" (click)="onSubmit()">Save</button>
            </div>
        </div>
    </div>

</div>
