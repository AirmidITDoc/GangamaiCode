<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div fxFlex.gt-sm="100%" fxFlex>
        <!-- <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
            <mat-tab label="OT Reservation List"> -->
        <div class="top-header header accent" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
            fxLayoutAlign.gt-xs="space-between center ">
            <div class="top-header-info">
                <div class="top-header-title">
                    <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                        OT Reservation List
                    </span>
                </div>
            </div>
            <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
                <button mat-raised-button (click)="onNewotReservation()">New OTReservation
                </button>

            </div>
        </div>
        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

            <ng-template #firstActionButtonTemplate let-element>
                <div fxLayout="row" fxLayoutAlign="center center" class="gap-12">
                    <button mat-icon-button matTooltip="Medical Clearance">
                        <mat-icon>
                            <img width="30px" height="30px" src="assets/images/logos/insurance.png">
                        </mat-icon>
                    </button>

                    <button mat-icon-button matTooltip="Financial Clearance">
                        <mat-icon>
                            <img width="30px" height="30px" src="assets/images/logos/finance.png">
                        </mat-icon>
                    </button>

                    <button mat-icon-button matTooltip="Reservation PostPond" (click)="tOTBookingDateChange(element)"
                        [disabled]="element.otCheckInId">
                        <mat-icon>date_range</mat-icon>
                    </button>

                    <button mat-icon-button matTooltip="Check In" (click)="checkInForm(element)">
                        <!-- matTooltip]="element.isCheckedIn ? 'Check Out' : 'Check In'" 
                         need to change in list proc-->
                        <mat-icon>
                            <img width="30px" height="30px" src="assets/images/logos/check-in.png">
                        </mat-icon>
                    </button>

                    <button mat-icon-button matTooltip="Pre-Operation" (click)="preOperationForm(element)"
                        [disabled]="!(element.otCheckInId > 0)">
                        <mat-icon>
                            <img width="30px" height="30px" src="assets/images/logos/preOper.png">
                        </mat-icon>
                    </button>

                    <!-- <button mat-icon-button matTooltip="Theater-In" (click)="theaterIn(element)"> -->
                    <!-- this icon should disable when i do preOper then only 
                         (To confirm patient is inside OT) -->
                    <!-- <mat-icon>
                            <img width="30px" height="30px" src="assets/images/logos/theaterIn.png">
                        </mat-icon>
                    </button> -->

                    <button mat-icon-button matTooltip="In-Operation" (click)="onInOperation(element)"
                        [disabled]="!(element.otPreOperationId > 0)">
                        <mat-icon>
                            <img width="30px" height="30px" src="assets/images/logos/inOper.png">
                        </mat-icon>
                    </button>

                    <button mat-icon-button matTooltip="Anesthesia Record" (click)="onAnesthesiaRecord(element)">
                        <!-- this icon should disable when i do inOper then only 
                         (To record complete drugs ) -->
                        <mat-icon>
                            <img width="30px" height="30px" src="assets/images/logos/anesthesia.png">
                        </mat-icon>
                    </button>

                    <button mat-icon-button matTooltip="Post-Operation" (click)="postOperationForm(element)">
                        <!-- this icon should disable when i do aneths then only enable -->
                        <mat-icon>
                            <img width="30px" height="30px" src="assets/images/logos/postOper.png">
                        </mat-icon>
                    </button>
                </div>
            </ng-template>

            <ng-template #actionsTemplate let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <mat-icon *ngIf="element.opIpType=='1'" matTooltip="IP"
                        class="pill green-600 s-16">circle</mat-icon>

                    <mat-icon *ngIf="element.opIpType=='0'" matTooltip="OP"
                        class="pill orange-600 s-16">circle</mat-icon>
                </div>
            </ng-template>

            <ng-template #actionsTemplate1 let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <mat-icon *ngIf="element.otRequestId > 0 ; else noRequest" matTooltip="Request Accepted"
                        class="pill blue-600 s-16 ">circle</mat-icon>
                </div>
            </ng-template>

            <ng-template #actionButtonTemplate let-element>
                <div fxLayout="row" fxLayoutAlign="center center">

                    <button mat-icon-button matTooltip="Edit Reservation" (click)="OnEdit(element)">
                        <mat-icon>edit</mat-icon>
                    </button>

                    <button mat-icon-button matTooltip="Print" (click)="OnPrint(element)">
                        <mat-icon> print</mat-icon>
                    </button>

                    <button mat-icon-button matTooltip="Cancel" (click)="OnCancel(element)">
                        <mat-icon> cancel</mat-icon>
                    </button>

                    <app-airmid-consentform-icon [refId]="element.otReservationId" [opipId]="element.opIpId"
                        [opipType]="element.opIpType"></app-airmid-consentform-icon>
                </div>
            </ng-template>
            <airmid-table [gridConfig]="gridConfig" class="content">
                <ng-container filters>
                    <form [formGroup]="myFilterform">

                        <airmid-datepicker [formGroup]="myFilterform" [isRangePicker]="true"
                            formStartControlName="start" formEndControlName="end"
                            [(fromValue)]="gridConfig.filters[0].fieldValue"
                            [(toValue)]="gridConfig.filters[1].fieldValue"></airmid-datepicker>

                        <mat-form-field appearance="outline">
                            <mat-label>UHID No</mat-label>
                            <input matInput placeholder="Search UHID No" autocomplete="off" [formGroup]="myFilterform"
                                formControlName="RegNo" (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('RegNo')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>


                        <mat-form-field appearance="outline">
                            <mat-label>First Name</mat-label>
                            <input matInput placeholder="Search First Name" autocomplete="off"
                                [formGroup]="myFilterform" formControlName="FirstName" (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('FirstName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <mat-form-field appearance="outline">
                            <mat-label>Last Name</mat-label>
                            <input matInput placeholder="Search Last Name" autocomplete="off" [formGroup]="myFilterform"
                                formControlName="LastName" (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('LastName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <mat-radio-group formControlName="opipType" name="opipType" fxLayout="column"
                            (change)="onChangeFirst()" style="padding: 8px;">

                            <div fxLayout="row" fxLayoutAlign="start center" style="gap: 8px;">
                                <mat-icon class="pill">circle</mat-icon>
                                <mat-radio-button value="2">ALL</mat-radio-button>
                            </div>

                            <div fxLayout="row" fxLayoutAlign="start center" style="gap: 8px;">
                                <mat-icon class="pill orange-600 s-16">circle</mat-icon>
                                <mat-radio-button value="0">OP</mat-radio-button>
                            </div>

                            <div fxLayout="row" fxLayoutAlign="start center" style="gap: 8px;">
                                <mat-icon class="pill green-600 s-16">circle</mat-icon>
                                <mat-radio-button value="1">IP</mat-radio-button>
                            </div>
                        </mat-radio-group>
                    </form>
                </ng-container>
            </airmid-table>
        </div>
        <!-- </mat-tab> -->
