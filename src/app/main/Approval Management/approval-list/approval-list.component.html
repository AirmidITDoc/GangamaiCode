<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                   Approval List
                </span>
            </div>
        </div> 
    </div>

    <div fusePerfectScrollbar
        class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
        dynamicTableHeight>

        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

            <ng-template #approvalStatus let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <mat-icon *ngIf="element.approvalStatus == 1" matTooltip="Verified"
                        style="color: green;">check_circle</mat-icon>

                    <mat-icon *ngIf="element.approvalStatus == 0" matTooltip="Pending"
                        color="warn">hourglass_empty</mat-icon>
                </div>
            </ng-template>  

            <ng-template #actionTemplate let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <!-- <button mat-icon-button matTooltip="Approve"  
                                        *ngIf="!element.approvalStatus == 0 ">
                                        <mat-icon>edit</mat-icon>
                                    </button> -->
                    <button class="btn btn-danger"   matTooltip="Pending for Approval"
                       matTooltipPosition="above" style="padding: 4px;color: white;"
                        *ngIf="!element.approvalStatus" (click)="getCommanApprovalDateList(element)"> Pending
                    </button>
                    <button class="btn btn-success"   matTooltip="Approval Completed"
                       matTooltipPosition="above" style="padding: 4px;color: white;background-color: green;"
                        *ngIf="element.approvalStatus"> Approved
                    </button>
                     <button class="btn btn-success"   matTooltip="Direct Approval"
                       matTooltipPosition="above" style="padding: 4px;color: white;background-color: orange;"
                        *ngIf="!element.approvalStatus && element.transactionType == 'OPD Discount Approval'"
                        (click)="getDirectApproval(element,'Approval')"> Direct Approve
                    </button>
                     <button class="btn btn-danger"   matTooltip="Reject Approval"
                       matTooltipPosition="above" style="padding: 4px;color: white;background-color: rgb(243, 97, 97);"
                        *ngIf="!element.approvalStatus && element.transactionType == 'OPD Discount Approval'"
                        (click)="getDirectApproval(element,'Reject')"> Reject
                    </button>
                </div>
            </ng-template>

            <airmid-table [gridConfig]="gridConfig" class="content" :ShowButtons="false" #grid
               >
                <ng-container filters>
                    <form [formGroup]="_ApprovalListService.ApprovalForm" fxLayout="column">
                        <airmid-datepicker [formGroup]="_ApprovalListService.ApprovalForm" [isRangePicker]="true"
                            formStartControlName="start" formEndControlName="end"    [(fromValue)]="gridConfig.filters[1].fieldValue"
                            [(toValue)]="gridConfig.filters[2].fieldValue">
                        </airmid-datepicker> 

                        <div fxFlex fxLayout="row">
                            <span style="font-weight: bold;">Status : </span>
                            <mat-slide-toggle name="Status" (change)="onChangeFirst()" formControlName="Status">
                                Approved / Pending
                            </mat-slide-toggle>
                        </div>
                    </form>

                </ng-container>
            </airmid-table>
        </div> 
    </div>

</div>
