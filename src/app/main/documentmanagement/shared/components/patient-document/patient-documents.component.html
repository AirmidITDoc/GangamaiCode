<div class="split" [class.tree-only]="!showViewer">
    <aside class="pane left">
        <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>
        <app-category-tree [nodes]="treeNodes" [expandAll]="false" [showDocumentActions]="true"
            [selectedFileId]="selectedFileId ?? selectedFile?.id ?? null" (selectFile)="onSelectFile($event)"
            (uploadDocument)="uploadDocument.emit($event)" (viewDocuments)="viewDocuments.emit($event)"
            (generateQrCode)="generateQrCode.emit($event)">
        </app-category-tree>
    </aside>

    <section class="pane right" *ngIf="showViewer">
        <app-document-viewer [file]="selectedFile"></app-document-viewer>
    </section>
</div>
