<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Complaint List
                </span>
            </div>
        </div>
        <!-- *ngIf="IsAdd" -->
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onSave()">+ New Complaint
            </button>
        </div>
    </div>
    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">


        <ng-template #actionsTemplateactive let-element>
            <div fxLayout="row" fxLayoutAlign="center center">
                <!-- 
                <mat-icon *ngIf="element.isdeleted == 1" title="Isdeleted" style="background-color: red;">
                    <img width="30px" height="30px" src="assets/images/logos/drugtype.png">
                </mat-icon> -->
            </div>
        </ng-template>

        <!-- <ng-template #actionsTemplatebatch let-element>
            <div fxLayout="row" fxLayoutAlign="center center">

                <mat-icon *ngIf="element.isBatchRequired == true" title="IsBatchRequired"
                    style="background-color: rgb(232, 127, 52);">
                    <img width="30px" height="30px" src="assets/images/logos/drugtype.png">
                </mat-icon>

            </div>
        </ng-template> -->

        <ng-template #actionButtonTemplate let-element>
            <div fxLayout="row" fxLayoutAlign="center center">

                <button mat-icon-button matTooltip="Edit Complaint" (click)="onEdit(element)">
                    <mat-icon> edit</mat-icon>
                </button>

                  <button mat-icon-button matTooltip="Print Complaint" (click)="onprint(element)">
                    <mat-icon> print</mat-icon>
                </button>

                <button mat-icon-button matTooltip="Delete" (click)="delitem(element)">
                    <mat-icon>delete</mat-icon>
                </button>


            </div>
        </ng-template>

        <airmid-table [gridConfig]="gridConfig" class="content">
            <ng-container filters>
                <form [formGroup]="myformSearch" fxLayout="column">


                    <airmid-datepicker [formGroup]="myformSearch" [isRangePicker]="true" formStartControlName="fromDate"
                        formEndControlName="enddate" [(fromValue)]="gridConfig.filters[2].fieldValue"
                               [(toValue)]="gridConfig.filters[3].fieldValue"></airmid-datepicker>


                    <mat-form-field appearance="outline">
                        <mat-label>RegNo</mat-label>
                        <input matInput placeholder="Search RegNo" autocomplete="off" [formGroup]="myformSearch"
                            formControlName="RegNo" (input)="onChangeFirst()" />
                        <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('RegNo')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>

                     <mat-form-field appearance="outline" fxFlex>
                        <mat-label>Person Name</mat-label>
                        <input matInput placeholder="Search Patient Name" autocomplete="off" (input)="onChangeFirst()"
                            [formGroup]="myformSearch" formControlName="NameSearch" />
                        <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('NameSearch')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>


                </form>

            </ng-container>
        </airmid-table>
    </div>
</div>
