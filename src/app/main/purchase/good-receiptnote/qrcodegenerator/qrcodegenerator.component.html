<div class="qr-generator">
    <div class="header accent">
        <div class="header-content">
            <span class="title">{{ Title }}</span>
            <button mat-icon-button type="button" aria-label="Close" (click)="onClose()">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </div>

    <div class="generator-content">
        <div class="generator-items" *ngIf="QrData.length; else noData">
            <div class="generator-item" *ngFor="let item of QrData">
                <div class="code-preview">
                    <img *ngIf="generatedType === 'qr' && item.qrDataUrl" [src]="item.qrDataUrl"
                        [width]="qrWidth(item)" [height]="qrWidth(item)" [alt]="'QR code for ' + item.QrCodeData">
                    <img *ngIf="generatedType === 'barcode' && item.barcodeDataUrl" [src]="item.barcodeDataUrl"
                        [style.width.mm]="item.Width"
                        [alt]="'Barcode for ' + item.QrCodeData">
                    <span class="code-value" *ngIf="generatedType">{{ item.QrCodeData }}</span>
                    <span class="code-placeholder" *ngIf="!generatedType">
                        Choose a code type to generate a preview.
                    </span>
                </div>

                <div class="code-settings">
                    <mat-form-field appearance="outline">
                        <mat-label>Quantity</mat-label>
                        <input [(ngModel)]="item.Qty" matInput type="number" min="1" autocomplete="off">
                    </mat-form-field>
                    <mat-form-field appearance="outline">
                        <mat-label>Width (mm)</mat-label>
                        <input [(ngModel)]="item.Width" matInput type="number" min="1" autocomplete="off">
                    </mat-form-field>
                    <mat-form-field appearance="outline">
                        <mat-label>Space between codes (mm)</mat-label>
                        <input [(ngModel)]="item.Between" matInput type="number" min="0" autocomplete="off">
                    </mat-form-field>
                    <mat-form-field appearance="outline">
                        <mat-label>Bottom margin (mm)</mat-label>
                        <input [(ngModel)]="item.Margin" matInput type="number" min="0" autocomplete="off">
                    </mat-form-field>
                </div>
            </div>
        </div>

        <ng-template #noData>
            <p class="empty-message">There is no data to generate a code.</p>
        </ng-template>

        <div class="generator-actions">
            <button mat-raised-button color="primary" type="button" [disabled]="!QrData.length"
                (click)="generate('qr')">
                Generate QR Code
            </button>
            <button mat-raised-button color="primary" type="button" [disabled]="!QrData.length"
                (click)="generate('barcode')">
                Generate Barcode
            </button>
            <span class="action-spacer"></span>
            <button mat-stroked-button type="button" printSectionId="dvPrintQr" ngxPrint
                [disabled]="!qrGenerated">
                Print QR Code
            </button>
            <button mat-stroked-button type="button" printSectionId="dvPrintBarcode" ngxPrint
                [disabled]="!barcodeGenerated">
                Print Barcode
            </button>
        </div>
    </div>

    <div id="dvPrintQr" class="print-section">
        <div *ngFor="let item of QrData" class="print-item">
            <div *ngFor="let copy of copies(item)" class="qr-print-copy"
                [style.width.mm]="item.Width" [style.height.mm]="item.Width"
                [style.margin-left.mm]="item.Between" [style.margin-bottom.mm]="item.Margin + 1">
                <img *ngIf="item.qrDataUrl" [src]="item.qrDataUrl"
                    [width]="qrWidth(item)" [height]="qrWidth(item)" [alt]="'QR code for ' + item.QrCodeData">
            </div>
        </div>
    </div>

    <div id="dvPrintBarcode" class="print-section">
        <div *ngFor="let item of QrData" class="print-item">
            <div *ngFor="let copy of copies(item)" class="barcode-print-copy"
                [style.margin-left.mm]="item.Between" [style.margin-bottom.mm]="item.Margin + 1">
                <img *ngIf="item.barcodeDataUrl" [src]="item.barcodeDataUrl"
                    [style.width.mm]="item.Width"
                    [alt]="'Barcode for ' + item.QrCodeData">
            </div>
        </div>
    </div>
</div>
