<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" style="height: 100%;" dynamicTableHeight>

    <div fusePerfectScrollbar
        class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
        dynamicTableHeight>

        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

            <div class="top-header">
                <div class="top-header-info">

                    <div class="top-header-title" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                        <span>Purchase Order</span>
                    </div>
                </div>
                <div class="top-header-right">
                    <div class="header-add-button">
                        <button mat-raised-button (click)="AddPRtoPurchase()" >PR To PO</button> &nbsp;
                        <button mat-raised-button (click)="AddPurchase()" *ngIf="IsAdd">Add Purchase Order</button>
                    </div>
                </div>
            </div>
            <ng-template #isVerifiedstatus let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <mat-icon *ngIf="element.isVerified=='1'" matTooltip="Verified"
                        style="color: green;">check_circle</mat-icon>

                    <mat-icon *ngIf="element.isVerified=='0'" matTooltip="NotVerified"
                        color="warn">hourglass_empty</mat-icon>
                </div>
            </ng-template>

             <ng-template #isPRTOPoStatus let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <mat-icon *ngIf="element.isPurchaseRequisitionId != 0" matTooltip="IsPurchaseRequisition"
                        style="color: green;">where_to_vote</mat-icon> 
                </div>
            </ng-template>

            <ng-template #actionButtonTemplate let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <button mat-icon-button matTooltip="Print Purchase Order"
                        (click)="viewgetPurchaseorderReportPdf(element)">
                        <mat-icon> print</mat-icon>
                    </button>

                    <button mat-icon-button matTooltip="Edit Purchase order" (click)="OnEdit(element)"
                        *ngIf="!element.isVerified">
                        <mat-icon>edit</mat-icon>
                    </button>

                    <button mat-icon-button matTooltip="Can't Edit Indent" *ngIf="element.isVerified">
                        <mat-icon>signal_cellular_no_sim</mat-icon>
                    </button>

                    <button *ngIf="!element.isVerified && IsPoverify" mat-icon-button (click)="onVerify(element)">
                        <mat-icon class="disabled-icon" matTooltip="verify Menu"
                            title="verify Menu">verified_user</mat-icon>
                    </button>
                    <!--&& element.isProceedToApproval != 0-->

                    <button *ngIf="element.isVerified" mat-icon-button>
                        <mat-icon class="disabled-icon" matTooltip="verified" style="color: green;"
                            title="verified">check_circle</mat-icon>
                    </button>

                    <button mat-icon-button
                        [matTooltip]="'We send the mail on your registered MailID : ' + element?.emailId"
                        matTooltipPosition="right" (click)="Onemail(element)"
                        (mouseenter)="openEmailDetailsPopover($event, element)"
                        (mouseleave)="closeEmailDetailsPopover()"
                        style="position: relative; cursor: pointer; text-decoration: underline; color: #667eea;">
                        <mat-icon>email</mat-icon>
                    </button>


                    <button mat-icon-button
                        [matTooltip]="'We send the message on your registered WhatsApp number: ' + element?.mobileNo"
                        matTooltipPosition="right" (click)="getWhatsappsharePurchase(element)"
                        (mouseenter)="openWhatsappDetailsPopover($event, element)"
                        (mouseleave)="closeWhatsappDetailsPopover()"
                        style="position: relative; cursor: pointer; text-decoration: underline; color: #667eea;">
                        <img width="20" height="20" src="assets/images/logos/WhatsApp.png">
                    </button>

                </div>
            </ng-template>
            <airmid-table [gridConfig]="gridConfig" class="content" :ShowButtons="false" #grid
                (onSelectRow)="GetDetails1($event)">
                <ng-container filters>
                    <form [formGroup]="mysearchform" fxLayout="column">
                        <!-- <airmid-datepicker [formGroup]="mysearchform" [isRangePicker]="true"
                            formStartControlName="startdate" formEndControlName="enddate"
                            [(fromValue)]="gridConfig.filters[0].fieldValue" 
                            [(toValue)]="gridConfig.filters[1].fieldValue" (dateChange)="onChangeFirst()">
                        </airmid-datepicker>  -->

                        <airmid-datepicker [formGroup]="mysearchform" [isRangePicker]="true"
                            formStartControlName="startdate" formEndControlName="enddate"
                            [(fromValue)]="gridConfig.filters[1].fieldValue"
                            [(toValue)]="gridConfig.filters[2].fieldValue">
                        </airmid-datepicker>


                        <airmid-dropdown label="Store Name" formControlName="StoreId"
                            (selectionChange)="selectChangeStore($event)" [formGroup]="mysearchform"
                            [mode]="autocompletestore" (keyup)="selectChangeStore($event)">
                        </airmid-dropdown>

                        <airmid-dropdown label="Supplier Name | Code" formControlName="SupplierId"
                            [formGroup]="mysearchform" [mode]="autocompleteSupplier"
                            (selectionChange)="selectChangeSupplier($event)" (keyup)="selectChangeSupplier($event)"
                            [(ngModel)]="gridConfig.filters[4].fieldValue"></airmid-dropdown>

                        <div fxLayout="row" class="gap-4 ">
                            <span style="font-weight: bold;">Status :</span>
                            <mat-slide-toggle name="Status" (change)="onChangeFirst()" formControlName="Status">
                                Pending / Verify
                            </mat-slide-toggle>
                        </div>

                    </form>
                </ng-container>
            </airmid-table>
        </div>

        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll" *ngIf="isShowDetailTable">

            <ng-template #iconisClosed let-element>
                <div fxLayout="row" fxLayoutAlign="center center">

                    <mat-icon *ngIf="element.isClosed == false" matTooltip="Pending"
                        class="active-icon red-500 s-16">hourglass_empty
                    </mat-icon>

                    <mat-icon *ngIf="element.isClosed == true" matTooltip="Accepted"
                        class="active-icon green-500 s-16">check_circle
                    </mat-icon>

                </div>
            </ng-template>

            <airmid-table [gridConfig]="gridConfig1" class="content" #grid1 [ShowFilter]="false" [ShowButtons]="false">
            </airmid-table>
        </div>
    </div>


</div>
