<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" style="height: 100%;" dynamicTableHeight>
    <mat-toolbar class="top-header accent">
        <div fxLayout="row" fxLayoutAlign="start center" class="top-header-info">
            <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                Purchase Requisition Verification
            </span>
        </div>
        
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onSave()">New Requisition
            </button>
        </div>
    </mat-toolbar>

    <div fusePerfectScrollbar
        class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
        dynamicTableHeight>
        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

             <ng-template #actionsTemplate1 let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <mat-icon *ngIf="element.isclosed=='1';" matTooltip="Is Closed" style="color: rgb(41, 129, 12);">close</mat-icon>
                    <mat-icon *ngIf="!element.isclosed=='1';" matTooltip="Pending"  style="color: brown;">Pending</mat-icon>
                </div>
            </ng-template>


            <ng-template #actionsTemplate2 let-element>
                <div fxLayout="row" fxLayoutAlign="center center">

                    <mat-icon *ngIf="element.priority==1" matTooltip="Urgent" style="color: red;">report
                    </mat-icon>

                    
                    <mat-icon *ngIf="element.priority==0" matTooltip="Normal"
                        style="color: rgb(19, 126, 13);">report
                    </mat-icon>

                </div>
            </ng-template>

            <ng-template #isverifyTemplate let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <mat-icon *ngIf="element.isverify=='1';" matTooltip="Is Verify"
                        style="color: green;">check_circle</mat-icon>
                    <mat-icon *ngIf="!element.isverify=='1';" matTooltip="Is Verify"
                        style="color: rgb(128, 0, 30);">hourglass_empty</mat-icon>
                </div>
            </ng-template>
         

            <ng-template #actionButtonTemplate let-element>
                <div fxLayout="row" fxLayoutAlign="center center">

                    <button mat-icon-button matTooltip="Edit Requisition" (click)="OnEdit(element)"
                        *ngIf="!element.isverify">
                        <mat-icon>edit</mat-icon>
                    </button>

                    <button mat-icon-button matTooltip="Can't Edit Requisition" *ngIf="element.isverify">
                        <mat-icon>signal_cellular_no_sim</mat-icon>
                    </button>
<!-- isInchargeVerify? -->
                    <button *ngIf="!element.isverify && !element.isCancelled" mat-icon-button
                        (click)="onVerify(element)">
                        <mat-icon class="disabled-icon" matTooltip="verify Menu">verified_user</mat-icon>
                    </button>

                    <!-- <button *ngIf="element.isInchargeVerify" mat-icon-button>
                        <mat-icon class="disabled-icon" matTooltip="verified"
                            style="color: green;">check_circle</mat-icon>
                    </button> -->

                    <button mat-icon-button matTooltip="Print Requisition" (click)="viewgetReportPdf(element)">
                        <mat-icon> print</mat-icon>
                    </button>

                    <button mat-icon-button matTooltip="Delete Indent" (click)="deleterequisition(element)"
                        *ngIf="!element.isverify">
                        <mat-icon style="color: brown;"> delete</mat-icon>
                    </button>

                </div>
            </ng-template>
            <airmid-table [gridConfig]="gridConfig" class="content" (onSelectRow)="GetDetails2($event)" #grid>

                <ng-container filters>
                    <form [formGroup]="PurchaseReqVerifyForm" fxLayout="column">
                        

                       <airmid-datepicker [formGroup]="PurchaseReqVerifyForm" [isRangePicker]="true"
                            formStartControlName="startdate" formEndControlName="enddate"
                            [(fromValue)]="gridConfig.filters[0].fieldValue"
                            [(toValue)]="gridConfig.filters[1].fieldValue">
                        </airmid-datepicker>

                        <airmid-dropdown label="From Store Name" formControlName="FromStoreId"
                            (selectionChange)="fromStoreView($event)" [formGroup]="PurchaseReqVerifyForm"
                            [mode]="autocompletestore">
                        </airmid-dropdown>

                        <airmid-dropdown label="To Store Name" formControlName="ToStoreId"
                            (selectionChange)="toStoreView($event)" [formGroup]="PurchaseReqVerifyForm"
                            [mode]="autocompletestore">
                        </airmid-dropdown>

                        <div fxLayout="column" fxLayoutAlign="start start">
                            <div fxLayout="row" class="gap-4 ">
                                <span
                                    style="font-weight: bold;color: rgb(4, 44, 84);padding: 5;font-size: large;">Status
                                    :</span>
                                <mat-slide-toggle name="Status" (change)="onChangeFirst()"
                                    formControlName="Closed" [formGroup]="PurchaseReqVerifyForm">
                                    Pending / Close
                                </mat-slide-toggle>
                            </div>
                            <div fxLayout="row" class="gap-4 ">
                                <span
                                    style="font-weight: bold;color: rgb(4, 44, 84);padding: 5;font-size: large;">Verify
                                    :</span>
                                <mat-slide-toggle name="Verify" (change)="onChangeFirst()"
                                    formControlName="Verify" [formGroup]="PurchaseReqVerifyForm">
                                    Verify
                                </mat-slide-toggle>
                            </div>

                        </div>

                    </form>

                </ng-container>
            </airmid-table>
        </div>

        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll" *ngIf="isShowDetailTable">
            <airmid-table [gridConfig]="gridConfig1" class="content" #grid1 :ShowFilter="false">
            </airmid-table>
        </div>

    </div>

</div>
