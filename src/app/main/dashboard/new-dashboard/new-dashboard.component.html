
<div class="dashboard-container">
    <div class="metrics-grid">
        <mat-card *ngFor="let m of metrics" class="metric-card mat-elevation-z2" [ngClass]="'theme-' + m.color">
          <mat-card-content class="metric-content">
            <div class="metric-icon">
              <mat-icon>{{ getMatIcon(m.icon) }}</mat-icon>
            </div>
            <div class="metric-text">
              <div class="metric-label">{{ m.label }}</div>
              <div class="metric-value">{{ m.value }}</div>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
      <div class="charts-row">
        <mat-card class="chart-card mat-elevation-z2">
          <mat-card-header>
            <mat-card-title>IPD Overview</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <ngx-charts-pie-chart
              [results]="ipdData"
              [doughnut]="true"
              [labels]="true"
              [gradient]="false"
              [explodeSlices]="false"
              [arcWidth]="0.4"
              [view]="chartView"
              [scheme]="colorScheme">
            </ngx-charts-pie-chart>
          </mat-card-content>
        </mat-card>
      
        <mat-card class="chart-card mat-elevation-z2">
          <mat-card-header>
            <mat-card-title>OPD Overview</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <ngx-charts-pie-chart
              [results]="opdData"
              [doughnut]="true"
              [labels]="true"
              [gradient]="false"
              [explodeSlices]="false"
              [arcWidth]="0.4"
              [view]="chartView"
              [scheme]="colorScheme">
            </ngx-charts-pie-chart>
          </mat-card-content>
        </mat-card>
      </div>
  </div>
