<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Diet Plan Schduled List for Patient
                </span>
            </div>
        </div>
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="NewDietPlan()">New Diet Schdule Plan
            </button>

        </div>
    </div>
    <div fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="space-between center"
        class="px-12 py-4 border-bottom gap-8">
        <div class="info-badge-top overflow-auto" fxLayout="row" fxLayoutAlign="space-between" flex>

            <!-- LEFT side: existing cards -->
            <div fxLayout="row" fxLayoutAlign="start center" class="gap-8">


                <div class="dashboard-card registrations">
                    <div class="card-label">Total Diet Schdule </div>
                    <div class="card-value">{{VTotalcount}}</div>
                    <mat-icon class="card-icon">receipt_long</mat-icon>
                </div>
                <div class="dashboard-card pending">
                    <div class="card-label">Draft Diet Schdule </div>
                    <div class="card-value">{{VdraftNewcount}}</div>
                    <mat-icon class="card-icon">receipt_long</mat-icon>
                </div>

                <div class="dashboard-card app-accept">
                    <div class="card-label">Final Diet Schdule </div>
                    <div class="card-value">{{VfinalNewcount}}</div>
                    <mat-icon class="card-icon">cancel</mat-icon>
                </div>

                <div class="dashboard-card app-Cancel">
                    <div class="card-label">Cancelled Diet Schdule </div>
                    <div class="card-value">{{VCancelcount}}</div>
                    <mat-icon class="card-icon">cancel</mat-icon>
                </div>

            </div>

                                style="font-size: large;color: rgb(36, 84, 98);margin-left: 400px;font-weight: bold;margin-right: 20px;">

        </div>

    </div>
    <div class="content">
        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

            <ng-template #ItemNopopover let-element>
                <span (mouseenter)="openMenuPopup(element, $event)" (mouseleave)="closeDetailsPopover1()"
                    style="font-size: 14px; line-height: 18px; cursor: pointer; text-decoration: underline; color: #4CAF50;">
                    {{ element.patient }}
                </span>
            </ng-template>

            <ng-template #draftorFinal let-element>
                <button type="button" class="status-chip" [ngClass]="element.draftorFinal ? 'is-final' : 'is-draft'"
                    [matTooltip]="element.draftorFinal ? 'Final: click to revert to Draft' : 'Draft: click to mark Final'"
                    (click)="$event.stopPropagation(); Changefinal(element)">
                    <mat-icon class="chip-icon">{{ element.draftorFinal ? 'check_circle' : 'edit' }}</mat-icon>
                    <span class="chip-text">{{ element.draftorFinal ? 'Final' : 'Draft' }}</span>
                </button>
            </ng-template>
            <!--    [disabled]="!element.isCancelled" -->
            <ng-template #actionButtonTemplate let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <button mat-icon-button color="primary" (click)="Edit(element)" matTooltip="Edit Schdule">
                        <mat-icon>edit</mat-icon>
                    </button>


                    <button mat-stroked-button color="warn" class="cancel-diet-btn" (click)="DietplanCancel(element)"
                        matTooltip="Cancel Schdule">
                        <span>Cancel</span>
                    </button>


                </div>
            </ng-template>
            <airmid-table [gridConfig]="gridConfig" class="content" #grid>
                <ng-container filters>
                    <form [formGroup]="myFilterform">

                        <mat-form-field appearance="outline">
                            <mat-label>Enter a date range</mat-label>
                            <mat-date-range-input [rangePicker]="picker">
                                <input matStartDate formControlName="fromDate" placeholder="Start date">
                                <input matEndDate formControlName="enddate" placeholder="End date"
                                    (dateChange)="getfilterdata()">
                            </mat-date-range-input>
                            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                            <mat-date-range-picker #picker></mat-date-range-picker>
                        </mat-form-field>

                        <!-- 
                        <mat-form-field appearance="outline">
                            <mat-label>DietPlanId</mat-label>
                            <input matInput placeholder="Search DietPlan Id" autocomplete="off"
                                [formGroup]="myFilterform" formControlName="DietPlanId" (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('DietPlanId')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field> -->

                        <mat-form-field appearance="outline">
                            <mat-label>First Name</mat-label>
                            <input matInput placeholder="Search First Name" autocomplete="off"
                                [formGroup]="myFilterform" formControlName="FirstName" (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('FirstName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>


                        <mat-form-field appearance="outline">
                            <mat-label>Last Name</mat-label>
                            <input matInput placeholder="Search Last Name" autocomplete="off" [formGroup]="myFilterform"
                                formControlName="LastName" (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('LastName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>


                        <airmid-dropdown label="Diet Type Name" formControlName="dietTypeId" [formGroup]="myFilterform"
                            [(ngModel)]="gridConfig.filters[3].fieldValue"
                            [validations]="getValidationdoctorMessages().dietTypeId" [mode]="autocompleteModedietType"
                            (selectionChange)="ListView($event)" (keyup)="ListView($event)">
                        </airmid-dropdown>
                    </form>
                </ng-container>
            </airmid-table>
        </div>
    </div>

</div>
