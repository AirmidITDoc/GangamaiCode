<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    IP Bill Settlement
                </span>
            </div>
        </div>
    </div>
    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
        <div class="modal-body-container p-12">
            <mat-card style="padding: 8px;">
                <form [formGroup]="searchFormGroup" fxLayoutAlign="space-between start">
                    <div fxLayout="column" fxLayoutAlign="start none" style="width: 100%;" fxLayoutGap="6px">
                
                      
                        <div fxLayout="row" fxLayoutGap="8px"> 
                                <!-- <div fxFlex="50%" fxFlex.sm="100%" *ngIf="!vCheckBox">
                                     <airmid-autocomplete  label="Search Reg No / Patient Name / Mobile No"
                                      [formGroup]="searchFormGroup"   formControlName="RegId"
                                       placeholderText="Search Reg No / Patient Name / Mobile No" 
                                      ApiUrl="Admission/search-patient?Keyword=" TextField="formattedText"  ValueField="regId"
                                      (selectionChange)="getSelectedObj($event)">
                                       </airmid-autocomplete> 
                                </div> -->

                                <div fxFlex="50%" fxFlex.sm="100%" >
                                    <airmid-autocomplete lbl="RegID" [formGroup]="searchFormGroup"
                                        label="Search Reg No / Patient Name / Mobile No(DC)"
                                        formControlName="RegId" fxFlex
                                        placeholderText="RegNo / First Name / Last Name / Mobile No(DC)"
                                        ApiUrl="Admission/Dischargesearch-patient?Keyword="
                                        (selectionChange)="getSelectedObj($event)" TextField="formattedText"
                                        ValueField="regId">
                                    </airmid-autocomplete>
                                </div> 
                            </div>

                        
                
                        <div fxFlex.gt-sm="100%" fxFlex class="patient-info-container">
                            <div class="patient-info-container" *ngIf="PatientName">
                                <div class="patient-info-box">
                                    <div class="patient-info-title border-bottom pb-2">
                                        <span class="h1">Patient Information</span>
                                    </div>
                                    <div class="patient-info-box my-8">
                                        <div class="patient-info-row ">
                                           
                                            <div class="patient-col">
                                                <span class="patient-col-key ">Patient Name</span>
                                                <span>:</span>
                                                <span class="patient-col-value">{{registerObj.regNo}}-{{PatientName}}</span>
                                            </div>
                                             <div class="patient-col gap-1">
                                                <span class="patient-col-key ">Age | Gender</span>
                                               <span>:</span>
                                                  <span
                                                 class="patient-col-value">{{registerObj?.age}} | {{registerObj?.genderName}}</span>
                                             </div>

                                               <div class="patient-col gap-1">
                                                    <span class="patient-col-key">IPDNo</span>
                                              <span>:</span>
                                            <span class="patient-col-value">{{registerObj?.ipdNo}}</span>
                                                </div>
                                            <div class="patient-col">
                                                <span class="patient-col-key">Ward | Bed Name </span>
                                                <span>:</span>
                                                <span class="patient-col-value">{{registerObj?.roomName}} | {{registerObj?.bedName}}</span>
                                            </div>
                
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </mat-card> 
        </div> 

        <ng-template #actionsTemplate let-element>
            <div>
                <mat-icon *ngIf="element.companyId=='0'" matTooltip="Patient Category Self">account_box
                </mat-icon>

                <mat-icon *ngIf="element.companyId!='0'" matTooltip="Patient Category Company">business
                </mat-icon>
            </div>
        </ng-template> 

        <ng-template #actionButtonTemplate let-element>
            <div fxLayout="row" fxLayoutAlign="center center">
            
                <button mat-icon-button class="material-icons" *ngIf="element.balanceAmt !=0 " matTooltip="Final Discount"
                    (click)="getFinalDisc(element)">
                    <mat-icon> money </mat-icon>
                </button>
            
                <button mat-icon-button (click)="openPaymentpopup(element)" matTooltip="Settlement" *ngIf="element.balanceAmt!='0'">
                    <mat-icon title="Settlement">payment</mat-icon>
                </button>
                <!-- <button mat-icon-button matTooltip="Print" (click)="viewgetOPPayemntPdf(element)">
                                <mat-icon>print</mat-icon>
                            </button> -->
            </div>
        </ng-template>

        
        <airmid-table [gridConfig]="gridConfig" #grid :ShowFilter="false"> 
        </airmid-table>
    </div>
</div>
