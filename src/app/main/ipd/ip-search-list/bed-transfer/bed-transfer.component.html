<div class="modal-wrapper grid-container resize-form-fields padding-fix">
    <!-- Modal Header -->
    <div class="modal-header accent">
        <div class="modal-header-content" fxLayout="row" fxLayoutAlign="space-between center">
            <div class="modal-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">Bed Transfer</span>
            </div>
            <div class="comman-date-container" fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="10px">
                <app-common-date [screenFrom]="screenFromString" (dateTimeEventEmitter)="getDateTime($event)">
                </app-common-date>
                <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                    matTooltip="Close">
                    <mat-icon>close</mat-icon>
                </button>
            </div>
        </div>
    </div>

    <!-- / HEADER -->
    <div class="modal-body content">
        <div class="modal-body-container ">

            <!-- Patient Info Section -->
            <div class="modal-card-container mt-0" style="margin-top: -4px;">
                <div fxFlex.gt-sm="100%" fxFlex>
                    <mat-card fxFlex.gt-sm="100%" fxFlex style="padding: 2px 10px;">
                        <div class="patient-info-sales">
                            <div class="patient-info-title border-bottom pb-1 mb-1">
                                <span class="h1 m-0" style="line-height: normal;">Patient Information</span>
                            </div>
                            <div class="Ipd-patient-info w-100-p">
                                <app-patient-information [uhidNo]="data?.regNo" [patientName]=" (data?.firstName || '') +
                                        (data?.middleName ? ' ' + data.middleName : '') +
                                        (data?.lastName ? ' ' + data.lastName : '')
                                        || data?.patientName
                                        " [doctorName]="data?.doctorname" [departmentName]="data?.departmentName"
                                    [doa]="data.admissionDate" [ipdNo]="data?.ipdno || data?.ipdno"
                                    [ageString]="(data?.age !== undefined ? data?.age + 'Y|' + data?.ageMonth + 'M|' + data?.ageDay + 'D | ' + data?.genderName : '')"
                                    [refDocName]="data?.refDocName"
                                    [wardBedName]="(data?.roomName && data?.bedName) ? (data?.roomName + ' | ' + data?.bedName) : ''"
                                    [patientType]="data?.patientType" [tariffName]="data?.tariffName"
                                    [companyName]="data?.companyName"></app-patient-information>
                            </div>
                        </div>
                    </mat-card>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-card-container">
        <mat-card>
            <div class="patient-info-container" style="margin-top: 20px;">
                <div class="patient-sub">
                    <div class="patient-info-title border-bottom pb-2">
                        <span class="h1">Current Bed Information:-{{ data.roomName}} | {{ data.className }}
                        </span>
                    </div>

                </div>
            </div>
        </mat-card>
    </div>



    <!-- Modal body -->
    <div class="modal-body" fusePerfectScrollbar>
        <div class="modal-body-container">
            <div fxLayout="column" class="gap-12">
                <div class="modal-card-container">
                    <mat-card fxFlex.gt-sm="100%" fxFlex>
                        <div class="sales-patient-info-title">
                            <span style="font-weight: 700;">Bed Transfer</span>
                        </div>
                        <hr>
                        <form [formGroup]="Bedtransfer">
                            <div fxlayout="row" fxFlex>
                                <div fxLayoutGap="4px">
                                    <airmid-dropdown label="Ward Name" formControlName="toWardId" fxFlex="25%"
                                        [validations]="getValidationMessages().toWardId" ValueField="roomId"
                                        TextField="roomName" (selectionChange)="onChangeWard($event)"
                                        [formGroup]="Bedtransfer" ApiUrl="WardMaster/get-WardClass" #ddlWard>
                                    </airmid-dropdown>

                                    <airmid-dropdown label="Bed Name" formControlName="toBedId" fxFlex="25%"
                                        [formGroup]="Bedtransfer" TextField="bedName" ValueField="bedId"
                                        [validations]="getValidationMessages().toBedId" #ddlBedName>
                                    </airmid-dropdown>
                                    <airmid-dropdown label="Class Name" formControlName="toClassId" fxFlex="20%"
                                        [formGroup]="Bedtransfer" [validations]="getValidationMessages().ClassId"
                                        [mode]="autocompleteModeClass" [disabled]="true" [readonly]="true"
                                        #ddlClassName>
                                    </airmid-dropdown>
                                    <mat-form-field appearance="outline" fxFlex="35%">
                                        <textarea matInput rows="1" cols="5" placeholder="Enter Remark"
                                            formControlName="remark"></textarea>
                                    </mat-form-field>

                                </div>
                            </div>
                        </form>
                    </mat-card>
                </div>
            </div>
        </div>
    </div>
    <!-- FOOTER -->
    <div class="modal-footer" fxLayout="column">
        <div class="modal-card-container">
            <div fxLayout="row" fxLayoutAlign="space-between center" class="dialog-footer">

                <!-- LEFT SIDE -->
                <div>
                    <button mat-raised-button color="accent" (click)="getbedStatement()">
                        Bed Transfer Statement
                    </button>
                </div>

                <!-- RIGHT SIDE -->
                <div fxLayout="row" fxLayoutGap="10px">
                    <button class="btn btn-danger-outline" (click)="onClose()">Cancel</button>
                    <button class="btn btn-primary" (click)="onBedtransfer()">Save</button>
                </div>

            </div>
        </div>
    </div>
</div>
