<div class="modal-wrapper grid-container">

    <!-- Modal header -->
    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">Discharge</span>
            </div>
            <div class="modal-header-right">
                <div class="comman-date-container">
                    <div class="comman-date">
                        <app-common-date [screenFrom]="screenFromString"
                            (dateTimeEventEmitter)="getDateTime($event)"></app-common-date>
                    </div>
                    <div class="close-icon">
                        <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                            matTooltip="Close">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- / HEADER -->
    <div class="modal-body content">
        <div class="modal-body-container">

            <!-- Patient Info Section -->
            <div class="modal-card-container mt-0" style="margin-top: -4px;">
                <div fxFlex.gt-sm="100%" fxFlex>
                    <mat-card fxFlex.gt-sm="100%" fxFlex style="padding: 2px 10px;">
                        <div class="patient-info-sales">
                            <div class="patient-info-title border-bottom pb-1 mb-1">
                                <span class="h1 m-0" style="line-height: normal;">Patient Information</span>
                            </div>
                            <div class="Ipd-patient-info w-100-p">
                                <app-patient-information [uhidNo]="data?.regNo" [patientName]=" (data?.firstName || '') +
                                        (data?.middleName ? ' ' + data.middleName : '') +
                                        (data?.lastName ? ' ' + data.lastName : '')
                                        || data?.patientName
                                        " [doctorName]="data?.doctorname" [departmentName]="data?.departmentName"
                                    [doa]="data.admissionDate" [ipdNo]="data?.ipdno || data?.ipdno"
                                    [ageString]="(data?.age !== undefined ? data?.age + 'Y|' + data?.ageMonth + 'M|' + data?.ageDay + 'D | ' + data?.genderName : '')"
                                    [refDocName]="data?.refDocName"
                                    [wardBedName]="(data?.roomName && data?.bedName) ? (data?.roomName + ' | ' + data?.bedName) : ''"
                                    [patientType]="data?.patientType" [tariffName]="data?.tariffName"
                                    [companyName]="data?.companyName"></app-patient-information>
                            </div>
                        </div>
                    </mat-card>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal body -->
    <div class="modal-body" fusePerfectScrollbar>
        <div class="modal-body-container">
            <div fxLayout="column" class="gap-12">
                <div class="modal-card-container">
                    <mat-card fxFlex.gt-sm="100%" fxFlex>
                        <div fxlayout="row" fxFlex>
                            <div fxLayoutGap="4px">
                                <airmid-dropdown label="DischargedDoc" formControlName="dischargedDocId"
                                    [formGroup]="DischargeInsertForm" fxFlex
                                    [validations]="getValidationMessages().dischargedDocId" [mode]="autocompletcondoc"
                                    (SelectionChange)="docName($event)">
                                </airmid-dropdown>

                                <airmid-dropdown label="DischargeType" formControlName="dischargeTypeId"
                                    [formGroup]="DischargeInsertForm" fxFlex
                                    [validations]="getValidationMessages().dischargeTypeId"
                                    [mode]="autocompletedichargetype" (selectopnChange)="selctdischargeType($event)">
                                </airmid-dropdown>

                                <airmid-dropdown label="Mode" formControlName="modeOfDischargeId"
                                    [formGroup]="DischargeInsertForm" fxFlex (SelectionChange)="modeOfDischarge($event)"
                                    [validations]="getValidationMessages().modeOfDischargeId" [mode]="autocompletemode">
                                </airmid-dropdown>

                                <mat-form-field appearance="outline" fxFlex>
                                    <mat-label>Comments</mat-label>
                                    <input name="Comments" placeholder="Comments" matInput [(ngModel)]="vComments">
                                </mat-form-field>

                            </div>
                        </div>
                    </mat-card>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="modal-footer" fxLayout="column">
        <div class="modal-card-container">
            <div fxLayout="row" fxLayoutAlign="space-between center" class="dialog-footer">

                <!-- LEFT SIDE -->
                <div>
                    <button mat-raised-button color="accent" (click)="DischargeInitiate()" [disabled]="true">
                        Initiate Discharge
                    </button>
                </div>

                <!-- RIGHT SIDE -->
                <div fxLayout="row" fxLayoutGap="10px">
                    <button class="btn btn-danger-outline" (click)="onClose()">Cancel</button>
                    <button class="btn btn-primary" (click)="onDischarge()">Save</button>
                </div>

            </div>
        </div>
    </div>
</div>
