<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Radiology Test Master
                </span>
            </div>
        </div>
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onSave()" *ngIf="IsAdd">+ New Test
            </button>
        </div>
    </div>
    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
        <airmid-table [gridConfig]="gridConfig" class="content">
            <ng-container filters>
                <form [formGroup]="searchFormGroup" fxLayout="column">
                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>Test Name</mat-label>
                        <input matInput placeholder="Search Test Name" autocomplete="off"
                        [formGroup]="searchFormGroup" formControlName="TestNameSearch"
                        (input)="onChangeFirst()"/>
                        <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('TestNameSearch')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>

               <airmid-dropdown label="CategoryName" formControlName="CategoryId"
                        [formGroup]="searchFormGroup" (selectionChange)="CategoryView($event)"
                        [(ngModel)]="gridConfig.filters[1].fieldValue"
                        [mode]="autocompleteModeCategoryId"
                        (selectionChange)="Clearfilter($event)"></airmid-dropdown>

                    <airmid-dropdown label="ServiceName" formControlName="ServiceId" (selectionChange)="ServiceView($event)"                        [(ngModel)]="gridConfig.filters[2].fieldValue"
                       [(ngModel)]="gridConfig.filters[2].fieldValue"  [formGroup]="searchFormGroup" [mode]="autocompleteModeServiceID"
                        ></airmid-dropdown>
                </form>
            </ng-container>
        </airmid-table>
    </div>
</div>
