<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto resize-form-fields padding-fix"
    dynamicTableHeight >
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    OT Bill Template List
                </span>
            </div>
        </div>
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onSave()" *ngIf="IsAdd">+ New OT Template
            </button>
        </div>
    </div>
     <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
        <airmid-table [gridConfig]="gridConfig" class="content">
            <ng-container filters>
                 <form [formGroup]="_OTBillingTemplateService.myformSearch" fxLayout="column">
                  <!-- <airmid-dropdown label="Service Name" formControlName="serviceId" [formGroup]="_OTBillingTemplateService.myformSearch"
                            ValueField="serviceId" TextField="serviceName" name="serviceName"
                            [ApiUrl]="'SurgeryMaster/GetServiceListwithSurgeryWise?TariffId=1&ClassId=1&IsProcedure=true&ServiceName=%25'"
                            [disableAutoNext]="true"   [(ngModel)]="gridConfig.filters[0].fieldValue"
                            (selectionChange)="selectChangeServiceName($event)">
                 </airmid-dropdown> -->


                   <airmid-textbox label="Template Name" formControlName="otBillTemplateName" 
                   [formGroup]="_OTBillingTemplateService.myformSearch"
                    [(ngModel)]="gridConfig.filters[0].fieldValue">
                    </airmid-textbox>
                </form> 
            </ng-container>
        </airmid-table>
    </div>
</div>
