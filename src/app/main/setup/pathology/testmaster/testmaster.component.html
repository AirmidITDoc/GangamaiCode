<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Test Master
                </span>
            </div>
        </div>
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onSave()">New Test
            </button>
        </div>
    </div>
    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

        <ng-template #actionButtonTemplate let-element>
            <div fxLayout="row" fxLayoutAlign="center center">

                <button mat-icon-button matTooltip="Edit" (click)="onSave(element)">
                    <mat-icon>edit</mat-icon>
                </button>

                <button mat-icon-button matTooltip="Delete" (click)="deactivateTestMaster(element)">
                    <mat-icon> delete</mat-icon>
                </button>
            </div>
        </ng-template>

        <ng-template #actionsIsSubTest let-element>
            <div fxLayout="row" fxLayoutAlign="center center">

                <mat-icon *ngIf="element.isSubTest == true && element.isTemplateTest==false" title="IsSubTest">
                    <img width="50px" height="50px" src="assets/images/logos/Subtest.png">
                </mat-icon>
                <mat-icon *ngIf="element.isSubTest == false && element.isTemplateTest==false" title="IsTest">
                    <img width="30px" height="30px" src="assets/images/logos/ISTest.png">
                </mat-icon>

            </div>
        </ng-template>

        <ng-template #actionsisTemplateTest let-element>
            <div fxLayout="row" fxLayoutAlign="center center">

                <!-- <mat-icon *ngIf="element.isTemplateTest=='1'" title="IsTemplateTest">assignment</mat-icon> -->
                <mat-icon *ngIf="element.isTemplateTest=='1'" title="NotTemplateTest">
                    <img width="30px" height="30px" src="assets/images/logos/template.png">
                </mat-icon>
            </div>
        </ng-template>

        <airmid-table [gridConfig]="gridConfig" class="content">
            <ng-container filters>
                <form [formGroup]="searchFormGroup" fxLayout="column">
                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>Test Name</mat-label>
                        <input matInput placeholder="Search Test Name" autocomplete="off" (input)="onChangeFirst()"
                            [formGroup]="searchFormGroup" formControlName="TestNameSearch" />
                        <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('TestNameSearch')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>
                    <airmid-dropdown label="CategoryName" formControlName="CategoryId"
                        [formGroup]="searchFormGroup" (selectionChange)="CatView($event)"
                        [(ngModel)]="gridConfig.filters[1].fieldValue"
                        [mode]="autocompleteModeCategoryId"
                      ></airmid-dropdown>

                    <airmid-dropdown label="ServiceName" formControlName="ServiceId"
                    (selectionChange)="ServiceView($event)"
                        [(ngModel)]="gridConfig.filters[2].fieldValue"
                        [formGroup]="searchFormGroup" [mode]="autocompleteModeServiceID"
                       ></airmid-dropdown>

                        <mat-radio-group name="Istest" formControlName="Istest" fxLayout="row"
                        [(ngModel)]="gridConfig.filters[3].fieldValue">
                             <mat-radio-button value="2">All</mat-radio-button>
                            <mat-radio-button value="0">IsTest</mat-radio-button>
                            <mat-radio-button value="1">IsSubTest</mat-radio-button>
                        </mat-radio-group>
                </form>
            </ng-container>
        </airmid-table>
    </div>
</div>
