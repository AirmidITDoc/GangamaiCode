<div class="modal-wrapper grid-container">
    <!-- Modal header -->
    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">Hospital Master</span>
            </div>
            <div class="modal-header-right">
                <div class="close-icon">
                    <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                        matTooltip="Close">
                        <mat-icon>close</mat-icon>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal body -->
    <div class="modal-body" fusePerfectScrollbar>
        <div class="modal-body-container detail-wrapper">
            <mat-tab-group>
                <mat-tab label=" Hospital Details">
                    <div class="detail-container">

                        <mat-card>
                            <div fxLayout="column" fxLayoutGap="4px">
                                <div class="detail-container">
                                    <div class="detail-header">
                                        Hospital Details
                                    </div>

                                    <input type="hidden" name="HospitalId" formControlName="hospitalId"
                                        [(ngModel)]="registerObj.hospitalId">

                                    <div fxLayout="row" fxLayoutGap="12px">
                                        <div fxFlex="33%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-textbox label="HospitalName" formControlName="hospitalName"
                                                [formGroup]="HospitalForm" [maxLength]="400"
                                                [(ngModel)]="registerObj.hospitalName"
                                                [validations]="getValidationMessages().HospitalName">
                                            </airmid-textbox>
                                        </div>

                                        <div fxFlex="33%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-textbox label="Hospital Short Name"
                                                formControlName="hospitalShortName" [formGroup]="HospitalForm"
                                                [maxLength]="100" [(ngModel)]="registerObj.hospitalShortName">
                                            </airmid-textbox>
                                        </div>

                                        <div fxFlex="33%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-textbox label="HospitalHeaderLine"
                                                [(ngModel)]="registerObj.hospitalHeaderLine"
                                                formControlName="hospitalHeaderLine" [formGroup]="HospitalForm"
                                                [maxLength]="100">
                                            </airmid-textbox>
                                        </div>
                                    </div>
                                </div>

                                <div class="detail-container">
                                    <div class="detail-header">
                                        Hospital Details
                                    </div>
                                    <div fxLayout="row warp" fxLayoutGap="12px">
                                        <div fxFlex="24%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-textbox label="HospitalAddress"
                                                [value]="registerObj.hospitalAddress" formControlName="hospitalAddress"
                                                [formGroup]="HospitalForm" [maxLength]="400"
                                                [validations]="getValidationMessages().HospitalAddress">
                                            </airmid-textbox>
                                        </div>
                                        <div fxFlex="24%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-dropdown label="City" formControlName="cityId"
                                                [formGroup]="HospitalForm" (selectionChange)="selectChangecity($event)"
                                                [validations]="getValidationMessages().cityId" ValueField="cityId"
                                                [value]="registerObj.cityId" TextField="cityName"
                                                ApiUrl="CityMaster/get-cities"></airmid-dropdown>
                                        </div>

                                        <div fxFlex="24%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-textbox label="Pin" formControlName="pin"
                                                (keypress)="keyPressAlphanumeric($event)" [formGroup]="HospitalForm"
                                                [maxLength]="Is5_Digit_Pincode_Id ? 5 : 6"
                                                [validations]="getValidationMessages().Pin">
                                            </airmid-textbox>
                                        </div>

                                        <div fxFlex="24%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-textbox label="Phone" formControlName="phone"
                                                [formGroup]="HospitalForm" [maxLength]="10"
                                                (keypress)="keyPressAlphanumeric($event)" [value]="registerObj.phone"
                                                [validations]="getValidationMessages().Phone">
                                            </airmid-textbox>
                                        </div>
                                        <div fxFlex="24%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-textbox label="Email" formControlName="emailId"
                                                [formGroup]="HospitalForm" [value]="registerObj.emailId"
                                                [validations]="getValidationMessages().Email">
                                            </airmid-textbox>
                                        </div>
                                        <div fxFlex="24%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-textbox label="website" formControlName="webSiteInfo"
                                                [formGroup]="HospitalForm" [value]="registerObj.webSiteInfo"
                                                [validations]="getValidationMessages().website">
                                            </airmid-textbox>
                                        </div>

                                    </div>
                                </div>

                                <div class="detail-container">

                                    <div class="detail-header">
                                        OPD Cash Counter Details
                                    </div>

                                    <div fxLayout="row warp" fxLayoutGap="12px">
                                        <div fxFlex="32%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-dropdown label="OPD_Billing_Counter"
                                                [value]="registerObj?.opdBillingCounterId"
                                                formControlName="opdBillingCounterId"
                                                [mode]="autocompleteOPDBillingCounterId"
                                                [formGroup]="HospitalForm"></airmid-dropdown>
                                        </div>

                                        <div fxFlex="32%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-dropdown label="OPD_Refund_Bill_Counter"
                                                formControlName="opdRefundBillCounterId"
                                                [value]="registerObj?.opdRefundBillCounterId"
                                                [mode]="autocompleteOPDRefundBillCounterId"
                                                [formGroup]="HospitalForm"></airmid-dropdown>
                                        </div>

                                        <div fxFlex="32%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-dropdown label="OPD_Advance_Counter"
                                                formControlName="opdAdvanceCounterId"
                                                [value]="registerObj?.opdAdvanceCounterId"
                                                [mode]="autocompleteOPDAdvanceCounterId"
                                                [formGroup]="HospitalForm"></airmid-dropdown>
                                        </div>

                                        <div fxFlex="32%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-dropdown label="OPD_Receipt_Counter"
                                                formControlName="opdReceiptCounterId"
                                                [value]="registerObj?.opdReceiptCounterId"
                                                [mode]="autocompleteOPDReceiptCounterId"
                                                [formGroup]="HospitalForm"></airmid-dropdown>
                                        </div>

                                        <!-- added as per 8085 -->
                                        <div fxFlex="32%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-dropdown label="OPD_Refund_Bill_Receipt_Counter"
                                                [mode]="autocompleteOPDRefundBillReceiptCounterId"
                                                [value]="registerObj?.opdRefundBillReceiptCounterId"
                                                formControlName="opdRefundBillReceiptCounterId"
                                                [formGroup]="HospitalForm"></airmid-dropdown>
                                        </div>

                                        <div fxFlex="32%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-dropdown label="OPD_Refund_Advance_Counter"
                                                [mode]="autocompleteOPDRefundAdvanceCounterId"
                                                formControlName="opdRefundAdvanceCounterId"
                                                [value]="registerObj?.opdRefundAdvanceCounterId"
                                                [formGroup]="HospitalForm"></airmid-dropdown>
                                        </div>

                                    </div>
                                </div>

                                <div class="detail-container">

                                    <div class="detail-header">
                                        IPD Cash Counter Details
                                    </div>

                                    <div fxLayout="row wrap" fxLayoutGap="12px">

                                        <div fxFlex="32%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-dropdown label="IPD_Billing_Counter"
                                                formControlName="ipdBillingCounterId"
                                                [value]="registerObj?.ipdBillingCounterId"
                                                [mode]="autocompleteIPDBillingCounterId"
                                                [formGroup]="HospitalForm"></airmid-dropdown>
                                        </div>

                                        <div fxFlex="32%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-dropdown label="IPD_Advance_Counter"
                                                formControlName="ipdAdvanceCounterId"
                                                [value]="registerObj?.ipdAdvanceCounterId"
                                                [mode]="autocompleteIPDAdvanceCounterId"
                                                [formGroup]="HospitalForm"></airmid-dropdown>
                                        </div>

                                        <div fxFlex="32%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-dropdown label="IPD_Refund_of_Bill_Counter"
                                                formControlName="ipdRefundOfBillCounterId"
                                                [value]="registerObj?.ipdRefundOfBillCounterId"
                                                [mode]="autocompleteIPDRefundofBillCounterId"
                                                [formGroup]="HospitalForm"></airmid-dropdown>
                                        </div>

                                        <div fxFlex="32%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-dropdown label="IPD_Receipt_Counter"
                                                [value]="registerObj?.ipdReceiptCounterId"
                                                formControlName="ipdReceiptCounterId"
                                                [mode]="autocompleteIPDReceiptCounterId"
                                                [formGroup]="HospitalForm"></airmid-dropdown>
                                        </div>

                                        <div fxFlex="32%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-dropdown label="IPD_Refund_of_Advance_Counter"
                                                [mode]="autocompleteIPDRefundofAdvanceCounterId"
                                                formControlName="ipdRefundOfAdvanceCounterId"
                                                [value]="registerObj?.ipdRefundOfAdvanceCounterId"
                                                [formGroup]="HospitalForm"></airmid-dropdown>
                                        </div>

                                        <div fxFlex="32%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-dropdown label="IPD_Refund_of_Bill_Receipt_Counter"
                                                [value]="registerObj?.ipdRefundOfBillReceiptCounterId"
                                                [mode]="autocompleteIPDRefundofBillReceiptCounterId"
                                                formControlName="ipdRefundOfBillReceiptCounterId"
                                                [formGroup]="HospitalForm"></airmid-dropdown>
                                        </div>

                                        <div fxFlex="32%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-dropdown label="IPD_Advance_Receipt_Counter"
                                                [mode]="autocompleteIPDAdvanceReceiptCounterId"
                                                formControlName="ipdAdvanceReceiptCounterId"
                                                [value]="registerObj?.ipdAdvanceReceiptCounterId"
                                                [formGroup]="HospitalForm"></airmid-dropdown>
                                        </div>

                                        <div fxFlex="32%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-dropdown label="IPD_Refund_of_Advance_Receipt_Counter"
                                                [value]="registerObj?.ipdRefundOfAdvanceReceiptCounterId"
                                                [mode]="autocompleteIPDRefundofAdvanceReceiptCounterId"
                                                formControlName="ipdRefundOfAdvanceReceiptCounterId"
                                                [formGroup]="HospitalForm"></airmid-dropdown>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </mat-card>
                    </div>
                </mat-tab>

                <mat-tab label="Hospital Template Detail">
                    <div fxFlexFill fxLayout="column" fxLayout.gt-xs="row" fxLayoutGap="10px">
                        <div fxFlex.gt-sm="100%" fxFlex>

                            <div fxFlexFill fxLayout="column" fxLayout.gt-xs="row" fxLayoutGap="10px">
                                <div fxFlex.gt-sm="100%" fxFlex>

                                    <form [formGroup]="HospitalForm">
                                        <div fxFlexFill fxLayout="column">

                                            <div fxFlex="100%" fxFlex.xs="100%" fxFlex.sm="33%" style="margin-top: 5px;">

                                                <mat-form-field appearance="outline" fxFlex="250px">
                                                    <mat-label>Select Header Option</mat-label>
                                                    <mat-select formControlName="isHeaderOption" (selectionChange)="onSelectionChange($event.value)">
                                                        <mat-option [value]=1>Logo+Info</mat-option>
                                                        <mat-option [value]=2>Image Header</mat-option>
                                                        <mat-option [value]=3>Template</mat-option>
                                                    </mat-select>
                                                </mat-form-field>
                                            </div>

                                            <div fxFlex="100%" fxFlex.xs="100%" fxFlex.sm="33%">

                                                <airmid-editor label="Template Details" formControlName="header"
                                                    [(value)]="vTemplateDesc"
                                                    [formGroup]="HospitalForm"></airmid-editor>

                                                <!-- <mat-checkbox aria-label="Is Active" formControlName="IsActive"
                                                    (checked)=true [(ngModel)]="isActive"
                                                    style="font-weight: bold;margin-right: 20px;">IsActive
                                                </mat-checkbox> -->
                                            </div>

                                        </div>
                                    </form>

                                </div>
                            </div>

                        </div>
                    </div>
                </mat-tab> </mat-tab-group>
        </div>
    </div>

    <!-- Modal footer -->
    <div class="modal-footer">
        <div class="modal-footer-buttons">
            <button type="button" class="btn btn-danger-outline" (click)="onClose()">Close</button>
            <button type="button" class="btn btn-primary" (click)="onSubmit()">Save</button>
        </div>
    </div>
</div>
