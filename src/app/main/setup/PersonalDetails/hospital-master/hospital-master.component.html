<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Hospital
                </span>
            </div>
        </div>
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onAdd()">New Hospital
            </button>
        </div>
    </div>
    
    <airmid-table [gridConfig]="gridConfig" class="content">
        <ng-container filters>
            <form [formGroup]="myformSearch">
                <mat-form-field appearance="outline">
                    <mat-label>Hospital Name</mat-label>
                    <input matInput placeholder="Search First Name" autocomplete="off" [formGroup]="myformSearch"
                        formControlName="NameSearch" (input)="onChangeFirst($event)" />
                    <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('Hospital')">
                        <mat-icon>close</mat-icon>
                    </button>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>PhoneNo</mat-label>
                    <input matInput autocomplete="off" [formGroup]="myformSearch" formControlName="phoneNo"
                        (input)="onChangeFirst($event)" maxlength="10"/>
                    <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('phoneNo')">
                        <mat-icon>close</mat-icon>
                    </button>
                </mat-form-field>

                <!-- <airmid-dropdown label="City" formControlName="cityId" [formGroup]="myformSearch"
                    ValueField="cityName" TextField="cityName" (selectionChange)="selectChangecity($event)"
                    [(ngModel)]="gridConfig.filters[1].fieldValue" ApiUrl="CityMaster/get-cities"></airmid-dropdown> -->

                <airmid-dropdown label="City Name" formControlName="cityId" [formGroup]="myformSearch"
                    [(ngModel)]="gridConfig.filters[1].fieldValue" [mode]="autocompletecity"
                    (selectionChange)="selectChangecity($event)">
                </airmid-dropdown>

                <mat-radio-group name="IsActive" formControlName="IsActive"
                    [(ngModel)]="gridConfig.filters[3].fieldValue" (change)="onChangeFirst($event)">
                    <div fxLayout="row">

                        <mat-radio-button value='1'>Active</mat-radio-button>
                        <mat-radio-button value='0'>Deactive</mat-radio-button>
                    </div>
                </mat-radio-group>
            </form>
        </ng-container>
    </airmid-table>
</div>
