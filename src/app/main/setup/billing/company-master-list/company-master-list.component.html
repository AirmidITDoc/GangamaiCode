<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Company Master
                </span>
            </div>
        </div>
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onSave()" *ngIf="IsAdd">+ New Company
            </button>
        </div>
    </div>
    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

        <ng-template #actionButtonTemplate let-element>
            <div fxLayout="row" fxLayoutAlign="center center">


                <button mat-icon-button matTooltip="IsSubCompany" (click)="AssignServCompany(element)">
                    <mat-icon>business</mat-icon>
                </button>

                <button mat-icon-button matTooltip="Edit Company" (click)="onSave(element)">
                    <mat-icon> edit</mat-icon>
                </button>

                <button mat-icon-button matTooltip="Edit Service Code" (click)="CompservUpdate(element)">
                    <mat-icon> edit</mat-icon>
                </button>

                <button mat-icon-button matTooltip="Delete" (click)="delCompany(element)">
                    <mat-icon>delete</mat-icon>
                </button>


            </div>
        </ng-template>


        <airmid-table [gridConfig]="gridConfig" class="content">
            <ng-container filters>
                <form [formGroup]="searchform" fxLayout="column">

                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>Company Name</mat-label>
                        <input matInput placeholder="Search Company Name" autocomplete="off" (input)="onChangeFirst()"
                            [formGroup]="searchform" formControlName="CompanyNameSearch" />
                        <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('CompanyNameSearch')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>

                    <airmid-dropdown label="Company Type" formControlName="compTypeId" [formGroup]="searchform"  [(ngModel)]="gridConfig.filters[1].fieldValue"
                        [mode]="autocompleteModetypeName" (selectionChange)="onChangeFirst()">
                    </airmid-dropdown>

                    <airmid-dropdown label="City" formControlName="cityId" [formGroup]="searchform"  [(ngModel)]="gridConfig.filters[2].fieldValue"
                      (selectionChange)="onChangeFirst()" [mode]="autocompleteModecity">
                    </airmid-dropdown>

                  

                     <mat-form-field appearance="outline" fxFlex>
                        <mat-label>Mobile No</mat-label>
                        <input matInput placeholder="Mobile No"  (input)="onChangeFirst()" 
                            [formGroup]="searchform" formControlName="phoneNo" [max]="10"/>
                        <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('phoneNo')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>



                    <mat-radio-group value="" fxLayoutAlign="center center" formControlName="Isactive"
                        [(ngModel)]="gridConfig.filters[4].fieldValue" [formGroup]="searchform">
                        <mat-radio-button value="2">All</mat-radio-button>
                        <mat-radio-button mat-fab value="1">IsActive</mat-radio-button>
                        <mat-radio-button mat-fab value="0">IsDeactive</mat-radio-button>
                    </mat-radio-group>
                </form>
            </ng-container>
        </airmid-table>
    </div>
</div>
