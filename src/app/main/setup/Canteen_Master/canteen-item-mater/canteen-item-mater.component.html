<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Canteen Item Master
                </span>
            </div>
        </div>
        <!-- *ngIf="IsAdd" -->
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onSave()">+ New Item
            </button>
        </div>
    </div>
    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">


        <ng-template #actionsTemplateactive let-element>
            <div fxLayout="row" fxLayoutAlign="center center">

                <mat-icon *ngIf="element.isdeleted == 1" title="Isdeleted" style="background-color: red;">
                    <img width="30px" height="30px" src="assets/images/logos/drugtype.png">
                </mat-icon>
            </div>
        </ng-template>

        <!-- <ng-template #actionsTemplatebatch let-element>
            <div fxLayout="row" fxLayoutAlign="center center">

                <mat-icon *ngIf="element.isBatchRequired == true" title="IsBatchRequired"
                    style="background-color: rgb(232, 127, 52);">
                    <img width="30px" height="30px" src="assets/images/logos/drugtype.png">
                </mat-icon>

            </div>
        </ng-template> -->

        <ng-template #actionButtonTemplate let-element>
            <div fxLayout="row" fxLayoutAlign="center center">

                <button mat-icon-button matTooltip="Edit Item" (click)="onSave(element)">
                    <mat-icon> edit</mat-icon>
                </button>


                <button mat-icon-button matTooltip="Delete" (click)="delitem(element)">
                    <mat-icon>delete</mat-icon>
                </button>


            </div>
        </ng-template>

        <airmid-table [gridConfig]="gridConfig" class="content">
            <ng-container filters>
                <form [formGroup]="myformSearch" fxLayout="column">



                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>Item Name</mat-label>
                        <input matInput placeholder="Search Item Name" autocomplete="off" (input)="onChangeFirst()"
                            [formGroup]="myformSearch" formControlName="ItemNameSearch" />
                        <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('ItemNameSearch')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>



                    <!-- <airmid-dropdown label="Item Category Name" formControlName="CatId"
                        (selectionChange)="Catlist($event)" [(ngModel)]="gridConfig.filters[2].fieldValue"
                        [formGroup]="myformSearch" [mode]="autocompleteModeItemCategory">
                    </airmid-dropdown>

                    <airmid-dropdown label="Item Generic Name" formControlName="GenericId"
                        (selectionChange)="Genericlist($event)" [(ngModel)]="gridConfig.filters[3].fieldValue"
                        [formGroup]="myformSearch" [mode]="autocompleteModeItemGenericName">
                    </airmid-dropdown> -->

                    <!-- <airmid-dropdown label="Drug Type" formControlName="DrugTypeId" (selectionChange)="druglist($event)"
                        [formGroup]="myformSearch" [mode]="autocompleteModeDrugType"
                        [(ngModel)]="gridConfig.filters[6].fieldValue"></airmid-dropdown>


                    <airmid-dropdown label="Manufacture Name" formControlName="ManufId"
                        (selectionChange)="Manulist($event)" [formGroup]="myformSearch" [mode]="autocompleteModeMenu"
                        [(ngModel)]="gridConfig.filters[5].fieldValue">
                    </airmid-dropdown> -->


                    <!-- <mat-form-field appearance="outline">
                        <mat-label>Storage Location</mat-label>
                        <input matInput placeholder="Storage Location" autocomplete="off" [formGroup]="myformSearch"
                            formControlName="ProdLocation" (input)="onChangeFirst()" />
                        <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('ProdLocation')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field> -->

                    <!-- <span> <mat-icon class="pill pink s-16">circle</mat-icon> HighRisk Drug</span> -->
                    <!-- <span> <mat-icon class="pill red s-16">circle</mat-icon>Emergency Drug</span>
                    <span> <mat-icon class="pill blue s-16">circle</mat-icon>Narcotic Drug</span>
                    <span> <mat-icon class="pill green s-16">circle</mat-icon>H1 Drug</span> -->

                </form>

            </ng-container>
        </airmid-table>
    </div>
</div>
