<div class="modal-wrapper grid-container">
    <!-- Modal header -->
    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{ value: '*', params: { delay: '100ms', x: '-25px' } }">New External Doctor </span>
            </div>
            <div class="modal-header-right">
                <div class="comman-date-container">
                    <div class="close-icon">
                        <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                            matTooltip="Close">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-body" fusePerfectScrollbar>
        <div class="modal-body-container">
            <div class="personal-panel fix-panel">

                <form [formGroup]="myForm">
                    <input type="hidden" name="extDoctorId" formControlName="extDoctorId"  [(ngModel)]="vextDoctorId">
                    <div fxLayout="row wrap" fxLayoutGap="12px grid">
                        <div fxFlex="50%" fxFlex.xs="100%" fxFlex.sm="33%">
                            <airmid-textbox label="First Name" formControlName="firstName" [value]="data?.firstName"
                                [formGroup]="myForm" [validations]="getValidationMessages().FirstName"
                                [maxLength]="50">
                            </airmid-textbox>
                        </div>
                        <div fxFlex="50%" fxFlex.xs="100%" fxFlex.sm="33%">
                            <airmid-textbox label="LastName" formControlName="lastName" [value]="data?.lastName"
                                [formGroup]="myForm" [validations]="getValidationMessages().LastName" [maxLength]="50">
                            </airmid-textbox>
                        </div>

                        <div fxFlex="100%" fxFlex.xs="100%" fxFlex.sm="33%">
                            <airmid-textbox label="Doctor Name" formControlName="doctorName" [value]="data?.doctorName"
                                [formGroup]="myForm" [validations]="getValidationMessages().DoctorName"
                                [maxLength]="150">
                            </airmid-textbox>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <div class="modal-footer">
        <div class="footer-navigation-container" fxLayoutAlign="space-between">
            <div fxLayout="row">
                
            </div>
            <div class="modal-footer-buttons">
                <button type="button" class="btn btn-danger-outline" (click)="onClose()">Close</button>
                <button type="button" class="btn btn-primary" (click)="onSubmit()">Save</button>
            </div>
        </div>
    </div>
</div>
