<div class="modal-wrapper grid-container">
    <!-- Modal header -->
    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{ value: '*', params: { delay: '100ms', x: '-25px' } }"> Doctor Share Payout </span>
            </div>
            <div class="modal-header-right">
                <div class="comman-date-container">

                    <div class="close-icon">
                        <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                            matTooltip="Close">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal body -->
    <div class="modal-body" fusePerfectScrollbar>
        <div class="modal-body-container">
            <div fxLayout="column" class="gap-12">

                <div class="modal-card-container">
                    <mat-card>
                        <div fxLayout="column" class="gap-8">

                            <form [formGroup]="_DoctorShareService.DocFormGroup">
                                <div fxLayout="row wrap" fxLayoutGap="8px 0px grid">

                                    <div fxLayout="row" fxLayoutGap="5px" style="padding-top: 20px;">
                                        <div fxLayout="row wrap" fxLayoutGap="12px grid">
                                            <mat-radio-group formControlName="ServiceOrgrpType" name="ServiceOrgrpType"
                                                fxLayout="row">
                                                <mat-radio-button value="1">Service Wise</mat-radio-button>
                                                <mat-radio-button value="2">Group Wise</mat-radio-button>
                                            </mat-radio-group>
                                            <mat-divider [vertical]="true"></mat-divider>&nbsp;
                                            <mat-radio-group formControlName="PatientType" name="PatientType"
                                                fxLayout="row">
                                                <mat-radio-button value="0">OP</mat-radio-button>
                                                <mat-radio-button value="1">IP</mat-radio-button>
                                            </mat-radio-group>
                                        </div>
                                    </div>
                                </div>
                                <div fxLayout="row wrap" fxLayoutGap="8px 0px grid" style="padding-top: 23px;">
                                    <div fxFlex="20" fxFlex.xs="100" fxFlex.sm="33">
                                        <airmid-dropdown label="Select Doctor Name" formControlName="DoctorID"
                                            [value]="data?.DoctorID" [formGroup]="_DoctorShareService.DocFormGroup"
                                            (selectionChange)="selectChangeDoctor($event)"
                                            [mode]="autocompleteModeItem">
                                        </airmid-dropdown>
                                    </div>

                                    <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="33%"
                                        *ngIf="_DoctorShareService.DocFormGroup.get('ServiceOrgrpType').value=='1'">
                                        <airmid-dropdown label="Select Service Name" formControlName="ServiceID"
                                            [value]="data?.ServiceID" [formGroup]="_DoctorShareService.DocFormGroup"
                                            (selectionChange)="selectChangeService($event)"
                                            [mode]="autocompleteModeService">
                                        </airmid-dropdown>
                                    </div>
                                    <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="33%"
                                        *ngIf="_DoctorShareService.DocFormGroup.get('ServiceOrgrpType').value=='2'">
                                        <airmid-dropdown label="Select Group Name" formControlName="GroupWise"
                                            [value]="data?.GroupWise" [formGroup]="_DoctorShareService.DocFormGroup"
                                            (selectionChange)="selectChangeGroup($event)"
                                            [mode]="autocompletedepartment">
                                        </airmid-dropdown>
                                    </div>
                                    <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="33%">
                                        <airmid-dropdown label="Select Class Name" formControlName="ClassId"
                                            [value]="data?.ClassId" [formGroup]="_DoctorShareService.DocFormGroup"
                                            (selectionChange)="selectChangeClass($event)" [mode]="autocompleteClass">
                                        </airmid-dropdown>
                                    </div>
                                    <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="33%">

                                        <mat-radio-group formControlName="DocShareType" name="DocShareType"
                                            fxLayout="row">
                                            <mat-label
                                                style="font-weight: bold;font-size: large;color: rgb(5, 77, 101);">Doctor
                                                Share :</mat-label>&nbsp;&nbsp;
                                            <mat-radio-button value="P">%</mat-radio-button> &nbsp;
                                            <mat-radio-button value="A">Amount</mat-radio-button>
                                        </mat-radio-group>

                                    </div>
                                    <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="33%"
                                        *ngIf="_DoctorShareService.DocFormGroup.get('DocShareType').value=='P'">
                                        <mat-form-field appearance="outline">
                                            <mat-label>%</mat-label>
                                            <input name="Percentage" formControlName="Percentage" matInput
                                                [(ngModel)]="vServicePerc" (keypress)="keyPressAlphanumeric($event)">
                                        </mat-form-field>
                                    </div>
                                    <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="33%"
                                        *ngIf="_DoctorShareService.DocFormGroup.get('DocShareType').value=='A'">
                                        <mat-form-field appearance="outline">
                                            <mat-label>Amount</mat-label>
                                            <input name="Amount" formControlName="Amount" matInput
                                                [(ngModel)]="vServiceAmt" (keypress)="keyPressAlphanumeric($event)">
                                        </mat-form-field>
                                    </div>
                                </div>


                            </form>
                        </div>
                    </mat-card>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <div class="footer-navigation-container">
            <div class="modal-footer-buttons">
                <button class="btn btn-danger-outline" (click)="onClose()">Close</button>
                <button class="btn btn-primary" (click)="OnSave()">Save</button>
            </div>
        </div>
    </div>
</div>
