<div class="modal-wrapper grid-container">
    <!-- Modal header -->
    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{ value: '*', params: { delay: '100ms', x: '-25px' } }">Doctor Share Payout</span>
            </div>
            <div class="modal-header-right">
                <div class="comman-date-container">
                  
                    <div class="close-icon">
                        <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                            matTooltip="Close">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-body">
        <form [formGroup]="Doctorshare" class="form-container">
            <div class="modal-body-container">
                <div fxLayout="column" class="gap-8" fxFlex>
                    <div class="modal-card-container">
                        <!-- Type Selection Section -->
                        <div class="selection-section">
                            <mat-card class="type-card" style="padding: 20px;">
                                <div class="radio-group-container" fxLayout="row" class="gap-12">
                                    <div class="radio-group-wrapper">
                                        <label class="group-label" style="font-weight: bold;" >Type :</label>&nbsp;
                                        <mat-radio-group formControlName="shrTypeSerOrGrp" class="custom-radio-group">
                                            <mat-radio-button value="1" class="custom-radio-button">
                                                <span class="radio-label">Service Wise</span>
                                            </mat-radio-button>
                                            <mat-radio-button value="2" class="custom-radio-button">
                                                <span class="radio-label">Group Wise</span>
                                            </mat-radio-button>
                                        </mat-radio-group>
                                    </div>
    
                                    <mat-divider [vertical]="true" class="vertical-divider"></mat-divider>
    
                                    <div class="radio-group-wrapper">
                                        <label class="group-label" style="font-weight: bold;">Patient Type :</label>&nbsp;
                                        <mat-radio-group formControlName="opIpType" class="custom-radio-group">
                                            <mat-radio-button value="0" class="custom-radio-button">
                                                <span class="radio-label">OP</span>
                                            </mat-radio-button>
                                            <mat-radio-button value="1" class="custom-radio-button">
                                                <span class="radio-label">IP</span>
                                            </mat-radio-button>
                                        </mat-radio-group>
                                    </div>
                                </div>
                            </mat-card>
                        </div>
                    </div>
    
                    <div class="modal-card-container">
                        <div fxLayout="column"  >
                            <div fxFlex="100%" fxFlex.xs="100%" fxFlex.sm="100%">
                                <airmid-dropdown label="Select Doctor Name" formControlName="doctorId"
                                    [value]="data?.DoctorID" [formGroup]="Doctorshare"
                                    (selectionChange)="selectChangeDoctor($event)" [mode]="autocompleteModeDoctor">
                                </airmid-dropdown>
                            </div>
    
                            <!-- Service Name (Conditional) -->
                            <div fxFlex="100%" fxFlex.xs="100%" fxFlex.sm="100%" *ngIf="Doctorshare.get('shrTypeSerOrGrp').value=='1'">
                                <airmid-dropdown label="Service Name" formControlName="serviceId" [formGroup]="Doctorshare"
                                    [value]="data?.serviceId" [validations]="getValidationMessages().ServiceID"
                                    [mode]="autocompleteModeService">
                                </airmid-dropdown>
                            </div>
    
                            <!-- Group Name (Conditional) -->
                            <div fxFlex="100%" fxFlex.xs="100%" fxFlex.sm="100%" *ngIf="Doctorshare.get('shrTypeSerOrGrp').value=='2'">
                                <airmid-dropdown label="Select Group Name" formControlName="GroupWise"
                                    [value]="data?.GroupWise" [formGroup]="Doctorshare"
                                    (selectionChange)="selectChangeGroup($event)" [mode]="autocompleteGroupName">
                                </airmid-dropdown>
                            </div>
    
                            <!-- Class Name -->
                            <div fxFlex="100%" fxFlex.xs="100%" fxFlex.sm="100%">
                                <airmid-dropdown label="Select Class Name" formControlName="classId" [value]="data?.classId"
                                    [formGroup]="Doctorshare" (selectionChange)="selectChangeClass($event)"
                                    [mode]="autocompleteClass" [validations]="getValidationMessages().classId">
                                </airmid-dropdown>
                            </div>
                        </div>
    
                    </div>
    
                    <div class="modal-card-container">
                         <mat-card class="share-card"> 
                      <div fxLayout="column" fxLayoutGap="6px">
                           
                                <div class="share-type-container">
                                    <label class="share-label" style="font-weight: bold;">Doctor Share :</label>&nbsp;
                                    <mat-radio-group formControlName="docShrType" class="share-radio-group">
                                        <mat-radio-button value="P" class="share-radio-button">
                                            <span class="radio-label">Percentage (%)</span>
                                        </mat-radio-button>
                                        <mat-radio-button value="A" class="share-radio-button">
                                            <span class="radio-label">Fixed Amount</span>
                                        </mat-radio-button>
                                    </mat-radio-group>
                                </div>
    
                                <!-- Percentage Input -->
                                <div fxFlex="100%" fxFlex.xs="100%" fxFlex.sm="100%" *ngIf="Doctorshare.get('docShrType').value=='P'">
                                    <mat-form-field appearance="outline" class="value-input" fxFlex>
                                        <mat-label>Percentage Value</mat-label>
                                        <input name="Percentage" formControlName="servicePercentage" matInput type="text"
                                            [(ngModel)]="vServicePerc" (keypress)="keyPressDigitsOnly($event)"
                                            placeholder="0">
                                        <span matSuffix>%</span>
                                    </mat-form-field>
                                </div>
    
                                <!-- Amount Input -->
                                <div fxFlex="100%" fxFlex.xs="100%" fxFlex.sm="100%" *ngIf="Doctorshare.get('docShrType').value=='A'">
                                    <mat-form-field appearance="outline" class="value-input" fxFlex>
                                        <mat-label>Amount Value</mat-label>
                                        <input name="Amount" formControlName="serviceAmount" matInput type="text"
                                            [(ngModel)]="vServiceAmt" (keypress)="keyPressDigitsOnly($event)"
                                            placeholder="0">
                                        <span matPrefix>₹&nbsp;</span>
                                    </mat-form-field>
                                </div>
                                </div> 
                            </mat-card> 
    
                    </div> 
                </div> 
            </div>
        </form>
    </div>

    <!-- Modal Footer -->
 

        <div class="modal-footer">
            <div class="footer-navigation-container">
                <div class="modal-footer-buttons">
                    <button class="btn btn-danger-outline" (click)="onClose()">Close</button>
                    <button class="btn btn-primary" (click)="OnSave()">Save</button>
                </div>
            </div>
        </div>
