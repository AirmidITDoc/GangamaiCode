<div class="doctor-share-modal">
    <!-- Modal Header -->
    <div class="modal-header-modern accent">
        <h2 class="header-title" [@animate]="{ value: '*', params: { delay: '100ms', x: '-25px' } }">
            Doctor Share Payout
        </h2>
        <button mat-icon-button class="close-button" [mat-dialog-close]="true" aria-label="Close dialog" matTooltip="Close">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body-modern">
        <form [formGroup]="Doctorshare" class="form-container">
            
            <!-- Type Selection Section -->
            <div class="selection-section">
                <mat-card class="type-card">
                    <div class="radio-group-container">
                        <div class="radio-group-wrapper">
                            <label class="group-label">Type</label>
                            <mat-radio-group formControlName="shrTypeSerOrGrp" class="custom-radio-group">
                                <mat-radio-button value="1" class="custom-radio-button">
                                    <span class="radio-label">Service Wise</span>
                                </mat-radio-button>
                                <mat-radio-button value="2" class="custom-radio-button">
                                    <span class="radio-label">Group Wise</span>
                                </mat-radio-button>
                            </mat-radio-group>
                        </div>
                        
                        <mat-divider [vertical]="true" class="vertical-divider"></mat-divider>
                        
                        <div class="radio-group-wrapper">
                            <label class="group-label">Patient Type</label>
                            <mat-radio-group formControlName="opIpType" class="custom-radio-group">
                                <mat-radio-button value="0" class="custom-radio-button">
                                    <span class="radio-label">OP</span>
                                </mat-radio-button>
                                <mat-radio-button value="1" class="custom-radio-button">
                                    <span class="radio-label">IP</span>
                                </mat-radio-button>
                            </mat-radio-group>
                        </div>
                    </div>
                </mat-card>
            </div>

            <!-- Form Fields Section -->
            <div class="form-fields-section">
                
                <!-- Doctor Name -->
                <div class="form-field-wrapper">
                    <airmid-dropdown 
                        label="Select Doctor Name" 
                        formControlName="doctorId"
                        [value]="data?.DoctorID" 
                        [formGroup]="Doctorshare"
                        (selectionChange)="selectChangeDoctor($event)" 
                        [mode]="autocompleteModeDoctor">
                    </airmid-dropdown>
                </div>

                <!-- Service Name (Conditional) -->
                <div class="form-field-wrapper" *ngIf="Doctorshare.get('shrTypeSerOrGrp').value=='1'">
                    <airmid-dropdown 
                        label="Service Name" 
                        formControlName="serviceId"
                        [formGroup]="Doctorshare" 
                        [value]="data?.serviceId"
                        [validations]="getValidationMessages().ServiceID"
                        [mode]="autocompleteModeService">
                    </airmid-dropdown>
                </div>

                <!-- Group Name (Conditional) -->
                <div class="form-field-wrapper" *ngIf="Doctorshare.get('shrTypeSerOrGrp').value=='2'">
                    <airmid-dropdown 
                        label="Select Group Name" 
                        formControlName="GroupWise"
                        [value]="data?.GroupWise" 
                        [formGroup]="Doctorshare"
                        (selectionChange)="selectChangeGroup($event)" 
                        [mode]="autocompleteGroupName">
                    </airmid-dropdown>
                </div>

                <!-- Class Name -->
                <div class="form-field-wrapper">
                    <airmid-dropdown 
                        label="Select Class Name" 
                        formControlName="classId"
                        [value]="data?.classId" 
                        [formGroup]="Doctorshare"
                        (selectionChange)="selectChangeClass($event)" 
                        [mode]="autocompleteClass"
                        [validations]="getValidationMessages().classId">
                    </airmid-dropdown>
                </div>

                <!-- Doctor Share Type Section -->
                <div class="share-section">
                    <mat-card class="share-card">
                        <div class="share-type-container">
                            <label class="share-label">Doctor Share</label>
                            <mat-radio-group formControlName="docShrType" class="share-radio-group">
                                <mat-radio-button value="P" class="share-radio-button">
                                    <span class="radio-label">Percentage (%)</span>
                                </mat-radio-button>
                                <mat-radio-button value="A" class="share-radio-button">
                                    <span class="radio-label">Fixed Amount</span>
                                </mat-radio-button>
                            </mat-radio-group>
                        </div>

                        <!-- Percentage Input -->
                        <div class="value-input-wrapper" *ngIf="Doctorshare.get('docShrType').value=='P'">
                            <mat-form-field appearance="outline" class="value-input">
                                <mat-label>Percentage Value</mat-label>
                                <input 
                                    name="Percentage" 
                                    formControlName="servicePercentage" 
                                    matInput
                                    type="number"
                                    [(ngModel)]="vServicePerc" 
                                    (keypress)="keyPressAlphanumeric($event)"
                                    placeholder="0">
                                <span matSuffix>%</span>
                            </mat-form-field>
                        </div>

                        <!-- Amount Input -->
                        <div class="value-input-wrapper" *ngIf="Doctorshare.get('docShrType').value=='A'">
                            <mat-form-field appearance="outline" class="value-input">
                                <mat-label>Amount Value</mat-label>
                                <input 
                                    name="Amount" 
                                    formControlName="serviceAmount" 
                                    matInput
                                    type="number"
                                    [(ngModel)]="vServiceAmt" 
                                    (keypress)="keyPressAlphanumeric($event)"
                                    placeholder="0">
                                <span matPrefix>₹&nbsp;</span>
                            </mat-form-field>
                        </div>
                    </mat-card>
                </div>

            </div>
        </form>
    </div>

    <!-- Modal Footer -->
    <div class="modal-footer-modern">
        <button mat-stroked-button class="cancel-button" (click)="onClose()">
            <mat-icon>close</mat-icon>
            Cancel
        </button>
        <button mat-raised-button color="primary" class="save-button" (click)="OnSave()">
            <mat-icon>check</mat-icon>
            Save
        </button>
    </div>
</div>
