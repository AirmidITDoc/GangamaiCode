<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Doctor Share Payout List
                </span>
            </div>
        </div>
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onAdd()">New Add
            </button>

        </div>
    </div>
    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
        <ng-template #actionsTemplate let-element>
            <div fxLayout="row" fxLayoutAlign="center center">

                <mat-icon *ngIf="element.op_IP_Type=='0'" matTooltip="IP" class="pill green-600 s-16">circle</mat-icon>
                <mat-icon *ngIf="element.op_IP_Type=='1'" matTooltip="OP" class="pill orange-600 s-16">circle
                </mat-icon>

            </div>
        </ng-template>
          <ng-template #actionButtonTemplate let-element>
            <div fxLayout="row" fxLayoutAlign="center center">
                <button mat-icon-button (click)="onEdit(element)" style="color:black;">
                    <mat-icon title="Edit Menu">edit</mat-icon>
                </button>
                <button mat-icon-button (click)="onDelete(element)" color="warn">
                    <mat-icon>delete_outline</mat-icon>
                </button>

            </div>
        </ng-template>
        
        <airmid-table [gridConfig]="gridConfig" class="content">
            <ng-container filters>
                <form [formGroup]="_DoctorShareService.DocFormGroup">
                    <airmid-dropdown label="Select Doctor Name" formControlName="DoctorName"
                        [formGroup]="_DoctorShareService.DocFormGroup" (selectionChange)="ListView($event)"
                        [mode]="autocompleteModeItem">
                    </airmid-dropdown>
                    <mat-radio-group formControlName="Type" name="Type" (change)="onChange()">
                        <mat-radio-button value="1">Service Wise</mat-radio-button>
                        <mat-radio-button value="2">Group Wise</mat-radio-button>
                    </mat-radio-group>

                    <div style="padding: 10px;">
                        <button mat-raised-button class="searchButton" matTooltip="search" (click)="getfilterdata()">
                            <mat-icon class="searchiconbutton">search</mat-icon>
                        </button>
                    </div>

                </form>
            </ng-container>
        </airmid-table>
      
    </div>
</div>
