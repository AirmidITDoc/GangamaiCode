<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Doctor Master
                </span>
            </div>
        </div>
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <input hidden #excelInputRef type="file" (change)="handleFileChange($event, excelInputRef)" />
            <!-- <button mat-raised-button (click)="excelInputRef.click()">
                Import excel
            </button> -->
            <button mat-raised-button (click)="newDoctormaster()">New Doctor
            </button>
            <!-- <button mat-raised-button (click)="newSchdule()">New Doctor Schdule
            </button> -->
        </div>
    </div>
    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
        <ng-template #actionsTemplate let-element>
            <div fxLayout="row" fxLayoutAlign="center center">
                <!-- <mat-icon *ngIf="element.isInHouseDoctor==true" title="IsInHouseDoctor">account_balance
                </mat-icon> -->
                <mat-icon *ngIf="element.isInHouseDoctor==true" title="IsInHouseDoctor">
                    <img width="50px" height="50px" src="assets/images/logos/houseondr.png">
                </mat-icon>
            </div>
        </ng-template>

        <ng-template #actionsTemplate1 let-element>
            <div fxLayout="row" fxLayoutAlign="center center">
                <!-- <mat-icon *ngIf="element.isOnCallDoctor==true" title="IsOnCallDoctor">ring_volume
                </mat-icon> -->
                <mat-icon *ngIf="element.isOnCallDoctor==true" title="IsOnCallDoctor">
                    <img width="50px" height="50px" src="assets/images/logos/callondr.png">
                </mat-icon>
            </div>
        </ng-template>


        <ng-template #actionsTemplate2 let-element>
            <div fxLayout="row" fxLayoutAlign="center center">
                <!-- <mat-icon *ngIf="element.isConsultant==true" title="IsConsultant">local_pharmacy
                </mat-icon> -->
                <mat-icon *ngIf="element.isConsultant==true" title="IsConsultant">
                    <img width="50px" height="50px" src="assets/images/logos/consultantdr.jpg">
                </mat-icon>
            </div>
        </ng-template>

        <ng-template #actionsTemplate3 let-element>
            <div fxLayout="row" fxLayoutAlign="center center">
                <!-- <mat-icon *ngIf="element.isRefDoc==false" title="IsRefDoc">directions_run
                </mat-icon> -->
                <mat-icon *ngIf="element.isRefDoc==true" title="IsRefDoc">
                    <img width="50px" height="50px" src="assets/images/logos/refdr.png">
                </mat-icon>
            </div>
        </ng-template>

        <airmid-table [gridConfig]="gridConfig" class="content">
            <ng-container filters>
                <form [formGroup]="myformSearch" fxLayout="column">

                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>First Name</mat-label>
                        <input matInput placeholder="Search First Name" autocomplete="off" [formGroup]="myformSearch"
                            formControlName="DoctorNameSearch" (input)="onChangeFirst()" />
                        <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('firstName')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>

                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>Last Name</mat-label>
                        <input matInput placeholder="Search Last Name" autocomplete="off" [formGroup]="myformSearch"
                            formControlName="lastName" (input)="onChangeFirst()" />
                        <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('lastName')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>

                    <mat-radio-group value="1" [formGroup]="myformSearch" formControlName="FlagActive"
                        (change)="onChangeFirst()" fxLayoutAlign="center center">
                        <mat-radio-button value="2">All</mat-radio-button>
                        <mat-radio-button mat-fab value="1">IsActive</mat-radio-button>
                        <mat-radio-button mat-fab value="0">IsDeactive</mat-radio-button>
                    </mat-radio-group>

                    <div fxLayout="column" class="gap-4 ">
                        <span style="font-weight: bold;">Doctor Type :</span>

                        <mat-radio-group formControlName="DoctorType" fxLayout="column" fxLayoutGap="8px"
                            (change)="onDoctorTypeChange($event)">

                            <mat-radio-button value="0">All</mat-radio-button>
                            <mat-radio-button value="1">RMO Doctor</mat-radio-button>
                            <mat-radio-button value="2">Consultant</mat-radio-button>
                            <mat-radio-button value="3">Ref Doctor</mat-radio-button>

                        </mat-radio-group>

                        <!-- <mat-slide-toggle name="IsConsultant" (change)="onChangeFirst()" formControlName="IsConsultant">
                            IsConsultant / IsRefDoctor
                        </mat-slide-toggle> -->

                        <!-- <mat-slide-toggle name="IsRef" formControlName="IsRef">
                            IsRefDoctor
                        </mat-slide-toggle> -->
                    </div>

                </form>
            </ng-container>
        </airmid-table>
        <ng-template #actionButtonTemplate let-element>
            <div fxLayout="row" fxLayoutAlign="center center">
                <button mat-icon-button (click)="onEdit(element)" style="color:black;">
                    <mat-icon title="Edit Menu">edit</mat-icon>
                </button>
                <button mat-icon-button (click)="onDelete(element)" color="warn">
                    <mat-icon>delete_outline</mat-icon>
                </button>
                <airmid-fileupload-icon [refId]="element.doctorId" [refType]="page" [multiple]="true"
                    [title]="'Doctor Master'"></airmid-fileupload-icon>

                <airmid-signature-icon [refId]="element.doctorId" [refType]="signature" [multiple]="true"
                    docName="DoctorSignature"></airmid-signature-icon>

                <button mat-icon-button matTooltip="Doctor Executive" (click)="onOpenForm(element)">
                    <mat-icon>person</mat-icon>
                </button>
            </div>
        </ng-template>
    </div>
</div>
