<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Employees Master List
                </span>
            </div>
        </div>
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onNew()">New Employee
            </button>

        </div>
    </div>
    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

        <ng-template #actionButtonTemplate let-element>
            <div fxLayout="row" fxLayoutAlign="center center">

                <!-- Button 1: Edit Patient Registration  -->
                <button mat-icon-button matTooltip="Edit Employee Detail" (click)="onNew(element)">
                    <mat-icon>edit</mat-icon>
                </button>

                <!-- Button 2: Print Registration  -->
                <button mat-icon-button matTooltip="Deactive" (click)="onCancel(element)">
                    <mat-icon>delete</mat-icon>
                </button>

                <airmid-fileupload-icon [refId]="element.executiveId" [refType]="page" [multiple]="true"
                    [title]="'Employee Document'"></airmid-fileupload-icon>

                <button mat-icon-button matTooltip="Image Upload" (click)="onFiles1(element)">
                    <img width="25" height="25" src="assets/images/logos/imgUpload.png">
                </button>

            </div>
        </ng-template>

        <airmid-table [gridConfig]="gridConfig" class="content">
            <ng-container filters>
                <form [formGroup]="myFilterform">

                    <mat-form-field appearance="outline">
                        <mat-label>First Name</mat-label>
                        <input matInput placeholder="Search First Name" autocomplete="off"
                            [(ngModel)]="gridConfig.filters[0].fieldValue" />
                        <button matSuffix mat-icon-button aria-label="Clear"
                            (click)="gridConfig.filters[0].fieldValue=''">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Last Name</mat-label>
                        <input matInput placeholder="Search Last Name" autocomplete="off"
                            [(ngModel)]="gridConfig.filters[1].fieldValue" />
                        <button matSuffix mat-icon-button aria-label="Clear"
                            (click)="gridConfig.filters[1].fieldValue=''">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>

                </form>
            </ng-container>
        </airmid-table>
    </div>


</div>
