<div class="modal-wrapper grid-container">
    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">Edit Constant</span>
            </div>
            <div class="modal-header-right">
                <div class="close-icon">
                    <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                        matTooltip="Close">
                        <mat-icon>close</mat-icon>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-body" fusePerfectScrollbar>
        <div class="modal-body-container">
            <form [formGroup]="form">
                <input type="hidden" name="constantId" formControlName="constantId">

                <div fxLayout="row wrap" fxLayoutGap="12px grid">
                    <div fxFlex>
                        <airmid-textbox label="Name" formControlName="name" [value]="data?.name" [formGroup]="form">
                        </airmid-textbox>
                    </div>
                    <div fxFlex>
                        <airmid-textbox label="Value" formControlName="value" [value]="data?.value" [formGroup]="form">
                        </airmid-textbox>
                    </div>
                    <mat-form-field appearance="outline">
                        <mat-label>Constant Type</mat-label>
                        <mat-select formControlName="constantType" [formGroup]="form"
                            (selectionChange)="selectChange($event)">
                            <mat-option *ngFor="let item of constantTypeList" [value]="item.constantType">
                                {{ item.constantType }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>

                <div class="new-appointment-actions gap-8 mt-12" fxLayout="row" fxLayoutAlign="space-between">

                    <div>
                        <!-- <app-airmid-slider label="IsActive/Deactive"   formControlName="isActive" [formGroup]="form" ></app-airmid-slider> -->
                    </div>

                    <div class="new-appointment-actions gap-8" fxLayoutAlign="end center">
                        <button class="btn btn-danger-outline" (click)="onClear(false)">Close</button>
                        <button class="btn btn-primary " color="accent" (click)="onSubmit()">
                            <span>Save</span>
                        </button>
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>
