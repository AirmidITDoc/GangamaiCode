<div class="modal-wrapper grid-container resize-form-fields">
    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">New Menu</span>
            </div>
            <div class="modal-header-right">
                <div class="close-icon">
                    <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                        matTooltip="Close">
                        <mat-icon>close</mat-icon>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-body" fusePerfectScrollbar>
        <div class="modal-body-container">
            <div fxLayout="column" class="gap-12">
                <div class="form-container">
                    <div fxFlexFill fxLayout="column">
                        <mat-card fxFlex.gt-sm="100%" fxFlex style="padding: 10px ; gap: 4px; margin-top: 10px;">
                            <form [formGroup]="dietMenuForm">
                                <input type="hidden" name="dietMenuId" formControlName="dietMenuId">
                                <div fxLayout="row wrap" fxLayoutGap="12px grid">
                                    <div fxFlex="33%" fxFlex.xs="100%" fxFlex.sm="33%">
                                        <airmid-textbox label="Menu Name" formControlName="dietMenuName"
                                            [formGroup]="dietMenuForm" [maxLength]="50"
                                            [validations]="getValidationMessages().MenuName">
                                        </airmid-textbox>
                                    </div>
                                    <div fxFlex="33%" fxFlex.xs="100%" fxFlex.sm="33%">
                                        <airmid-dropdown label="Meal Type" formControlName="mealTypeId"
                                            [formGroup]="dietMenuForm" [validations]="getValidationMessages().MealType"
                                            [mode]="autocompleteModeMealType">
                                        </airmid-dropdown>
                                    </div>
                                    <div fxFlex="33%" fxFlex.xs="100%" fxFlex.sm="33%">
                                        <airmid-dropdown label="Diet Type" formControlName="dietTypeId"
                                            [formGroup]="dietMenuForm" [validations]="getValidationMessages().DietType"
                                            [mode]="autocompleteModeDietType">
                                        </airmid-dropdown>
                                    </div>
                                    <div fxFlex="33%" fxFlex.xs="100%" fxFlex.sm="33%">
                                        <airmid-textbox label="Texture" formControlName="texture"
                                            [formGroup]="dietMenuForm" [maxLength]="50"
                                            [validations]="getValidationMessages().Texture">
                                        </airmid-textbox>
                                    </div>
                                    <div fxFlex="33%" fxFlex.xs="100%" fxFlex.sm="33%">
                                        <airmid-textbox label="Calories (Kcal)" formControlName="calories"
                                            [formGroup]="dietMenuForm" [maxLength]="50"
                                            [validations]="getValidationMessages().Calories">
                                        </airmid-textbox>
                                    </div>
                                    <div fxFlex="33%" fxFlex.xs="100%" fxFlex.sm="33%">
                                        <airmid-textbox label="Protein (g)" formControlName="protein"
                                            [formGroup]="dietMenuForm" [maxLength]="50"
                                            [validations]="getValidationMessages().Protein">
                                        </airmid-textbox>
                                    </div>
                                </div>
                            </form>
                        </mat-card>
                    </div>
                </div>

                <div class="info-container">
                    <div fxFlexFill fxLayout="column">
                        <mat-card fxFlex.gt-sm="100%" fxFlex
                            style="padding: 10px 10px 50px 10px ; gap: 4px; margin-top: 10px;">
                            <div fxLayout="row wrap" fxLayoutGap="12px grid">
                                <div fxFlex="100%" fxFlex.xs="100%" fxFlex.sm="25%">
                                    <mat-card-title>Food Item Details</mat-card-title>
                                </div>

                                <div fxFlex="50%" fxFlex.xs="100%" fxFlex.sm="25%">
                                    <form [formGroup]="dietMenuForm">
                                        <airmid-dropdown label="Select a food item to add.."
                                            formControlName="foodItemId" [formGroup]="dietMenuForm"
                                            (selectionChange)="selectChangeFoodName($event)" ValueField="foodItemId"
                                            TextField="foodName" ApiUrl="FoodItemMaster/get-FoodItemMaster">
                                        </airmid-dropdown>
                                    </form>
                                </div>
                            </div>


                            <hr style="border: none; border-top: 1px solid rgba(0,0,0,0.12); margin: 8px 0;">
                            <div fxLayout="row wrap" fxLayoutGap="20px grid" style="padding:5px 0px" cdkDropList
                                (cdkDropListDropped)="dropFoodItem($event)">
                                <div *ngFor="let item of selectedFoodItems; let i = index" class="menucard">

                                    <div fxLayout="row wrap" fxLayoutGap="12px grid">

                                        <div fxFlex="15%">
                                            <mat-card-title>
                                                {{ item.sequenceNo }}
                                            </mat-card-title>
                                        </div>

                                        <div fxFlex="70%">
                                            <mat-card-title>
                                                {{ item.name }}
                                            </mat-card-title>
                                        </div>

                                        <div fxFlex="10%" class="menuclose-icon">
                                            <button mat-icon-button type="button" tabIndex="-1" matTooltip="Remove"
                                                (click)="removeFoodItem(i)">
                                                <mat-icon>close</mat-icon>
                                            </button>
                                        </div>

                                    </div>

                                    <div fxLayout="row wrap" fxLayoutGap="8px grid">
                                        <div fxFlex="50%">
                                            <mat-form-field appearance="outline" class="w-100">
                                                <mat-label>Quantity</mat-label>
                                                <input matInput type="text" [(ngModel)]="item.quantity"
                                                    [ngModelOptions]="{standalone: true}" maxlength="10">
                                            </mat-form-field>
                                        </div>

                                        <div fxFlex="50%">
                                            <mat-form-field appearance="outline" class="w-100">
                                                <mat-label>Unit</mat-label>
                                                <mat-select [(ngModel)]="item.unitId"
                                                    [ngModelOptions]="{standalone: true}">
                                                    <mat-option *ngFor="let u of unitList" [value]="u.value">
                                                        {{ u.text }}
                                                    </mat-option>
                                                </mat-select>
                                            </mat-form-field>
                                        </div>


                                    </div>

                                </div>
                            </div>

                        </mat-card>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-footer">
        <div class="footer-navigation-container">
            <form [formGroup]="dietMenuForm">
                <div class="modal-footer-container">
                    <div></div>
                    <div class="modal-footer-buttons">
                        <button class="btn btn-danger-outline" (click)="onClear(false)">Close</button>
                        <button class="btn btn-primary " color="accent" (click)="onSubmit()">
                            <span>Save</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
