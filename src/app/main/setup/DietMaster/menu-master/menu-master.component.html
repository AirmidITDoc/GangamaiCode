<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Menu List
                </span>
            </div>
        </div>
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onSave()" *ngIf="IsAdd">+ New Menu
            </button>
        </div>
    </div>

    <ng-template #dietMenuDetails let-element>
        <div class="food-collapse-row">
            <mat-chip-set>
                <mat-chip
                    *ngFor="let data of getDetailArray(element?.dietMenuDetails).slice(0, isExpanded(element) ? undefined : visibleCount)">
                    {{ getDetailNames(data) }}
                </mat-chip>
                <mat-chip *ngIf="!isExpanded(element) && getDetailArray(element?.dietMenuDetails).length > visibleCount"
                    class="more-chip"
                    style="--mdc-chip-label-text-color: #fff; --mdc-chip-elevated-container-color: #3949AB;"
                    (click)="expandRow(element)">
                    +{{ getDetailArray(element?.dietMenuDetails).length - visibleCount }} more
                </mat-chip>
            </mat-chip-set>
        </div>
    </ng-template>

    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
        <!-- (onSelectRow)="GetDetails1($event)" -->
        <airmid-table [gridConfig]="gridConfig" class="content" #grid :ShowButtons="false">
            <ng-container filters>
                <form [formGroup]="myFilterform" fxLayout="column">
                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>Diet Menu Name</mat-label>
                        <input matInput placeholder="Search Diet Menu Name" autocomplete="off"
                            [formGroup]="myFilterform" formControlName="DietMenuName" (input)="onChangeFirst()" />
                        <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('DietMenuName')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>
                    
                        <airmid-dropdown label="Meal Type" formControlName="MealName" [formGroup]="myFilterform"
                            [(ngModel)]="gridConfig.filters[1].fieldValue"(selectionChange)="MealTypeView($event)" [mode]="autocompleteModeMealType">
                        </airmid-dropdown>
                        
                        <airmid-dropdown label="Diet Type" formControlName="DietName" [formGroup]="myFilterform"
                             [(ngModel)]="gridConfig.filters[2].fieldValue"(selectionChange)="DietTypeView($event)" [mode]="autocompleteModeDietType">
                        </airmid-dropdown>
                        
                </form>
            </ng-container>
        </airmid-table>
    </div>
