<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Menu List
                </span>
            </div>
        </div>
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onSave()" *ngIf="IsAdd">+ New Menu
            </button>
        </div>
    </div>
    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
        <airmid-table [gridConfig]="gridConfig" class="content" #grid :ShowButtons="false"
            (onSelectRow)="GetDetails1($event)">
            <ng-container filters>
                <form [formGroup]="myFilterform" fxLayout="column">
                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>Diet Menu Name</mat-label>
                        <input matInput placeholder="Search Diet Menu Name" autocomplete="off"
                            [formGroup]="myFilterform" formControlName="DietMenuName"
                            (input)="onChangeFirst()" />
                        <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('DietMenuName')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>
                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>MealName</mat-label>
                        <input matInput placeholder="Search Meal Name" autocomplete="off" [formGroup]="myFilterform"
                            formControlName="MealName" (input)="onChangeFirst()" />
                        <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('MealName')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>
                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>DietName</mat-label>
                        <input matInput placeholder="Search Diet Name" autocomplete="off" [formGroup]="myFilterform"
                            formControlName="DietName" (input)="onChangeFirst()" />
                        <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('DietName')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>
                </form>
            </ng-container>
        </airmid-table>
    </div>
    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll" *ngIf="isShowDetailTable">
        <airmid-table [gridConfig]="gridConfig1" class="content" #grid1 [ShowFilter]="false" [ShowButtons]="false">
        </airmid-table>
    </div>

</div>
