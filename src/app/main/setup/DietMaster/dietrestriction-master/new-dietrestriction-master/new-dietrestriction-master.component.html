<div class="modal-wrapper grid-container">
    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">New Diet Restriction</span>
            </div>
            <div class="modal-header-right">
                <div class="close-icon">
                    <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                        matTooltip="Close">
                        <mat-icon>close</mat-icon>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-body" fusePerfectScrollbar>
        <div class="modal-body-container">
            <form [formGroup]="myForm">
                <input type="hidden" name="RestrictionId" formControlName="restrictionId">
                <div fxLayout="row wrap" fxLayoutGap="12px grid">
                    <div fxFlex="50%" fxFlex.xs="100%" fxFlex.sm="33%">
                        <airmid-textbox label="Restriction Name" formControlName="restrictionName" [formGroup]="myForm"
                            [maxLength]="50" [validations]="getValidationMessages().RestrictionName">
                        </airmid-textbox>
                    </div>
                    <!-- <div fxFlex="33%" fxFlex.xs="100%" fxFlex.sm="33%">
                        <airmid-textbox label="Restriction Code" formControlName="restrictionCode" [formGroup]="myForm"
                            [maxLength]="50" [validations]="getValidationMessages().RestrictionCode">
                        </airmid-textbox>
                    </div> -->
                    <div fxFlex="50%" fxFlex.xs="100%" fxFlex.sm="33%">
                        <!-- <airmid-dropdown label="Restriction Type" formControlName="restrictionTypeId"
                            [formGroup]="myForm" [validations]="getValidationMessages().RestrictionTypeId"
                            [mode]="autocompleteModeDietRestriction">
                        </airmid-dropdown> -->
                        <airmid-textbox label="Restriction Type" formControlName="restrictionTypeId"
                            [formGroup]="myForm" [maxLength]="50"
                            [validations]="getValidationMessages().RestrictionTypeId" [readonly]="true">
                        </airmid-textbox>
                    </div>
                    <div fxFlex="100%" fxFlex.xs="100%" fxFlex.sm="33%">
                        <mat-form-field appearance="outline" fxFlex>
                            <textarea rows="1" formControlName="description" placeholder="Description"
                                matInput></textarea>
                        </mat-form-field>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="modal-footer">
        <div class="footer-navigation-container">
            <form [formGroup]="myForm">
                <div class="modal-footer-container">
                    <div></div>
                    <div class="modal-footer-buttons">
                        <button class="btn btn-danger-outline" (click)="onClear(false)">Close</button>
                        <button class="btn btn-primary " color="accent" (click)="onSubmit()">
                            <span>Save</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
