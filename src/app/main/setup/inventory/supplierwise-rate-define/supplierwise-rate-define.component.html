<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                  SupplierWise Rate Define
                </span>
            </div>
        </div>
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onNewRate()" >+ New 
            </button>
        </div>
    </div>
    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
        <airmid-table [gridConfig]="gridConfig"  class="content">
              
             <ng-container filters> 
                <form [formGroup]="_SupplierwiseRateDefineService.myformSearch" fxLayout="column"> 
                 <airmid-autocomplete label="Item Name (enter 2 char)" [formGroup]="_SupplierwiseRateDefineService.myformSearch"
                      formControlName="itemId" placeholderText="Item Name (enter 2 char)"  
                      TextField="formattedText"
                      [ApiUrl]="'ItemMaster/GetItemListForGRNOrPO?StoreId=' + StoreId + '&ItemName='"
                        ValueField="itemId" >
                </airmid-autocomplete> 

               <airmid-dropdown label="Supplier Name" formControlName="supplierId"
                      [formGroup]="_SupplierwiseRateDefineService.myformSearch" 
                      [mode]="autocompleteSupplier"  ></airmid-dropdown>


                <mat-radio-group value="" [(ngModel)]="gridConfig.filters[2].fieldValue" fxLayoutAlign="center center">
                    <mat-radio-button value="">All</mat-radio-button>
                    <mat-radio-button mat-fab value="1">IsActive</mat-radio-button>
                    <mat-radio-button mat-fab value="0">IsDeactive</mat-radio-button>
                </mat-radio-group>
                      </form>
             </ng-container> 
        </airmid-table>
    </div>
</div>
