<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Item Master
                </span>
            </div>
        </div>
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onSave()">+ New Item
            </button>
        </div>
    </div>
    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

          <ng-template #actionButtonTemplate let-element>
            <div fxLayout="row" fxLayoutAlign="center center">


              
                <button mat-icon-button matTooltip="Edit Item" (click)="onSave(element)">
                    <mat-icon> edit</mat-icon>
                </button>

                <button mat-icon-button matTooltip="Edit GenricName" (click)="ongenericedit(element)">
                    <mat-icon> edit</mat-icon>
                </button>

                <button mat-icon-button matTooltip="Delete" (click)="delitem(element)">
                    <mat-icon>delete</mat-icon>
                </button>


            </div>
        </ng-template>

        <airmid-table [gridConfig]="gridConfig" class="content">
            <ng-container filters>
                <form [formGroup]="myformSearch" fxLayout="column">
                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>Item Name</mat-label>
                        <input matInput placeholder="Search Item Name" autocomplete="off" (input)="onChangeFirst()"
                            [formGroup]="myformSearch" formControlName="ItemNameSearch" />
                        <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('ItemNameSearch')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>

                    <airmid-dropdown label="To Store Name" formControlName="ToStoreId"
                        (selectionChange)="ListView1($event)" [formGroup]="myformSearch" [mode]="autocompletestore">
                    </airmid-dropdown>

                </form>

            </ng-container>
        </airmid-table>
    </div>
</div>
