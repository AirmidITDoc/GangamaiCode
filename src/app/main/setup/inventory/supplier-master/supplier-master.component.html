<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Supplier Master
                </span>
            </div>
        </div>
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onSave()" *ngIf="IsAdd">+ Add New Supplier
            </button>
        </div>
    </div>

    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
        <airmid-table [gridConfig]="gridConfig" class="content">
            <ng-container filters>
                <form [formGroup]="myformSearch" fxLayout="column">

                    <airmid-dropdown label="Store Name" formControlName="StoreId" [formGroup]="myformSearch"
                        [(ngModel)]="gridConfig.filters[1].fieldValue" [mode]="autocompleteModestoreName"
                        (selectionChange)="selectChangestoreName($event)">
                    </airmid-dropdown>

                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>Supplier Name</mat-label>
                        <input matInput placeholder="Search Supplier Name" autocomplete="off" (input)="onChangeFirst()"
                            [formGroup]="myformSearch" formControlName="SupplierNameSearch" />
                        <button matSuffix mat-icon-button aria-label="Clear"
                            (click)="Clearfilter('SupplierNameSearch')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>

                    <airmid-dropdown label="City Name" formControlName="cityId" [formGroup]="myformSearch"
                        [(ngModel)]="gridConfig.filters[2].fieldValue" [mode]="autocompletecity"
                        (selectionChange)="selectChangecity($event)">
                    </airmid-dropdown>

                    <mat-form-field appearance="outline">
                        <mat-label>MobileNo</mat-label>
                        <input matInput autocomplete="off" [formGroup]="myformSearch" formControlName="mobileNo"
                            (input)="onChangeFirst()" maxlength="10"/>
                        <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('mobileNo')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>

                </form>
            </ng-container>

        </airmid-table>
    </div>

</div>
