<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" dynamicTableHeight>
<!-- <div class="page-layout simple inner-sidebar inner-scroll" style="width:100%;overflow-y: hidden;overflow-x: auto;"> -->
    <!-- HEADER -->
    <div class="top-header">
        <div class="top-header-info" fxLayout="row" fxLayoutAlign="start center">

            <mat-icon class="logo-icon" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}">account_box
            </mat-icon>
            <div class="top-header-title" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                <span>Branch / Unit Wise Summary</span>
            </div>
        </div>

    </div>

    <div class="layout-body p-8" style="height: 65px;">

        <form [formGroup]="myformSearch" class="mat-error-fix">

            <div fxLayout.gt-xs="row" fxLayout="column" fxLayoutAlign="start" class="gap-4">
                <div fxLayout="row wrap" fxFlex fxLayoutGap="14px 0px grid">

                    <airmid-dropdown label="Unit Name" formControlName="UnitId" (selectionChange)="ListView($event)"
                        fxFlex="15%" [(ngModel)]="gridConfig.filters[0].fieldValue" [formGroup]="myformSearch"
                        [mode]="autocompleteModeunit"></airmid-dropdown>

                    <airmid-datepicker [formGroup]="myformSearch" [isRangePicker]="true" formStartControlName="start"
                        formEndControlName="end" [(fromValue)]="gridConfig.filters[1].fieldValue"
                        [(toValue)]="gridConfig.filters[2].fieldValue">
                    </airmid-datepicker>

                    <div class="action-button-container" style="padding-left: 20px;">
                        <div class="button-row-group">
                            <button class="btn btn-danger-outline btn-xs" (click)="onClear()">clear</button>
                            <button class="btn btn-primary btn-with-icon btn-xs" (click)="onChangeFirst()">
                                <span>Search</span>
                                <span class="btn-icon">
                                    <mat-icon>search</mat-icon>
                                </span>
                            </button>

                        </div>
                    </div>
                </div>
            </div>

        </form>

    </div>

    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
        <mat-tab label="Branch-wise Revenue">
            <mat-card>

                <div class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                    dynamicTableHeight>

                    <div class="main-content overflow-auto ml-8" fxLayout="row" fxLayoutAlign="start stretch">
                        <div style="width:40%;">

                            <div class="personal-panel">

                                <div style="padding-top: 20px;">
                                    <div fxFlex="calc(33.33% - 16px)" fxFlex.xs="100%" fxFlex.sm="100%">
                                        <mat-card class="chart-card">
                                            <mat-card-content>
                                                <div class="chart-header">
                                                    <h3 class="chart-title">Branch Revenue Distribution</h3>
                                                    <p class="chart-subtitle">Selected period breakdown</p>
                                                </div>
                                                <div
                                                    style="height: 300px; display: flex; align-items: center; justify-content: center;">
                                                    <canvas id="paymentModeChart"></canvas>
                                                </div>
                                            </mat-card-content>
                                        </mat-card>
                                    </div>
                                </div>

                            </div>

                        </div>
                        <div fxFlex="60%">
                               <div fxLayout="row" class="gap-4 p-8">
                                    <div class="net-amt-box">
                                        <span class="net-amt-label">Total Count : </span>
                                        <span class="net-amt-value">{{ TotCount }}</span>
                                    </div>
                                    <div class="net-amt-box">
                                        <span class="net-amt-label">Total Net Amt : </span>
                                        <span class="net-amt-value">{{ TotNetamt | currency : 'INR'
                                            }}</span>
                                    </div>
                                </div>
                                <div>
                                    <ng-template #actionButtonTemplate let-element>
                                        <div fxLayout="row" fxLayoutAlign="center center">

                                            <button mat-icon-button matTooltip="Print"
                                                (click)="viewgetReportPdf(element)">
                                                <mat-icon>print</mat-icon>
                                            </button>

                                        </div>
                                    </ng-template>

                                    <airmid-table [gridConfig]="gridConfig" #grid :ShowFilter="false"
                                        :ShowButtons="false">
                                    </airmid-table>

                                </div>

                             

                        </div>
                    </div>
                </div>
            </mat-card>
        </mat-tab>

        <mat-tab label="Test Wise Summary">
            <div>
                <ng-template #actionButtonTemplate1 let-element>
                    <div fxLayout="row" fxLayoutAlign="center center">

                        <!-- <button mat-icon-button matTooltip="Print" (click)="viewgetReportPdf(element)">
                            <mat-icon>print</mat-icon>
                        </button> -->
                        <button mat-icon-button color="warn" matTooltip="Trend"
                        (click)="serviceTrend(element)">
                            <mat-icon>trending_up</mat-icon>
                        </button>

                    </div>
                </ng-template>
                <airmid-table [gridConfig]="gridConfig1" #ServiceGrid :ShowFilter="false" :ShowButtons="false">
                </airmid-table>
            </div>

        </mat-tab>

        <mat-tab label="Category Wise Summary">
            <div>
                <ng-template #actionButtonTemplate2 let-element>
                    <div fxLayout="row" fxLayoutAlign="center center">

                        <button mat-icon-button color="warn" matTooltip="Trend"
                        (click)="categoryTrend(element)">
                            <mat-icon>trending_up</mat-icon>
                        </button>

                    </div>
                </ng-template>
                <airmid-table [gridConfig]="gridConfig2" #CategoryGrid :ShowFilter="false" :ShowButtons="false">
                </airmid-table>
            </div>
        </mat-tab>

        <mat-tab label="Doctor Wise Summary">
            <div>
                <ng-template #actionButtonTemplate3 let-element>
                    <div fxLayout="row" fxLayoutAlign="center center">

                        <button mat-icon-button color="warn" matTooltip="Trend"
                        (click)="doctorTrend(element)">
                            <mat-icon>trending_up</mat-icon>
                        </button>

                    </div>
                </ng-template>
                <airmid-table [gridConfig]="gridConfig3" #DoctorGrid :ShowFilter="false" :ShowButtons="false">
                </airmid-table>
            </div>
        </mat-tab>

        <mat-tab label="B2B/Company Wise Summary">
            <div>
                <ng-template #actionButtonTemplate4 let-element>
                    <div fxLayout="row" fxLayoutAlign="center center">

                        <button mat-icon-button color="warn" matTooltip="Trend"
                        (click)="companyTrend(element)">
                            <mat-icon>trending_up</mat-icon>
                        </button>

                    </div>
                </ng-template>
                <airmid-table [gridConfig]="gridConfig4" #b2bGrid :ShowFilter="false" :ShowButtons="false">
                </airmid-table>
            </div>
        </mat-tab>

    </mat-tab-group>
</div>
