<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" style="height: 100%;" fusePerfectScrollbar
    dynamicTableHeight>
    <mat-toolbar class="top-header accent">
        <div fxLayout="row" fxLayoutAlign="start center" class="top-header-info">
            <button mat-icon-button class="sidebar-toggle ">
                <mat-icon>menu</mat-icon>
            </button>
            <mat-icon class="logo-icon" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}">account_box
            </mat-icon>
            <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                Refund Approval List
            </span>
        </div>

    </mat-toolbar>

    <div fusePerfectScrollbar
        class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
        dynamicTableHeight>

        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

            <ng-template #isApprovalstatus let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <mat-icon *ngIf="element.isApproval==true" matTooltip="Refund Approved" class="s-20 mr-4"
                        style="color: #4caf50;">
                        check_circle
                    </mat-icon>
                    <mat-icon *ngIf="!element.isApproval==true" matTooltip="Refund Not Approved" class="s-20 mr-4"
                        style="color: #f44336;">
                        hourglass_empty
                    </mat-icon>
                </div>
            </ng-template>

            <ng-template #actionsPatientType let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <mat-icon *ngIf="element.patientType=='Self'" matTooltip="Patient Category Self">account_box
                    </mat-icon>
                    <mat-icon *ngIf="element.patientType=='Company'" matTooltip="Patient Category Company">business
                    </mat-icon>
                </div>
            </ng-template>

            <ng-template #firstActionButtonTemplate let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <button mat-icon-button matTooltip="Refund Approval" (click)="openStatus(element)"
                        [disabled]="element.isApproval==true">
                        <mat-icon>edit</mat-icon>
                    </button>
                </div>
            </ng-template>

            <airmid-table [gridConfig]="gridConfig" class="content" :ShowButtons="false">
                <ng-container filters>
                    <form [formGroup]="myformSearch">
                        <airmid-dropdown label="Unit Name" formControlName="UnitId" [readonly]="!isSuperAdmin"
                            [(ngModel)]="gridConfig.filters[6].fieldValue" (selectionChange)="ListView1($event)"
                            [formGroup]="myformSearch" [mode]="autocompleteModeunit"></airmid-dropdown>

                        <airmid-datepicker [formGroup]="myformSearch" [isRangePicker]="true"
                            formStartControlName="start" formEndControlName="end"
                            [(fromValue)]="gridConfig.filters[3].fieldValue"
                            [(toValue)]="gridConfig.filters[4].fieldValue">
                        </airmid-datepicker>

                        <mat-form-field appearance="outline">
                            <mat-label>UHID</mat-label>
                            <input matInput placeholder="Search UHID" autocomplete="off" [formGroup]="myformSearch"
                                formControlName="RegNo" (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('RegNo')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <mat-form-field appearance="outline">
                            <mat-label>First Name</mat-label>
                            <input matInput placeholder="Search First Name" autocomplete="off"
                                [formGroup]="myformSearch" formControlName="FirstName" (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('FirstName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <mat-form-field appearance="outline">
                            <mat-label>Last Name</mat-label>
                            <input matInput placeholder="Search Last Name" autocomplete="off" [formGroup]="myformSearch"
                                formControlName="LastName" (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('LastName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <mat-form-field appearance="outline">
                            <mat-label>PBillNo</mat-label>
                            <input matInput placeholder="Search PBillNo" autocomplete="off" [formGroup]="myformSearch"
                                formControlName="PBillNo" (keypress)="keyPressAlphanumeric($event)"
                                (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)=" Clearfilter('PBillNo')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <airmid-dropdown label="Company Name" formControlName="CompanyId" [formGroup]="myformSearch"
                            [(ngModel)]="gridConfig.filters[6].fieldValue" (selectionChange)="ListViewcompany($event)"
                            [mode]="autocompleteModecompany"></airmid-dropdown>

                        <div fxLayout="column" fxLayoutAlign="start start">

                            <div fxFlex fxLayout="column">
                                <mat-radio-group name="StatusSearch" fxLayout="column" [formGroup]="myformSearch"
                                    formControlName="StatusSearch" (change)="onChangeFirst()" style="padding: 6px;"
                                    class="gap-4">
                                    <mat-label>Status:</mat-label>
                                    <div fxLayout="column">
                                        <mat-radio-button value='2'>All</mat-radio-button>
                                        <mat-radio-button value='1'>Approved</mat-radio-button>
                                        <mat-radio-button value='0'>Not</mat-radio-button>
                                    </div>
                                </mat-radio-group>
                            </div>
                        </div>
                    </form>

                </ng-container>
            </airmid-table>
        </div>
    </div>
</div>

<!-- Approval Form -->
<ng-template #statusForm>
    <mat-toolbar class="accent" style="width: 100%; height: 45px; justify-content: space-between;">
        <div fxLayout="row" fxLayoutAlign="start center">
            <mat-icon class="logo-icon mr-16" style="color: white;">account_box</mat-icon>
            <span style="font-size: 16px;">Refund Approval</span>
        </div>

        <div class="close-icon">
            <button mat-icon-button [mat-dialog-close]="true" aria-label="Close dialog" matTooltip="Close">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </mat-toolbar>

    <div class="service-table1 p-12" fxLayout="column" fxLayoutGap="16px">

        <form [formGroup]="approvalFormFinal">

            <mat-card>
                <mat-card-content fxLayout="row" fxLayoutAlign="start center">
                    <span class="ml-12" style="font-size: 20px;"><b>Patient Name:</b></span>
                    <span class="ml-8" style="font-size: 20px;">{{ patientName }}</span>
                </mat-card-content>
            </mat-card>

            <mat-card style="margin-top: 10px;">
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Comment</mat-label>
                    <textarea rows="3" matInput formControlName="comment"></textarea>
                </mat-form-field>
            </mat-card>

        </form>

    </div>

    <div fxLayout="row" fxLayoutAlign="space-between center" fxLayoutGap="12px" class="p-12 border-top">
        <form [formGroup]="approvalFormFinal">
            <mat-checkbox formControlName="isApproval">
                IsApproved
            </mat-checkbox>
        </form>
        <div>
            <button class="btn btn-danger-outline" [mat-dialog-close]="true" style="margin-right: 5px;">
                Close
            </button>
            <button class="btn btn-primary" color="accent" (click)="saveStatus()">
                Save
            </button>
        </div>
    </div>
</ng-template>
