<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" fusePerfectScrollbar dynamicTableHeight>

    <ng-template #actionsTemplate1 let-element>
        <div fxLayout="row" fxLayoutAlign="center center">
            <mat-icon *ngIf="element.patientType=='Self'" matTooltip="Patient Category Self">account_box
            </mat-icon>
            <mat-icon *ngIf="!element.patientType=='Self'" matTooltip="Patient Category other">business
            </mat-icon>
        </div>

    </ng-template>

    <ng-template #actionsTemplate2 let-element>
        <div>
            <!-- <mat-icon title="Bill Cancelled" *ngIf="element.isCancelled==1" [disabled]="element.disabled"
                class="disabled-icon">
                close</mat-icon> -->

            <mat-icon title="Cancelled Bill" *ngIf="element.isCancelled=='1'" [disabled]="element.disabled"
                class="pill red s-16" matTooltip="Cancelled Bill">circle</mat-icon>
        </div>
    </ng-template>

    <ng-template #actionsTemplate3 let-element>
        <div>
            <mat-icon title="Refund" *ngIf="!element.refundAmount==0" [disabled]="element.disabled"
                class="disabled-icon">
                redo</mat-icon>
        </div>
    </ng-template>
    <ng-template #actionsTemplate4 let-element>
        <div>
            <button mat-icon-button (click)="openPaymentpopup(element)" matTooltip="Settlement"
                *ngIf="isSettlement && element.balanceAmt!='0'">
                <mat-icon title="Settlement" *ngIf="element.balanceAmt!=0 && element.isCancelled !=1"
                    class="disabled-icon">receipt</mat-icon>
                <mat-icon title="paid" *ngIf="element.balanceAmt==0" [disabled]="element.disabled"
                    class="disabled-icon">payment</mat-icon>
            </button>
        </div>
    </ng-template>

    <ng-template #actionButtonTemplate let-element>
        <div fxLayout="row" fxLayoutAlign="center center">

            <!-- <button mat-icon-button matTooltip="Review Company Bill" (click)="OnCompanyBill(element)"
                *ngIf="element.companyId !=0 && element.balanceAmt !=0 ">
                <mat-icon>remove_red_eye</mat-icon>
            </button> -->

            <span [matTooltip]="getVerificationTooltip(element)" matTooltipPosition="above">
                <button mat-icon-button matTooltip="Print" (click)="OnPrint(element)"
                    [disabled]="!isActionEnabled(element)">
                    <mat-icon>print</mat-icon>
                </button>
            </span>

            <span [matTooltip]="getVerificationTooltip(element)" matTooltipPosition="above">
                <button mat-icon-button
                    [matTooltip]="'We send the mail on your registered MailID : ' + element?.emailId"
                    matTooltipPosition="right" (click)="Onemail(element)"
                    (mouseenter)="openEmailDetailsPopover($event, element)" (mouseleave)="closeEmailDetailsPopover()"
                    style="position: relative; cursor: pointer; text-decoration: underline; color: #667eea;"
                    [disabled]="!isActionEnabled(element)">
                    <mat-icon>email</mat-icon>
                </button>
            </span>

            <span [matTooltip]="getVerificationTooltip(element)" matTooltipPosition="above">
                <button *ngIf="true" mat-icon-button matTooltip="Message" (click)="Onmessage(element,m)"
                    [disabled]="!isActionEnabled(element)">
                    <mat-icon>message</mat-icon>
                </button>
            </span>

            <span [matTooltip]="getVerificationTooltip(element)" matTooltipPosition="above">
                <button mat-icon-button
                    [matTooltip]="'We send the message on your registered WhatsApp number: ' + element?.mobileNo"
                    matTooltipPosition="right" (click)="getWhatsappshareBill(element)"
                    (mouseenter)="openWhatsappDetailsPopover($event, element)"
                    (mouseleave)="closeWhatsappDetailsPopover()"
                    style="position: relative; cursor: pointer; text-decoration: underline; color: #667eea;"
                    [disabled]="!isActionEnabled(element)">
                    <img width="20" height="20" src="assets/images/logos/WhatsApp.png">
                </button>
            </span>

            <!-- <span [matTooltip]="getVerificationTooltip(element)" matTooltipPosition="above">
                <button mat-icon-button [matMenuTriggerFor]="moreMenu" aria-label="More"
                    (click)="$event.stopPropagation();" [disabled]="!isActionEnabled(element)">
                    <mat-icon class="secondary-text">more_vert</mat-icon>
                </button>
            </span>
            <mat-menu #moreMenu="matMenu">
                <ng-container *ngFor="let m of menuActions, let n of menuActions">
                    <button mat-menu-item aria-label="remove" (click)="OngetRecord(element,m)">
                        <span>{{m}}</span>
                    </button>
                </ng-container>
            </mat-menu> -->
        </div>
    </ng-template>
    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
        <!-- (selectedTabChange)="onTabChange($event)" -->
        <mat-tab label="Lab Browse Bill List">
            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>
                <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
                    fxLayoutAlign.gt-xs="space-between center ">
                    <div class="top-header-info">
                        <div class="top-header-title">
                            <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                                Lab Browse Bill List
                            </span>
                        </div>
                    </div>

                </div>
                <div id="contacts"
                    class="page-layout simple left-sidebar inner-sidebar inner-scroll resize-form-fields">
                    <airmid-table [gridConfig]="gridConfig" class="content" #opBillGrid>
                        <ng-container filters>
                            <form [formGroup]="myFilterbillform">
                                <airmid-dropdown label="Unit Name" formControlName="UnitId" [readonly]="!isSuperAdmin"
                                    (selectionChange)="ListViewUnit1($event)"
                                    [(ngModel)]="gridConfig.filters[7].fieldValue" [formGroup]="myFilterbillform"
                                    [mode]="autocompleteModeunit"></airmid-dropdown>

                                <airmid-datepicker [formGroup]="myFilterbillform" [isRangePicker]="true"
                                    formStartControlName="fromDate" formEndControlName="enddate"
                                    [(fromValue)]="gridConfig.filters[2].fieldValue"
                                    [(toValue)]="gridConfig.filters[3].fieldValue"></airmid-datepicker>

                                <mat-form-field appearance="outline">
                                    <mat-label>First Name</mat-label>
                                    <input matInput placeholder="Search First Name" autocomplete="off"
                                        [formGroup]="myFilterbillform" formControlName="FirstName"
                                        (input)="onChangeOPBill()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterOPbill('FirstName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">
                                    <mat-label>Last Name</mat-label>
                                    <input matInput placeholder="Search Last Name" autocomplete="off"
                                        [formGroup]="myFilterbillform" formControlName="LastName"
                                        (input)="onChangeOPBill()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterOPbill('LastName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">
                                    <mat-label>PBillNo</mat-label>
                                    <input matInput placeholder="Search PBillNo" autocomplete="off"
                                        [formGroup]="myFilterbillform" formControlName="PBillNo"
                                        (keypress)="keyPressAlphanumeric($event)" (input)="onChangeOPBill()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterOPbill('PBillNo')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">
                                    <mat-label>UHID</mat-label>
                                    <input matInput placeholder="Search UHID" autocomplete="off"
                                        [formGroup]="myFilterbillform" formControlName="RegNo"
                                        (keypress)="keyPressAlphanumeric($event)" (input)="onChangeOPBill()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterOPbill('RegNo')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <airmid-dropdown label="Company Name" formControlName="CompanyId"
                                    [formGroup]="myFilterbillform" [(ngModel)]="gridConfig.filters[6].fieldValue"
                                    (selectionChange)="ListView($event)"
                                    [mode]="autocompleteModecompany"></airmid-dropdown>
                            </form>
                        </ng-container>
                    </airmid-table>
                </div>
            </div>

        </mat-tab>

        <mat-tab label="Lab Browse Payment List">

            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>
                <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
                    fxLayoutAlign.gt-xs="space-between center ">
                    <div class="top-header-info">
                        <div class="top-header-title">
                            <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                                Lab Browse Payment List
                            </span>
                        </div>
                    </div>

                </div>
                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
                    <ng-template #actionButtonTemplate1 let-element>
                        <div fxLayout="row" fxLayoutAlign="center center">

                            <button mat-icon-button matTooltip="Print" (click)="viewgetOPPayemntPdf(element,false)">
                                <mat-icon>print</mat-icon>
                            </button>

                            <button mat-icon-button matTooltip="Send message On WhatsApp"
                                (click)="getWhatsappshareBill(element)">
                                <img width="100" height="20px" src="assets/images/logos/WhatsApp.png">
                            </button>

                        </div>
                    </ng-template>

                    <airmid-table [gridConfig]="gridConfig1" class="content" #opPaymentGrid>
                        <ng-container filters>

                            <form [formGroup]="myFilterpayform" class="resize-form-fields">
                                <airmid-dropdown label="Unit Name" formControlName="UnitId" [readonly]="!isSuperAdmin"
                                    (selectionChange)="ListViewUnit2($event)"
                                    [(ngModel)]="gridConfig1.filters[8].fieldValue" [formGroup]="myFilterpayform"
                                    [mode]="autocompleteModeunit"></airmid-dropdown>

                                <airmid-datepicker [formGroup]="myFilterpayform" [isRangePicker]="true"
                                    formStartControlName="fromDate" formEndControlName="enddate"
                                    [(fromValue)]="gridConfig1.filters[2].fieldValue"
                                    [(toValue)]="gridConfig1.filters[3].fieldValue"></airmid-datepicker>

                                <mat-form-field appearance="outline">
                                    <mat-label>First Name</mat-label>
                                    <input matInput placeholder="Search First Name" autocomplete="off"
                                        [formGroup]="myFilterpayform" formControlName="FirstName"
                                        (input)="onChangeOPPayment()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterOPpayment('FirstName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">
                                    <mat-label>Last Name</mat-label>
                                    <input matInput placeholder="Search Last Name" autocomplete="off"
                                        [formGroup]="myFilterpayform" formControlName="LastName"
                                        (input)="onChangeOPPayment()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterOPpayment('LastName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">
                                    <mat-label>UHID</mat-label>
                                    <input matInput placeholder="Search UHID" autocomplete="off"
                                        [formGroup]="myFilterpayform" formControlName="RegNo"
                                        (keypress)="keyPressAlphanumeric($event)" (input)="onChangeOPPayment()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterOPpayment('RegNo')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">
                                    <mat-label>PBillNo</mat-label>
                                    <input matInput placeholder="Search PBillNo" autocomplete="off"
                                        [formGroup]="myFilterpayform" formControlName="PBillNo"
                                        (keypress)="keyPressAlphanumeric($event)" (input)="onChangeOPPayment()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterOPpayment('PBillNo')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">
                                    <mat-label>ReceiptNo</mat-label>
                                    <input matInput placeholder="Search ReceiptNo" autocomplete="off"
                                        [formGroup]="myFilterpayform" formControlName="ReceiptNo"
                                        (keypress)="keyPressAlphanumeric($event)" (input)="onChangeOPPayment()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterOPpayment('ReceiptNo')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <airmid-dropdown label="Company Name" formControlName="CompanyId"
                                    [formGroup]="myFilterpayform" [(ngModel)]="gridConfig1.filters[7].fieldValue"
                                    (selectionChange)="ListView1($event)"
                                    [mode]="autocompleteModecompany1"></airmid-dropdown>

                            </form>
                        </ng-container>
                    </airmid-table>
                </div>
            </div>

        </mat-tab>

        <mat-tab label="Lab Browse Refund List">

            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>
                <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
                    fxLayoutAlign.gt-xs="space-between center ">
                    <div class="top-header-info">
                        <div class="top-header-title">
                            <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                                Lab Browse Refund List
                            </span>
                        </div>
                    </div>

                </div>
                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
                    <ng-template #actionButtonTemplate2 let-element>
                        <div fxLayout="row" fxLayoutAlign="center center">

                            <button mat-icon-button matTooltip="Print" (click)="viewgetOPRefundBillReportPdf(element)">
                                <mat-icon>print</mat-icon>
                            </button>

                            <button mat-icon-button matTooltip="Send message On WhatsApp"
                            style="margin-bottom: 6px;"
                                (click)="getWhatsappshareRefundBill(element)">
                                <img width="100" height="20px" src="assets/images/logos/WhatsApp.png">
                            </button>

                        </div>
                    </ng-template>

                    <ng-template #isApprovalstatus let-element>
                        <div fxLayout="row" fxLayoutAlign="center center">
                            <mat-icon *ngIf="element.isApproval==true" matTooltip="Refund Approved" class="s-20 mr-4"
                                style="color: #4caf50;">
                                check_circle
                            </mat-icon>
                            <mat-icon *ngIf="!element.isApproval==true" matTooltip="Refund Not Approved"
                                class="s-20 mr-4" style="color: #f44336;">
                                hourglass_empty
                            </mat-icon>
                        </div>
                    </ng-template>

                    <airmid-table [gridConfig]="gridConfig2" class="content resize-form-fields" #opRefundGrid>
                        <ng-container filters>
                            <form [formGroup]="myFilterrefundform">
                                <airmid-dropdown label="Unit Name" formControlName="UnitId" [readonly]="!isSuperAdmin"
                                    (selectionChange)="ListViewUnit3($event)"
                                    [(ngModel)]="gridConfig2.filters[5].fieldValue" [formGroup]="myFilterrefundform"
                                    [mode]="autocompleteModeunit"></airmid-dropdown>

                                <airmid-datepicker [formGroup]="myFilterrefundform" [isRangePicker]="true"
                                    formStartControlName="fromDate" formEndControlName="enddate"
                                    [(fromValue)]="gridConfig2.filters[2].fieldValue"
                                    [(toValue)]="gridConfig2.filters[3].fieldValue"></airmid-datepicker>

                                <mat-form-field appearance="outline">
                                    <mat-label>First Name</mat-label>
                                    <input matInput placeholder="Search First Name" autocomplete="off"
                                        [formGroup]="myFilterrefundform" formControlName="FirstName"
                                        (input)="onChangeOPRefund()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterOPRefund('FirstName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">
                                    <mat-label>Last Name</mat-label>
                                    <input matInput placeholder="Search Last Name" autocomplete="off"
                                        [formGroup]="myFilterrefundform" formControlName="LastName"
                                        (input)="onChangeOPRefund()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterOPRefund('LastName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">
                                    <mat-label>UHID</mat-label>
                                    <input matInput placeholder="Search UHID" autocomplete="off"
                                        [formGroup]="myFilterrefundform" formControlName="RegNo"
                                        (keypress)="keyPressAlphanumeric($event)" (input)="onChangeOPRefund()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterOPRefund('RegNo')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">
                                    <mat-label>RefundNo</mat-label>
                                    <input matInput placeholder="Search RefundNo" autocomplete="off"
                                        [formGroup]="myFilterrefundform" formControlName="RefundNo"
                                        (keypress)="keyPressAlphanumeric($event)" (input)="onChangeOPRefund()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterOPRefund('RefundNo')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <airmid-dropdown label="Company Name" formControlName="CompanyId"
                                    [formGroup]="myFilterrefundform" [(ngModel)]="gridConfig2.filters[7].fieldValue"
                                    (selectionChange)="ListView1($event)"
                                    [mode]="autocompleteModecompany1"></airmid-dropdown>

                            </form>
                        </ng-container>
                    </airmid-table>
                </div>
            </div>

        </mat-tab>
    </mat-tab-group>


</div>
