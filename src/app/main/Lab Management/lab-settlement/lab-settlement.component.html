<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" fusePerfectScrollbar dynamicTableHeight>

    <div fusePerfectScrollbar
        class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
        dynamicTableHeight>
        <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
            fxLayoutAlign.gt-xs="space-between center ">
            <div class="top-header-info">
                <div class="top-header-title">
                    <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                        LAB Patient Settlement
                    </span>
                </div>
            </div>
        </div>
        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
            <div class="modal-body-container">
                <mat-card style="padding: 5px;">
                    <form [formGroup]="searchFormGroup" fxLayoutAlign="space-between start">
                        <div fxLayout="column" fxLayoutAlign="start none" style="width: 100%;">
                            <div class="redio-container resize-form-fields" style="padding: 10px; gap: 5px;">

                                <airmid-dropdown label="Unit Name" formControlName="UnitId" fxFlex="15%"
                                    [readonly]="!isSuperAdmin" (selectionChange)="ListView1($event)"
                                    [formGroup]="searchFormGroup" [mode]="autocompleteModeunit"></airmid-dropdown>

                                <airmid-autocomplete label="Lab-UHID / First Name / Last Name / Mobile No"
                                    [formGroup]="searchFormGroup" formControlName="RegId"
                                    placeholderText="Lab-UHID / First Name / Last Name / Mobile No" fxFlex="40%"
                                    [ApiUrl]="'LabPatientRegistration/search-patient-1?UnitId=' + UnitId + '&Keyword='"
                                    (selectionChange)="getSelectedObj($event)" ValueField="regId"
                                    TextField="formattedText"></airmid-autocomplete>
                            </div>
                        </div>
                    </form>
                </mat-card>

                <div fxlayout="row" style="padding: 0px 5px 0px 5px">
                    <div fxFlex.gt-sm="100%" fxFlex class="patient-info-container">
                        <mat-card style="padding: 5px;">
                            <div class="patient-info-container">
                                <div class="patient-info-box">
                                    <div class="patient-info-title border-bottom pb-1 mb-1">
                                        <span class="h1 m-0" style="line-height: normal;">Patient Information</span>
                                    </div>
                                    <div class="Ipd-patient-info w-100-p">
                                        <app-patient-information [uhidNo]="registerObj?.labRequestNo"
                                            [patientName]="registerObj?.firstName + ' ' + registerObj?.lastName"
                                            [ageString]="(registerObj?.age !== undefined ? registerObj?.ageYear + 'Y|' + registerObj?.ageMonth + 'M|' + registerObj?.ageDay + 'D | ' + registerObj?.genderName : '')"
                                            [mobileNo]="registerObj?.mobileNo">
                                        </app-patient-information>
                                    </div>
                                </div>
                            </div>
                        </mat-card>
                    </div>
                </div>
            </div>

            <ng-template #actionsTemplate let-element>
                <div>
                    <mat-icon *ngIf="element.companyId=='0'" matTooltip="Patient Category Self">account_box
                    </mat-icon>

                    <mat-icon *ngIf="element.companyId!='0'" matTooltip="Patient Category Company">business
                    </mat-icon>
                </div>
            </ng-template>

            <ng-template #actionButtonTemplate let-element>
                <div fxLayout="row" fxLayoutAlign="center center">

                    <button mat-icon-button class="material-icons" *ngIf="element.balanceAmt !=0 "
                        matTooltip="Final Discount" (click)="getFinalDisc(element)">
                        <mat-icon> money </mat-icon>
                    </button>

                    <button mat-icon-button (click)="openPaymentpopup(element)" matTooltip="Settlement"
                        *ngIf="isSettlement==true && element.balanceAmt != 0">
                        <mat-icon title="Settlement">receipt</mat-icon>
                    </button>
                </div>
            </ng-template>

            <airmid-table [gridConfig]="gridConfig" #tblLabPatient :ShowFilter="false">
            </airmid-table>
        </div>
    </div>
</div>
