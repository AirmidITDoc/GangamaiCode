<div class="page-layout modal-wrapper grid-container preOperMain" fusePerfectScrollbar>

    <div class="modal-header accent preOperHeader">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">Add Template</span>
            </div>
            <div class="modal-header-right">
                <div class="comman-date-container">
                    <div class="comman-date">
                        <app-common-date [screenFrom]="screenFromString"
                            (dateTimeEventEmitter)="getDateTime($event)"></app-common-date>
                    </div>
                    <div class="close-icon">
                        <button mat-icon-button tabIndex="-1" (click)="onClose()" aria-label="Close dialog">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-body preOperMiddle" fusePerfectScrollbar>
        <div class="modal-body-container">
            <div fxLayout="column" class="gap-12"></div>
            <form [formGroup]="_radiologytemplateService.myform">
                <div class="modal-card-container" style="padding: 10px 2px 5px 0px ;">
                    <div fxFlex.gt-sm="100%" fxFlex class="patient-info-container">
                        <div class="patient-info-container">
                            <div class="patient-info-box gap-4" fxFlexFill fxLayout="column">
                                <mat-card fxFlex.gt-sm="100%" fxFlex>
                                    <div class="patient-info-sales">

                                        <div class="patient-info-title border-bottom pb-1 mb-1">
                                            <span class="h1 m-0" style="line-height: normal;">Patient Information</span>
                                        </div>
                                        <div class="Ipd-patient-info w-100-p">
                                            <app-patient-information [uhidNo]="regObj?.labRequestNo"
                                                [patientName]="PatientName"
                                                [ageString]="(AgeYear !== undefined ? AgeYear + 'Y|' + AgeMonth + 'M|' + AgeDay + 'D | ' + GenderName : '')"
                                                [refDocName]="Doctorname" [patientType]="PatientType"
                                                [companyName]="CompanyName">
                                            </app-patient-information>
                                        </div>
                                    </div>
                                </mat-card>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-body" fusePerfectScrollbar>
                    <div fxFlexFill fxLayout="column">
                        <form [formGroup]="_radiologytemplateService.myform" class="resize-form-fields">
                            <div fxFlexFill fxLayout="row">

                                <airmid-dropdown label="Template Name" formControlName="TemplateName"
                                    [formGroup]="_radiologytemplateService.myform" fxFlex="50%" ValueField="templateId"
                                    TextField="templateName" (selectionChange)="selectChangeTemplateName($event)"
                                    ApiUrl="RadiologyTemplate/get-RdioTemplates">
                                </airmid-dropdown>

                                <div>
                                    <button (click)="onAddTemplate($event)" class="btn btn-primary btn-with-icon py-8"
                                        style="margin-left: 10px;" [disabled]="!isSelected">
                                        <span class="btn-icon">
                                            <mat-icon> add </mat-icon>
                                        </span>
                                    </button>
                                </div>

                            </div>

                            <div>
                                <airmid-editor label="Template Details" formControlName="ResultEntry" fxFlex
                                    [(value)]="vTemplateDesc" [formGroup]="_radiologytemplateService.myform"
                                    (valueChange)="onEditorValueChange($event)">
                                </airmid-editor>
                            </div>

                            <div style="margin-top: 5px;" fxLayout="row" class="gap-4">
                                <airmid-dropdown label="Doctor Name" formControlName="DoctorId" fxFlex="30%"
                                    [formGroup]="_radiologytemplateService.myform" [mode]="autocompleteModeDoctor"
                                    (selectionChange)="selectChangeDoctorName($event)">
                                </airmid-dropdown>
                                
                                <mat-form-field appearance="outline" fxFlex>
                                    <mat-label>Comment </mat-label>
                                    <textarea rows="1" name="suggestionNotes" formControlName="suggestionNotes" matInput
                                        [(ngModel)]="vsuggestionNotes"></textarea>
                                    <mat-error>Please enter Comment </mat-error>
                                </mat-form-field>
                            </div>
                        </form>
                    </div>
                </div>
            </form>

        </div>
    </div>

    <div class="modal-footer preOperfooter">
        <div class="footer-navigation-container">
            <div class="modal-footer-buttons preOperbtn">
                <button class="btn btn-danger-outline" (click)="onClose()">Close</button>
                <button class="btn btn-primary " color="accent" (click)="onSubmit()" *ngIf="!verifyCheck">
                    <span>Save</span>
                </button>
                <button class="btn btn-success" (click)="onVerify()" *ngIf="verifyCheck">Authorization</button>
            </div>
        </div>
    </div>

</div>
