<div class="page-layout simple left-sidebar inner-sidebar inner-scroll" dynamicTableHeight>
    <mat-toolbar class="accent" style="height:50px; justify-content: space-between;width: 100%;">
        <div fxLayout="row" fxLayoutAlign="start center">

            <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}" style="color: white;">
                Tracking List
            </span>
        </div>

        <div fxLayout="row" fxLayoutALign="end start">
            <button mat-icon-button tabIndex="-1" (click)="onClose()" aria-label="Close dialog">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </mat-toolbar>
    <div class="modal-card-container mt-0" style="margin-top: -4px;">
        <div fxFlex.gt-sm="100%" fxFlex>
            <mat-card fxFlex.gt-sm="100%" fxFlex style="padding: 2px 10px;">
                <div class="patient-info-sales">
                    <div class="patient-info-title border-bottom pb-1 mb-1">
                        <span class="h1 m-0" style="line-height: normal;">Patient Information</span>
                    </div>
                    <div class="Ipd-patient-info w-100-p">
                        <app-patient-information [uhidNo]="registerObj?.labRequestNo"
                            [patientName]="registerObj?.patientName"
                            [ageString]="(registerObj?.age !== undefined ? registerObj?.ageYear + 'Y|' + registerObj?.ageMonth + 'M|' + registerObj?.ageDay + 'D | ' + registerObj?.genderName : '')"
                            [refDocName]="registerObj?.refDoctorName" [patientType]="registerObj?.patientType">
                        </app-patient-information>
                    </div>
                </div>
            </mat-card>
        </div>
    </div>
    <div class="content">

        <div class="center p-12" fxFlexAlign="start center">
            <div class="timeline-container">
                <!-- Center Line -->
                <div class="timeline-line"></div>

                <div class="timeline-item" *ngFor="let item of trackerList; let i = index">
                    <!-- ICON ON LINE -->
                    <div class="timeline-icon">
                        ✔
                    </div>
                    <!-- CARD -->
                    <div class="timeline-card">
                        <div class="title">
                            <h3>{{item.Lbl}}</h3>
                        </div>
                        <div class="header">
                            <mat-icon class="avatar">person</mat-icon>
                            <div>
                                <b>{{ item.UserName }}</b>
                                <div class="time">{{ item.RegTime | date:'dd/MM/yyyy hh:mm a'}}</div>
                                <div class="test-status-block">{{ item.TestStatus }}</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>
