<div class="modal-wrapper grid-container">
    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{ value: '*', params: { delay: '100ms', x: '-25px' } }">Estimate</span>
            </div>
            <div class="modal-header-right">
                <div class="comman-date-container">

                    <div class="close-icon">
                        <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                            matTooltip="Close">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-body labpatientMiddle">
        <div class="modal-body-container">
            <mat-drawer-container class="main-container h-100-p">
                <mat-drawer-content>
                    <div>
                        <form [formGroup]="myForm">
                            <div fxLayout="row" fxLayoutGap="4px">
                                <div fxFlex="100%">
                                    <airmid-dropdown label="Unit / Branch Name" formControlName="unitId"
                                        [validations]="getValidationMessages().UnitId" [formGroup]="myForm"
                                        [mode]="autocompleteModeunit"></airmid-dropdown>
                                </div>
                                <div fxFlex="100%">
                                    <airmid-dropdown label="Doctor Name" formControlName="doctorId" [formGroup]="myForm"
                                        [mode]="autocompleteModedoctor">
                                    </airmid-dropdown>
                                </div>
                                <div fxFlex="100%">
                                    <airmid-dropdown label="Ref Doctor Name" formControlName="refDocId"
                                        [validations]="getValidationMessages().refDocId" [formGroup]="myForm"
                                        [mode]="autocompleteModerefdoc">
                                    </airmid-dropdown>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="main-content overflow-auto ml-8" fxLayout="row" fxLayoutAlign="start stretch">
                        <div style="width:40%;">
                            <div class="personal-panel">
                                <mat-accordion multi>
                                    <mat-expansion-panel expanded>
                                        <mat-expansion-panel-header>
                                            <mat-panel-title>Personal Details</mat-panel-title>
                                        </mat-expansion-panel-header>
                                        <div>
                                            <form [formGroup]="myForm">
                                                <div fxLayout="column" fxLayout.xs="column" fxLayoutGap="4px">
                                                    <div fxLayout="row" fxLayoutGap="4px">
                                                        <div fxFlex="33%">
                                                            <airmid-textbox label="MobileNo" formControlName="mobileNo"
                                                                [validations]="getValidationMessages().mobileNo"
                                                                (keypress)="keyPressAlphanumeric($event)"
                                                                [formGroup]="myForm" [maxLength]="10"
                                                                [value]="registerObj?.mobileNo">
                                                            </airmid-textbox>
                                                        </div>
                                                        <div fxFlex="33%">
                                                            <airmid-dropdown label="Prefix" formControlName="prefixId"
                                                                [formGroup]="myForm" ValueField="prefixId"
                                                                TextField="prefixName" [value]="registerObj?.prefixId"
                                                                (selectionChange)="onChangePrefix($event)"
                                                                ApiUrl="Prefix/get-prefixs">
                                                            </airmid-dropdown>
                                                        </div>
                                                        <div fxFlex="33%">
                                                            <airmid-dropdown label="Gender" formControlName="genderId"
                                                                [formGroup]="myForm" [value]="registerObj?.genderId"
                                                                #ddlGender [readonly]="true"
                                                                [mode]="autocompleteModegender">
                                                            </airmid-dropdown>
                                                        </div>
                                                    </div>
                                                    <div fxLayout="row" fxLayoutGap="4px">
                                                        <div fxFlex="33%">
                                                            <airmid-textbox label="First Name"
                                                                formControlName="firstName"
                                                                [value]="registerObj.firstName" [formGroup]="myForm"
                                                                [validations]="getValidationMessages().firstName"
                                                                [maxLength]="100"></airmid-textbox>
                                                        </div>
                                                        <div fxFlex="33%">
                                                            <airmid-textbox label="Middle Name"
                                                                formControlName="middleName" [formGroup]="myForm"
                                                                [maxLength]="50" [value]="registerObj?.middleName">
                                                            </airmid-textbox>
                                                        </div>
                                                        <div fxFlex="33%">
                                                            <airmid-textbox label="Last Name" formControlName="lastName"
                                                                [formGroup]="myForm" [maxLength]="50"
                                                                [validations]="getValidationMessages().lastName"
                                                                [value]="registerObj?.lastName">
                                                            </airmid-textbox>
                                                        </div>
                                                    </div>
                                                    <div fxLayout="row" fxLayoutGap="4px">
                                                        <div fxFlex="100">
                                                            <app-airmid-dateofbirth [formGroup]="myForm"
                                                                [(value)]="registerObj.dateofBirth" dateStyle="Year"
                                                                formControlName="DateOfBirth"></app-airmid-dateofbirth>
                                                        </div>
                                                    </div>
                                                    <div fxLayout="row" fxLayoutGap="4px">
                                                        <div fxFlex="50">
                                                            <airmid-textbox label="Address" formControlName="address"
                                                                [validations]="getValidationMessages().address"
                                                                [formGroup]="myForm" [value]="registerObj?.address">
                                                            </airmid-textbox>
                                                        </div>
                                                        <div fxFlex="50">
                                                            <airmid-textbox label="Aadhaar No. / National ID"
                                                                formControlName="adharCardNo"
                                                                [value]="registerObj.adharCardNo ?? ''"
                                                                [formGroup]="myForm"
                                                                (keypress)="keyPressAlphanumeric($event)"
                                                                [validations]="getValidationMessages().adharCardNo"></airmid-textbox>
                                                        </div>
                                                    </div>

                                                    <div fxLayout="row" fxLayoutGap="4px">
                                                        <div fxFlex="33">
                                                            <airmid-dropdown label="City" formControlName="cityId"
                                                                [formGroup]="myForm" ValueField="cityId"
                                                                TextField="cityName" [value]="registerObj?.cityId"
                                                                (selectionChange)="onChangecity($event)"
                                                                ApiUrl="CityMaster/get-cities">
                                                            </airmid-dropdown>
                                                        </div>
                                                        <div fxFlex="33">
                                                            <airmid-dropdown label="State" formControlName="stateId"
                                                                [formGroup]="myForm" ValueField="stateId"
                                                                TextField="stateName" #ddlState
                                                                [value]="registerObj?.stateId"
                                                                ApiUrl="StateMaster/get-state" [readonly]="true">
                                                            </airmid-dropdown>
                                                        </div>
                                                        <div fxFlex="33">
                                                            <airmid-dropdown label="Country" formControlName="countryId"
                                                                [formGroup]="myForm" [value]="registerObj?.countryId"
                                                                [disabled]="true" #ddlCountry
                                                                [mode]="autocompleteModecountry" [readonly]="true">
                                                            </airmid-dropdown>
                                                        </div>
                                                    </div>
                                                    <div fxLayout="row" fxLayoutGap="4px">
                                                        <div fxFlex="50">
                                                            <airmid-textbox label="Comments" formControlName="Comments"
                                                                [validations]="getValidationMessages().Comments"
                                                                [formGroup]="myForm">
                                                            </airmid-textbox>
                                                        </div>
                                                        <div fxFlex="50">
                                                            <airmid-textbox label="ReferByName"
                                                                formControlName="ReferByName"
                                                                [validations]="getValidationMessages().ReferByName"
                                                                [formGroup]="myForm">
                                                            </airmid-textbox>
                                                        </div>
                                                    </div>
                                                </div>
                                            </form>
                                        </div>
                                    </mat-expansion-panel>
                                </mat-accordion>
                            </div>
                        </div>
                        <div fxFlex="60">
                            <div>
                                <mat-card>
                                    <mat-card-content>
                                        <div class="detail-header">
                                            Billing Information
                                        </div>

                                        <div>

                                            <div fxFlex="100%">
                                                <form [formGroup]="myForm">
                                                    <airmid-autocomplete label="Enter Service Name" [formGroup]="myForm"
                                                        formControlName="ServiceId" placeholderText="Enter Service Name"
                                                        fxFlex ApiUrl="{{ApiURL}}"
                                                        (selectionChange)="getSelectedserviceObj($event)"
                                                        TextField="formattedText"
                                                        ValueField="serviceId"></airmid-autocomplete>
                                                </form>
                                            </div>
                                        </div>
                                        <div fxLayout="column" fxLayoutGap="6px">
                                            <div fxLayout="row" fxLayoutGap="6px">
                                                <div fxFlex="100%" class="airmid-table-container">
                                                    <mat-card>
                                                        <mat-table #table1 matSort [dataSource]="dstable1"
                                                            [@animateStagger]="{ value: '50' }"
                                                            class="airmid-table table h-480">

                                                            <ng-container matColumnDef="ServiceName">
                                                                <mat-header-cell *matHeaderCellDef mat-sort-header
                                                                    class="w-300">Service
                                                                    Name</mat-header-cell>
                                                                <mat-cell *matCellDef="let contact"
                                                                    class="w-300">{{contact.ServiceName}}</mat-cell>
                                                            </ng-container>

                                                            <ng-container matColumnDef="DoctorName">
                                                                <mat-header-cell *matHeaderCellDef mat-sort-header
                                                                    class="w-300">
                                                                    -
                                                                </mat-header-cell>

                                                                <mat-cell *matCellDef="let contact" class="w-300">
                                                                    <ng-container *ngIf="showDoctorDropdown(contact)">
                                                                        <mat-form-field appearance="outline"
                                                                            fxFlex="200px" floatLabel="never">
                                                                            <mat-select placeholder="Select Doctor"
                                                                                [(ngModel)]="contact.DoctorId"
                                                                                [ngModelOptions]="{ standalone: true }"
                                                                                required
                                                                                (selectionChange)="getdocdetail($event, contact)">
                                                                                <mat-option
                                                                                    *ngFor="let option of doctorOptions"
                                                                                    [value]="option.value || option.Value">
                                                                                    {{ option.text ||
                                                                                    option.Text }}
                                                                                </mat-option>
                                                                            </mat-select>
                                                                        </mat-form-field>
                                                                    </ng-container>
                                                                </mat-cell>
                                                            </ng-container>

                                                            <ng-container matColumnDef="Urgent">
                                                                <mat-header-cell *matHeaderCellDef mat-sort-header
                                                                    fxShow.gt-sm class="w-70">
                                                                    -
                                                                </mat-header-cell>
                                                                <mat-cell *matCellDef="let contact" fxShow.gt-sm
                                                                    class="w-70">
                                                                    <mat-slide-toggle
                                                                        (change)="onUrgentToggleChange($event, contact)">
                                                                    </mat-slide-toggle>
                                                                </mat-cell>
                                                            </ng-container>

                                                            <ng-container matColumnDef="Price">
                                                                <mat-header-cell *matHeaderCellDef mat-sort-header
                                                                    fxShow.gt-sm class="w-100">Price</mat-header-cell>
                                                                <mat-cell *matCellDef="let contact" fxShow.gt-sm
                                                                    class="w-100">
                                                                    <mat-form-field appearance="fill">
                                                                        <input matInput [(ngModel)]="contact.Price"
                                                                            type="text" [id]="'Price' + index" [min]="0"
                                                                            (ngModelChange)="getCellCalculation(contact)"
                                                                            type="number" />
                                                                    </mat-form-field>
                                                                </mat-cell>
                                                            </ng-container>

                                                            <ng-container matColumnDef="DiscountAmount">
                                                                <mat-header-cell *matHeaderCellDef>Disc
                                                                    Amt</mat-header-cell>
                                                                <mat-cell *matCellDef="let contact">
                                                                    <mat-form-field floatLabel="never"
                                                                        appearance="fill">
                                                                        <input matInput placeholder="Disc Amt"
                                                                            [(ngModel)]="contact.DiscAmt" type="text"
                                                                            [min]="0" [max]="contact.TotalAmt"
                                                                            (ngModelChange)="onDiscountAmtChange(contact)">
                                                                    </mat-form-field>
                                                                </mat-cell>
                                                            </ng-container>

                                                            <ng-container matColumnDef="NetAmount">
                                                                <mat-header-cell *matHeaderCellDef>Net
                                                                    Amt</mat-header-cell>
                                                                <mat-cell *matCellDef="let contact"><span
                                                                        class="text-overflow">
                                                                        {{(contact.NetAmount || 0) | currency:
                                                                        currency:'symbol'}}
                                                                    </span></mat-cell>
                                                            </ng-container>

                                                            <ng-container matColumnDef="buttons" stickyEnd>
                                                                <mat-header-cell *matHeaderCellDef
                                                                    class="w-100">Action</mat-header-cell>
                                                                <mat-cell *matCellDef="let contact" class="w-100">
                                                                    <button mat-icon-button color="warn"
                                                                        (click)="deleteTableRow(contact)"><mat-icon>delete_outline</mat-icon></button>
                                                                    <button mat-icon-button color="warn"
                                                                        (click)="deleteTableRow(contact)"><mat-icon>perm_device_information</mat-icon></button>
                                                                    <button mat-icon-button color="warn"
                                                                        (click)="deleteTableRow(contact)"><mat-icon>delete_outline</mat-icon></button>
                                                                </mat-cell>
                                                            </ng-container>

                                                            <mat-header-row class="accent h-35"
                                                                *matHeaderRowDef="displayedServiceselected; sticky: true"></mat-header-row>
                                                            <mat-row
                                                                *matRowDef="let contact; columns: displayedServiceselected; let i = index"
                                                                tabindex="999" class="h-32"
                                                                [@animate]="{ value: '*', params: { y: '100%' } }"
                                                                appHighlight></mat-row>

                                                        </mat-table>
                                                    </mat-card>

                                                    <form [formGroup]="myForm">
                                                        <div fxLayout="row" fxLayoutGap="6px" style="padding: 10px;">
                                                            <div fxFlex="10%" fxFlex.xs="100%" fxFlex.sm="100%">
                                                                <airmid-textbox label="Total Amount"
                                                                    formControlName="totalAmt" [formGroup]="myForm"
                                                                    [type]="'number'" [readonly]="true">
                                                                </airmid-textbox>
                                                            </div>
                                                            <div fxFlex="10%" fxFlex.xs="100%" fxFlex.sm="100%">
                                                                <airmid-textbox label="Discount %"
                                                                    formControlName="totalDiscountPer"
                                                                    [formGroup]="myForm" [min]="0" [max]="100"
                                                                    [type]="'text'" (valueChange)="updateCalculation()">
                                                                </airmid-textbox>
                                                            </div>
                                                            <div fxFlex="10%" fxFlex.xs="100%" fxFlex.sm="100%">
                                                                <airmid-textbox label="Discount Amount"
                                                                    formControlName="discountAmt" [formGroup]="myForm"
                                                                    [type]="'number'" [readonly]="true">
                                                                </airmid-textbox>
                                                            </div>
                                                            <div fxFlex="10%" fxFlex.xs="100%" fxFlex.sm="100%">
                                                                <airmid-textbox label="Total Net Amount"
                                                                    formControlName="netPayableAmt" [formGroup]="myForm"
                                                                    [type]="'number'" [readonly]="true">
                                                                </airmid-textbox>
                                                            </div>
                                                            <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="100%"
                                                                *ngIf="myForm.get('totalDiscountPer')?.value > 0">
                                                                <airmid-dropdown label="Concession Reason"
                                                                    formControlName="concessionReasonId"
                                                                    [formGroup]="myForm"
                                                                    [mode]="autocompleteModeConcession"
                                                                    (selectionChange)="selectChangeConcession($event)">
                                                                </airmid-dropdown>
                                                            </div>
                                                        </div>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>
                                    </mat-card-content>
                                </mat-card>
                            </div>
                        </div>
                    </div>

                </mat-drawer-content>
            </mat-drawer-container>
        </div>
    </div>
    <div class="modal-footer labpatientfooter">
        <div class="footer-navigation-container">
            <div class="modal-footer-container p-8" fxLayoutAlign="space-between">
                <div class="modal-footer-buttons labpatientbtn">
                    <div>
                        <button class="btn btn-primary" (click)="onSave()">Save & Print </button>
                    </div>
                    <div>
                        <button class="btn btn-danger-outline" (click)="onClose()">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
