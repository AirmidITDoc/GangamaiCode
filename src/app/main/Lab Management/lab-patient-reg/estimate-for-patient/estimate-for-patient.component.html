<div class="modal-wrapper grid-container">
    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{ value: '*', params: { delay: '100ms', x: '-25px' } }">Estimate Bill</span>
            </div>
            <div class="modal-header-right">
                <div class="comman-date-container">

                    <div class="close-icon">
                        <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                            matTooltip="Close">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content overflow-auto ml-8" fxLayout="row" fxLayoutAlign="start stretch">
        <div style="width:45%;">
            <mat-card>
                <mat-card-content>

                    <div class="personal-panel">
                        <div class="detail-header"
                            style="background-color:#000080;font-size: large;color: antiquewhite;font-weight: bold;padding: 10px;">
                            Patient Details
                        </div>
                        <div style="padding-top: 80px;">
                            <form [formGroup]="estimateform">
                                <div fxLayout="column" fxLayout.xs="column" fxLayoutGap="4px">

                                    <div fxLayout="row" fxLayoutGap="4px">
                                        <div fxFlex="49%">
                                            <airmid-dropdown label="Unit / Branch Name" formControlName="unitId"
                                                [validations]="getValidationMessages().UnitId"
                                                [formGroup]="estimateform"
                                                [mode]="autocompleteModeunit"></airmid-dropdown>
                                        </div>
                                        <div fxFlex="49%">
                                            <airmid-dropdown label="Doctor Name" formControlName="doctorId"
                                                [formGroup]="estimateform" [mode]="autocompleteModedoctor">
                                            </airmid-dropdown>
                                        </div>
                                        <!-- <div fxFlex="33%">
                                                            <airmid-dropdown label="Ref Doctor Name"
                                                                formControlName="refDocId"
                                                                [validations]="getValidationMessages().refDocId"
                                                                [formGroup]="estimateform" [mode]="autocompleteModerefdoc">
                                                            </airmid-dropdown>
                                                        </div> -->
                                    </div>

                                    <div fxLayout="row" fxLayoutGap="4px">

                                        <!-- <div fxFlex="33%">
                                                            <airmid-dropdown label="Prefix" formControlName="prefixId"
                                                                [formGroup]="estimateform" ValueField="prefixId"
                                                                TextField="prefixName" [value]="registerObj?.prefixId"
                                                                (selectionChange)="onChangePrefix($event)"
                                                                ApiUrl="Prefix/get-prefixs">
                                                            </airmid-dropdown>
                                                        </div>
                                                        <div fxFlex="33%">
                                                            <airmid-dropdown label="Gender" formControlName="genderId"
                                                                [formGroup]="estimateform"
                                                                [value]="registerObj?.genderId" #ddlGender
                                                                [readonly]="true" [mode]="autocompleteModegender">
                                                            </airmid-dropdown>
                                                        </div> -->
                                        <div fxFlex="49%">
                                            <airmid-textbox label="Patient Name" formControlName="patientName"
                                                [value]="registerObj.firstName" [formGroup]="estimateform"
                                                [validations]="getValidationMessages().firstName"
                                                [maxLength]="100"></airmid-textbox>
                                        </div>
                                        <div fxFlex="49%">
                                            <airmid-textbox label="MobileNo" formControlName="mobileNo"
                                                [validations]="getValidationMessages().mobileNo"
                                                (keypress)="keyPressAlphanumeric($event)" [formGroup]="estimateform"
                                                [maxLength]="10" [value]="registerObj?.mobileNo">
                                            </airmid-textbox>
                                        </div>
                                    </div>
                                    <div fxLayout="row" fxLayoutGap="4px">
                                        <div fxFlex="95">
                                            <app-airmid-dateofbirth [formGroup]="estimateform" dateStyle="Year"
                                                formControlName="DateOfBirth"></app-airmid-dateofbirth>
                                        </div>
                                    </div>
                                    <div fxLayout="row" fxLayoutGap="4px">

                                        <!-- <div fxFlex="33%">
                                                            <airmid-textbox label="MobileNo" formControlName="mobileNo"
                                                                [validations]="getValidationMessages().mobileNo"
                                                                (keypress)="keyPressAlphanumeric($event)"
                                                                [formGroup]="estimateform" [maxLength]="10"
                                                                [value]="registerObj?.mobileNo">
                                                            </airmid-textbox>
                                                        </div> -->
                                        <div fxFlex="49">
                                            <airmid-dropdown label="City" formControlName="cityId"
                                                [formGroup]="estimateform" ValueField="cityId" TextField="cityName"
                                                [value]="registerObj?.cityId" (selectionChange)="onChangecity($event)"
                                                ApiUrl="CityMaster/get-cities">
                                            </airmid-dropdown>
                                        </div>
                                        <div fxFlex="49">
                                            <airmid-textbox label="EmailId" formControlName="emailId"
                                                [validations]="getValidationMessages().EmailId"
                                                [formGroup]="estimateform">
                                            </airmid-textbox>
                                        </div>
                                        <!-- <div fxFlex="33">
                                                            <airmid-textbox label="ReferByName"
                                                                formControlName="ReferByName"
                                                                [validations]="getValidationMessages().ReferByName"
                                                                [formGroup]="estimateform">
                                                            </airmid-textbox>
                                                        </div> -->
                                    </div>

                                    <!-- <div fxLayout="row" fxLayoutGap="4px">
                                                        <div fxFlex="50">
                                                            <airmid-textbox label="Address" formControlName="address"
                                                                [validations]="getValidationMessages().address"
                                                                [formGroup]="estimateform" [value]="registerObj?.address">
                                                            </airmid-textbox>
                                                        </div>
                                                        <div fxFlex="50">
                                                            <airmid-textbox label="Aadhaar No. / National ID"
                                                                formControlName="adharCardNo"
                                                                [value]="registerObj.adharCardNo ?? ''"
                                                                [formGroup]="estimateform"
                                                                (keypress)="keyPressAlphanumeric($event)"
                                                                [validations]="getValidationMessages().adharCardNo"></airmid-textbox>
                                                        </div>
                                                    </div> -->

                                    <div fxLayout="row" fxLayoutGap="4px">
                                        <!-- <div fxFlex="33">
                                                            <airmid-dropdown label="City" formControlName="cityId"
                                                                [formGroup]="estimateform" ValueField="cityId"
                                                                TextField="cityName" [value]="registerObj?.cityId"
                                                                (selectionChange)="onChangecity($event)"
                                                                ApiUrl="CityMaster/get-cities">
                                                            </airmid-dropdown>
                                                        </div> -->
                                        <!-- <div fxFlex="33">
                                                            <airmid-dropdown label="State" formControlName="stateId"
                                                                [formGroup]="estimateform" ValueField="stateId"
                                                                TextField="stateName" #ddlState
                                                                [value]="registerObj?.stateId"
                                                                ApiUrl="StateMaster/get-state" [readonly]="true">
                                                            </airmid-dropdown>
                                                        </div>
                                                        <div fxFlex="33">
                                                            <airmid-dropdown label="Country" formControlName="countryId"
                                                                [formGroup]="estimateform" [value]="registerObj?.countryId"
                                                                [disabled]="true" #ddlCountry
                                                                [mode]="autocompleteModecountry" [readonly]="true">
                                                            </airmid-dropdown>
                                                        </div> -->
                                    </div>
                                    <div fxLayout="row" fxLayoutGap="4px">
                                        <div fxFlex="49%">
                                            <airmid-dropdown label="B2B / Company Name" formControlName="companyId"
                                                [formGroup]="estimateform"
                                                [validations]="getValidationMessages().companyId"
                                                [mode]="autocompleteModecompany"
                                                (selectionChange)="onChangeCompany($event)"></airmid-dropdown>
                                        </div>
                                        <div fxFlex="49%">
                                            <airmid-textbox label="Comments" formControlName="comments"
                                                [validations]="getValidationMessages().Comments"
                                                [formGroup]="estimateform">
                                            </airmid-textbox>
                                        </div>
                                        <!-- <div fxFlex="33%">
                                                            <airmid-textbox label="EmailId" formControlName="emailId"
                                                                [validations]="getValidationMessages().EmailId"
                                                                [formGroup]="estimateform">
                                                            </airmid-textbox>
                                                        </div> -->
                                    </div>

                                </div>
                            </form>
                        </div>

                    </div>
                </mat-card-content>
            </mat-card>
        </div>
        <div fxFlex="55%">
            <div>
                <mat-card>
                    <mat-card-content>
                        <div class="detail-header"
                            style="background-color: #000080;font-size: large;color: antiquewhite;font-weight: bold;padding: 10px;">
                            Bill Details
                        </div>

                        <div>

                            <div style="padding-top: 10px;" fxFlex="60%">
                                <form [formGroup]="estimateform">
                                    <airmid-autocomplete label="Enter Service Name" [formGroup]="estimateform"
                                        formControlName="ServiceId" placeholderText="Enter Service Name" fxFlex
                                        ApiUrl="{{ApiURL}}" (selectionChange)="getSelectedserviceObj($event)"
                                        TextField="formattedText" ValueField="serviceId"></airmid-autocomplete>

                                    <!-- <div fxFlex="5%" fxFlex.xs="5%" fxFlex.sm="5%">
                                        <div class="mt-2">
                                            <button type="button" (click)="onAddCharges()"
                                                class="btn btn-primary btn-with-icon py-8"
                                                [matTooltipPosition]="'above'" fxFlex>
                                                <span class="btn-icon">
                                                    <mat-icon> add </mat-icon>
                                                </span>
                                            </button>
                                        </div>
                                    </div> -->
                                </form>
                            </div>
                        </div>
                        <div fxLayout="column">
                            <div fxLayout="row" fxLayoutGap="6px">
                                <div fxFlex="100%" class="airmid-table-container">
                                    <mat-card>
                                        <mat-table #table1 matSort [dataSource]="dstable1"
                                            [@animateStagger]="{ value: '50' }" class="airmid-table table h-300">

                                            <ng-container matColumnDef="ServiceName">
                                                <mat-header-cell *matHeaderCellDef mat-sort-header class="w-300">Service
                                                    Name</mat-header-cell>
                                                <mat-cell *matCellDef="let contact"
                                                    class="w-300">{{contact.ServiceName}}</mat-cell>
                                            </ng-container>

                                            <!-- <ng-container matColumnDef="DoctorName">
                                                <mat-header-cell *matHeaderCellDef mat-sort-header class="w-300">
                                                    -
                                                </mat-header-cell>

                                                <mat-cell *matCellDef="let contact" class="w-300">
                                                    <ng-container *ngIf="showDoctorDropdown(contact)">
                                                        <mat-form-field appearance="outline" fxFlex="200px"
                                                            floatLabel="never">
                                                            <mat-select placeholder="Select Doctor"
                                                                [(ngModel)]="contact.DoctorId"
                                                                [ngModelOptions]="{ standalone: true }" required
                                                                (selectionChange)="getdocdetail($event, contact)">
                                                                <mat-option *ngFor="let option of doctorOptions"
                                                                    [value]="option.value || option.Value">
                                                                    {{ option.text ||
                                                                    option.Text }}
                                                                </mat-option>
                                                            </mat-select>
                                                        </mat-form-field>
                                                    </ng-container>
                                                </mat-cell>
                                            </ng-container> -->

                                            <!-- <ng-container matColumnDef="Urgent">
                                                <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm
                                                    class="w-70">
                                                    -
                                                </mat-header-cell>
                                                <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-70">
                                                    <mat-slide-toggle (change)="onUrgentToggleChange($event, contact)">
                                                    </mat-slide-toggle>
                                                </mat-cell>
                                            </ng-container> -->

                                            <ng-container matColumnDef="Price">
                                                <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm
                                                    class="w-100">Price</mat-header-cell>
                                                <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-100">
                                                    <mat-form-field appearance="fill">
                                                        <input matInput [(ngModel)]="contact.Price" type="text"
                                                            [id]="'Price' + index" [min]="0"
                                                            (ngModelChange)="getCellCalculation(contact)"
                                                            type="number" />
                                                    </mat-form-field>
                                                </mat-cell>
                                            </ng-container>

                                            <ng-container matColumnDef="DiscountAmount">
                                                <mat-header-cell *matHeaderCellDef class="w-100">Disc
                                                    Amt</mat-header-cell>
                                                <mat-cell *matCellDef="let contact" class="w-100">
                                                    <mat-form-field floatLabel="never" appearance="fill">
                                                        <input matInput placeholder="Disc Amt"
                                                            [(ngModel)]="contact.DiscAmt" type="text" [min]="0"
                                                            [max]="contact.TotalAmt"
                                                            (ngModelChange)="onDiscountAmtChange(contact)">
                                                    </mat-form-field>
                                                </mat-cell>
                                            </ng-container>

                                            <ng-container matColumnDef="NetAmount">
                                                <mat-header-cell *matHeaderCellDef>Net
                                                    Amt</mat-header-cell>
                                                <mat-cell *matCellDef="let contact"><span class="text-overflow">
                                                        {{(contact.NetAmount || 0) | currency:
                                                        currency:'symbol'}}
                                                    </span></mat-cell>
                                            </ng-container>

                                            <ng-container matColumnDef="buttons" stickyEnd>
                                                <mat-header-cell *matHeaderCellDef
                                                    class="w-100">Action</mat-header-cell>
                                                <mat-cell *matCellDef="let contact" class="w-100">
                                                    <button mat-icon-button color="warn"
                                                        (click)="deleteTableRow($event ,contact)"><mat-icon>delete_outline</mat-icon></button>

                                                </mat-cell>
                                            </ng-container>

                                            <mat-header-row class="accent h-35"
                                                *matHeaderRowDef="displayedServiceselected; sticky: true"></mat-header-row>
                                            <mat-row
                                                *matRowDef="let contact; columns: displayedServiceselected; let i = index"
                                                tabindex="999" class="h-32"
                                                [@animate]="{ value: '*', params: { y: '100%' } }"
                                                appHighlight></mat-row>

                                        </mat-table>
                                    </mat-card>

                                    <form [formGroup]="estimateform">
                                        <div fxLayout="row" fxLayoutGap="6px" style="padding: 10px;">
                                            <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="100%">
                                                <airmid-textbox label="Total Amount" formControlName="totalAmount"
                                                    [formGroup]="estimateform" [type]="'number'" [readonly]="true">
                                                </airmid-textbox>
                                            </div>
                                            <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="100%">
                                                <airmid-textbox label="Discount %" formControlName="totalDiscountPer"
                                                    [formGroup]="estimateform" [min]="0" [max]="100" [type]="'text'"
                                                    (valueChange)="updateCalculation()">
                                                </airmid-textbox>
                                            </div>
                                            <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="100%">
                                                <airmid-textbox label="Discount Amount" formControlName="discAmount"
                                                    [formGroup]="estimateform" [readonly]="true">
                                                </airmid-textbox>
                                            </div>
                                            <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="100%">
                                                <airmid-textbox label="Total Net Amount" formControlName="netAmount"
                                                    [formGroup]="estimateform" [type]="'number'" [readonly]="true">
                                                </airmid-textbox>
                                            </div>
                                            <!-- <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="100%"
                                                                *ngIf="estimateform.get('totalDiscountPer')?.value > 0">
                                                                <airmid-dropdown label="Concession Reason"
                                                                    formControlName="concessionReasonId"
                                                                    [formGroup]="estimateform"
                                                                    [mode]="autocompleteModeConcession"
                                                                    (selectionChange)="selectChangeConcession($event)">
                                                                </airmid-dropdown>
                                                            </div> -->
                                        </div>

                                    </form>
                                </div>
                            </div>
                        </div>
                    </mat-card-content>
                </mat-card>


            </div>
        </div>


    </div>
    <div fxLayoutAlign="end" style="padding-right: 20px;padding-bottom: 20px;">
        <div class="modal-footer-buttons" fxLayout="row">
            <button class="btn btn-danger-outline" (click)="onClose()">Close</button>
            <button class="btn btn-primary" (click)="onSave()" [disabled]="!chargeList.length">Save</button>
        </div>
    </div>
</div>
