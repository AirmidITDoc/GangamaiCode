            </div>

                        <app-common-date [screenFrom]="screenFromString" [isDisableFuture]="true"

                    </div> -->
                    <div class="close-icon">
                        <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"

                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

                                                <div fxFlex="49%">
                                                    <airmid-dropdown label="B2B / Company Name"

                                                        (selectionChange)="onChangeCompany($event)"></airmid-dropdown>
                                                </div>
                                                <div fxFlex="49%">

                                                </ng-container>

                                                <ng-container matColumnDef="Price">
                                                    <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm
                                                        class="w-100">Price</mat-header-cell>
                                                    <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-100">
                                                        <mat-form-field appearance="fill">
                                                            <input matInput [(ngModel)]="contact.Price" type="text"
                                                                [id]="'Price' + index" [min]="0"
                                                                (ngModelChange)="getCellCalculation(contact)"
                                                                type="number" />
                                                        </mat-form-field>
                                                    </mat-cell>
                                                </ng-container>

                                                <ng-container matColumnDef="DiscountAmount">
                                                    <mat-header-cell *matHeaderCellDef class="w-100">Disc
                                                        Amt</mat-header-cell>
                                                    <mat-cell *matCellDef="let contact" class="w-100">
                                                        <mat-form-field floatLabel="never" appearance="fill">
                                                            <input matInput placeholder="Disc Amt"
                                                                [(ngModel)]="contact.DiscAmt" type="text" [min]="0"
                                                                [max]="contact.TotalAmt"
                                                                (ngModelChange)="onDiscountAmtChange(contact)">
                                                        </mat-form-field>
                                                    </mat-cell>
                                                </ng-container>

                                                <ng-container matColumnDef="NetAmount">
                                                    <mat-header-cell *matHeaderCellDef>Net
                                                        Amt</mat-header-cell>
                                                    <mat-cell *matCellDef="let contact"><span class="text-overflow">

                                                        </span></mat-cell>
                                                </ng-container>

                                                        class="w-100">Action</mat-header-cell>

                                                        <button mat-icon-button color="warn"

                                                    </mat-cell>

                                                    *matHeaderRowDef="displayedServiceselected; sticky: true"></mat-header-row>
                                                <mat-row
                                                    *matRowDef="let contact; columns: displayedServiceselected; let i = index"

                                        <form [formGroup]="estimateform">

                                                    <airmid-textbox label="Total Amount" formControlName="totalAmount"

                                                    </airmid-textbox>
                                                </div>
                                                <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="100%">
                                                    <airmid-textbox label="Discount %"
                                                        formControlName="totalDiscountPer" [formGroup]="estimateform"

                                                    </airmid-textbox>
                                                </div>

                                                </div>

                    </div>

                </div>
                <div fxLayoutAlign="end" style="padding-right:20px;">
                    <div fxLayout="row">
                        <button class="btn btn-danger-outline" (click)="onClose()">Close</button>
                        <button class="btn btn-primary" (click)="onSave()" [disabled]="!chargeList.length">Save</button>
                    </div>
                </div>

                <div>

                    <form [formGroup]="myformSearch">
                        <div fxLayout="column" style="padding-top:5px ;">

                            <div fxLayout.gt-xs="row" fxLayout="column" fxLayoutAlign="start" class="gap-4">
                                <div fxLayout="row wrap"  fxLayoutGap="5px 0px grid">

                                    <div fxFlex="15%" fxFlex.xs="100%" fxFlex.sm="35%">
                                        <airmid-datepicker [formGroup]="myformSearch" [isRangePicker]="true"
                                            formStartControlName="fromDate" formEndControlName="enddate"
                                            [(fromValue)]="gridConfig.filters[0].fieldValue"
                                            [(toValue)]="gridConfig.filters[1].fieldValue">
                                        </airmid-datepicker>
                                    </div>


                                    <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="35%">
                                        <mat-form-field appearance="outline" fxFlex>
                                            <mat-label>Patient Name</mat-label>
                                            <input matInput placeholder="Search Patient Name" autocomplete="off"
                                                [formGroup]="myformSearch" formControlName="PatientName"
                                                (input)="onChangeOPBill()" />
                                            <button matSuffix mat-icon-button aria-label="Clear"
                                                (click)="Clearfilter('FirstNameSearch')">
                                                <mat-icon>close</mat-icon>
                                            </button>
                                        </mat-form-field>
                                    </div>
                                    <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="35%">

                                        <mat-form-field appearance="outline" fxFlex>
                                            <mat-label>MobileNo</mat-label>
                                            <input matInput placeholder="Search MobileNo" autocomplete="off"
                                                [formGroup]="myformSearch" formControlName="MobileNo"
                                                (input)="onChangeOPBill()" />
                                            <button matSuffix mat-icon-button aria-label="Clear"
                                                (click)="Clearfilter('MobileNo')">
                                                <mat-icon>close</mat-icon>
                                            </button>
                                        </mat-form-field>
                                    </div>

                                    <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="35%">

                                        <airmid-dropdown label="Company Name" formControlName="CompanyId"
                                            [formGroup]="myformSearch" (selectionChange)="ListView($event)"
                                            [mode]="autocompleteModecompany"></airmid-dropdown>
                                    </div>

                                    <div class="action-button-container">
                                        <div class="button-row-group">
                                            <button class="btn btn-danger-outline btn-xs"
                                                (click)="onClear()">clear</button>
                                            <button class="btn btn-primary btn-with-icon btn-xs"
                                                (click)="onChangeOPBill()">
                                                <span>Search</span>
                                                <span class="btn-icon">
                                                    <mat-icon>search</mat-icon>
                                                </span>
                                            </button>

                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </form>

                    <div>
                        <div style="height: 200px; overflow-y:auto;" fxFlex="97%">

                            <ng-template #actionButtonTemplate let-element>
                                <div fxLayout="row" fxLayoutAlign="center center">

                                    <button mat-icon-button matTooltip="Print"

                                    </button>


                                </div>
                            </ng-template>
