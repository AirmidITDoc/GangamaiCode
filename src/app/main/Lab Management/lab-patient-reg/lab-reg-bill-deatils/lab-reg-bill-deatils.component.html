<div class="dialog-content-wrapper modal-wrapper grid-container">
    <!-- Modal Header -->
    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Lab Bill Detail List
                    <!-- <span style="margin-left: 20px;font-weight: bold;">Doctor:- {{doctorName}} |
                        {{BillNo}}</span> -->
                </span>
            </div>
            <div class="modal-header-right">
                <div class="comman-date-container">

                    <div class="close-icon">
                        <button mat-icon-button tabIndex="-1" (click)="onClose()" aria-label="Close dialog">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="info-badge-top overflow-auto" fxLayout="row" fxLayoutGap="3px">

        <div fxFlex fxLayout="column">
            <mat-card style="padding: 6px;">
                <div class="patient-info-title" fxLayout="row">
                    <span class="h2" style="margin-right: 5px;"><strong>Patient Name:</strong>
                        {{data.patientName}}</span>
                    <span class="h2"><strong>Ref. Doctor:</strong> {{data.refDoctorName}}</span>
                </div>
            </mat-card>

            <!-- dynamicTableHeight -->
            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto">

                <div id="contacts" style="height: 250px;">

                    <ng-template #ColorCode let-element>
                        <div fxLayout="row" fxLayoutAlign="center center" class="status-box">
                            <span [ngClass]="{
                'status-completed': element.isCompleted === true,
                'status-pending': element.isCompleted === false
                        }">
                                {{ element.isCompleted ? 'Completed' : 'Pending' }}
                            </span>
                        </div>
                    </ng-template>

                    <ng-template #icons let-element>
                        <div fxLayout="row" fxLayoutAlign="center center">

                            <mat-icon *ngIf="element.isPathology==1" matTooltip="Pathology Service" class="s-20 mr-4"
                                style="color: #9c27b0;">
                                <img width="50px" height="50px" src="assets/images/logos/pathology.png">
                            </mat-icon>

                            <mat-icon *ngIf="element.isRadiology==1" matTooltip="Radiology Service" class="s-20 mr-4"
                                style="color: #4a6be6;">
                                <img width="50px" height="50px" src="assets/images/logos/pathology.png">
                            </mat-icon>
                        </div>
                    </ng-template>

                    <ng-template #actionButtonTemplate let-contact>
                        <div fxLayout="row" fxLayoutAlign="center center">

                            <span [matTooltip]="contact.isVerifySign === false
                                                    ? 'Verification is Pending'
                                                    : ''">
                                <button mat-icon-button matTooltip="Print"
                                    [disabled]="contact.isVerifySign === false">
                                    <mat-icon>print</mat-icon>
                                </button>
                            </span>

                            <span [matTooltip]="contact.isVerifySign === false
                                                    ? 'Verification is Pending'
                                                    : ''">
                                <button mat-icon-button matTooltip="Report Dispatch"
                                    (click)="viewgetReportdispatch(element)"
                                    [disabled]="contact.isVerifySign === false">
                                    <mat-icon>local_shipping</mat-icon>
                                </button>
                            </span>

                            <span [matTooltip]="contact.isVerifySign === false
                                                    ? 'Verification is Pending'
                                                    : ''">
                                <button mat-icon-button matTooltip="SMS Send" (click)="viewgetSms(element)"
                                    [disabled]="contact.isVerifySign === false">
                                    <mat-icon>sms</mat-icon>
                                </button>
                            </span>

                            <span [matTooltip]="contact.isVerifySign === false
                                                    ? 'Verification is Pending'
                                                    : ''">
                                <button mat-icon-button [disabled]="contact.isVerifySign === false"
                                    [matTooltip]="'We send the mail on your registered MailID : ' + element?.emailId"
                                    matTooltipPosition="right" (click)="Onemail(element)"
                                    style="position: relative; cursor: pointer; text-decoration: underline; color: #667eea;">
                                    <mat-icon>email</mat-icon>
                                </button>
                            </span>

                            <span [matTooltip]="contact.isVerifySign === false
                                                    ? 'Verification is Pending'
                                                    : ''">
                                <button mat-icon-button [disabled]="contact.isVerifySign === false"
                                    [matTooltip]="'We send the message on your registered WhatsApp number: ' + element?.mobileNo"
                                    matTooltipPosition="right" (click)="getWhatsappshareReport(element)"
                                    style="position: relative; cursor: pointer; text-decoration: underline; color: #667eea;">
                                    <img width="20" height="20" src="assets/images/logos/WhatsApp.png">
                                </button>
                            </span>
                        </div>
                    </ng-template>

                    <div class="gridtitle">
                        Test & Services
                    </div>
                    <airmid-table [gridConfig]="gridConfig" #billgrid :ShowFilter="false" :ShowButtons="false">
                        <ng-container filters>
                        </ng-container>
                    </airmid-table>
                </div>

                <div id="contacts" style="height: 200px;margin-top: 20px;">
                    <div class="gridtitle">
                        <span>
                            Discount Details
                        </span>
                    </div>
                    <airmid-table [gridConfig]="gridConfig1" #Discgrid :ShowFilter="false" :ShowButtons="false">
                        <ng-container filters>
                        </ng-container>
                    </airmid-table>
                </div>

                <div id="contacts" style="height: 200px;margin-top: 50px;">
                    <div class="gridtitle">
                        Payment Details
                    </div>
                    <airmid-table [gridConfig]="gridConfig2" #PayGrid :ShowFilter="false" :ShowButtons="false">
                        <ng-container filters>
                        </ng-container>
                    </airmid-table>
                </div>

                <div id="contacts" style="height: 200px;margin-top: 60px;">
                    <div class="gridtitle">
                        Credit Details
                    </div>
                    <airmid-table [gridConfig]="gridConfig3" #Creditgrid :ShowFilter="false" :ShowButtons="false">
                        <ng-container filters>
                        </ng-container>
                    </airmid-table>
                </div>
            </div>
        </div>

        <!-- <div fxFlex="25%" fxLayout="column" style="border: 1px solid black;">

        </div> -->
    </div>

    <div class="modal-footer" style="margin-top: 10px;">
        <div class="footer-navigation-container">
            <div class="modal-footer-buttons">
                <button class="btn btn-primary" color="accent" (click)="onPrint()">
                    Path Req
                </button>
                <button class="btn btn-primary" color="accent" (click)="onPrint()">
                    Non Path Req
                </button>

                <button class="btn btn-danger-outline" (click)="onClose()">Close</button>

            </div>
        </div>
    </div>
