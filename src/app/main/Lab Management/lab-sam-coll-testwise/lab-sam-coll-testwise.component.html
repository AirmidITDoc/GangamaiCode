<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" style="height: 100%;" fusePerfectScrollbar
    dynamicTableHeight>
    <mat-toolbar class="top-header accent">
        <div fxLayout="row" fxLayoutAlign="start center" class="top-header-info">
            <button mat-icon-button class="sidebar-toggle ">
                <mat-icon>menu</mat-icon>
            </button>
            <mat-icon class="logo-icon" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}">account_box
            </mat-icon>
            <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                Sample Collection TestWise List
            </span>
        </div>

    </mat-toolbar>

    <div fusePerfectScrollbar
        class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
        dynamicTableHeight>

        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

            <!-- <ng-template #iconisCompeleted let-element>
                <div fxLayout="row" fxLayoutAlign="center center" class="status-box gap-4" >
                    <span [ngClass]="{
                            'status-completed': element.isSampleCollection == 'True',
                            'status-pending': element.isSampleCollection == 'False'
                        }">
                        {{ element.isSampleCollection == 'True' ? 'Completed' : 'Pending' }}
                    </span>
                </div>
            </ng-template> -->

            <ng-template #genderANDage let-element>
                <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="8px">

                    <span class="patient-link"
                        matTooltip="{{ element.genderName }} • {{ element.ageYear }}y {{ element.ageMonth }}m {{ element.ageDay }}d"
                        matTooltipPosition="above">

                        {{ element.genderName }}
                        <span *ngIf="element.ageYear"> • {{ element.ageYear }}y</span>
                        <span *ngIf="element.ageMonth"> {{ element.ageMonth }}m</span>
                        <span *ngIf="element.ageDay"> {{ element.ageDay }}d</span>

                    </span>

                </div>
            </ng-template>

            <airmid-table [gridConfig]="gridConfig" class="content" :ShowButtons="false">
                <ng-container filters>
                    <form [formGroup]="myformSearch">

                        <airmid-datepicker [formGroup]="myformSearch" [isRangePicker]="true"
                            formStartControlName="start" formEndControlName="end"
                            [(fromValue)]="gridConfig.filters[0].fieldValue"
                            [(toValue)]="gridConfig.filters[1].fieldValue">
                        </airmid-datepicker>

                        <mat-form-field appearance="outline">
                            <mat-label>PBillNo</mat-label>
                            <input matInput placeholder="Search PBillNo" autocomplete="off" [formGroup]="myformSearch"
                                formControlName="PBillNo" (keypress)="keyPressAlphanumeric($event)"
                                (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)=" Clearfilter('PBillNo')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <airmid-dropdown label="Company Name" formControlName="CompanyId" [formGroup]="myformSearch"
                            [(ngModel)]="gridConfig.filters[3].fieldValue" (selectionChange)="ListViewcompany($event)"
                            [mode]="autocompleteModecompany"></airmid-dropdown>

                        <airmid-dropdown label="Test Name" formControlName="TestId" [formGroup]="myformSearch"
                            [(ngModel)]="gridConfig.filters[4].fieldValue" (selectionChange)="ListViewTest($event)"
                            ApiUrl="BillingService/PathologyServicesearch?Keyword=%" TextField="serviceName"
                            ValueField="serviceId"></airmid-dropdown>

                            <airmid-dropdown label="OutSource Name" formControlName="OutSourceId" [formGroup]="myformSearch"
                            [(ngModel)]="gridConfig.filters[5].fieldValue" (selectionChange)="ListViewOutSource($event)"
                            [mode]="autocompleteModeoutsource"></airmid-dropdown>

                        <!-- <div fxLayout="column" fxLayoutAlign="start start">

                            <div fxFlex fxLayout="row">
                                <mat-radio-group name="StatusSearch" fxLayout="row" [formGroup]="myformSearch"
                                    formControlName="StatusSearch" (change)="onChangeFirst()" style="padding: 6px;"
                                    class="gap-4">
                                    <mat-label>Status:</mat-label>
                                    <div fxLayout="row">
                                        <mat-radio-button value='0'>Pending</mat-radio-button>
                                        <mat-radio-button value='1'>Completed</mat-radio-button>
                                    </div>
                                </mat-radio-group>
                            </div>
                        </div> -->
                    </form>

                </ng-container>
            </airmid-table>
        </div>
    </div>
</div>
