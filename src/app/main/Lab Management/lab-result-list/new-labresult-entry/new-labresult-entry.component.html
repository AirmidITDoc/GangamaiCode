<div class="page-layout modal-wrapper grid-container" fusePerfectScrollbar>

    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Lab Result Entry
                </span>
            </div>
            <div class="modal-header-right">
                <div class="comman-date-container">
                    <div class="comman-date">
                        <app-common-date [screenFrom]="screenFromString"
                            (dateTimeEventEmitter)="getDateTime($event)"></app-common-date>
                    </div>
                    <div class="close-icon">
                        <button mat-icon-button tabIndex="-1" (click)="onClose()" aria-label="Close dialog">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="modal-body content">
        <div fxLayout="column" class="gap-8 h-100-p">
            <div class="modal-card-container">
                <div fxFlex.gt-sm="100%" fxFlex fxLayoutGap="4px">

                    <mat-card fxFlex.gt-sm="100%" fxFlex>
                        <div class="patient-info-sales my-8">

                            <div class="patient-info-title border-bottom pb-1 mb-1" fxLayout="row"
                                fxLayoutAlign="space-between center">
                                <span class="h1 m-0" style="line-height: normal;">Patient Information</span>

                                <div class="gap-4" fxLayout="row">

                                    <div class="legend-item">
                                        <span class="legend-box low-box"></span>
                                        <span style="font-size: 16px;">Low (Below Normal)</span>
                                    </div>

                                    <div class="legend-item">
                                        <span class="legend-box high-box"></span>
                                        <span style="font-size: 16px;">High (Above Normal)</span>
                                    </div>

                                    <button mat-raised-button color="primary" (click)="onUpload()"
                                        style="background-color: aliceblue; color: brown;"
                                        *ngIf="!verifyCheck && !viewCheck">
                                        Upload
                                        <mat-icon class="ml-4">cloud_upload</mat-icon>
                                    </button>

                                    <button mat-raised-button color="primary"
                                        style="background-color: aliceblue; color: brown;"
                                        *ngIf="!verifyCheck && !viewCheck">
                                        Re-Run
                                    </button>
                                </div>
                            </div>
                            <div class="Ipd-patient-info w-100-p">
                                <app-patient-information [uhidNo]="selectedAdvanceObj2?.labRequestNo"
                                    [patientName]="selectedAdvanceObj2?.patientName"
                                    [ageString]="(selectedAdvanceObj2?.ageYear !== undefined ? selectedAdvanceObj2?.ageYear + 'Y|' + selectedAdvanceObj2?.ageMonth + 'M|' + selectedAdvanceObj2?.ageDay + 'D | ' + selectedAdvanceObj2?.genderName : '')"
                                    [refDocName]="selectedAdvanceObj2?.doctorName">
                                </app-patient-information>
                            </div>
                        </div>
                    </mat-card>

                </div>
            </div>
            <div class="modal-card-container">
                <div fxFlex.gt-sm="100%" fxFlex class="airmid-table-container">
                    <mat-card style="padding: 6px;">
                        <!-- appTableKeyboardNavigation -->
                        <mat-table matSort [dataSource]="dataSource" class="airmid-table h-400"
                            [@animateStagger]="{value:'50'}" appTableKeyboardNavigation>

                            <ng-container matColumnDef="sequence">
                                <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm class="w-70">Sr.No
                                </mat-header-cell>
                                <mat-cell *matCellDef="let element; let i = index" fxShow.gt-sm class="w-70">
                                    {{ i + 1 }}
                                </mat-cell>
                            </ng-container>

                            <ng-container matColumnDef="TestName" sticky>
                                <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm class="border-right">
                                    Test Name
                                </mat-header-cell>
                                <mat-cell *matCellDef="let contact">
                                    {{contact.TestName}}
                                </mat-cell>
                            </ng-container>

                            <ng-container matColumnDef="ParameterName">
                                <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-md
                                    class="border-right">
                                    Parameter Name
                                </mat-header-cell>
                                <mat-cell *matCellDef="let contact" fxHide fxShow.gt-md>
                                    {{contact.ParameterName}}
                                </mat-cell>
                            </ng-container>

                            <ng-container matColumnDef="ResultValue" style="width:100%;font-weight: bold;">
                                <mat-header-cell *matHeaderCellDef mat-sort-header class="border-right">
                                    Result
                                </mat-header-cell>

                                <mat-cell *matCellDef="let contact" class="border-right" [ngClass]="{
                                        'low-range': contact.RangeStatus === 'low',
                                        'high-range': contact.RangeStatus === 'high'
                                    }">

                                    <mat-form-field appearance="fill" *ngIf="!contact.IsHelpShown" style="width: 100%;">
                                        <input matInput autocomplete="off" (keyup)="onResultUp(contact)"
                                            (keydown.F2)="onKeydown($event,contact)" matTooltip="Use Help Value"
                                            [(ngModel)]="contact.ResultValue">
                                    </mat-form-field>

                                    <mat-form-field appearance="fill" *ngIf="contact.IsHelpShown" style="width:100%">
                                        <input type="text" matInput id="helpText_{{contact.ParameterId}}"
                                            (keyup)="filterHelp($event, contact)" [matAutocomplete]="auto">
                                        <mat-autocomplete #auto="matAutocomplete"
                                            (optionSelected)="onSelectHelp($event.option.value, contact)">
                                            <mat-option *ngFor="let option of contact.helpItems"
                                                [value]="option.ParameterValues">
                                                {{ option.ParameterValues }}
                                            </mat-option>
                                        </mat-autocomplete>
                                    </mat-form-field>

                                    <mat-icon class="Help-Value" *ngIf="contact.ParaIsNumeric ==0"
                                        matTooltip="Use Help Value" style="width: 10px;height: 10px;">
                                        circle
                                    </mat-icon>
                                </mat-cell>
                            </ng-container>

                            <ng-container matColumnDef="Flag">
                                <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm
                                    class="w-80 border-right">Bold
                                </mat-header-cell>
                                <mat-cell class="w-80" *matCellDef="let contact" fxShow.gt-sm>
                                    <mat-form-field appearance="fill">
                                        <input matInput matTooltip="Status" [(ngModel)]="contact.ParaBoldFlag"
                                            (input)="onlyB(contact)">
                                    </mat-form-field>
                                </mat-cell>
                            </ng-container>

                            <ng-container matColumnDef="NormalRange">
                                <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-md
                                    class="border-right">
                                    NormalRange
                                </mat-header-cell>
                                <mat-cell *matCellDef="let contact" fxHide fxShow.gt-md class="border-right">
                                    {{contact?.NormalRange}}
                                </mat-cell>
                            </ng-container>

                            <ng-container matColumnDef="machine">
                                <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-md
                                    class="border-right">
                                    M/I
                                </mat-header-cell>
                                <mat-cell *matCellDef="let contact" fxHide fxShow.gt-md class="border-right">
                                    {{'-'}}
                                </mat-cell>
                            </ng-container>

                            <!-- <ng-container matColumnDef="Formula">
                                <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-md
                                    class="border-right">
                                    Formula
                                </mat-header-cell>
                                <mat-cell *matCellDef="let contact" fxHide fxShow.gt-md class="border-right">
                                    {{contact?.Formula}}
                                </mat-cell>
                            </ng-container> -->

                            <ng-container matColumnDef="loading">
                                <mat-header-cell *matFooterCellDef colspan="6" style="display: none;">
                                </mat-header-cell>
                            </ng-container>

                            <ng-container matColumnDef="noData">
                                <mat-footer-cell *matFooterCellDef colspan="6">
                                    no data found...
                                </mat-footer-cell>
                            </ng-container>

                            <mat-header-row class="accent"
                                *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
                            <mat-row *matRowDef="let contact; columns: displayedColumns;" class="contact"
                                [@animate]="{value:'*',params:{y:'100%'}}" (click)="onRowChange(contact)">
                            </mat-row>
                            <mat-footer-row *matFooterRowDef="['loading']"
                                [ngClass]="{'hide': !(sIsLoading == 'loading-data')}">
                            </mat-footer-row>
                            <mat-footer-row *matFooterRowDef="['noData']"
                                [ngClass]="{'hide':!(dataSource!=null && dataSource.data.length==0)}">
                            </mat-footer-row>
                        </mat-table>

                    </mat-card>
                </div>
            </div>

            <div class="modal-card-container">
                <form [formGroup]="otherForm">
                    <mat-card style="padding: 6px;">
                        <div fxLayout="column" fxLayout="row" fxLayout="4px">

                            <mat-form-field appearance="outline" fxFlex>
                                <mat-label>Suggestion Note</mat-label>
                                <textarea matInput rows="2" name="suggestionNotes" formControlName="suggestionNotes"
                                    [(ngModel)]="vsuggation" (keydown)="onEnterSugg($event)">
                                    </textarea>
                                <!-- <mat-hint align="end">{{ vsuggation?.length || 0 }}/500</mat-hint> -->
                            </mat-form-field>
                        </div>

                        <div fxLayout="column" fxLayout="row" fxLayout="4px" class=" resize-form-fields">
                            <airmid-dropdown label="Technician Name" formControlName="PathResultDoctorId"
                                [formGroup]="otherForm" (selectionChange)="selectChangeDoctor($event)" fxFlex="40%"
                                ValueField="doctorId" TextField="doctorName"
                                ApiUrl="Pathology/search-pathologistdoctor"></airmid-dropdown>
                        </div>
                    </mat-card>

                </form>
            </div>
        </div>
    </div>
    <div class="modal-footer" fxLayout="column">
        <div class="modal-footer-buttons">
            <button class="btn btn-danger-outline" (click)="onClose()">Close</button>
            <button class="btn btn-primary" (click)="onSave()" *ngIf="!verifyCheck && !viewCheck">Save</button>
            <button class="btn btn-success" (click)="onVerify()"
                *ngIf="verifyCheck && !viewCheck">Authorization</button>
        </div>
    </div>
</div>
