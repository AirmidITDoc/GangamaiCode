<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" fusePerfectScrollbar dynamicTableHeight>


    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Home Collection List
                </span>
            </div>
        </div>
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onnew()">+ Add Collection
            </button>
        </div>
    </div>

    <ng-template #actionButtonTemplate let-element>
        <div fxLayout="row" fxLayoutAlign="center center">
            <button mat-icon-button matTooltip="Edit" (click)="onnew(element)"
                [style.visibility]="!element.isCancel ? 'visible' : 'hidden'">
                <mat-icon>edit</mat-icon>
            </button>

            <button mat-icon-button matTooltip="Process Bill" (click)="onBillProcess(element)"
                [style.visibility]="!element.isCancel ? 'visible' : 'hidden'">
                <mat-icon>replay</mat-icon>
            </button>

            <button mat-icon-button matTooltip="Cancel" (click)="OnCancel(element)"
                [style.visibility]="!element.isCancel ? 'visible' : 'hidden'">
                <mat-icon> cancel </mat-icon>
            </button>

            <button mat-icon-button matTooltip="Print" [style.visibility]="!element.isCancel ? 'visible' : 'hidden'">
                <mat-icon>print</mat-icon>
            </button>

            <button mat-icon-button [matMenuTriggerFor]="actionsMenu" matTooltipPosition="above"
                (click)="$event.stopPropagation();">
                <mat-icon>more_vert</mat-icon>
            </button>

            <mat-menu #actionsMenu="matMenu" xPosition="before" yPosition="below" [overlapTrigger]="false">

                <button mat-menu-item (click)="openStatus(element)" style="height: 32px; min-height: 32px;">
                    <mat-icon style="margin-right: 8px; font-size: 16px; width: 16px; height: 16px;">update</mat-icon>
                    <span style="font-size: 13px;">Update Phlebotomist</span>
                </button>

            </mat-menu>
        </div>
    </ng-template>

    <ng-template #stausStart let-element>
        <div fxLayout="column" fxLayoutAlign="center center"
            [ngClass]="element.status > 0 ? 'status-started' : 'status-no'">
            {{ element.status > 0 ? 'Started' : 'No' }}
        </div>
    </ng-template>

    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

        <airmid-table [gridConfig]="gridConfig" class="content">
            <ng-container filters>
                <form [formGroup]="myFilterform">

                    <div fxLayout="column" fxLayoutAlign="start none">

                        <airmid-dropdown label="Unit Name" formControlName="UnitId" [readonly]="true"
                            [(ngModel)]="gridConfig.filters[4].fieldValue" (selectionChange)="ListView1($event)"
                            [formGroup]="myFilterform" [mode]="autocompleteModeunit"></airmid-dropdown>

                        <mat-form-field appearance="outline">
                            <mat-label>Enter a date range</mat-label>
                            <mat-date-range-input [rangePicker]="picker">
                                <input matStartDate formControlName="fromDate" placeholder="Start date">
                                <input matEndDate formControlName="enddate" placeholder="End date"
                                    (dateChange)="onChangeFirst()">
                            </mat-date-range-input>
                            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                            <mat-date-range-picker #picker></mat-date-range-picker>
                        </mat-form-field>

                        <mat-form-field appearance="outline">
                            <mat-label>FirstName</mat-label>
                            <input matInput placeholder="FirstName" autocomplete="off" [formGroup]="myFilterform"
                                formControlName="FirstName" (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('FirstName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <mat-form-field appearance="outline">
                            <mat-label>LastName</mat-label>
                            <input matInput placeholder="LastName" autocomplete="off" [formGroup]="myFilterform"
                                formControlName="LastName" (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('LastName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <!-- <airmid-dropdown label="Select Doctor Name" formControlName="DoctorID"
                            [(ngModel)]="gridConfig.filters[5].fieldValue" [formGroup]="myFilterform"
                            (selectionChange)="ListView($event)" (keyup)="ListView($event)"
                            [mode]="autocompleteModedoctor">
                        </airmid-dropdown> -->
                    </div>

                </form>
            </ng-container>
        </airmid-table>
    </div>
</div>

<ng-template #statusForm>
    <mat-toolbar class="accent" style="width: 100%; height: 45px; justify-content: space-between;">
        <div fxLayout="row" fxLayoutAlign="start center">
            <mat-icon class="logo-icon mr-16" style="color: white;">account_box</mat-icon>
            <span style="font-size: 16px;">Update Phlebotomist</span>
        </div>

        <div class="close-icon">
            <button mat-icon-button [mat-dialog-close]="true" aria-label="Close dialog" matTooltip="Close">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </mat-toolbar>

    <div class="service-table1 p-12" fxLayout="column" fxLayoutGap="16px">

        <form [formGroup]="statusFormFinal">

            <!-- <mat-card style="margin-top: 10px;"> -->
                <div fxFlex="50%" fxFlex.xs="100%" fxFlex.sm="33%">
                    <airmid-dropdown label="Phlebotomist" formControlName="phlebotomist" [formGroup]="statusFormFinal"
                        ApiUrl="CompanyEmployeInfo/get-employe" ValueField="executiveId" TextField="fullName"
                        (selectionChange)="getSelectedObjPhlebotomist($event)"></airmid-dropdown>
                </div>
            <!-- </mat-card> -->
        </form>

    </div>

    <div fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="12px" class="p-12 border-top">
        <button class="btn btn-danger-outline" [mat-dialog-close]="true">
            Close
        </button>
        <button class="btn btn-primary" color="accent" (click)="saveStatus()">
            Save
        </button>
    </div>
</ng-template>
