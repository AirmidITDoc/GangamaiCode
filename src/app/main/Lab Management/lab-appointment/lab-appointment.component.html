<div class="modal-page page-layout inner-scroll">
    <div class="modal-wrapper grid-container">
        <!-- Modal header -->
        <div class="modal-header accent">
            <div class="modal-header-content">
                <div class="modal-header-title">
                    <span [@animate]="{ value: '*', params: { delay: '100ms', x: '-25px' } }">Lab Appointment</span>
                </div>
                <div class="modal-header-right">
                    <button class="btn btn-primary" (click)="demoOpen( $event.event)">Save </button>
                </div>
            </div>
        </div>

        <!-- Modal body -->
        <div class="modal-body resize-form-fields" fusePerfectScrollbar>
            <div class="modal-body-container">
                <div fxLayout="column" class="gap-8 h-100-p">
                    <div class="modal-card-container calender-header input-error-hidden">
                        <div fxLayout="row" fxLayoutGap="16px" fxLayoutAlign="start center">
                            <form [formGroup]="myFilterform" class="resize-form-fields gap-4">
                                <!-- <div fxFlex="50%" fxFlex.xs="100%">
                                    <mat-form-field appearance="outline">
                                        <mat-label>Enter a date range</mat-label>
                                        <mat-date-range-input [rangePicker]="picker">
                                            <input matStartDate formControlName="fromDate" placeholder="Start date">
                                            <input matEndDate formControlName="enddate" placeholder="End date">
                                        </mat-date-range-input>
                                        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                                        <mat-date-range-picker #picker></mat-date-range-picker>
                                    </mat-form-field>
                                </div> -->
                                <div fxFlex="50%" fxFlex.xs="100%">
                                    <airmid-dropdown fxFlex label="Category Name" formControlName="categoryId"
                                        [formGroup]="myFilterform" [mode]="autocompleteRadioDD"
                                        (selectionChange)="selectChangeCategory($event)"></airmid-dropdown>
                                </div>
                                <div fxFlex="50%" fxFlex.xs="100%">
                                    <airmid-dropdown fxFlex label="Doctor Name" formControlName="refDocId"
                                        [formGroup]="myFilterform" [mode]="autocompleteRefDoctorDD"
                                        (selectionChange)="onChangeRefdoc($event)"></airmid-dropdown>
                                </div>
                            </form>
                            <div fxFlex="60%" fxFlex.xs="100%">
                                <!--  *ngIf="vRefDocId > 0" -->
                                <div fxLayout="row" fxLayoutAlign="start center" class="gap-8">
                                    <button mat-raised-button (click)="bindData()">Refresh</button>
                                    <h3 #dateDisplay class="m-0">{{ viewDate | calendarDate : view + 'ViewTitle' : 'en'
                                        }}</h3>
                                </div>
                            </div>
                        </div>

                        <!--  *ngIf="vRefDocId > 0" -->
                        <div fxLayout="row" fxLayoutAlign="space-between center" class="mt-12 mb-2" [gdAlignRows.xs]=""
                            *ngIf="vRefDocId > 0 || categoryId > 0">
                            <div class="button-row-group">
                                <button mat-raised-button mwlCalendarPreviousView [view]="view" [(viewDate)]="viewDate"
                                    (viewDateChange)="closeOpenMonthViewDay()">Previous</button>
                                <button mat-raised-button mwlCalendarToday [(viewDate)]="viewDate"
                                    (viewDateChange)="closeOpenMonthViewDay()">Today</button>
                                <button mat-raised-button mwlCalendarNextView [view]="view" [(viewDate)]="viewDate"
                                    (viewDateChange)="closeOpenMonthViewDay()">Next</button>
                            </div>
                            <div class="button-row-group">
                                <button mat-raised-button (click)="setView(CalendarView.Month)"
                                    [color]="view === CalendarView.Month ? 'primary' : undefined">Month</button>
                                <button mat-raised-button (click)="setView(CalendarView.Week)"
                                    [color]="view === CalendarView.Week ? 'primary' : undefined">Week</button>
                                <!-- <button mat-raised-button (click)="setView(CalendarView.Day)" [color]="view === CalendarView.Day ? 'primary' : undefined">Day</button> -->
                            </div>
                        </div>

                        <div fxLayout="row wrap" fxLayoutAlign="start center" fxLayoutGap="16px" *ngIf="false">

                            <!-- Calendar Controls               *ngIf="vRefDocId > 0"-->
                            <div fxFlex.gt-sm="50%" fxFlex="100%" *ngIf="vRefDocId > 0 || categoryId > 0">
                                <div fxLayout="row wrap" fxLayoutGap="16px" fxLayoutAlign="start center">
                                    <!-- Navigation Buttons -->
                                    <div fxFlex="100%" fxFlex.gt-sm="auto">
                                        <button mat-raised-button mwlCalendarPreviousView [view]="view"
                                            [(viewDate)]="viewDate"
                                            (viewDateChange)="closeOpenMonthViewDay()">Previous</button>
                                        <button mat-raised-button mwlCalendarToday [(viewDate)]="viewDate"
                                            (viewDateChange)="closeOpenMonthViewDay()">Today</button>
                                        <button mat-raised-button mwlCalendarNextView [view]="view"
                                            [(viewDate)]="viewDate"
                                            (viewDateChange)="closeOpenMonthViewDay()">Next</button>
                                    </div>

                                    <!-- View Title and Refresh -->
                                    <div fxFlex="100%" fxFlex.gt-sm="auto"
                                        style="display: flex; align-items: center; gap: 8px">
                                        <h3 style="margin: 0">{{ viewDate | calendarDate : view + 'ViewTitle' : 'en' }}
                                        </h3>
                                        <button mat-raised-button (click)="bindData()">Refresh</button>
                                    </div>

                                    <!-- View Switch Buttons -->
                                    <div fxFlex="100%" fxFlex.gt-sm="auto">
                                        <div class="btn-group">
                                            <button mat-raised-button (click)="setView(CalendarView.Month)"
                                                [class.active]="view === CalendarView.Month">Month</button>
                                            <button mat-raised-button (click)="setView(CalendarView.Week)"
                                                [class.active]="view === CalendarView.Week">Week</button>
                                            <button mat-raised-button (click)="setView(CalendarView.Day)"
                                                [class.active]="view === CalendarView.Day">Day</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div fxLayout="row" class="overflow-auto" *ngIf="vRefDocId > 0 || categoryId > 0">
                        <div class="modal-card-container overflow-auto" style="width: 70%;">
                            <!--  *ngIf="vRefDocId > 0" -->
                            <div class="calendar-scroll-container" [ngSwitch]="view">
                                <mwl-calendar-month-view *ngSwitchCase="CalendarView.Month" [viewDate]="viewDate"
                                    [events]="events" [refresh]="refresh" [activeDayIsOpen]="activeDayIsOpen"
                                    (dayClicked)="dayClicked($event.day)"
                                    (eventClicked)="handleEvent('Clicked', $event.event)"
                                    (eventTimesChanged)="eventTimesChanged($event)"></mwl-calendar-month-view>
                                <mwl-calendar-week-view *ngSwitchCase="CalendarView.Week" [viewDate]="viewDate"
                                    [events]="events" [refresh]="refresh"
                                    (eventClicked)="handleEvent('Clicked', $event.event)"
                                    (eventTimesChanged)="eventTimesChanged($event)" [hourSegments]="30"
                                    [dayStartHour]="8"
                                    [hourSegmentTemplate]="weekViewHourSegmentTemplate"></mwl-calendar-week-view>
                                <mwl-calendar-day-view *ngSwitchCase="CalendarView.Day" [viewDate]="viewDate"
                                    [events]="events" [refresh]="refresh"
                                    (eventClicked)="handleEvent('Clicked', $event.event)"
                                    (eventTimesChanged)="eventTimesChanged($event)"
                                    [hourSegments]="30"></mwl-calendar-day-view>
                            </div>
                            <ng-template #weekViewHourSegmentTemplate let-segment="segment" let-locale="locale"
                                let-segmentHeight="segmentHeight" let-isTimeLabel="isTimeLabel">
                                <div #segmentElement class="cal-hour-segment" [style.height.px]="segmentHeight"
                                    [class.cal-hour-start]="segment.isStart"
                                    [class.cal-after-hour-start]="!segment.isStart" [ngClass]="segment.cssClass"
                                    (mousedown)="startDragToCreate(segment, $event, segmentElement)"
                                    [ngClass]="{ 'cal-disabled-segment': !isTimeLabel && segment.date < now }">
                                    <div class="cal-time" *ngIf="isTimeLabel">
                                        {{ segment.date | date : 'hh:mm a' }}
                                    </div>
                                </div>
                            </ng-template>
                        </div>
                        <div style="width: 30%;">
                            <p class="info-header" style="height: 30px;">information</p>

                            <div class="layout-card-container" style="height: 60px;">
                                <div fxLayout="row wrap" fxFlex fxLayoutGap="4px">

                                    <div fxFlex="50%" fxFlex.xs="100%" fxFlex.sm="35%">
                                        <airmid-datepicker [formGroup]="myFilterform" [isRangePicker]="true"
                                            formStartControlName="fromDate" formEndControlName="enddate"
                                            [(fromValue)]="gridConfig.filters[0].fieldValue"
                                            [(toValue)]="gridConfig.filters[1].fieldValue">
                                        </airmid-datepicker>
                                    </div>

                                    <div class="action-button-container">
                                        <div class="button-row-group">
                                            <button class="btn btn-primary btn-with-icon btn-xs"
                                                (click)="searchRecords()">
                                                <span>Search</span>
                                                <span class="btn-icon">
                                                    <mat-icon>search</mat-icon>
                                                </span>
                                            </button>

                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div
                                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                                dynamicTableHeight>

                                <ng-template #actionButtonTemplate let-element>
                                    <div fxLayout="row" fxLayoutAlign="center center">
                                        <!-- <button mat-icon-button matTooltip="Edit" (click)="onnew(element)"
                                            [style.visibility]="!element.isCancel ? 'visible' : 'hidden'">
                                            <mat-icon>edit</mat-icon>
                                        </button> -->

                                        <button mat-icon-button matTooltip="Process Bill"
                                            (click)="onBillProcess(element)">
                                            <mat-icon>replay</mat-icon>
                                        </button>

                                        <!-- <button mat-icon-button matTooltip="Cancel" (click)="OnCancel(element)"
                                            [style.visibility]="!element.isCancel ? 'visible' : 'hidden'">
                                            <mat-icon> cancel </mat-icon>
                                        </button> -->

                                        <!-- <button mat-icon-button matTooltip="Print"
                                            [style.visibility]="!element.isCancel ? 'visible' : 'hidden'">
                                            <mat-icon>print</mat-icon>
                                        </button> -->
                                    </div>
                                </ng-template>

                                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

                                    <airmid-table [gridConfig]="gridConfig" #grid :ShowFilter="false"
                                        :ShowButtons="false">
                                    </airmid-table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
