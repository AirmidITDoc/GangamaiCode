<div class="modal-wrapper grid-container">
  <!-- Modal header -->
  <div class="modal-header accent">
    <div class="modal-header-content">
      <div class="modal-header-title">
        <span [@animate]="{ value: '*', params: { delay: '100ms', x: '-25px' } }">Report Dispatch</span>
      </div>
      <div class="modal-header-right">
        <div class="comman-date-container">

          <div class="close-icon">
            <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
              matTooltip="Close">
              <mat-icon>close</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Modal body -->

  <div fxLayout="column" class="gap-4">

    <div class="modal-card-container">
      <div class="patient-info-sales">

        <div class="patient-info-title border-bottom pb-1 mb-1">
          <span class="h1 m-0" style="line-height: normal;">Patient Information</span>
        </div>
        <div class="Ipd-patient-info w-100-p">
          <app-patient-information [uhidNo]="Personaldata?.labRequestNo" [doa]="Personaldata.regTime"
            [patientName]="Personaldata.patientName"
            [ageString]="(Personaldata.ageYear !== undefined ? Personaldata.ageYear + 'Y|' + Personaldata.ageMonth + 'M|' + Personaldata.ageDay + 'D | ' + Personaldata.genderName : '')"
            [refDocName]="Personaldata.doctorName" [patientType]="Personaldata.patientType"
            [companyName]="Personaldata.companyName">
          </app-patient-information>
        </div>
      </div>

    </div>
    <div class="modal-card-container">

      <div fxLayout="column" class="gap-4">

        <form [formGroup]="myReportform" style="border: blue">
          <div class="modal-body resize-form-fields">

            <input type="hidden" name="dispatchId" formControlName="dispatchId">

            <div fxLayout="column" fxLayout.gt-xs="row" fxLayoutGap="5px">
              <div fxFlex.gt-xs="40" fxFlex="100" class="table-left">
                <mat-card fxFlex.gt-sm="100%" fxFlex>
                  <div fxLayout="column" fxFlex>
                    <div fxLayout="row wrap" fxLayoutGap="5px 0px grid">

                      <div fxFlex="48%" fxFlex.sm="100%">
                        <airmid-dropdown label="Branch" formControlName="unitId" [formGroup]="myReportform"
                          [validations]="getValidationMessages().UnitId" [mode]="autocompleteModehospital"
                          (selectionChange)="getSelectedObjunit($event)">
                        </airmid-dropdown>
                      </div>

                      <div fxFlex="48%" fxFlex.sm="100%">
                        <airmid-dropdown label="Mode" formControlName="dispatchModeId" [formGroup]="myReportform"
                          [validations]="getValidationMessages().Mode" [mode]="autocompleteModedispatch"
                          (selectionChange)="getSelectedObjMode($event)">
                        </airmid-dropdown>
                      </div>
                    </div>
                    <div fxLayout="row wrap" fxLayoutGap="5px 0px grid">

                      <div fxFlex="96%" fxFlex.xs="100" fxFlex.sm="100%">
                        <airmid-textbox label="Remark" formControlName="comments" [formGroup]="myReportform"
                          [validations]="getValidationMessages().Remark" [maxLength]="500">
                        </airmid-textbox>
                      </div>
                    </div>
                    <div fxLayoutAlign="end">
                      <div class="modal-footer-buttons" fxLayout="row" fxLayoutGap="5px"
                        style="margin: 10px 5px 0px 5px; ">
                        <button class="btn btn-primary" (click)="onSubmit()">Save</button>
                      </div>
                    </div>
                  </div>
                </mat-card>

              </div>
              <div fxFlex.gt-xs="60" fxFlex="100" class="table-left">

                <!-- <mat-card fxFlex.gt-sm="100%" fxFlex>
                  <mat-card-content> -->

                <!-- <div fxLayout="row wrap" fxLayoutGap="5px 0px grid"> -->
                <mat-table matSort [dataSource]="dataSource" [@animateStagger]="{ value: '50' }" class="airmid-table">

                  <ng-container matColumnDef="CheckBox">
                    <th mat-header-cell *matHeaderCellDef>
                      <mat-checkbox (change)="masterToggle()" [checked]="isAllSelected()"
                        [indeterminate]="isSomeSelected()" [disabled]="areAllRowsDisabled()">
                      </mat-checkbox>
                    </th>

                    <td mat-cell *matCellDef="let contact">
                      <mat-checkbox (click)="$event.stopPropagation()"
                        (change)="$event ? selection.toggle(contact) : null" *ngIf="!contact.name else noMLC"
                        [checked]="selection.isSelected(contact)" [disabled]="isCheckboxDisabled(contact)">
                      </mat-checkbox>
                      <ng-template #noMLC>
                        <div
                          style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                          <span>----</span>
                        </div>
                      </ng-template>
                    </td>

                  </ng-container>

                  <ng-container matColumnDef="testname">
                    <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm>
                      TestName</mat-header-cell>
                    <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                      {{ contact.testName}}
                    </mat-cell>
                  </ng-container>

                  <ng-container matColumnDef="mode">
                    <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm>
                      Mode</mat-header-cell>
                    <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                      {{contact.name}}
                    </mat-cell>
                  </ng-container>

                  <ng-container matColumnDef="action" stickyEnd>
                    <mat-header-cell *matHeaderCellDef fxShow.gt-sm>
                      Actions
                    </mat-header-cell>
                    <mat-cell *matCellDef="let element">
                      <button mat-icon-button matTooltip="Print">
                        <mat-icon>print</mat-icon>
                      </button>

                      <button mat-icon-button
                        [matTooltip]="'We send the mail on your registered MailID : ' + element?.emailId"
                        matTooltipPosition="right" (click)="Onemail(element)"
                        (mouseenter)="openEmailDetailsPopover($event, element)"
                        (mouseleave)="closeEmailDetailsPopover()"
                        style="position: relative; cursor: pointer; text-decoration: underline; color: #667eea;">
                        <mat-icon>email</mat-icon>
                      </button>

                      <button mat-icon-button
                        [matTooltip]="'We send the message on your registered WhatsApp number: ' + element?.mobileNo"
                        matTooltipPosition="right" (click)="getWhatsappshareBill(element)"
                        (mouseenter)="openWhatsappDetailsPopover($event, element)"
                        (mouseleave)="closeWhatsappDetailsPopover()"
                        style="position: relative; cursor: pointer; text-decoration: underline; color: #667eea;">
                        <img width="20" height="20" src="assets/images/logos/WhatsApp.png">
                      </button>
                    </mat-cell>
                  </ng-container>

                  <ng-container matColumnDef="loading">
                    <mat-footer-cell *matFooterCellDef colspan="6">loading data...</mat-footer-cell>
                  </ng-container>

                  <ng-container matColumnDef="noData">
                    <mat-footer-cell *matFooterCellDef colspan="6">
                      <mat-spinner *ngIf="isLoadingStr == 'loading'" [diameter]="30"></mat-spinner>
                      <span *ngIf="isLoadingStr == 'no-data'">No data found...</span>
                    </mat-footer-cell>
                  </ng-container>

                  <mat-header-row class="accent min-width-800" style="height: 40px;"
                    *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
                  <mat-row *matRowDef="let row; columns: displayedColumns" class="element min-width-800"
                    style="height: 40px;" [@animate]="{ value: '*', params: { y: '100%' } }"></mat-row>
                </mat-table>
                <!-- </div> -->

                <!-- </mat-card-content>
                </mat-card> -->
              </div>
            </div>
          </div>
        </form>

      </div>

    </div>

    <div class="modal-card-container">
      <div>
        <span style="font-size: large;font-weight: bolder;color: rgb(17, 65, 118);padding-left: 20px;">History</span>
      </div>
      <div style="overflow:auto; height: 450px;">
        <airmid-table [gridConfig]="gridConfigReportdispatch" #ReportGrid [ShowFilter]="false" [ShowButtons]="false">

        </airmid-table>
      </div>

    </div>
  </div>





</div>
