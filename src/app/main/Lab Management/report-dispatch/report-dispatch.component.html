<div class="modal-wrapper grid-container" dynamicTableHeight>
  <!-- Modal header -->
  <div class="modal-header accent">
    <div class="modal-header-content">
      <div class="modal-header-title">
        <span [@animate]="{ value: '*', params: { delay: '100ms', x: '-25px' } }">Report Dispatch</span>
      </div>
      <div class="modal-header-right">
        <div class="comman-date-container">

          <div class="close-icon">
            <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
              matTooltip="Close">
              <mat-icon>close</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Modal body -->

  <div fxLayout="column" class="gap-4">

    <div class="modal-card-container">
      <div class="patient-info-sales">

        <div class="patient-info-title border-bottom pb-1 mb-1">
          <span class="h1 m-0" style="line-height: normal;">Patient Information</span>
        </div>
        <div class="Ipd-patient-info w-100-p">
          <app-patient-information [uhidNo]="Personaldata?.labRequestNo" [doa]="Personaldata.regTime"
            [patientName]="Personaldata.patientName"
            [ageString]="(Personaldata.ageYear !== undefined ? Personaldata.ageYear + 'Y|' + Personaldata.ageMonth + 'M|' + Personaldata.ageDay + 'D | ' + Personaldata.genderName : '')"
            [refDocName]="Personaldata.doctorName" [patientType]="Personaldata.patientType"
            [companyName]="Personaldata.companyName">
          </app-patient-information>
        </div>
      </div>


      <div class="container">
        <mat-card style="padding: 20px;">
          <div class="row">

            <div class="section">
              <div style="padding-left: 40px;">
                <mat-icon title="Branch" style="background-color: rgb(69, 181, 16);">
                  <img width="90px" height="90px" src="assets/images/logos/flagon.jpg">
                </mat-icon>
                <span style="font-size: large;font-weight: bold;color: rgb(7, 67, 107);">Dispatch At : -
                  {{UnitId}}</span>

                <span style="padding-left: 500px;"><mat-icon title="Due Amount">
                    <img width="90px" height="90px" src="assets/images/logos/dueamt.png">
                  </mat-icon>
                  <span style="font-size: large;font-weight: bold;color: rgb(7, 67, 107);">Due Amount : -
                    {{DueAmt}}</span></span>
              </div>


            </div>

          </div>
        </mat-card>
      </div>

    </div>
    <div class="modal-card-container">

      <div fxLayout="column" class="gap-4">

        <form [formGroup]="myReportform" style="border: blue">
          <div class="modal-body resize-form-fields">

            <input type="hidden" name="dispatchId" formControlName="dispatchId">

            <div fxLayout="column" fxLayout.gt-xs="row" fxLayoutGap="5px">
              <div fxFlex.gt-xs="60" fxFlex="100" class="table-left">
                <mat-card fxFlex.gt-sm="100%" fxFlex>
                  <div fxLayout="column" fxFlex>
                    <div fxLayout="row wrap" fxLayoutGap="5px 0px grid">

                      <div fxFlex="48%" fxFlex.sm="100%">
                        <airmid-dropdown label="Branch" formControlName="unitId" [formGroup]="myReportform"
                          [validations]="getValidationMessages().UnitId" [mode]="autocompleteModehospital"
                          (selectionChange)="getSelectedObjunit($event)">
                        </airmid-dropdown>
                      </div>

                      <div fxFlex="48%" fxFlex.sm="100%">
                        <airmid-dropdown label="Mode" formControlName="dispatchModeId" [formGroup]="myReportform"
                          [validations]="getValidationMessages().Mode" [mode]="autocompleteModedispatch"
                          (selectionChange)="getSelectedObjMode($event)">
                        </airmid-dropdown>
                      </div>
                    </div>
                    <div fxLayout="row wrap" fxLayoutGap="5px 0px grid">

                      <div fxFlex="96%" fxFlex.xs="100" fxFlex.sm="100%">
                        <airmid-textbox label="Remark" formControlName="comments" [formGroup]="myReportform"
                          [validations]="getValidationMessages().Remark" [maxLength]="500">
                        </airmid-textbox>
                      </div>
                    </div>
                    <div fxLayoutAlign="end">
                      <div class="modal-footer-buttons" fxLayout="row" fxLayoutGap="5px"
                        style="margin: 10px 5px 0px 5px; ">
                        <button class="btn btn-danger-outline" (click)="onClose()">Close</button>
                        <button class="btn btn-primary" (click)="onSubmit()">Save</button>
                      </div>
                    </div>
                  </div>
                </mat-card>

              </div>
              <div fxFlex.gt-xs="40" fxFlex="100" class="table-left">

                <mat-card fxFlex.gt-sm="100%" fxFlex>
                  <mat-card-content>

                    <div fxLayout="row wrap" fxLayoutGap="5px 0px grid">
                      <div fxLayout="column" fxFlex>


                        <!-- <mat-checkbox aria-label="Service Name" formControlName="Service">
                          
                          </mat-checkbox> -->
                        <mat-icon title="Branch">
                          <img width="90px" height="90px" src="assets/images/logos/serviceicon.png">
                        </mat-icon> Service Name
                        <div style="height: 100px; overflow:auto;">
                          <!-- <airmid-table [gridConfig]="gridConfig" #EBillGrid :ShowFilter="false"
                                :ShowButtons="false">
                              </airmid-table> -->
                        </div>

                      </div>
                    </div>

                  </mat-card-content>
                </mat-card>
              </div>
            </div>
          </div>
        </form>

      </div>

    </div>

    <div class="modal-card-container">
      <div>
        <span style="font-size: large;font-weight: bolder;color: rgb(17, 65, 118);padding-left: 20px;">History</span>
      </div>
      <!-- style="height: 200px; overflow:auto;"? -->
      <div style="overflow:auto;">
        <airmid-table [gridConfig]="gridConfigReportdispatch" #ReportGrid [ShowFilter]="false" [ShowButtons]="false">

        </airmid-table>
      </div>

    </div>
  </div>





</div>
