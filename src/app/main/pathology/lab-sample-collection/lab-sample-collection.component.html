<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" style="height: 100%;" fusePerfectScrollbar
    dynamicTableHeight>
    <mat-toolbar class="top-header accent">
        <div fxLayout="row" fxLayoutAlign="start center" class="top-header-info">
            <button mat-icon-button class="sidebar-toggle ">
                <mat-icon>menu</mat-icon>
            </button>
            <mat-icon class="logo-icon" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}">account_box
            </mat-icon>
            <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                Lab Sample Collection List
            </span>
        </div>

    </mat-toolbar>

    <div fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="space-between center"
        class="px-12 py-4 border-bottom gap-8">

        <div class="info-badge-top overflow-auto" fxLayout="row" fxLayoutAlign="space-between" flex>

            <div class="dashboard-card registrations">
                <div class="card-label">Total Sample</div>
                <div class="card-value">{{Vtotalcount}}</div>
                <mat-icon class="card-icon">person_add</mat-icon>
            </div>

            <div class="dashboard-card appointments">
                <div class="card-label">Completed</div>
                <div class="card-value">{{VCompletedcount}}</div>
                <mat-icon class="card-icon">event</mat-icon>
            </div>

            <div class="dashboard-card appointments-split">
                <div class="card-label">Pending</div>
                <div class="card-value">
                    <div> {{Vpendingcount}}</div>

                </div>
                <mat-icon class="card-icon">group</mat-icon>
            </div>
        </div>

    </div>
    <div fusePerfectScrollbar
        class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
        dynamicTableHeight>

        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

            <ng-template #iconisCompeleted let-element>
                <div fxLayout="column" fxLayoutAlign="center center" class="status-box">
                    <span [ngClass]="{
                            'status-completed': element.isSampleCollection == 'True',
                            'status-pending': element.isSampleCollection == 'False'
                        }">
                        {{ element.isSampleCollection == 'True' ? 'Completed' : 'Pending' }}
                    </span>
                </div>
            </ng-template>

            <ng-template #actionButtonTemplate let-element>
                <!-- *ngIf="element.isSampleCollection?.toString().trim() === 'False'" -->
                <div fxLayout="row" fxLayoutAlign="center center">
                    <button mat-icon-button (click)="onSave(element)" matTooltip="Edit" *ngIf="IsEdit">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button matTooltip="Patient Details Sticker" (click)="OnPrintPatientIcard(element)">
                        <mat-icon>pages</mat-icon>
                    </button>
                </div>
            </ng-template>

            <ng-template #statusbtnTemplate let-element>
                <div fxLayout="row" fxLayoutAlign="center center" class="gap-8">

                    <div fxLayout="row" fxLayoutAlign="center center">
                        <mat-icon *ngIf="!element.companyName" matTooltip="Patient Category Self">account_box
                        </mat-icon>

                        <mat-icon *ngIf="element.companyName" matTooltip="Patient Category Company">business
                        </mat-icon>
                    </div>

                    <div fxLayout="row" fxLayoutAlign="center center">
                        <mat-icon *ngIf="element.isSampleCollection == 'True'" title="Sample Collected"
                            style="background-color: rgb(69, 181, 16);">
                            <img width="50px" height="50px" src="assets/images/logos/samplecoll1.png">
                        </mat-icon>

                        <mat-icon *ngIf="element.isSampleCollection !== 'True'" title="Sample Not Collected"
                            style="background-color: rgb(232, 127, 52);">
                            <img width="50px" height="50px" src="assets/images/logos/samplenotcoll.jpg">
                        </mat-icon>
                    </div>
                </div>
            </ng-template>

            <ng-template #actionButtonTemplate1 let-element>

                <div fxLayout="row" fxLayoutAlign="center center">
                    <button mat-icon-button matTooltip="Patient Details Sticker" (click)="OnPrintPatientIcard(element)">
                        <mat-icon>pages</mat-icon>
                    </button>
                </div>
            </ng-template>


            <airmid-table [gridConfig]="gridConfig" class="content" :ShowButtons="false"
                (onSelectRow)="getSelectedRow($event)">
                <ng-container filters>
                    <form [formGroup]="myformSearch">
                        <airmid-datepicker [formGroup]="myformSearch" [isRangePicker]="true"
                            formStartControlName="start" formEndControlName="end"
                            [(fromValue)]="gridConfig.filters[3].fieldValue"
                            [(toValue)]="gridConfig.filters[4].fieldValue">
                        </airmid-datepicker>

                        <mat-form-field appearance="outline">
                            <mat-label>UHID</mat-label>
                            <input matInput placeholder="Search UHID" autocomplete="off" [formGroup]="myformSearch"
                                formControlName="RegNo" (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('RegNo')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <mat-form-field appearance="outline">
                            <mat-label>First Name</mat-label>
                            <input matInput placeholder="Search First Name" autocomplete="off"
                                [formGroup]="myformSearch" formControlName="FirstName" (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('FirstName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <mat-form-field appearance="outline">
                            <mat-label>Last Name</mat-label>
                            <input matInput placeholder="Search Last Name" autocomplete="off" [formGroup]="myformSearch"
                                formControlName="LastName" (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('LastName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <div fxLayout="column" fxLayoutAlign="start start">
                            <!-- <div fxFlex fxLayout="row">
                                <mat-radio-group name="Istype" fxLayout="row" [formGroup]="myformSearch"
                                    formControlName="PatientTypeSearch" (change)="onChangeFirst()" style="padding: 6px;"
                                    class="gap-4">
                                    <mat-label>Type:</mat-label>
                                    <div fxLayout="row">
                                        <mat-radio-button value='5'>All</mat-radio-button>
                                        <mat-radio-button value='1'>IP</mat-radio-button>
                                        <mat-radio-button value='0'>OP</mat-radio-button>
                                        <mat-radio-button value='2'>LAB</mat-radio-button>
                                    </div>
                                </mat-radio-group>
                            </div> -->

                            <div fxFlex fxLayout="row">
                                <mat-radio-group name="StatusSearch" fxLayout="row" [formGroup]="myformSearch"
                                    formControlName="StatusSearch" (change)="onChangeFirst()" style="padding: 6px;"
                                    class="gap-4">
                                    <mat-label>Status:</mat-label>
                                    <div fxLayout="row">
                                        <mat-radio-button value='0'>Pending</mat-radio-button>
                                        <mat-radio-button value='1'>Completed</mat-radio-button>
                                    </div>
                                </mat-radio-group>
                            </div>
                        </div>
                    </form>

                </ng-container>
            </airmid-table>
        </div>

        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll" *ngIf="isShowDetailTable">
            <!-- <div style="padding: 10px; height: 30px; margin-bottom: 10px;">
                <div fxLayout="row wrap" fxLayoutAlign="space-between center">
                    <div class="table-header-title" style="padding: 10px;">
                        <span class="h3 font-weight-600">Test Details</span>
                    </div>
                </div>
            </div> -->
            <airmid-table [gridConfig]="gridConfig1" class="content" #grid1 :ShowFilter="false">
            </airmid-table>
        </div>
    </div>
</div>
