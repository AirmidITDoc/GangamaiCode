<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" fusePerfectScrollbar dynamicTableHeight>


    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Lab Patient Registration List
                </span>
            </div>
        </div>
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onnew()">+ Add New
            </button>

            <button mat-raised-button (click)="Onmessage()">+ Add Estimate
            </button>
        </div>
    </div>
    <ng-template #actionsTemplate2 let-element>
        <div>
            <mat-icon title="Bill Cancelled" *ngIf="element.isCancelled==1" [disabled]="element.disabled"
                class="disabled-icon">
                close</mat-icon>
        </div>
    </ng-template>

    <!-- <ng-template #ColorCode let-element>
        <div fxLayout="row" fxLayoutAlign="center center" class="status-box">
            <span [ngClass]="{
                'status-completed': element.paidAmt>0,
                'status-pending': element.balanceAmt =0
                        }">
                {{ element.paidAmt ? 'Completed' : 'Pending' }}
            </span>
        </div>
    </ng-template> -->
    <ng-template #ColorCode let-element>
        <div fxLayout="column" fxLayoutAlign="center center" class="status-box">
            <span [ngClass]="{
                    'status-completed': element.paidAmt > 0,
                    'status-pending': element.paidAmt == 0
                }">
                {{ element.paidAmt > 0 ? 'Paid' : 'Pending' }}
            </span>
        </div>
    </ng-template>

    <ng-template #patientNameWithBadgeTemplate let-element>
        <!-- Patient Name with Token Badge and Hover Popover -->
        <span [matBadge]="element.tokenNo" matBadgeColor="warn" matBadgePosition="after" matBadgeOverlap="false"
            matBadgeSize="small" [matBadgeHidden]="!element.tokenNo"
            (mouseenter)="openPatientDetailsPopover($event, element)" (mouseleave)="closePatientDetailsPopover()"
            style="font-size: 14px; line-height: 18px; position: relative; top: 4px; cursor: pointer; text-decoration: underline; color: #667eea;">
            {{ element.patientName }}
        </span>
    </ng-template>

    <ng-template #doctorNameWithPopoverTemplate let-element>
        <!-- Doctor Name with Hover Popover -->
        <span (mouseenter)="openDoctorDetailsPopover($event, element)" (mouseleave)="closeDoctorDetailsPopover()"
            style="font-size: 14px; line-height: 18px; cursor: pointer; text-decoration: underline; color: #4CAF50;">
            {{ element.doctorName }}
        </span>
    </ng-template>

    <ng-template #actionsTemplate4 let-element>
        <div>

            <button mat-icon-button (click)="openPaymentpopup(element)" matTooltip="Settlement"
                *ngIf="element.balanceAmt!='0'" style="color: #9c27b0;">
                <mat-icon title="Settlement" *ngIf="element.balanceAmt!=0" class="disabled-icon">receipt</mat-icon>
                <mat-icon title="paid" *ngIf="element.balanceAmt==0" [disabled]="element.disabled"
                    class="disabled-icon">payment</mat-icon>
            </button>
        </div>
    </ng-template>

    <ng-template #actionButtonTemplate let-element>
        <div fxLayout="row" fxLayoutAlign="center center">
            <button mat-icon-button matTooltip="Edit Registration" (click)="OnEditRegistration(element)">
                <mat-icon>edit</mat-icon>
            </button>

            <mat-icon (click)="billdetail(element)" matTooltip="Bill Detail">
                remove_red_eye
            </mat-icon>

            <airmid-fileupload-icon [refId]="element.labPatientId" [refType]="page" [multiple]="true"
                [title]="element.patientName + ' Document'"></airmid-fileupload-icon>

            <mat-icon matTooltip="Refund">
                replay
            </mat-icon>

            <mat-icon matTooltip="Discount">
                local_offer
            </mat-icon>

            <button mat-icon-button matTooltip="Print" (click)="viewgetOPBillReportPdf(element)">
                <mat-icon>print</mat-icon>
            </button>

            <!-- <button mat-icon-button matTooltip="EMail" (click)="Onemail(element)">
                <mat-icon>email</mat-icon>
            </button> -->

            <!-- <button *ngIf="true" mat-icon-button matTooltip="Message" (click)="Onmessage(element,m)">
                <mat-icon>message</mat-icon>
            </button> -->

            <!-- <button mat-icon-button matTooltip="Send message On WhatsApp" (click)="getWhatsappshareBill(element)">
                <img width="100" height="20px" src="assets/images/logos/WhatsApp.png">
            </button> -->
        </div>
    </ng-template>

    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

        <ng-template #actionsTemplate4 let-element>
            <div>

                <button mat-icon-button (click)="openPaymentpopup(element)" matTooltip="Settlement"
                    *ngIf="element.balanceAmt!='0'">
                    <mat-icon title="Settlement" *ngIf="element.balanceAmt!=0" class="disabled-icon">receipt</mat-icon>
                    <mat-icon title="paid" *ngIf="element.balanceAmt==0" [disabled]="element.disabled"
                        class="disabled-icon">payment</mat-icon>
                </button>
            </div>
        </ng-template>


        <ng-template #after24Hr let-element>
            <div fxLayout="row" fxLayoutAlign="center center">
                <mat-icon style="border-radius:100% ;" *ngIf="element.isAfter24Hrs==1" matTooltip="24hrs Completed">
                    <img width="20px" height="20px" src="assets/images/logos/alarm.png">
                </mat-icon>
            </div>
        </ng-template>

        <airmid-table [gridConfig]="gridConfig" class="content">
            <ng-container filters>
                <form [formGroup]="myFilterform">

                    <div fxLayout="column" fxLayoutAlign="start none">

                        <mat-form-field appearance="outline">
                            <mat-label>Enter a date range</mat-label>
                            <mat-date-range-input [rangePicker]="picker">
                                <input matStartDate formControlName="fromDate" placeholder="Start date"
                                    (dateChange)="onChangeFirst()">
                                <input matEndDate formControlName="enddate" placeholder="End date"
                                    (dateChange)="onChangeFirst()">
                            </mat-date-range-input>
                            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                            <mat-date-range-picker #picker></mat-date-range-picker>
                        </mat-form-field>

                        <mat-form-field appearance="outline">
                            <mat-label>FirstName</mat-label>
                            <input matInput placeholder="FirstName" autocomplete="off" [formGroup]="myFilterform"
                                formControlName="FirstName" (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('FirstName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <mat-form-field appearance="outline">
                            <mat-label>LastName</mat-label>
                            <input matInput placeholder="LastName" autocomplete="off" [formGroup]="myFilterform"
                                formControlName="LastName" (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('LastName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <mat-form-field appearance="outline">
                            <mat-label>PBillNo</mat-label>
                            <input matInput placeholder="Search PBillNo" autocomplete="off" [formGroup]="myFilterform"
                                formControlName="PBillNo" (keypress)="keyPressAlphanumeric($event)"
                                (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)=" Clearfilter('PBillNo')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <airmid-dropdown label="Select Doctor Name" formControlName="DoctorID"
                            [(ngModel)]="gridConfig.filters[5].fieldValue" [formGroup]="myFilterform"
                            (selectionChange)="ListView($event)" (keyup)="ListView($event)"
                            [mode]="autocompleteModedoctor">
                        </airmid-dropdown>

                        <airmid-dropdown label="Unit Name" formControlName="UnitId"
                            [(ngModel)]="gridConfig.filters[6].fieldValue" (selectionChange)="ListView1($event)"
                            [formGroup]="myFilterform" [mode]="autocompleteModeunit"></airmid-dropdown>

                    </div>

                </form>
            </ng-container>
        </airmid-table>
    </div>
</div>
