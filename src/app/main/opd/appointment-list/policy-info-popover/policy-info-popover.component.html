<div class="policy-info-popover-container">
  <div class="popover-header">
    <h3>Policy Information</h3>
  </div>

  <div class="popover-body">
    <!-- Policy Information Form -->
    <form [formGroup]="policyFormGroup" class="policy-form">
      <div class="form-row">
        <div fxFlex="50%" fxFlex.xs="100%" fxFlex.sm="33%">
          <airmid-textbox label="Policy No / Member No" formControlName="policyNo" [formGroup]="policyFormGroup"
            [maxLength]="15"></airmid-textbox>
        </div>

        <mat-form-field appearance="outline" fxFlex>
          <mat-label>Valid Date</mat-label>
          <input matInput [matDatepicker]="picker1" formControlName="policyValidateDate"
            [value]="registerObj.policyValidateDate ?? '1900-01-01'" (dateChange)="onValidDateChange($event)">
          <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
          <mat-datepicker #picker1></mat-datepicker>
        </mat-form-field>
      </div>

      <div class="form-row">
        <div fxFlex="100%" fxFlex.xs="100%" fxFlex.sm="33%">
          <airmid-textbox label="Policy Limit" formControlName="approvedAmount" [formGroup]="policyFormGroup"
            [maxLength]="15"></airmid-textbox>
        </div>

        <button mat-raised-button color="primary" (click)="CompanyInfoSave()" class="save-btn">
          Save
        </button>
      </div>
    </form>

    <!-- Policy History -->
    <div class="history-section">
      <h4>Policy History</h4>
      <div class="page-layout simple left-sidebar inner-sidebar inner-scroll">
        <airmid-table [gridConfig]="gridConfig" #grid [ShowFilter]="false" [ShowButtons]="false">
        </airmid-table>
      </div>
