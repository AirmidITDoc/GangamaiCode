<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" style="height: 100%;" fusePerfectScrollbar
    dynamicTableHeight>

    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">

        <mat-tab label="OP Advance">
            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>
                <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
                    fxLayoutAlign.gt-xs="space-between center ">
                    <div class="top-header-info">
                        <div class="top-header-title">
                            <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                                OP Advance List
                            </span>
                        </div>
                    </div>

                    <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
                        <button mat-raised-button (click)="onNew1()">New Advance
                        </button>
                    </div>
                </div>

                <div class="content">
                    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
  <airmid-table [gridConfig]="gridConfig" class="content" #ipBrowse>
                        <ng-container filters>
                            <form [formGroup]="_BrowseIpAdvanceService.UserFormGroup">
                                <airmid-datepicker [formGroup]="_BrowseIpAdvanceService.UserFormGroup"
                                    [isRangePicker]="true" formStartControlName="fromDate" formEndControlName="enddate"
                                    [(fromValue)]="gridConfig.filters[2].fieldValue"
                                    [(toValue)]="gridConfig.filters[3].fieldValue"></airmid-datepicker>

                                <!-- <mat-form-field appearance="outline" fxFlex>
                                    <mat-label>Advance No</mat-label>
                                    <input matInput placeholder="Search Advance No" autocomplete="off"
                                        [(ngModel)]="gridConfig.filters[5].fieldValue" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)="gridConfig.filters[5].fieldValue='0'">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field> -->

                                <mat-form-field appearance="outline">
                                    <mat-label>Advance No</mat-label>
                                    <input matInput placeholder="Search Advance No" autocomplete="off"
                                        [formGroup]="_BrowseIpAdvanceService.UserFormGroup" formControlName="PBillNo"
                                        (input)="onChangeAdvance()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterAdvance('PBillNo')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <!-- <mat-form-field appearance="outline" fxFlex>
                                    <mat-label>Registration No</mat-label>
                                    <input matInput placeholder="Search Registration No" autocomplete="off"
                                        [(ngModel)]="gridConfig.filters[4].fieldValue" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)="gridConfig.filters[4].fieldValue='0'">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field> -->

                                <mat-form-field appearance="outline">
                                    <mat-label>UHID</mat-label>
                                    <input matInput placeholder="Search UHID" autocomplete="off"
                                        [formGroup]="_BrowseIpAdvanceService.UserFormGroup" formControlName="RegNo"
                                        (input)="onChangeAdvance()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterAdvance('RegNo')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">
                                    <mat-label>First Name</mat-label>
                                    <input matInput placeholder="Search First Name" autocomplete="off"
                                        [formGroup]="_BrowseIpAdvanceService.UserFormGroup" formControlName="FirstName"
                                        (input)="onChangeAdvance()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterAdvance('FirstName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">
                                    <mat-label>Last Name</mat-label>
                                    <input matInput placeholder="Search Last Name" autocomplete="off"
                                        [formGroup]="_BrowseIpAdvanceService.UserFormGroup" formControlName="LastName"
                                        (input)="onChangeAdvance()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterAdvance('LastName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                             
                            </form>
                        </ng-container>
                    </airmid-table>
                    </div>
                </div>

            </div>
        </mat-tab>

        <mat-tab label="OP Refund Of Advance">

                </div>

                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">

                                    <input matInput placeholder="Search Last Name" autocomplete="off"
                                        [formGroup]="_BrowseIpAdvanceService.AdvanceOfRefund" formControlName="LastName"
                                        (input)="onChangeAdvanceOfRefund()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterAdvanceOfRefund('LastName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <button matSuffix mat-icon-button aria-label="Clear"

                            <mat-form-field appearance="outline" fxFlex>

                                <input matInput placeholder="Search First Name" autocomplete="off"

                                <button matSuffix mat-icon-button aria-label="Clear"
                                    (click)="gridConfig1.filters[0].fieldValue='%'">
                                    <mat-icon>close</mat-icon>
                                </button>
                            </mat-form-field>

                            <mat-form-field appearance="outline" fxFlex>
                                <mat-label>Last Name</mat-label>
                                <input matInput placeholder="Search Last Name" autocomplete="off"
                                    [(ngModel)]="gridConfig1.filters[1].fieldValue" />
                                <button matSuffix mat-icon-button aria-label="Clear"
                                    (click)="gridConfig1.filters[1].fieldValue='%'">
                                    <mat-icon>close</mat-icon>
                                </button>
                            </mat-form-field>                             -->
                            </form>
                        </ng-container>
                    </airmid-table>
                    </div>
                </div>

            </div>
        </mat-tab>

    </mat-tab-group>
</div>
