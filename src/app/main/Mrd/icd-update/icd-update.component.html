<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Patient ICD Code
                </span>
            </div>
        </div>
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button>Add ICD Code
            </button>
        </div>
    </div>

    <div class="modal-body" fusePerfectScrollbar>
        <div class="modal-body-container">
            <form [formGroup]="IcdUpdateForm">
                <mat-card style="padding: 10px;">
                    <div fxLayout="row wrap" fxLayoutGap="10px" fxLayoutAlign="start center">
                        <mat-radio-group formControlName="opIpType">
                            <mat-radio-button [value]="true">IP</mat-radio-button>
                        </mat-radio-group>

                        <airmid-autocomplete lbl="RgId" [formGroup]="IcdUpdateForm" formControlName="opIpId"
                            placeholderText="IP-RegNo/FirstName/LastName" fxFlex="50%" [disabled]="IpFilterDisable"
                            label="Search Reg No / Patient Name / Mobile No" ApiUrl="Admission/search-patient?Keyword="
                            (selectionChange)="getSelectedObjIP($event)" ValueField="admissionID"
                            TextField="formattedText">
                        </airmid-autocomplete>
                    </div>
                </mat-card>
                <div class="modal-card-container mt-8">
                    <div fxFlex.gt-sm="100%" fxFlex>
                        <mat-card fxFlex.gt-sm="100%" fxFlex style="padding: 2px 10px;">
                            <div class="patient-info-sales">
                                <div class="patient-info-title border-bottom pb-1 mb-1">
                                    <span class="h1 m-0" style="line-height: normal;">Patient Information</span>
                                </div>
                                <div class="Ipd-patient-info w-100-p">
                                    <app-patient-information>
                                    </app-patient-information>
                                </div>
                            </div>
                        </mat-card>
                    </div>
                </div>
            </form>
        </div>

        <!-- icd list -->
        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

            <!-- <ng-template #actionButtonTemplate let-element>
                <div fxLayout="row" fxLayoutAlign="center center">

                    <button mat-icon-button matTooltip="Edit Item" (click)="onSave(element)">
                        <mat-icon> edit</mat-icon>
                    </button>


                    <button mat-icon-button matTooltip="Delete" (click)="delitem(element)">
                        <mat-icon>delete</mat-icon>
                    </button>


                </div>
            </ng-template> -->

            <airmid-table [gridConfig]="gridConfig" class="content">
                <ng-container filters>
                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>Diagnosis Name</mat-label>
                        <input matInput placeholder="Search Diagnosis  Name" autocomplete="off"
                            [(ngModel)]="gridConfig.filters[0].fieldValue" />
                        <button matSuffix mat-icon-button aria-label="Clear"
                            (click)="gridConfig.filters[0].fieldValue=''">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>

                </ng-container>
            </airmid-table>
        </div>
    </div>
</div>
