<div class="modal-wrapper grid-container icd-dialog">

    <!-- Header -->
    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{ value: '*', params: { delay: '100ms', x: '-25px' } }">Add ICD Code</span>
            </div>
            <div class="modal-header-right">
                <div class="close-icon">
                    <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                        matTooltip="Close">
                        <mat-icon>close</mat-icon>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Body -->
    <div class="modal-body" fusePerfectScrollbar>
        <div fxLayout="column" class="icd-body gap-8 p-6">

            <!-- Patient search -->
            <mat-card class="icd-card search-card input-error-hidden" *ngIf="ustatus">
                <form [formGroup]="searchFormGroup" fxLayout="row" fxLayoutAlign="start center" fxLayout.xs="column"
                    class="gap-8">

                    <mat-radio-group aria-label="Select patient type" formControlName="opIpType"
                        [(ngModel)]="vSelectedOption" name="paymode" (change)="onChangePatientType($event)"
                        fxLayout="row">
                        <mat-radio-button value="0">OP</mat-radio-button>
                        <mat-radio-button value="1">IP</mat-radio-button>
                    </mat-radio-group>

                    <div class="search-field" fxFlex *ngIf="searchFormGroup.get('opIpType').value != '1'">
                        <airmid-autocomplete label="OP-RegNo / First Name / Last Name / Mobile No"
                            placeholderText="OP-RegNo / First Name / Last Name / Mobile No"
                            [formGroup]="searchFormGroup" formControlName="regId"
                            ApiUrl="VisitDetail/search-patient-1?Keyword=" ValueField="regId" TextField="formattedText"
                            (selectionChange)="getSelectedObjOP($event)">
                        </airmid-autocomplete>
                    </div>

                    <div class="search-field" fxFlex *ngIf="searchFormGroup.get('opIpType').value != '0'">
                        <airmid-autocomplete label="IP RegNo / First Name / Last Name / Mobile No"
                            placeholderText="IP RegNo / First Name / Last Name / Mobile No"
                            [formGroup]="searchFormGroup" formControlName="regId"
                            ApiUrl="Admission/Dischargesearch-patient?Keyword=" ValueField="regId"
                            TextField="formattedText" (selectionChange)="getSelectedObj($event)">
                        </airmid-autocomplete>
                    </div>
                </form>
            </mat-card>

            <!-- Patient information -->
            <mat-card class="icd-card patient-card">
                <div class="section-title border-bottom">Patient Information</div>
                <app-patient-information class="w-100-p" [uhidNo]="registerObj?.regNo" [patientName]="PatientName"
                    [doctorName]="registerObj?.doctorName || (DoctorNamecheck ? DoctorName : '')"
                    [departmentName]="registerObj?.departmentName" [doa]="registerObj?.admissionDate"
                    [ipdNo]="registerObj?.ipdNo || registerObj?.ipdno || (IPDNocheck ? IPDNo : (OPDNoCheck ? OPDNo : ''))"
                    [ageString]="registerObj?.age != null ? registerObj.age + 'Y' : (Patientdetails?.ageYear || '')"
                    [refDocName]="registerObj?.refDocName"
                    [wardBedName]="(registerObj?.roomName && registerObj?.bedName) ? (registerObj.roomName + ' | ' + registerObj.bedName) : ''"
                    [patientType]="registerObj?.patientType" [tariffName]="registerObj?.tariffName"
                    [companyName]="registerObj?.companyName">
                </app-patient-information>
            </mat-card>

            <!-- Provisional diagnosis -->
            <mat-card class="icd-card diagnosis-card">
                <div class="section-title">Provisional Diagnosis Details</div>
            </mat-card>

            <!-- Main diagnosis -->
            <mat-card class="icd-card diagnosis-card">
                <form [formGroup]="IcdUpdateForm">
                    <div class="section-title">Main Diagnosis Details</div>
                    <app-airmid-diagnos-chipautocomplete class="w-100-p"
                        [chips]="IcdUpdateForm.get('PatientDignosisMaster')?.value"
                        [apiUrl]="'MIcdDiagnosisMaster/search_MIcdDiagnosisMaster?Keyword='"
                        [displayKey]="'icdCodeWithDignosis'" [allowCustom]="true"
                        (chipsChange)="selectChangeDiagnosis($event)">
                    </app-airmid-diagnos-chipautocomplete>
                </form>
            </mat-card>

        </div>
    </div>

   
    <div class="modal-footer">
        <div class="footer-navigation-container">
            <div class="modal-footer-buttons">
                <form [formGroup]="IcdUpdateForm">
                    <div formGroupName="mrdDiagnosisInfoHeader">
                        <app-airmid-slider label="Synchronize" formControlName="isSync"></app-airmid-slider>
                    </div>
                </form>

                <button type="button" class="btn btn-danger-outline" (click)="onClose(false)">Close</button>
                <button type="button" class="btn btn-primary" (click)="onSubmit()">Save</button>
            </div>
        </div>
    </div>

</div>
