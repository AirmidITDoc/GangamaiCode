<div class="modal-wrapper grid-container labpatientMain resize-form-fields">
    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{ value: '*', params: { delay: '100ms', x: '-25px' } }">
                    ICDE Update Form
                </span>
            </div>
            <div class="modal-header-right">
                <div class="close-icon">
                    <button mat-icon-button tabIndex="-1" (click)="onClose(false)" matTooltip="Close">
                        <mat-icon>close</mat-icon>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-body" fusePerfectScrollbar>
        <div fxLayout="column" fxLayoutGap="16px" class="p-12">

            <mat-card class="p-8">
                <form [formGroup]="searchFormGroup" fxLayout="column" fxLayoutGap="8px">

                    <div fxLayout="row" fxLayoutGap="8px">
                        <div fxFlex="50" fxFlex.sm="100" fxFlex.xs="100">
                            <airmid-autocomplete lbl="RegID" [formGroup]="searchFormGroup"
                                label="Search UHID / Patient Name / Mobile No(DC)" formControlName="RegId" fxFlex
                                placeholderText="UHID / First Name / Last Name / Mobile No(DC)"
                                ApiUrl="Admission/Dischargesearch-patient?Keyword="
                                (selectionChange)="getSelectedObj($event)" TextField="formattedText" ValueField="regId">
                            </airmid-autocomplete>
                        </div>
                    </div>


                    <mat-card class="patient-info-card" style="padding: 8px 12px;">
                        <div class="patient-info-sales">
                            <div class="patient-info-title border-bottom pb-1 mb-1">
                                <span class="h1 m-0" style="line-height: normal;">Patient Information</span>
                            </div>
                            <div class="Ipd-patient-info w-100-p">
                                <app-patient-information [uhidNo]="registerObj?.regNo" [patientName]="PatientName"
                                    [doctorName]="registerObj?.doctorName"
                                    [departmentName]="registerObj?.departmentName" [doa]="registerObj?.admissionDate"
                                    [ipdNo]="registerObj?.ipdNo || registerObj?.ipdno"
                                    [ageString]="(registerObj?.age !== undefined ? registerObj?.age + 'Y | ' + registerObj?.genderName : '')"
                                    [refDocName]="registerObj?.refDocName"
                                    [wardBedName]="(registerObj?.roomName && registerObj?.bedName) ? (registerObj?.roomName + ' | ' + registerObj?.bedName) : ''"
                                    [patientType]="registerObj?.patientType" [tariffName]="registerObj?.tariffName"
                                    [companyName]="registerObj?.companyName">
                                </app-patient-information>
                            </div>
                        </div>
                    </mat-card>

                </form>
            </mat-card>


            <form [formGroup]="IcdUpdateForm" fxLayout="row">
                <span style="font-weight: 700;">Main Dignosis :</span>

                <app-airmid-diagnos-chipautocomplete fxFlex [chips]="IcdUpdateForm.get('PatientDignosisMaster')?.value"
                    [apiUrl]="'MIcdDiagnosisMaster/search_MIcdDiagnosisMaster?Keyword='"
                    [displayKey]="'icdCodeWithDignosis'" [allowCustom]="true"
                    (chipsChange)="selectChangeDiagnosis($event)">
                </app-airmid-diagnos-chipautocomplete>

            </form>


            <mat-card class="p-8">
                <form [formGroup]="IcdUpdateForm" fxLayout="column" fxLayoutGap="8px">
                    <span style="font-weight: 700;">Cause Of Death Reasons :</span>

                    <div fxLayout="row" fxLayout.xs="column" fxLayoutGap="12px">

                        <app-airmid-chipautocomplete fxFlex #chiefCauseInput
                            [chips]="IcdUpdateForm.get('PatientCauseMaster')?.value"
                            [apiUrl]="'OPDPrescriptionMedical/GetDiagnosisList?descriptionType=Complaint'"
                            [displayKey]="'descriptionName'" [allowCustom]="true"
                            (chipsChange)="selectChangeCause($event)">
                        </app-airmid-chipautocomplete>


                    </div>
                    <span style="font-weight: 700;">Pevisional Dignosis :</span>

                    <div fxLayout="row" fxLayout.xs="column" fxLayoutGap="12px">

                        <app-airmid-diagnos-chipautocomplete fxFlex
                            [chips]="IcdUpdateForm.get('PatientProvisionalDignosisMaster')?.value"
                            [apiUrl]="'MIcdDiagnosisMaster/search_MIcdDiagnosisMaster?Keyword='"
                            [displayKey]="'icdCodeWithDignosis'" [allowCustom]="true"
                            (chipsChange)="selectChangeProvDiagnosis($event)">
                        </app-airmid-diagnos-chipautocomplete>


                    </div>
                    <span style="font-weight: 700;">Final Dignosis :</span>

                    <div fxLayout="row" fxLayout.xs="column" fxLayoutGap="12px">

                        <app-airmid-diagnos-chipautocomplete fxFlex
                            [chips]="IcdUpdateForm.get('PatientfinalDignosisMaster')?.value"
                            [apiUrl]="'MIcdDiagnosisMaster/search_MIcdDiagnosisMaster?Keyword='"
                            [displayKey]="'icdCodeWithDignosis'" [allowCustom]="true"
                            (chipsChange)="selectChangefinalDiagnosis($event)">
                        </app-airmid-diagnos-chipautocomplete>

                    </div>
                    <div fxLayout="row" fxLayout.xs="column" fxLayoutGap="12px">


                    </div>

                </form>
            </mat-card>
        </div>
    </div>


    <div class="modal-footer" style="width: 100%;">
        <div class="footer-navigation-container" style="width: 100%;">
            <div class="modal-footer-container" style="width: 100%;">
                <div class="modal-footer-buttons" fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="10px"
                    style="width: 100%;">

                    <button class="btn btn-danger-outline" (click)="onClose(false)">
                        Close
                    </button>
                    <button type="button" class="btn btn-primary" (click)="onSubmit()">
                        Save
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
