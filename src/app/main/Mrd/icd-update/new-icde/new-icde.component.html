<div class="modal-wrapper grid-container labpatientMain resize-form-fields">
    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title" fxLayout="row" fxLayoutAlign="start center" style="gap: 10px;">
                <mat-icon style="color: white;">assignment_ind</mat-icon>
                <span [@animate]="{ value: '*', params: { delay: '100ms', x: '-25px' } }">
                    MRD ICD Update Form
                </span>
            </div>
            <div class="modal-header-right">
                <div class="close-icon">
                    <button mat-icon-button tabIndex="-1" (click)="onClose(false)" matTooltip="Close">
                        <mat-icon>close</mat-icon>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-body" fusePerfectScrollbar>
        <div fxLayout="column" fxLayoutGap="10px" class="p-6">

            <mat-card class="section-card">
                <form [formGroup]="searchFormGroup" fxLayout="column" fxLayoutGap="2px">

                    <div class="section-label" fxLayout="row" fxLayoutAlign="start center">
                        <mat-icon class="section-icon">search</mat-icon>
                        <span>Find Patient</span>
                    </div>

                    <div fxLayout="row" fxLayoutGap="2px">
                        <div fxFlex="50" fxFlex.sm="100" fxFlex.xs="100">
                            <airmid-autocomplete lbl="RegID" [formGroup]="searchFormGroup"
                                label="Search UHID / Patient Name / Mobile No(DC)" formControlName="RegId" fxFlex
                                placeholderText="UHID / First Name / Last Name / Mobile No(DC)"
                                ApiUrl="Admission/Dischargesearch-patient?Keyword="
                                (selectionChange)="getSelectedObj($event)" TextField="formattedText" ValueField="regId">
                            </airmid-autocomplete>
                        </div>
                    </div>

                    <mat-card class="patient-info-card" *ngIf="registerObj">
                        <div class="patient-info-sales">
                            <div class="patient-info-title border-bottom pb-1 mb-1">
                                <span class="h1 m-0" style="line-height: normal;">Patient Information</span>
                            </div>
                            <div class="Ipd-patient-info w-100-p">
                                <app-patient-information [uhidNo]="registerObj?.regNo" [patientName]="PatientName"
                                    [doctorName]="registerObj?.doctorName"
                                    [departmentName]="registerObj?.departmentName" [doa]="registerObj?.admissionDate"
                                    [ipdNo]="registerObj?.ipdNo || registerObj?.ipdno"
                                    [ageString]="registerObj?.age + 'Y'" [refDocName]="registerObj?.refDocName"
                                    [wardBedName]="(registerObj?.roomName && registerObj?.bedName) ? (registerObj?.roomName + ' | ' + registerObj?.bedName) : ''"
                                    [patientType]="registerObj?.patientType" [tariffName]="registerObj?.tariffName"
                                    [companyName]="registerObj?.companyName">
                                </app-patient-information>
                            </div>
                        </div>
                    </mat-card>

                </form>
            </mat-card>

            <mat-card class="section-card">
                <div class="section-label" fxLayout="row" fxLayoutAlign="start center">

                    <span style="padding-right: 40px;font-size: large;">Provisional Diagnosis Details</span>

                </div>
            </mat-card>

            <mat-card class="section-card">
                <form [formGroup]="IcdUpdateForm" fxLayout="column" fxLayoutGap="8px">

                    <div class="section-label" fxLayout="row" fxLayoutAlign="start center">

                        <span style="padding-right: 40px;font-size: large;">Main Diagnosis Details</span>

                        <div class="section-label" formGroupName="mrdDiagnosisInfoHeader" fxLayout="row"
                            fxLayoutAlign="start center">
                            <app-airmid-slider label="Synchronize" formControlName="isSync"></app-airmid-slider>
                        </div>

                    </div>

                    <app-airmid-diagnos-chipautocomplete fxFlex
                        [chips]="IcdUpdateForm.get('PatientDignosisMaster')?.value"
                        [apiUrl]="'MIcdDiagnosisMaster/search_MIcdDiagnosisMaster?Keyword='"
                        [displayKey]="'icdCodeWithDignosis'" [allowCustom]="true"
                        (chipsChange)="selectChangeDiagnosis($event)">
                    </app-airmid-diagnos-chipautocomplete>


                </form>
            </mat-card>

        </div>
    </div>

    <div class="modal-footer" fxLayoutAlign="end">
        <form [formGroup]="IcdUpdateForm" fxLayout="column" fxLayoutGap="2px">

        </form>
        <div class="next-div button-row-group" style="padding-right: 20px;">
            <button class="btn btn-danger-outline" (click)="onClose(false)">Close</button>
            <button class="btn btn-primary" color="accent" (click)="onSubmit()">
                <span>Save</span>
            </button>
        </div>
    </div>


</div>
