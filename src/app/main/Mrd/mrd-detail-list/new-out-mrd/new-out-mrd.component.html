<div class="modal-wrapper grid-container">
  <!-- Modal header -->
  <div class="modal-header accent">
    <div class="modal-header-content">
      <div class="modal-header-title">
        <span [@animate]="{ value: '*', params: { delay: '100ms', x: '-25px' } }"> MRD Out File Entry</span>
      </div>
      <div class="modal-header-right">
        <div class="comman-date-container">
          <div class="comman-date">
            <app-common-date [screenFrom]="screenFromString"
              (dateTimeEventEmitter)="getDateTime($event)"></app-common-date>
          </div>
          <div class="close-icon">
            <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
              matTooltip="Close">
              <mat-icon>close</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Modal body -->
  <div class="modal-body" fusePerfectScrollbar>
    <div class="modal-body-container">
      <div fxLayout="column" class="gap-12">

        <div class="modal-card-container">

          <div fxLayout="column" class="gap-8">

            <form [formGroup]="NewOutMrdForm" style="border: blue">
              <mat-card style="padding: 5;">

                <div fxLayout="row wrap" fxLayoutGap="8px 8px grid">

                  <!-- <div fxFlex="33" fxFlex.xs="100" fxFlex.sm="33">
                    <mat-form-field appearance="outline" class="dateField" fxFlex>
                      <mat-label>OUT Date</mat-label>
                      <input matInput [matDatepicker]="picker1" [min]="minDate" formControlName="outDate"
                        (dateChange)="onChangeDate($event.value)" />
                      <mat-datepicker-toggle matSuffix [for]="picker1"
                        [disabled]="isDatePckrDisabled"></mat-datepicker-toggle>
                      <mat-datepicker #picker1></mat-datepicker>
                    </mat-form-field>
                  </div> -->

                  <div fxFlex="50" fxFlex.xs="100" fxFlex.sm="33">

                    <span style="font-size: large;font-weight: bold;color: rgb(4, 4, 62);padding-left: 10px;padding-right: 10px;">Out File Data</span>
                    <!-- <mat-form-field appearance="outline" class="timeField" fxFlex>
                      <mat-label>OUT Time</mat-label>
                      <input matTimepicker #t="matTimepicker" mode="12h" formControlName="outTime"
                        (timeChange)="onChangeTime($event)" [disableDialogOpenOnClick]="isDatePckrDisabled" />
                      <mat-icon matSuffix (click)="!isDatePckrDisabled ? t.showDialog() : ''">access_time</mat-icon>
                    </mat-form-field> -->

                    <mat-form-field appearance="outline">
                      <mat-label>OUT Date / Time</mat-label>
                      <input matInput type="datetime-local" placeholder="date" [value]="date" [(ngModel)]="date"
                        (change)="date=$event.target.value" formControlName="outTime" />

                    </mat-form-field>
                  </div>
                </div>

                <div fxLayout="row wrap" fxLayoutGap="8px 8px grid">

                  <div fxFlex="33" fxFlex.xs="100" fxFlex.sm="33">
                    <airmid-textbox label="opipid" formControlName="opipid" [formGroup]="NewOutMrdForm"
                      [validations]="getValidationMessages().opipid" [maxLength]="15"></airmid-textbox>
                  </div>

                  <div fxFlex="33" fxFlex.xs="100" fxFlex.sm="33">
                    <airmid-textbox label="outNo" formControlName="outNo" [formGroup]="NewOutMrdForm"
                      [validations]="getValidationMessages().outNo" [maxLength]="15"></airmid-textbox>
                  </div>


                  <div fxFlex="33" fxFlex.xs="100" fxFlex.sm="33">
                    <airmid-textbox label="personName" formControlName="personName" [formGroup]="NewOutMrdForm"
                      [validations]="getValidationMessages().personName" [maxLength]="15"></airmid-textbox>
                  </div>
                </div>
              </mat-card>
              <mat-card style="padding: 5px;">

                <div fxLayout="row wrap" fxLayoutGap="8px 0px grid">
                  <!-- <div fxFlex="33" fxFlex.xs="100" fxFlex.sm="33">
                    <mat-form-field appearance="outline" class="dateField" fxFlex>
                      <mat-label>In Date</mat-label>
                      <input matInput [matDatepicker]="picker2" [min]="minDate" formControlName="inDate"
                        (dateChange)="onChangeDate1($event.value)" />
                      <mat-datepicker-toggle matSuffix [for]="picker2"
                        [disabled]="isDatePckrDisabled1"></mat-datepicker-toggle>
                      <mat-datepicker #picker2></mat-datepicker>
                    </mat-form-field>
                  </div> -->

                  <div fxFlex="50" fxFlex.xs="100" fxFlex.sm="33">
                    <span style="font-size: large;font-weight: bold;color: rgb(4, 4, 62);padding-left: 10px;padding-right: 10px;">In File Data</span>

                    <!-- <mat-form-field appearance="outline" class="timeField" fxFlex>
                      <mat-label>IN Time</mat-label>
                      <input matTimepicker #t="matTimepicker" mode="12h" formControlName="inTime"
                        (timeChange)="onChangeTime1($event)" [disableDialogOpenOnClick]="isDatePckrDisabled1" />
                      <mat-icon matSuffix (click)="!isDatePckrDisabled1 ? t.showDialog() : ''">access_time</mat-icon>
                    </mat-form-field> -->


                    <mat-form-field appearance="outline">
                      <mat-label>In Date / Time</mat-label>
                      <input matInput type="datetime-local" placeholder="date" [value]="date" [(ngModel)]="date"
                        (change)="date=$event.target.value" formControlName="inTime" />

                    </mat-form-field>
                  </div>
                </div>

                <div fxLayout="row wrap" fxLayoutGap="8px 0px grid">

                  <div fxFlex="33" fxFlex.xs="100" fxFlex.sm="33">
                    <airmid-textbox label="InNo" formControlName="inNo" [formGroup]="NewOutMrdForm"
                      [validations]="getValidationMessages().inNo" [maxLength]="15"></airmid-textbox>
                  </div>


                  <div fxFlex="33" fxFlex.xs="100" fxFlex.sm="33">
                    <airmid-textbox label="InReason" formControlName="inReason" [formGroup]="NewOutMrdForm"
                      [validations]="getValidationMessages().inReason" [maxLength]="15"></airmid-textbox>
                  </div>

                  <div fxFlex="33" fxFlex.xs="100" fxFlex.sm="33">
                    <airmid-textbox label="Return PersonName" formControlName="returnPersonName"
                      [formGroup]="NewOutMrdForm" [validations]="getValidationMessages().returnPersonName"
                      [maxLength]="15"></airmid-textbox>
                  </div>

                </div>
              </mat-card>
            </form>
          </div>

        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <div class="footer-navigation-container">
      <div class="modal-footer-buttons">
        <button class="btn btn-danger-outline" (click)="onClose()">Close</button>
        <button type="button" class="btn btn-primary" (click)="onSubmit()">Save</button>
      </div>
    </div>
  </div>
</div>
