<div class="modal-wrapper grid-container labpatientMain resize-form-fields">
  <!-- Modal header -->
  <div class="modal-header accent">
    <div class="modal-header-content">
      <div class="modal-header-title">
        <span [@animate]="{ value: '*', params: { delay: '100ms', x: '-25px' } }"> MRD IN File Entry</span>
      </div>
      <div class="modal-header-right">
        <div class="comman-date-container">

          <div class="close-icon">
            <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
              matTooltip="Close">
              <mat-icon>close</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Modal body -->
  <div class="modal-body" fusePerfectScrollbar>
    <div fxFlexFill fxLayout="row" fxLayout.gt-xs="column" fxLayoutGap="10px">


      <div class="modal-card-container mt-0" style="margin-top: -4px;">
        <div fxFlex.gt-sm="100%" fxFlex>
          <mat-card fxFlex.gt-sm="100%" fxFlex style="padding: 2px 10px;">
            <div class="patient-info-sales">
              <div class="patient-info-title border-bottom pb-1 mb-1">
                <span class="h1 m-0" style="line-height: normal;">Patient Information</span>
              </div>
              <div class="Ipd-patient-info w-100-p">
                <app-patient-information [uhidNo]="registerObj?.regNo" [patientName]="registerObj?.patientName"
                  [doctorName]="registerObj?.doctorName" [doa]="registerObj?.admissionTime"
                  [ipdNo]="registerObj?.ipdNo || registerObj?.ipdno"
                  [ageString]="(registerObj?.ageYear !== undefined ? registerObj?.ageYear + 'Y|' + registerObj?.ageMonth + 'M|' + registerObj?.ageDay + 'D | ' + registerObj?.genderName : '')">
                </app-patient-information>
              </div>
            </div>
          </mat-card>
        </div>
      </div>

      <div class="modal-body-container">
        <div fxLayout="column">

          <form [formGroup]="NewInMrdForm" style="border: blue">
            <input type="hidden" name="opipid" formControlName="opipid" [(ngModel)]="opipid">

            <div fxLayout="row" fxLayoutAlign="start stretch">
              <div fxFlex="50">

                <!-- <div fxLayout="row wrap" fxLayoutGap="2px 0px grid"> -->

                <!-- <div fxFlex="100" fxFlex.xs="100" fxFlex.sm="33">
                      <div style="font-size: large; font-weight: bold; color: rgb(3, 51, 101); padding:10px;">
                        OUT File Data
                      </div>

                      <div style="padding: 10px; font-size: large; color: rgb(2, 36, 69);">
                        Mrd File OUT Number : -<span style="font-weight: bold;">{{this.data.outFileId}}</span>
                      </div>

                      <div style="padding: 10px; font-size: large; color: rgb(2, 36, 69);">
                        Mrd File OUT Date : -<span style="font-weight: bold;">{{this.data.outDate}}</span>
                      </div>

                      <div style="padding: 10px; font-size: large; color: rgb(2, 36, 69);">
                        Mrd File OUT Person Name : -<span style="font-weight: bold;">{{this.data.personName}}</span>
                      </div>

                      <div style="padding: 10px; font-size: large; color: rgb(2, 36, 69);">
                        Mrd File OUT Reason : -<span style="font-weight: bold;">{{this.data.outReason}}</span>
                      </div>
                    </div> -->



                <!-- </div> -->



                <mat-card class="in-file-card">
                  <div class="card-header">
                    <mat-icon color="primary">folder_shared</mat-icon>
                    <span class="header-title">Out File Data</span>
                  </div>

                  <mat-divider></mat-divider>

                  <div class="card-content" style="margin-top: 10px;">
                    <div fxLayout="row wrap" fxLayoutGap="16px grid">

                      <div fxFlex="100" fxFlex.gt-sm="50" class="data-item">
                        <label>File OUT Number</label>
                        <div class="value">{{this.data.outFileId}}</div>
                      </div>

                      <div fxFlex="100" fxFlex.gt-sm="50" class="data-item">
                        <label>File OUT Date</label>
                        <div class="value">{{this.data.outDate | date:'dd-MMM-yyyy HH:mm'}}</div>
                      </div>

                      <div fxFlex="100" fxFlex.gt-sm="50" class="data-item">
                        <label>Return Person Name</label>
                        <div class="value">{{this.data.personName}}</div>
                      </div>

                      <div fxFlex="100" fxFlex.gt-sm="50" class="data-item">
                        <label>File IN Reason</label>
                        <div class="value">{{this.data.outReason || 'N/A'}}</div>
                      </div>

                    </div>
                  </div>
                </mat-card>

              </div>
              <div fxFlex="50">
                <mat-card>

                  <div fxLayout="row wrap" fxLayoutGap="2px 0px grid">

                    <div class="card-header">
                      <mat-icon color="primary">folder_shared</mat-icon>
                      <span class="header-title">IN File Data</span>
                    </div>
                    <div fxFlex="60" fxFlex.xs="100" fxFlex.sm="33" style="margin-top: 10px;margin-left: 20px;">

                      <mat-form-field appearance="outline">
                        <mat-label>In Date / Time</mat-label>
                        <input matInput type="datetime-local" placeholder="date" [value]="date" [(ngModel)]="date"
                          (change)="date=$event.target.value" formControlName="inTime" />

                      </mat-form-field>
                    </div>
                  </div>

                  <div fxLayout="row wrap" fxLayoutGap="2px 0px grid" style="padding: 10px;">

                    <!-- <div fxFlex="49" fxFlex.xs="100" fxFlex.sm="33">
                        <mat-form-field appearance="outline">
                        <mat-label>In Date / Time</mat-label>
                        <input matInput type="datetime-local" placeholder="date" [value]="date" [(ngModel)]="date"
                          (change)="date=$event.target.value" formControlName="inTime" />

                      </mat-form-field>
                    </div> -->

                    <div fxFlex="98" fxFlex.xs="100" fxFlex.sm="33">
                      <airmid-textbox label="Return PersonName" formControlName="returnPersonName"
                        [formGroup]="NewInMrdForm" [validations]="getValidationMessages().returnPersonName"
                        [maxLength]="15"></airmid-textbox>
                    </div>

                  </div>

                  <div fxLayout="row wrap" fxLayoutGap="2px 0px grid" style="padding-left: 10px;padding-right: 10px;">
                    <div fxFlex="98" fxFlex.xs="100" fxFlex.sm="33">
                      <airmid-textbox label="InReason" formControlName="inReason" [formGroup]="NewInMrdForm"
                        [validations]="getValidationMessages().inReason" [maxLength]="15"></airmid-textbox>
                    </div>


                  </div>
                </mat-card>
              </div>
            </div>
          </form>
        </div>


      </div>
      <div class="modal-footer">
        <div class="footer-navigation-container">
          <div class="modal-footer-buttons">
            <button class="btn btn-danger-outline" (click)="onClose()">Close</button>
            <button type="button" class="btn btn-primary" (click)="onSubmit()">Save</button>
          </div>
        </div>
      </div>
    </div>

  </div>
