<div class="page-layout simple left-sidebar inner-sidebar inner-scroll" dynamicTableHeight>
    <mat-toolbar class="accent" style="height:50px; justify-content: space-between;width: 100%;">
        <div fxLayout="row" fxLayoutAlign="start center">

            <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}" style="color: white;">
              Bill Detail List
            </span>
        </div>

        <div fxLayout="row" fxLayoutALign="end start">
            <button mat-icon-button tabIndex="-1" (click)="onClose()" aria-label="Close dialog">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </mat-toolbar>

    <div class="content">

        <div class="center p-12 pb-56" fxFlexAlign="start center">

            <div class="content-card" style="border-radius:4px;">
                <div fxFlexFill fxLayout="column" fxLayout.gt-xs="row"  fxLayoutGap="10px" fxLayoutAlign="stretch"  > 
                    <div fxFlex="100%" fxFlex.xs="100%" fxFlex.sm="50%">
                       
   
                                <mat-table #table1 matSort [dataSource]="Billdetaildatasource"
                                    [@animateStagger]="{value:'50'}" style="overflow-x: auto;">

                                    <ng-container matColumnDef="serviceName">
                                        <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm>
                                           serviceName
                                        </mat-header-cell>
                                        <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                                            <span> {{contact.serviceName}}</span>
                                        </mat-cell>
                                    </ng-container>

                                    <ng-container matColumnDef="Price">
                                        <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm>
                                          Price
                                        </mat-header-cell>
                                        <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                                            <span> {{contact.Price}}</span>
                                        </mat-cell>
                                    </ng-container>

                                    <ng-container matColumnDef="Qty">
                                        <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm>Qty
                                        </mat-header-cell>
                                        <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                                            <span> {{contact.Qty || '-'}}</span>
                                        </mat-cell>
                                    </ng-container>

                                    <ng-container matColumnDef="TotalAmt">
                                        <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm>
                                           TotalAmt
                                        </mat-header-cell>
                                        <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                                            <span> {{contact.TotalAmt}}</span>
                                        </mat-cell>
                                    </ng-container>

                                    <ng-container matColumnDef="DoctorName">
                                        <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm>
                                          DoctorName
                                        </mat-header-cell>
                                        <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                                            <span> {{contact.DoctorName}}</span>
                                        </mat-cell>
                                    </ng-container>

                                    <ng-container matColumnDef="DocAmt">
                                        <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm>DocAmt
                                        </mat-header-cell>
                                        <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                                            <span> {{contact.DocAmt || '-'}}</span>
                                        </mat-cell>
                                    </ng-container>

                                    <ng-container matColumnDef="loading">
                                        <mat-footer-cell *matFooterCellDef colspan="6">
                                            loading data...
                                        </mat-footer-cell>
                                    </ng-container>

                                    <ng-container matColumnDef="noData">
                                        <mat-footer-cell *matFooterCellDef colspan="6">
                                            <span>No Data Found</span>
                                        </mat-footer-cell>
                                    </ng-container>

                                    <mat-header-row class="accent" *matHeaderRowDef="displayedColumns; sticky: true">
                                    </mat-header-row>
                                    <mat-row *matRowDef="let contact; columns: displayedColumns;"
                                        [@animate]="{value:'*',params:{y:'100%'}}"
                                        (click)="getDoctor(contact)"></mat-row>
                                    <mat-footer-row *matFooterRowDef="['loading']"
                                        [ngClass]="{'hide':Billdetaildatasource!=null}">
                                    </mat-footer-row>
                                    <mat-footer-row *matFooterRowDef="['noData']"
                                        [ngClass]="{'hide':!(Billdetaildatasource!=null && Billdetaildatasource.data.length==0)}">
                                    </mat-footer-row>
                                </mat-table>
                         
                       
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
