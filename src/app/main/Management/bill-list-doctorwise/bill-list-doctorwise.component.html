<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" style="height: 100%;" fusePerfectScrollbar
    dynamicTableHeight>

    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
        <!-- 1st -->

        <mat-tab label="Doctor Pay Summary  List">
            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>

                <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
                    fxLayoutAlign.gt-xs="space-between center ">
                    <div class="top-header-info">
                        <div class="top-header-title">
                            <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                                Doctor Pay Summary List
                            </span>
                        </div>
                    </div>
                    <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
                        <button mat-raised-button (click)="Additiondocpay()">New AddOn Pay
                        </button>
                        <button mat-raised-button (click)="processDocShare()">Calculate Doctor Share
                        </button>
                    </div>
                </div>
                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
                    <ng-template #actionButtonTemplate1 let-element>
                        <div fxLayout="row" fxLayoutAlign="center center">
                            <mat-icon (click)="Doctorbilldetail(element)" matTooltip=" Summary Detail">
                                remove_red_eye
                            </mat-icon>
                        </div>

                    </ng-template>
                    <airmid-table [gridConfig]="gridConfig1" class="content" #summary>
                        <ng-container filters>

                            <form [formGroup]="_DoctorShareService.DocSummaryfilterForm">

                                <airmid-datepicker [formGroup]="_DoctorShareService.DocSummaryfilterForm"
                                    [isRangePicker]="true" formStartControlName="fromDate" formEndControlName="enddate"
                                    [(fromValue)]="gridConfig1.filters[0].fieldValue"
                                    [(toValue)]="gridConfig1.filters[1].fieldValue">
                                </airmid-datepicker>


                                <airmid-dropdown label="Select Doctor Name" formControlName="DoctorID"
                                    [(ngModel)]="gridConfig1.filters[2].fieldValue"
                                    [formGroup]="_DoctorShareService.DocSummaryfilterForm"
                                    (selectionChange)="ListView1($event)" (keyup)="ListView1($event)"
                                    [mode]="autocompleteModedoctor1">
                                </airmid-dropdown>


                            </form>
                        </ng-container>
                    </airmid-table>
                </div>
            </div>
        </mat-tab>
        <mat-tab label="Doctor Wise Bill List">
            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>
                <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
                    fxLayoutAlign.gt-xs="space-between center ">
                    <div class="top-header-info">
                        <div class="top-header-title">
                            <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                                Doctor Wise Bill List
                            </span>
                        </div>
                    </div>

                </div>

                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">


                    <ng-template #actionButtonTemplate2 let-element>

                        <div fxLayout="row" fxLayoutAlign="center center">
                            <mat-icon (click)="onHold(element)" matTooltip="Hold Bill">
                                <img width="50px" height="50px" src="assets/images/logos/hold.png">
                            </mat-icon>

                            <mat-icon (click)="billdetail(element)" matTooltip="Bill Detail">
                                edit
                            </mat-icon>


                            <mat-icon (click)="EditAdditiondocpay(element)" matTooltip="Update AddON Charges">
                                edit
                            </mat-icon>
                        </div>

                    </ng-template>


                    <airmid-table [gridConfig]="gridConfig2" class="content" #summarydetail>
                        <ng-container filters>
                            <form [formGroup]="_DoctorShareService.UserFormGroup">

                                <airmid-datepicker [formGroup]="_DoctorShareService.UserFormGroup"
                                    [isRangePicker]="true" formStartControlName="fromDate" formEndControlName="enddate"
                                    [(fromValue)]="gridConfig2.filters[1].fieldValue"
                                    [(toValue)]="gridConfig2.filters[2].fieldValue">
                                </airmid-datepicker>


                                <airmid-dropdown label="Select Doctor Name" formControlName="DoctorID"
                                    [(ngModel)]="gridConfig2.filters[0].fieldValue"
                                    [formGroup]="_DoctorShareService.UserFormGroup"
                                    (selectionChange)="ListView2($event)" (keyup)="ListView2($event)"
                                    [mode]="autocompleteModedoctor">
                                </airmid-dropdown>


                            </form>
                        </ng-container>
                    </airmid-table>
                </div>
            </div>
        </mat-tab>


    </mat-tab-group>
</div>
