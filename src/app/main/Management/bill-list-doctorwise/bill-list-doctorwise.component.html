<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" style="height: 100%;" fusePerfectScrollbar
    dynamicTableHeight>

    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
        <!-- 1st -->
        <mat-tab label="Browse Patient Bill List">
            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>


                <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
                    fxLayoutAlign.gt-xs="space-between center ">
                    <div class="top-header-info">
                        <div class="top-header-title">
                            <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                                Browse Patient Bill List
                            </span>
                        </div>
                    </div>
                    <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
                        <button mat-raised-button (click)="Additiondocpay()">New AddOn Pay
                        </button>

                    </div>
                </div>

                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
                    <ng-template #actionsTemplate1 let-element>
                        <div fxLayout="row" fxLayoutAlign="center center">
                            <mat-icon *ngIf="element.patientType=='Self'" matTooltip="Patient Category Self">account_box
                            </mat-icon>
                            <mat-icon *ngIf="!element.patientType=='Self'" matTooltip="Patient Category other">business
                            </mat-icon>
                        </div>

                    </ng-template>
                    <ng-template #actionsTemplate let-element>
                        <div fxLayout="row" fxLayoutAlign="center center">

                            <mat-icon *ngIf="element.opdipdtype=='0'" matTooltip="OPD"
                                class="pill orange-600 s-16">circle</mat-icon>

                            <mat-icon *ngIf="element.opdipdtype=='1'" matTooltip="IPD"
                                class="pill green-600 s-16">circle</mat-icon>
                        </div>
                    </ng-template>

                    <ng-template #actionButtonTemplate let-element>

                        <div fxLayout="row" fxLayoutAlign="center center">
                            <mat-icon *ngIf="element.isBillShrHold==false" (click)="onHold(element)"
                                matTooltip="Hold Bill">
                                <img width="50px" height="50px" src="assets/images/logos/hold.png">
                            </mat-icon>

                            <mat-icon (click)="billdetail(element)" matTooltip=" Bill Detail">
                                edit
                            </mat-icon>
                        </div>

                    </ng-template>


                    <airmid-table [gridConfig]="gridConfig" class="content" #ipBrowse>
                        <ng-container filters>
                            <form [formGroup]="_DoctorShareService.UserFormGroup">

                                <airmid-datepicker [formGroup]="_DoctorShareService.UserFormGroup"
                                    [isRangePicker]="true" formStartControlName="fromDate" formEndControlName="enddate"
                                    [(fromValue)]="gridConfig.filters[0].fieldValue"
                                    [(toValue)]="gridConfig.filters[1].fieldValue">
                                </airmid-datepicker>

                                <mat-form-field appearance="outline">
                                    <mat-label>Pbill No.</mat-label>
                                    <input matInput placeholder="PbillNo" autocomplete="off" formControlName="PbillNo"
                                        (input)="onChangeFirst()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)="Clearfilter('PbillNo')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <airmid-dropdown label="Select Doctor Name" formControlName="DoctorID"
                                    [(ngModel)]="gridConfig.filters[2].fieldValue"
                                    [formGroup]="_DoctorShareService.UserFormGroup" (selectionChange)="ListView($event)"
                                    (keyup)="ListView($event)" [mode]="autocompleteModedoctor">
                                </airmid-dropdown>

                                <mat-radio-group formControlName="OP_IP_Type" name="Radio" (change)="onChangeFirst()">
                                    <mat-radio-button value="2">ALL</mat-radio-button>&nbsp;
                                    <mat-radio-button value="0">OP</mat-radio-button>&nbsp;
                                    <mat-radio-button value="1">IP</mat-radio-button>&nbsp;
                                </mat-radio-group>

                            </form>
                        </ng-container>
                    </airmid-table>
                </div>
            </div>
        </mat-tab>


        <mat-tab label="Doctor Pay Summary  List">
            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>

                <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
                    fxLayoutAlign.gt-xs="space-between center ">
                    <div class="top-header-info">
                        <div class="top-header-title">
                            <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                                Doctor Pay Summary List
                            </span>
                        </div>
                    </div>

                </div>


                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

                    <airmid-table [gridConfig]="gridConfig1"  class="content" #summary>
                        <ng-container filters>

                            <form [formGroup]="_DoctorShareService.DocSummaryfilterForm">

                                <airmid-datepicker [formGroup]="_DoctorShareService.DocSummaryfilterForm"
                                    [isRangePicker]="true" formStartControlName="fromDate" formEndControlName="enddate"
                                    [(fromValue)]="gridConfig1.filters[0].fieldValue"
                                    [(toValue)]="gridConfig1.filters[1].fieldValue">
                                </airmid-datepicker>


                                <airmid-dropdown label="Select Doctor Name" formControlName="DoctorID"
                                    [(ngModel)]="gridConfig1.filters[2].fieldValue"
                                    [formGroup]="_DoctorShareService.DocSummaryfilterForm"
                                    (selectionChange)="ListView1($event)" (keyup)="ListView1($event)"
                                    [mode]="autocompleteModedoctor1">
                                </airmid-dropdown>


                            </form>
                        </ng-container>
                    </airmid-table>
                </div>
            </div>
        </mat-tab>
    </mat-tab-group>
</div>
