<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" style="height: 100%;" fusePerfectScrollbar
    dynamicTableHeight>
    <mat-toolbar class="top-header accent">
        <div fxLayout="row" fxLayoutAlign="start center" class="top-header-info">
            <button mat-icon-button class="sidebar-toggle ">
                <mat-icon>menu</mat-icon>
            </button>
            <mat-icon class="logo-icon" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}">account_box
            </mat-icon>
            <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                Doctor Share Process List
            </span>
        </div>

        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <div fxLayout="row" fxLayoutAlign="start center" class="gap-4">
                <mat-icon class="pill orange-600 s-16">circle</mat-icon>
                <span>: OP </span>
            </div>
            <div fxLayout="row" fxLayoutAlign="start center" class="gap-4">
                <mat-icon class="pill green s-16">circle</mat-icon>
                <span>: IP </span>
            </div>
        </div>

    </mat-toolbar>

    <div fusePerfectScrollbar
        class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
        dynamicTableHeight>

        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">


            <ng-template #actionsIPOP let-element>
                <div fxLayout="row" fxLayoutAlign="center center">

                    <mat-icon *ngIf="element.oPdIpdType=='OP'" matTooltip="OutPatient"
                        class="pill orange s-16">circle</mat-icon>
                    <mat-icon *ngIf="element.oPdIpdType=='IP'" matTooltip="InPatient"
                        class="pill green s-16">circle</mat-icon>

                </div>
            </ng-template>

            <ng-template #actionButtonTemplate2 let-element>

                <div fxLayout="row" fxLayoutAlign="center center">

                    <mat-icon (click)="OnPaymentdetail(element)" *ngIf="element.paymentId==0"
                        matTooltip="Payment Detail">
                        <img width="30px" height="30px" src="assets/images/logos/Billdate.jpg">
                    </mat-icon>

                    <mat-icon (click)="onPrint(element)" matTooltip="Print Receipt">print
                    </mat-icon>

                </div>

            </ng-template>


            <airmid-table [gridConfig]="gridConfig" class="content" :ShowButtons="false">
                <ng-container filters>
                    <form [formGroup]="DocProcessfilterForm">
                        <airmid-datepicker [formGroup]="DocProcessfilterForm" [isRangePicker]="true"
                            formStartControlName="fromDate" formEndControlName="enddate"
                            [(fromValue)]="gridConfig.filters[1].fieldValue"
                            [(toValue)]="gridConfig.filters[2].fieldValue">
                        </airmid-datepicker>

                        <airmid-dropdown label="Doctor Name" formControlName="DoctorID"
                            [formGroup]="DocProcessfilterForm" [(ngModel)]="gridConfig.filters[0].fieldValue"
                            [validations]="getValidationdoctorMessages().searchDoctorId" [mode]="autocompleteModedoctor"
                            (selectionChange)="ListView($event)" (keyup)="ListView($event)">
                        </airmid-dropdown>
                    </form>

                </ng-container>
            </airmid-table>
        </div>


    </div>
</div>
