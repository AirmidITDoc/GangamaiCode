<div id="contact" class="simple page-layout inner-scroll inner-sidebar right-sidebar">
    <mat-toolbar style="height: 50px;justify-content: space-between;width: 100%;">
        <div fxLayout="row" fxLayoutAlign="start center">
            <button mat-icon-button class="sidebar-toggle mr-12" style="color: white;">
                <mat-icon>menu</mat-icon>
            </button>
            <mat-icon class="logo-icon mr-16" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}"
                style="color: white;">account_box
            </mat-icon>
            <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}" style="color: white;">
                GST Adjustment
            </span>
        </div>
        <div class="close-icon">
            <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                matTooltip="Close">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </mat-toolbar>

    <div class="content">
        <div class="center p-24 pb-56">
            <div class="content-card">
                <div fxFlexFill fxLayout="column" fxLayout.gt-xs="row" fxLayoutGap="10px">
                    <div fxFlex.gt-sm="100%" fxFlex>

                        <form [formGroup]="GSTAdjustment">
                            <div fxLayout="row" style="font-size: large;font-weight: bold;">
                                <label style="margin-bottom: 15px;">ItemName :</label>
                                <span style="padding: 0px 15px 15px 15px;">{{itemname}}</span>
                            </div>

                            <div fxLayout="row" fxLayoutGap="4px">

                                <!-- <mat-form-field appearance="outline" fxFlex>
                                    <mat-label>CGSTPer</mat-label>
                                    <input name="CGSTPer" formControlName="CGSTPer" matInput required readonly
                                        (keyup.enter)="focusNext('SGSTPer')" [(ngModel)]="vCGSTPer" type="text"
                                        OnlyNUmber>
                                </mat-form-field> -->

                                <airmid-textbox label="CGSTPer" formControlName="oldCgstper" [formGroup]="GSTAdjustment"
                                    [validations]="getValidationMessages().CGSTPer" [value]="vCGSTPer"
                                    [readonly]="true">
                                </airmid-textbox>



                                <!-- <mat-form-field appearance="outline" fxFlex>
                                    <mat-label>SGSTPer</mat-label>
                                    <input name="SGSTPer" formControlName="SGSTPer" matInput required type="text"
                                        OnlyNUmber (keyup.enter)="focusNext('IGSTPer')" id="SGSTPer"
                                        [(ngModel)]="vSGSTPer" readonly>
                                </mat-form-field> -->

                                <airmid-textbox label="SGSTPer" formControlName="oldSgstper" [formGroup]="GSTAdjustment"
                                    [validations]="getValidationMessages().SGSTPer" [value]="vSGSTPer"
                                    [readonly]="true">
                                </airmid-textbox>

                                <!-- <mat-form-field appearance="outline" fxFlex>
                                    <mat-label>IGSTPer</mat-label>
                                    <input name="IGSTPer" formControlName="IGSTPer" matInput required type="text"
                                        OnlyNUmber (keyup.enter)="focusNext('NewCGSTPer')" id="IGSTPer"
                                        [(ngModel)]="vIGSTPer" readonly>
                                </mat-form-field> -->

                                <airmid-textbox label="IGSTPer" formControlName="oldIgstper" [formGroup]="GSTAdjustment"
                                    [validations]="getValidationMessages().IGSTPer" [value]="vIGSTPer"
                                    [readonly]="true">
                                </airmid-textbox>
                            </div>
                            <div fxLayout="row" fxLayoutGap="4px">

                                <!-- <mat-form-field appearance="outline" fxFlex>
                                    <mat-label>New CGSTPer</mat-label>
                                    <input name="NewCGSTPer" formControlName="NewCGSTPer" type="text" OnlyNUmber
                                        matInput required (keyup.enter)="focusNext('NewSGSTPer')" id="NewCGSTPer"
                                        [(ngModel)]="vNewCGSTPer" (keyup)="calculationAmt()"
                                        (keypress)="keyPressCharater($event)">
                                </mat-form-field> -->

                                <airmid-textbox label="New CGSTPer" formControlName="cgstper" #CGST
                                    [formGroup]="GSTAdjustment" [validations]="getValidationMessages().NewCGSTPer"
                                    [value]="vNewCGSTPer" (valueChange)="getchangegstper(1,$event,CGST)"  (keypress)="keyPressAlphanumeric($event)">
                                </airmid-textbox>

                                <!-- <mat-form-field appearance="outline" fxFlex>
                                    <mat-label>New SGSTPer</mat-label>
                                    <input name="NewSGSTPer" formControlName="NewSGSTPer" matInput required type="text"
                                        OnlyNUmber id="NewSGSTPer" [(ngModel)]="vNewSGSTPer" (keyup)="calculationAmt()"
                                        (keyup.enter)="focusNext('NewIGSTPer')" (keypress)="keyPressCharater($event)">
                                </mat-form-field> -->
                                <airmid-textbox label="New SGSTPer" formControlName="sgstper" #SGST
                                    [formGroup]="GSTAdjustment" [validations]="getValidationMessages().NewSGSTPer"
                                    [value]="vNewSGSTPer" (valueChange)="getchangegstper(2,$event,SGST)"  (keypress)="keyPressAlphanumeric($event)">
                                </airmid-textbox>

                                <!-- <mat-form-field appearance="outline" fxFlex>
                                    <mat-label>New IGSTPer</mat-label>
                                    <input name="NewIGSTPer" formControlName="NewIGSTPer" matInput required type="text"
                                        OnlyNUmber [(ngModel)]="vNewIGSTPer" id="NewIGSTPer" (keyup)="calculationAmt()"
                                        (keypress)="keyPressCharater($event)" (keyup.enter)="focusNext('Save')">
                                </mat-form-field> -->
                                <airmid-textbox label="New IGSTPer" formControlName="igstper" #IGST
                                    [formGroup]="GSTAdjustment" [validations]="getValidationMessages().NewIGSTPer"
                                    [value]="vNewIGSTPer" (valueChange)="getchangegstper(3,$event,IGST)"  (keypress)="keyPressAlphanumeric($event)">
                                </airmid-textbox>

                            </div>

                            <div class="modal-footer-buttons gap-8" fxLayoutAlign="end" style="margin-top: 20px;">

                                <!-- <mat-form-field appearance="outline" fxFlex>
                                    <mat-label>Old GSTPer</mat-label>
                                    <input name="OldTotalGSTPer" formControlName="OldTotalGSTPer" matInput required
                                        type="text" OnlyNUmber [(ngModel)]="vOldTotalGSTPer" id="OldTotalGSTPer">
                                </mat-form-field> -->
                                <airmid-textbox label="Old GSTPer" formControlName="OldTotalGSTPer" [formGroup]="GSTAdjustment"
                                    [validations]="getValidationMessages().OldTotalGSTPer" [value]="vOldTotalGSTPer" >
                                </airmid-textbox>
                                <!-- <mat-form-field appearance="outline" fxFlex>
                                    <mat-label>New GSTPer</mat-label>
                                    <input name="TotalGSTPer" formControlName="TotalGSTPer" matInput required
                                        type="text" OnlyNUmber [(ngModel)]="vTotalGSTPer" id="TotalGSTPer">
                                </mat-form-field> -->
                                <airmid-textbox label="New GSTPer" formControlName="TotalGSTPer" [formGroup]="GSTAdjustment"
                                    [validations]="getValidationMessages().TotalGSTPer" [value]="vTotalGSTPer" [readonly]="true">
                                </airmid-textbox>

                                <div class="sales-footer-buttons gap-8" fxLayout="row" fxLayoutAlign="center center"
                                    fxFlexAlign="center" style="margin-left: 30px;margin-right: 20px;">

                                    <button class="btn btn-primary" (click)="onSubmit()">Save</button>
                                    <button class="btn btn-danger-outline" (click)="onClose()">Close</button>
                                </div>

                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
