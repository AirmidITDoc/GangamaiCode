<div id="contact" class="simple page-layout inner-scroll inner-sidebar right-sidebar">
    <mat-toolbar style="height: 50px;justify-content: space-between;width: 100%;">
        <div fxLayout="row" fxLayoutAlign="start center">
            <!-- <button mat-icon-button class="sidebar-toggle mr-12" style="color: white;">
                <mat-icon>menu</mat-icon>
            </button>
            <mat-icon class="logo-icon mr-16" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}"
                style="color: white;">account_box
            </mat-icon> -->
            <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}" style="color: white;">
                GST Adjustment
                <!-- <div fxLayout="row" style="font-size: large;font-weight: bold;"> -->
                <label style="margin-bottom: 15px;">ItemName :</label>
                <span style="padding: 0px 15px 15px 15px;">{{itemname}}</span>
                <!-- </div> -->
            </span>
        </div>
        <div class="close-icon">
            <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                matTooltip="Close">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </mat-toolbar>

    <div class="content">
        <div class="center p-24 pb-56">
            <div class="content-card">
                <div fxFlexFill fxLayout="column" fxLayout.gt-xs="row" fxLayoutGap="10px">
                    <div fxFlex.gt-sm="100%" fxFlex>

                        <form [formGroup]="GSTAdjustment" fxLayout="column">


                            <div fxFlex="100%" fxFlex.xs="100%" fxFlex.sm="80%" fxLayout="row wrap"
                                fxLayoutGap="4px grid">
                                <span style="font-size: large;font-weight: bold;margin-right: 20px;color: rgb(6, 62, 97);">Old GST
                                    Details</span>
                                <!-- <mat-form-field appearance="outline" fxFlex>
                                    <mat-label>CGSTPer</mat-label>
                                    <input name="CGSTPer" formControlName="CGSTPer" matInput required readonly
                                        (keyup.enter)="focusNext('SGSTPer')" [(ngModel)]="vCGSTPer" type="text"
                                        OnlyNUmber>
                                </mat-form-field> -->

                                <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="33%">
                                    <airmid-textbox label="CGSTPer" formControlName="oldCgstper"
                                        [formGroup]="GSTAdjustment" [validations]="getValidationMessages().CGSTPer"
                                        [value]="vCGSTPer" [readonly]="true">
                                    </airmid-textbox>
                                </div>

                                <!-- <mat-form-field appearance="outline" fxFlex>
                                    <mat-label>SGSTPer</mat-label>
                                    <input name="SGSTPer" formControlName="SGSTPer" matInput required type="text"
                                        OnlyNUmber (keyup.enter)="focusNext('IGSTPer')" id="SGSTPer"
                                        [(ngModel)]="vSGSTPer" readonly>
                                </mat-form-field> -->

                                <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="33%">
                                    <airmid-textbox label="SGSTPer" formControlName="oldSgstper"
                                        [formGroup]="GSTAdjustment" [validations]="getValidationMessages().SGSTPer"
                                        [value]="vSGSTPer" [readonly]="true">
                                    </airmid-textbox>
                                </div>

                                <!-- <mat-form-field appearance="outline" fxFlex>
                                    <mat-label>IGSTPer</mat-label>
                                    <input name="IGSTPer" formControlName="IGSTPer" matInput required type="text"
                                        OnlyNUmber (keyup.enter)="focusNext('NewCGSTPer')" id="IGSTPer"
                                        [(ngModel)]="vIGSTPer" readonly>
                                </mat-form-field> -->

                                <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="33%">
                                    <airmid-textbox label="IGSTPer" formControlName="oldIgstper"
                                        [formGroup]="GSTAdjustment" [validations]="getValidationMessages().IGSTPer"
                                        [value]="vIGSTPer" [readonly]="true">
                                    </airmid-textbox>
                                </div>
                                <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="33%">

                                    <airmid-textbox label="OldTotalGSTPer" formControlName="OldTotalGSTPer"
                                        [formGroup]="GSTAdjfinal" [value]="vOldTotalGSTPer" [readonly]="true" fxFlex>
                                    </airmid-textbox>
                                </div>
                            </div>
                            <div fxFlex="100%" fxFlex.xs="100%" fxFlex.sm="80%" fxLayout="row wrap"
                                fxLayoutGap="4px grid">
                                <span style="font-size: large;font-weight: bold;margin-right: 10px;color: rgb(6, 62, 97);">New GST
                                    Details</span>

                                <div fxFlex="28%" fxFlex.xs="100%" fxFlex.sm="33%">
                                    <airmid-dropdown label="CGST/SGST" formControlName="cgstper"
                                        [formGroup]="GSTAdjustment" [mode]="autocompleteModeGSTTypesValues"
                                        (selectionChange)="getchangegstper($event)"
                                        (onClearSelection)="getchangegstper($event)">
                                    </airmid-dropdown>
                                </div>

                                <div fxFlex="28%" fxFlex.xs="100%" fxFlex.sm="33%">
                                    <airmid-dropdown label="IGST" formControlName="igstper" [formGroup]="GSTAdjustment"
                                        [mode]="autocompleteModeGSTTypesValues"
                                        (selectionChange)="getchangeIgstper($event)"
                                        (onClearSelection)="getchangeIgstper($event)">
                                    </airmid-dropdown>
                                </div>

                                <div fxFlex="28" fxFlex.xs="100%" fxFlex.sm="33%">
                                    <airmid-textbox label="New GSTPer" formControlName="TotalGSTPer"
                                        [formGroup]="GSTAdjfinal" [value]="vTotalGSTPer" [readonly]="true" fxFlex>
                                    </airmid-textbox>

                                </div>
                                <!-- (valueChange)="getchangegstper(1,$event,CGST)" -->
                                <!-- <airmid-textbox label="New CGSTPer" formControlName="cgstper" #CGST
                                    [formGroup]="GSTAdjustment" [validations]="getValidationMessages().NewCGSTPer"
                                    [value]="vNewCGSTPer" [type]="'number'">
                                </airmid-textbox>

                                <airmid-textbox label="New SGSTPer" formControlName="sgstper" #SGST
                                    [formGroup]="GSTAdjustment" [validations]="getValidationMessages().NewSGSTPer"
                                    [value]="vNewSGSTPer" [type]="'number'">
                                </airmid-textbox>

                                <airmid-textbox label="New IGSTPer" formControlName="igstper" #IGST
                                    [formGroup]="GSTAdjustment" [validations]="getValidationMessages().NewIGSTPer"
                                    [value]="vNewIGSTPer" [type]="'number'">
                                </airmid-textbox> -->

                            </div>
                        </form>
                        <form [formGroup]="GSTAdjfinal">
                            <div class="modal-footer-buttons gap-8" fxLayoutAlign="space-between"
                                style="margin-top: 20px;">

                                <div fxLayout="row" class="gap-8">


                                </div>

                                <div class="sales-footer-buttons gap-8" fxLayout="row" fxLayoutAlign="center center"
                                    fxFlexAlign="center" style="margin-left: 30px;margin-right: 20px;">

                                    <button class="btn btn-danger-outline" (click)="onClose()">Close</button>
                                    <button class="btn btn-primary" (click)="onSubmit()">Save</button>

                                </div>

                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
