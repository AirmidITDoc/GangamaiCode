<div class="modal-page page-layout inner-scroll">
  <div class="modal-wrapper grid-container">
    <mat-toolbar class="accent" style="width: 100%;height: 40px;justify-content: space-between;">
      <div fxLayout="row" fxLayoutAlign="start center">
        <mat-icon class="logo-icon mr-16" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}"
          style="color: white;">account_box
        </mat-icon>
        <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">Abha Application</span>
      </div>
      <div class="close-icon">
        <button mat-icon-button [mat-dialog-close]="true" aria-label="Close dialog" matTooltip="Close">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </mat-toolbar>

    <div class="modal-body content">
      <div fxLayout="column" class="gap-8 h-100-p">
      <mat-dialog-content class="dialog-content">
        <iframe *ngIf="safeUrl" [src]="safeUrl" class="full-screen-iframe" frameborder="0"
          allow="camera; microphone; fullscreen">
        </iframe>
      </mat-dialog-content>
      </div>
    </div>
  </div>
</div>
