<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" style="height: 100%;" fusePerfectScrollbar
    dynamicTableHeight>
    <mat-toolbar class="top-header accent">
        <div fxLayout="row" fxLayoutAlign="start center" class="top-header-info">

            <mat-icon class="logo-icon" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}">account_box
            </mat-icon>
            <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                Issue To Department List
            </span>
        </div>

        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onSave()" *ngIf="IsAdd">New Issue To Department
            </button>
        </div>

    </mat-toolbar>

    <div fusePerfectScrollbar
        class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
        dynamicTableHeight>

        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
            <ng-template #actionButtonTemplate let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <button mat-icon-button matTooltip="Print IssueToDept"
                        (click)="viewgetIssuetodeptReportPdf(element)">
                        <mat-icon> print</mat-icon>
                    </button>
                       <button *ngIf="!element.isVerified" mat-icon-button (click)="onVerify(element)">
                        <mat-icon class="disabled-icon" matTooltip="verify Menu">verified_user</mat-icon>
                    </button>
                </div>
            </ng-template>


            <!-- <ng-template #isVerifiedstatus let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                <mat-icon *ngIf="element.isverify=='1';" matTooltip="Is Verify"
                        style="color: green;">check_circle</mat-icon>
                    <mat-icon *ngIf="!element.isverify=='1';" matTooltip="Not Verify"
                        style="color: rgb(128, 0, 30);">hourglass_empty</mat-icon>

                </div>
            </ng-template> -->


            <ng-template #isacceptedstatus let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <mat-icon *ngIf="element.isAccepted=='1'" matTooltip="Is Accepted"
                        style="color: blueviolet;">spellcheck</mat-icon>
                    <mat-icon *ngIf="!element.isAccepted=='1'" matTooltip="Not Accepted"
                        style="color: rgb(225, 30, 8);">remove_shopping_cart</mat-icon>
                </div>
            </ng-template>

            <ng-template #actionsTemplate1 let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <mat-icon *ngIf="element.isClosed=='1';" matTooltip="Is Closed"
                        style="color: rgb(41, 129, 12);">copyright</mat-icon>
                    <mat-icon *ngIf="!element.isClosed=='1';" matTooltip="Pending"
                        style="color: brown;">hourglass_full</mat-icon>
                </div>
            </ng-template>

            <airmid-table [gridConfig]="gridConfig" class="content" (onSelectRow)="GetDetails1($event)" #grid>

                <ng-container filters>
                    <form [formGroup]="IssueSearchGroup" fxLayout="column">
                        <airmid-datepicker [formGroup]="IssueSearchGroup" [isRangePicker]="true"
                            formStartControlName="startdate" formEndControlName="enddate"
                            [(fromValue)]="gridConfig.filters[0].fieldValue" (dateChange)="ListView($event)"
                            [(toValue)]="gridConfig.filters[1].fieldValue">
                        </airmid-datepicker>

                        <airmid-dropdown label="From Store Name" formControlName="FromStoreId"
                            (selectionChange)="ListView($event)" [formGroup]="IssueSearchGroup"
                            [mode]="autocompletestore">
                        </airmid-dropdown>

                        <airmid-dropdown label="To Store Name" formControlName="ToStoreId"
                            (selectionChange)="ListView1($event)" [formGroup]="IssueSearchGroup"
                            [mode]="autocompletestore">
                        </airmid-dropdown>


                        <mat-slide-toggle name="IsClosed" (change)="onChangeFirst($event)" formControlName="IsClosed">
                            Pending / Close
                        </mat-slide-toggle>

                    </form>
                </ng-container>
            </airmid-table>
        </div>
        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll" *ngIf="isShowDetailTable">
            <ng-template #detailstatus let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                 

                    <div matTooltip="Accepted" class="pill1 green-600 s-18">
                        {{element.status}}
                    </div>

                </div>
            </ng-template>
            <ng-template #statusTable2 let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <mat-icon *ngIf="element.status=='A'" matTooltip="Accepted"
                        style="color: rgb(41, 129, 12);">check_circle</mat-icon>
                    <mat-icon *ngIf="element.status=='0'" matTooltip="Pending"
                        style="color: brown;">hourglass_full</mat-icon>
                </div>
            </ng-template>
            <airmid-table [gridConfig]="gridConfig1" class="content" #grid1 :ShowFilter="false">
            </airmid-table>
        </div>
    </div>

</div>
