<div class="modal-page page-layout inner-scroll">
    <div class="modal-wrapper grid-container">

        <div class="modal-header accent">
            <div class="modal-header-content">
                <div class="modal-header-title">
                    <span [@animate]="{ value: '*', params: { delay: '100ms', x: '-25px' } }">Indent</span>
                </div>
                <div class="modal-header-right">
                    <div class="comman-date-container">
                        <div class="close-icon">
                            <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                                matTooltip="Close">
                                <mat-icon>close</mat-icon>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="content">
            <div class="center p-12 pb-56" fxFlexAlign="start center">

                <div class="content-card" style="border-radius:4px; ">

                    <div class="nav material2">
                        <div fxLayout="column" fxLayoutAlign="start none" fxLayoutGap="10px">
                            <from [formGroup]="IndentSaveFrom">
                                <div fxFlexFill fxLayout="row" fxLayoutGap="8px">
                                    <airmid-dropdown label="From Store Name" formControlName="FromStoreId" fxFlex="30%"
                                        [formGroup]="IndentSaveFrom" [validations]="getValidationMessages().FromStoreId"
                                        [readonly]="true" [value]="data?.FromStoreId" [mode]="autocompletestore"
                                        >
                                        <!--  (selectionChange)="selectChangeStore($event)" -->
                                    </airmid-dropdown>

                                    <airmid-dropdown label="To Store Name" formControlName="ToStoreId" fxFlex="30%"
                                        [formGroup]="IndentSaveFrom" [validations]="getValidationMessages().ToStoreId"
                                        [value]="data?.ToStoreId" [mode]="autocompletestore"   (selectionChange)="selectChangeStore($event)">
                                    </airmid-dropdown>
                                    <!-- [(ngModel)]="status" -->
                                    <mat-slide-toggle name="IsUrgent" (change)="setpriority($event)"
                                        formControlName="priority" style="font-weight: bolder;padding: 10px;">
                                        Urgent
                                    </mat-slide-toggle>
                                </div>
                            </from>

                            
                            <form [formGroup]="IndentForm">
                                <div  fxLayout="row" fxLayoutGap="8px">
                                    <airmid-autocomplete label="Item Name (enter 2 char)" [formGroup]="IndentForm"
                                        formControlName="ItemName" placeholderText="Item Name (enter 2 char)"
                                        [ApiUrl]="'ItemMaster/search-GetItemListForIndent?StoreId=' + vstoreId + '&ItemName='"
                                        
                                        fxFlex="38%"
                                        (selectionChange)="getSelectedItem($event)" TextField="itemName"
                                        ValueField="itemId" (onClearSelection)="resetFormItem()"></airmid-autocomplete>

                                    <airmid-textbox fxFlex="6%" label="Qty" formControlName="Qty"
                                        (keypress)="keyPressAlphanumeric($event)" [formGroup]="IndentForm"
                                        [validations]="getValidationMessages().Qty" [maxLength]="10">
                                    </airmid-textbox> 

                                    <div matTooltip="Select All Value to enable this button!!" style="padding: 2px;">
                                        <button class="btn btn-primary" (click)="onAdd()">
                                            <mat-icon>add</mat-icon>
                                        </button>
                                    </div>

                                    <!-- <div class="vertical" fxLayoutGap="8px"> -->

                                        <!-- <mat-form-field appearance="outline" fxFlex="48%">
                                            <mat-label>Search by Item Kit</mat-label>
                                            <mat-select ngModel disabled>
                                                <mat-option>Search by Item Kit</mat-option>
                                            </mat-select>
                                        </mat-form-field> -->

                                                    <!-- <airmid-autocomplete label="Item Name (enter 2 char)" [formGroup]="IndentForm"
                                                        formControlName="ItemName" placeholderText="Item Name (enter 2 char)"
                                                        fxFlex="38%" ApiUrl="ItemMaster/GetItemListForGRNOrPO?StoreId=2&ItemName="
                                                        (selectionChange)="getSelectedItem($event)" TextField="formattedText"
                                                        ValueField="itemId"
                                                        (onClearSelection)="resetFormItem()"></airmid-autocomplete> -->


                                        <!-- <mat-form-field appearance="outline" fxFlex="8%">
                                            <mat-label>Qty</mat-label>
                                            <input name="Qty" formControlName="Qty" matInput [(ngModel)]="Qty">
                                        </mat-form-field>&nbsp;&nbsp; -->

                                                    <!-- <airmid-textbox fxFlex="6%" label="Qty" formControlName="Qty"
                                                        (keypress)="keyPressAlphanumeric($event)" [formGroup]="IndentForm"
                                                        [validations]="getValidationMessages().Qty" [maxLength]="10">
                                                    </airmid-textbox> -->

                                        <!-- <div>
                                            <button mat-raised-button (click)="onAdd()">Add</button>
                                        </div> -->

                                                    <!-- <div matTooltip="Select All Value to enable this button!!"
                                                        style="padding: 2px;">
                                                        <button class="btn btn-primary" (click)="onAdd()">
                                                            <mat-icon>add</mat-icon>
                                                        </button>
                                                    </div> -->
                                    <!-- </div> -->
                                </div>
                            </form>
                        </div>

                    </div>

                    <div fxFlexFill fxLayout="column" fxLayout.gt-xs="row">
                        <div fxFlex.gt-sm="100%" fxFlex>

                            <div fxlayout="row">

                                <div class="airmid-table-container">
                                    <mat-table matSort [dataSource]="dsIndentNameList" [@animateStagger]="{value:'50'}"
                                        class="airmid-table ">

                                        <ng-container matColumnDef="ItemID">
                                            <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm class="w-200">
                                                Item Code</mat-header-cell>
                                            <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-200">
                                                {{contact.ItemID}}
                                            </mat-cell>
                                        </ng-container>

                                        <ng-container matColumnDef="ItemName">
                                            <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm
                                                class="w-450">
                                                Item Name
                                            </mat-header-cell>
                                            <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-450">
                                                {{contact.ItemName}}
                                            </mat-cell>
                                        </ng-container>

                                        <!-- <ng-container matColumnDef="IndentQuantity">
                                            <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm
                                                class="w-200">
                                                Indent Quantity</mat-header-cell>
                                            <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-200">
                                                {{contact.Qty}}
                                            </mat-cell>
                                        </ng-container> -->

                                        <ng-container matColumnDef="IndentQuantity">
                                            <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm
                                                class="w-200">Indent Qty</mat-header-cell>
                                            <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-200">
                                                <mat-form-field appearance="fill">
                                                    <input matInput [(ngModel)]="contact.Qty" type="number" OnlyNumber
                                                        (input)="getCellCalculation(contact,contact.Qty,1)" [min]="0" />
                                                </mat-form-field>

                                            </mat-cell>
                                        </ng-container>


                                        <ng-container matColumnDef="VerifyQuantity">
                                            <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm
                                                class="w-200">Verify Qty</mat-header-cell>
                                            <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-200">
                                                <mat-form-field appearance="fill">
                                                    <input matInput type="number" OnlyNumber [(ngModel)]="contact.Qty"
                                                        (input)="getCellCalculation(contact,contact.VerifyQuantity,2)" [min]="0"/>
                                                </mat-form-field>

                                            </mat-cell>
                                        </ng-container>

                                        <ng-container matColumnDef="Action">
                                            <mat-header-cell *matHeaderCellDef style="color: white;" class="w-200">
                                                Action</mat-header-cell>
                                            <mat-cell *matCellDef="let row" class="w-200">
                                                <button mat-icon-button (click)="deleteTableRow(row)" color="warn">
                                                    <mat-icon>delete_outline</mat-icon>
                                                </button>
                                            </mat-cell>
                                        </ng-container>

                                        <ng-container matColumnDef="loading">
                                            <mat-header-cell *matFooterCellDef colspan="6" style="display: none;">
                                            </mat-header-cell>
                                        </ng-container>

                                        <!-- <ng-container matColumnDef="noData">
                                            <mat-footer-cell *matFooterCellDef colspan="6">
                                                no data found...
                                            </mat-footer-cell>
                                        </ng-container>


                                        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"
                                            class="accent"></mat-header-row>
                                        <mat-row *matRowDef="let contact; columns: displayedColumns"
                                            style="height: 40px;"
                                            [@animate]="{ value: '*', params: { y: '100%' } }"></mat-row>
                                        <mat-footer-row *matFooterRowDef="['loading']"
                                            [ngClass]="{ hide: dsIndentNameList != null }"></mat-footer-row>
                                        <mat-footer-row *matFooterRowDef="['noData']"
                                            [ngClass]="{ hide: !(dsIndentNameList != null && dsIndentNameList.data.length == 0) }"></mat-footer-row> -->


                                        <ng-container matColumnDef="NoData">
                                            <mat-footer-cell *matFooterCellDef>
                                                <span>No Data Found</span>
                                            </mat-footer-cell>
                                        </ng-container>

                                        <mat-header-row class="accent min-width-1350"
                                            *matHeaderRowDef="displayedColumns; sticky: true">
                                        </mat-header-row>
                                        <mat-row *matRowDef="let contact; columns: displayedColumns;"
                                            [@animate]="{value:'*',params:{y:'100%'}}"></mat-row>
                                        <mat-footer-row *matFooterRowDef="['NoData']"
                                            [ngClass]="{'hide':dsIndentNameList.data.length > 0}"></mat-footer-row>

                                    </mat-table>

                                    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [pageSize]="16"
                                        showFirstLastButtons>
                                    </mat-paginator>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
        <div style="margin-top: 10px;">
            <form [formGroup]="IndentSaveFrom">
                <div fxLayout="row" fxLayoutAlign="space-between">

                    <mat-form-field appearance="outline" fxFlex="50%" style="margin-left: 20px;">
                        <mat-label>Remark</mat-label>
                        <input name="Remark" formControlName="comments" [(ngModel)]="vRemark" matInput
                            [maxLength]="500">
                    </mat-form-field>

                    <div class="sales-footer-buttons gap-8" fxLayout="row" fxLayoutAlign="center center"
                        fxFlexAlign="center" style="margin-left: 30px;margin-right: 20px;">
                        <button class="btn btn-danger-outline" (click)="onClose()">Close</button>
                        <button class="btn btn-primary" (click)="OnSave()">Save</button>
                        <button class="btn btn-danger-outline" (click)="OnReset()">Reset</button>

                    </div>

                </div>

            </form>

        </div>
    </div>
