<div class="modal-page page-layout inner-scroll resize-form-fields padding-fix" dynamicTableHeight>
  <div class="modal-wrapper grid-container">
    <div class="modal-header accent">
      <div class="modal-header-content">
        <div class="modal-header-title">
          <span [@animate]="{ value: '*', params: { delay: '100ms', x: '-25px' } }">Indent</span>
        </div>
        <div class="modal-header-right">
          <div class="comman-date-container">
            <div class="close-icon">
              <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog" matTooltip="Close">
                <mat-icon>close</mat-icon>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-body content">
      <div fxLayout="column" class="gap-8 h-100-p">
        <div class="modal-card-container">
          <div fxLayout="column">
            <form [formGroup]="IndentSaveFrom" style="width: 100%">
              <div fxLayout="row wrap" fxLayoutGap="16px" fxLayoutAlign="start stretch">
                <!-- Store From Dropdown -->
                <airmid-dropdown
                  label="From Store Name"
                  formControlName="FromStoreId"
                  [formGroup]="IndentSaveFrom"
                  [validations]="getValidationMessages().FromStoreId"
                  [readonly]="true"
                  [value]="data?.FromStoreId"
                  [mode]="autocompletestore"
                  fxFlex="30%"
                ></airmid-dropdown>

                <!-- Store To Dropdown -->
                <airmid-dropdown
                  label="To Store Name"
                  formControlName="ToStoreId"
                  [formGroup]="IndentSaveFrom"
                  [validations]="getValidationMessages().ToStoreId"
                  [value]="data?.ToStoreId"
                  [mode]="autocompletestore"
                  (selectionChange)="selectChangeStore($event)"
                  fxFlex="30%"
                ></airmid-dropdown>

                <!-- Urgent Toggle -->
                <mat-slide-toggle name="IsUrgent" (change)="setpriority($event)" formControlName="priority" style="font-weight: bolder; padding: 10px" fxFlex="30%">Urgent</mat-slide-toggle>
              </div>
            </form>
          </div>
        </div>
        <div class="modal-card-container">
          <div fxLayout="column">
            <form [formGroup]="IndentForm" style="width: 100%">
              <div fxLayout="row wrap" fxLayoutGap="16px" fxLayoutAlign="start stretch">
                <!-- Item Autocomplete -->
                <airmid-autocomplete
                  label="Item Name (enter 2 char)"
                  [formGroup]="IndentForm"
                  formControlName="ItemName"
                  placeholderText="Item Name (enter 2 char)"
                  [ApiUrl]="'ItemMaster/search-GetItemListForIndent?StoreId=' + vstoreId + '&ItemName='"
                  fxFlex="38%"
                  (selectionChange)="getSelectedItem($event)"
                  TextField="itemName"
                  ValueField="itemId"
                  (onClearSelection)="resetFormItem()"
                ></airmid-autocomplete>

                <!-- Quantity Textbox -->
                <airmid-textbox
                  fxFlex="10%"
                  label="Qty"
                  formControlName="Qty"
                  (keypress)="keyPressAlphanumeric($event)"
                  [formGroup]="IndentForm"
                  [validations]="getValidationMessages().Qty"
                  [maxLength]="10"
                ></airmid-textbox>

                <!-- Add Button -->
                <div>
                  <button class="btn btn-primary" (click)="onAdd()" style="padding: 6px">
                    <mat-icon>add</mat-icon>
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
        <div class="modal-card-container" fxFlex fxLayout="column" fxLayoutGap="8px">
          <div class="airmid-table-container py-12" fxFlex style="min-height: 0; overflow-y: auto; overflow-x: auto">
            <mat-table matSort [dataSource]="dsIndentNameList" [@animateStagger]="{ value: '50' }" class="airmid-table">
              <ng-container matColumnDef="ItemID">
                <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm class="w-200">Item Code</mat-header-cell>
                <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-200">
                  {{ contact.ItemID }}
                </mat-cell>
              </ng-container>

              <ng-container matColumnDef="ItemName">
                <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm class="w-450">Item Name</mat-header-cell>
                <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-450">
                  {{ contact.ItemName }}
                </mat-cell>
              </ng-container>

              <!-- <ng-container matColumnDef="IndentQuantity">
                                                    <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm
                                                        class="w-200">
                                                        Indent Quantity</mat-header-cell>
                                                    <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-200">
                                                        {{contact.Qty}}
                                                    </mat-cell>
                                                </ng-container> -->

              <ng-container matColumnDef="IndentQuantity">
                <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm class="w-200">Indent Qty</mat-header-cell>
                <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-200">
                  <mat-form-field floatLabel="never">
                    <input matInput [(ngModel)]="contact.Qty" type="text" OnlyNumber
                     (input)="getCellCalculation(contact, contact.Qty, 1)" [min]="0"
                      (keypress)="keyPressDigitsOnly($event)" />
                  </mat-form-field>
                </mat-cell>
              </ng-container>

              <ng-container matColumnDef="VerifyQuantity">
                <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm class="w-200">Verify Qty</mat-header-cell>
                <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-200">
                  <mat-form-field floatLabel="never">
                    <input matInput type="text" OnlyNumber [(ngModel)]="contact.Qty" 
                    (input)="getCellCalculation(contact, contact.VerifyQuantity, 2)" [min]="0" 
                    (keypress)="keyPressDigitsOnly($event)" />
                  </mat-form-field>
                </mat-cell>
              </ng-container>

              <ng-container matColumnDef="Action">
                <mat-header-cell *matHeaderCellDef style="color: white" class="w-200">Action</mat-header-cell>
                <mat-cell *matCellDef="let row" class="w-200">
                  <button mat-icon-button (click)="deleteTableRow(row)" color="warn">
                    <mat-icon>delete_outline</mat-icon>
                  </button>
                </mat-cell>
              </ng-container>

              <ng-container matColumnDef="loading">
                <mat-header-cell *matFooterCellDef colspan="6" style="display: none"></mat-header-cell>
              </ng-container>

              <!-- <ng-container matColumnDef="noData">
                                                    <mat-footer-cell *matFooterCellDef colspan="6">
                                                        no data found...
                                                    </mat-footer-cell>
                                                </ng-container>
        
        
                                                <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"
                                                    class="accent"></mat-header-row>
                                                <mat-row *matRowDef="let contact; columns: displayedColumns"
                                                    style="height: 40px;"
                                                    [@animate]="{ value: '*', params: { y: '100%' } }"></mat-row>
                                                <mat-footer-row *matFooterRowDef="['loading']"
                                                    [ngClass]="{ hide: dsIndentNameList != null }"></mat-footer-row>
                                                <mat-footer-row *matFooterRowDef="['noData']"
                                                    [ngClass]="{ hide: !(dsIndentNameList != null && dsIndentNameList.data.length == 0) }"></mat-footer-row> -->

              <ng-container matColumnDef="NoData">
                <mat-footer-cell *matFooterCellDef>
                  <span>No Data Found</span>
                </mat-footer-cell>
              </ng-container>

              <mat-header-row class="accent min-width-1350" *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
              <mat-row *matRowDef="let contact; columns: displayedColumns" [@animate]="{ value: '*', params: { y: '100%' } }"></mat-row>
              <mat-footer-row *matFooterRowDef="['NoData']" [ngClass]="{ hide: dsIndentNameList.data.length > 0 }"></mat-footer-row>
            </mat-table>
          </div>
          <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [pageSize]="16" showFirstLastButtons></mat-paginator>
        </div>
      </div>
    </div>

    <div class="modal-footer" fxLayout="column">
      <div class="modal-card-container">
        <form [formGroup]="IndentSaveFrom">
          <div fxLayout="row" fxLayoutAlign="space-between">
            <mat-form-field appearance="outline" fxFlex="50%" style="margin-left: 20px">
              <mat-label>Remark</mat-label>
              <input name="Remark" formControlName="comments" [(ngModel)]="vRemark" matInput [maxLength]="500" />
            </mat-form-field>

            <div class="sales-footer-buttons gap-8" fxLayout="row" fxLayoutAlign="center center" fxFlexAlign="center" style="margin-left: 30px; margin-right: 20px">
              <button class="btn btn-danger-outline" (click)="onClose()">Close</button>
              <button class="btn btn-primary" (click)="OnSave()" [disabled]="isSaving">Save</button>
              <button class="btn btn-danger-outline" (click)="OnReset()">Reset</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
