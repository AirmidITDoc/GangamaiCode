<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" style="height: 100%;" fusePerfectScrollbar
    dynamicTableHeight>
    <mat-toolbar class="top-header accent">
        <div fxLayout="row" fxLayoutAlign="start center" class="top-header-info">
            <button mat-icon-button class="sidebar-toggle ">
                <mat-icon>menu</mat-icon>
            </button>
            <mat-icon class="logo-icon" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}">account_box
            </mat-icon>
            <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                Item Movement
            </span>
        </div>
    </mat-toolbar>
    <div fusePerfectScrollbar
        class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
        dynamicTableHeight>

        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
            <airmid-table [gridConfig]="gridConfig" class="content" #grid>
                <ng-container filters>

                    <form [formGroup]="_ItemMovemnentService.ItemSearchGroup">
                        <!-- <airmid-datepicker [formGroup]="_ItemMovemnentService.ItemSearchGroup" [isRangePicker]="true"
                            formStartControlName="start" formEndControlName="end"
                            [(fromValue)]="gridConfig.filters[0].fieldValue"
                            [(toValue)]="gridConfig.filters[1].fieldValue">
                        </airmid-datepicker> -->

                        <airmid-datepicker [formGroup]="_ItemMovemnentService.ItemSearchGroup" [isRangePicker]="true"
                            formStartControlName="start" formEndControlName="end"
                            [(fromValue)]="gridConfig.filters[0].fieldValue"
                            [(toValue)]="gridConfig.filters[1].fieldValue">
                        </airmid-datepicker>

                        <airmid-dropdown label="From Store" formControlName="FromStoreId"
                            (selectionChange)="onChangeFirst()" [formGroup]="_ItemMovemnentService.ItemSearchGroup"
                            [mode]="autocompletestore" [readonly]="true">
                        </airmid-dropdown>

                        <airmid-dropdown label="To Store" formControlName="ToStoreId"
                            (selectionChange)="onChangeFirst()" [formGroup]="_ItemMovemnentService.ItemSearchGroup"
                            [(ngModel)]="gridConfig.filters[4].fieldValue"
                            [mode]="autocompletestore" (selectionChange)="selectChangeStore($event)">
                        </airmid-dropdown>

                        <!-- changed by raksha api name-->
                        <airmid-autocomplete label="Item Name" [formGroup]="_ItemMovemnentService.ItemSearchGroup"
                            formControlName="ItemID" (onClearSelection)="ItemFromReset()"
                            [ApiUrl]="'ItemMaster/GetItemListForGRNOrPO?StoreId=' + storeId + '&ItemName='"
                            (selectionChange)="selectChangeItem($event)" TextField="formattedText" ValueField="ItemId">
                        </airmid-autocomplete>

                        <!-- <airmid-autocomplete label="Item Name" [formGroup]="_ItemMovemnentService.ItemSearchGroup"
                            formControlName="ItemID"
                            [ApiUrl]="'ItemMaster/GetItemListForPrescription?StoreId=' + TostoreId + '&ItemName='"
                            (selectionChange)="selectChangeItem($event)" TextField="formattedText" ValueField="ItemId">
                        </airmid-autocomplete> -->

                        <mat-form-field appearance="outline">
                            <mat-label>BatchNo</mat-label>
                            <input matInput placeholder="Search Batch" autocomplete="off" (input)="onChangeFirst()"
                                [formGroup]="_ItemMovemnentService.ItemSearchGroup" formControlName="BatchNo" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('BatchNo')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>
                    </form>
                </ng-container>
            </airmid-table>
        </div>
    </div>
</div>
