<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" style="height: 100%;" fusePerfectScrollbar
    dynamicTableHeight>

    <mat-tab-group mat-align-tabs="start" mat-stretch-tabs="false">
       
        <mat-tab label="Lab Bill Cancellation">
            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>

                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

                    <ng-template #ColorCodeCancel let-element>
                        <div fxLayout="row" fxLayoutAlign="center center">
                            <mat-icon *ngIf="element.isCancelled=='0'" matTooltip="NotCancelled"
                                class="pill blue-600 s-16">circle</mat-icon>
                            <mat-icon *ngIf="element.isCancelled=='1'" matTooltip="Cancelled"
                                class="pill red-600 s-16">circle
                            </mat-icon>
                        </div>
                    </ng-template>

                    <ng-template #actionButtonTemplate let-element>
                        <div fxLayout="row" fxLayoutAlign="center center">

                            <button class="btn btn-primary" *ngIf="element.isCancelled =='0'"
                                (click)="OnUpdate(element)" matTooltip="Bill Date Update">
                                BillDate
                            </button>&nbsp;
                            <button class="btn btn-danger" *ngIf="element.isCancelled =='0'"
                                (click)="openCancelBill(element,OP)" matTooltip="Cancle Bill" style="color: white;">
                                Bill
                                Cancel
                            </button>
                        </div>
                    </ng-template>

                    <airmid-table [gridConfig]="gridConfig" class="content" #labCan>
                        <ng-container filters>
                            <form [formGroup]="myFilterbillform" fxLayout="column" class="resize-form-fields">
                                <airmid-dropdown label="Unit Name" formControlName="UnitId" [readonly]="!isSuperAdmin"
                                    (selectionChange)="ListViewUnit1($event)"
                                    [(ngModel)]="gridConfig.filters[7].fieldValue" [formGroup]="myFilterbillform"
                                    [mode]="autocompleteModeunit"></airmid-dropdown>

                                <airmid-datepicker [formGroup]="myFilterbillform" [isRangePicker]="true"
                                    formStartControlName="fromDate" formEndControlName="enddate"
                                    [(fromValue)]="gridConfig.filters[2].fieldValue"
                                    [(toValue)]="gridConfig.filters[3].fieldValue"></airmid-datepicker>

                                <mat-form-field appearance="outline">
                                    <mat-label>First Name</mat-label>
                                    <input matInput placeholder="Search First Name" autocomplete="off"
                                        [formGroup]="myFilterbillform" formControlName="FirstName"
                                        (input)="onChangeLabCan()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterLabCan('FirstName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">
                                    <mat-label>Last Name</mat-label>
                                    <input matInput placeholder="Search Last Name" autocomplete="off"
                                        [formGroup]="myFilterbillform" formControlName="LastName"
                                        (input)="onChangeLabCan()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterLabCan('LastName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">
                                    <mat-label>PBillNo</mat-label>
                                    <input matInput placeholder="Search PBillNo" autocomplete="off"
                                        [formGroup]="myFilterbillform" formControlName="PBillNo"
                                        (keypress)="keyPressAlphanumeric($event)" (input)="onChangeLabCan()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterLabCan('PBillNo')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">
                                    <mat-label>UHID</mat-label>
                                    <input matInput placeholder="Search UHID" autocomplete="off"
                                        [formGroup]="myFilterbillform" formControlName="RegNo"
                                        (keypress)="keyPressAlphanumeric($event)" (input)="onChangeLabCan()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterLabCan('RegNo')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <airmid-dropdown label="Company Name" formControlName="CompanyId"
                                    [formGroup]="myFilterbillform" [(ngModel)]="gridConfig.filters[6].fieldValue"
                                    (selectionChange)="ListView($event)"
                                    [mode]="autocompleteModecompany"></airmid-dropdown>

                                <div fxFlexFill fxLayout="column" class="gap-8">
                                    <div fxLayout="row" class="gap-4">
                                        <mat-icon matTooltip="NotCancelled" class="pill blue-600 s-16">circle</mat-icon>
                                        <span class="blue-600-fg">NotCancelled</span>
                                    </div>
                                    <div fxLayout="row" class="gap-4">
                                        <mat-icon matTooltip="Cancelled" class="pill red-600 s-16">circle</mat-icon>
                                        <span class="red-600-fg">Cancelled</span>
                                    </div>
                                </div>
                            </form>
                        </ng-container>
                    </airmid-table>
                </div>
            </div>
        </mat-tab>

        <mat-tab label="Refund Of Lab Bill">
            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>

                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
                    <ng-template #actionButtonTemplateIPRefundBill let-element>
                        <div fxLayout="row" fxLayoutAlign="center center">

                            <button class="btn btn-primary" (click)="OnUpdate(element)" matTooltip="Bill Date Update">
                                Date Update
                            </button>
                        </div>
                    </ng-template>
                    <airmid-table [gridConfig]="gridConfig2" class="content" #labRefund>
                        <ng-container filters>
                            <form [formGroup]="myFilterrefundform" class="resize-form-fields">
                                <airmid-dropdown label="Unit Name" formControlName="UnitId" [readonly]="!isSuperAdmin"
                                    (selectionChange)="ListViewUnit3($event)"
                                    [(ngModel)]="gridConfig2.filters[5].fieldValue" [formGroup]="myFilterrefundform"
                                    [mode]="autocompleteModeunit"></airmid-dropdown>

                                <airmid-datepicker [formGroup]="myFilterrefundform" [isRangePicker]="true"
                                    formStartControlName="fromDate" formEndControlName="enddate"
                                    [(fromValue)]="gridConfig2.filters[2].fieldValue"
                                    [(toValue)]="gridConfig2.filters[3].fieldValue"></airmid-datepicker>

                                <mat-form-field appearance="outline">
                                    <mat-label>First Name</mat-label>
                                    <input matInput placeholder="Search First Name" autocomplete="off"
                                        [formGroup]="myFilterrefundform" formControlName="FirstName"
                                        (input)="onChangeOPRefund()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterOPRefund('FirstName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">
                                    <mat-label>Last Name</mat-label>
                                    <input matInput placeholder="Search Last Name" autocomplete="off"
                                        [formGroup]="myFilterrefundform" formControlName="LastName"
                                        (input)="onChangeOPRefund()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterOPRefund('LastName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">
                                    <mat-label>UHID</mat-label>
                                    <input matInput placeholder="Search UHID" autocomplete="off"
                                        [formGroup]="myFilterrefundform" formControlName="RegNo"
                                        (keypress)="keyPressAlphanumeric($event)" (input)="onChangeOPRefund()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterOPRefund('RegNo')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <mat-form-field appearance="outline">
                                    <mat-label>RefundNo</mat-label>
                                    <input matInput placeholder="Search RefundNo" autocomplete="off"
                                        [formGroup]="myFilterrefundform" formControlName="RefundNo"
                                        (keypress)="keyPressAlphanumeric($event)" (input)="onChangeOPRefund()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" ClearfilterOPRefund('RefundNo')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <airmid-dropdown label="Company Name" formControlName="CompanyId"
                                    [formGroup]="myFilterrefundform" [(ngModel)]="gridConfig2.filters[7].fieldValue"
                                    (selectionChange)="ListView1($event)"
                                    [mode]="autocompleteModecompany1"></airmid-dropdown>

                            </form>
                        </ng-container>
                    </airmid-table>
                </div>
            </div>

        </mat-tab>

    </mat-tab-group>
</div>

    <div class="modal-page page-layout inner-scroll" #CancelReasone>
        <div class="modal-wrapper grid-container">
            <div class="modal-header accent">
                <div class="modal-header-content">
                    <div class="modal-header-title">
                        <mat-icon class="logo-icon mr-16" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}"
                            style="color: white;">account_box
                        </mat-icon>
                        <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}"
                            style="color: white;">
                            Bill Cancel
                        </span>
                    </div>

                    <div class="close-icon">
                        <button mat-icon-button [mat-dialog-close]="true" aria-label="Close dialog" matTooltip="Close">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-body">
                <div fxLayout="column" class="gap-8 h-100-p">
                    <div class="modal-body-container">
                        <div class="modal-card-container">
                            <div fxLayout="column" fxLayoutGap="6px">
                                <span>Please Enter Bill Cancel Reason</span>
                                <mat-form-field appearance="outline" fxFlex>
                                    <mat-label>Reason</mat-label>
                                    <textarea rows="7" matInput name="Body" placeholder="Write here......" id="Body"
                                        type="text" required [(ngModel)]="VReason"></textarea>
                                </mat-form-field>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="modal-footer-buttons" fxLayout="row" fxLayoutAlign="end" fxLayoutGap="6px">
                    <button class="btn btn-primary" (click)="OnSaveCancelBill()">Save</button>
                </div>
            </div>
        </div>
    </div>


</ng-template>
