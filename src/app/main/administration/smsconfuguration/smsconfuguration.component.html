        <mat-tab label="WhatsApp Send List">

            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>
                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

                    <airmid-table [gridConfig]="gridConfig1" class="content" #grid1>
                        <ng-container filters>
                            <form [formGroup]="whatsappfilterForm">

                                <airmid-datepicker [formGroup]="whatsappfilterForm" [isRangePicker]="true"
                                    formStartControlName="fromDate" formEndControlName="enddate"
                                    [(fromValue)]="gridConfig1.filters[1].fieldValue"
                                    [(toValue)]="gridConfig1.filters[2].fieldValue">
                                </airmid-datepicker>

                                <mat-form-field appearance="outline">
                                    <mat-label>Mobile No</mat-label>
                                    <input matInput placeholder="Search Mobile" autocomplete="off"
                                        [formGroup]="whatsappfilterForm" formControlName="Mobile"
                                        (input)="onChangewhatsapp()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" Clearfilterwhatsapp('Mobile')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>


                            </form>
                        </ng-container>
                    </airmid-table>
                </div>
            </div>

        </mat-tab>


        <mat-tab label="Email Status Detail List">

            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>
                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">


                    <!-- <ng-template #actionisSendMail let-element>

                            </mat-icon>
                        </div>
                    </ng-template> -->

                    <airmid-table [gridConfig]="gridConfig2" class="content" #grid2>
                        <ng-container filters>
                            <form [formGroup]="emailfilterForm">
                                <airmid-datepicker [formGroup]="emailfilterForm" [isRangePicker]="true"
                                    formStartControlName="fromDate" formEndControlName="enddate"
                                    [(fromValue)]="gridConfig2.filters[0].fieldValue"
                                    [(toValue)]="gridConfig2.filters[1].fieldValue">
                                </airmid-datepicker>
                            </form>
                        </ng-container>
                    </airmid-table>
                </div>
            </div>

        </mat-tab>

        <mat-tab label="Audit Log Detail List">

            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>
                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

                    <airmid-table [gridConfig]="gridConfig3" class="content" #auditgrid>
                        <ng-container filters>
                            <form [formGroup]="auditFilterForm">

                                <airmid-datepicker [formGroup]="auditFilterForm" [isRangePicker]="true"
                                    formStartControlName="fromDate" formEndControlName="enddate"
                                    [(fromValue)]="gridConfig3.filters[1].fieldValue"
                                    [(toValue)]="gridConfig3.filters[2].fieldValue">
                                </airmid-datepicker>

                                <mat-form-field appearance="outline">
                                    <mat-label>Search Name</mat-label>
                                    <input matInput placeholder="Search ByName" autocomplete="off"
                                        [formGroup]="auditFilterForm" formControlName="ActionByName"
                                        (input)="onChangeaudit()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)="Clearfilteraudit('ActionByName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>


                            </form>
                        </ng-container>
                    </airmid-table>
                </div>
            </div>

        </mat-tab>



    </mat-tab-group>


</div>
