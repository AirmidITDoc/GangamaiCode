  
        <div class="simple page-layout modal-wrapper grid-container"> 
            <div class="modal-header accent">
                <div class="modal-header-content">
                    <div class="modal-header-title">
                        <button mat-icon-button class="sidebar-toggle mr-12" style="color: white;">
                            <mat-icon>menu</mat-icon>
                        </button> 
                        <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}"
                            style="color: white;">
                           SMS PDF Configuration
                        </span>
                    </div>
                    <div class="modal-header-right">
                        <div class="close-icon">
                            <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                                matTooltip="Close">
                                <mat-icon>close</mat-icon>
                            </button>
                        </div>
                    </div>
                </div>
            </div> 
            <div class="modal-body">
                 <div class="modal-body-container">
                <div class="h-100-p" fxLayout="column"> 
                    <div class="modal-card-container">
                        <div fxLayout="column" class="gap-8 h-100-p">  
                            <form [formGroup]="SearchGroupForm">
                            <div fxLayout="column" class="gap-8 h-100-p">
                                <div fxFlexFill fxLayout="column">  

                                <airmid-textbox fxFlex label="smsType" formControlName="type" placeholder="Enter Sms Type..."
                                [formGroup]="SearchGroupForm"   [validations]="getValidationMessages().type">
                               </airmid-textbox> 

                                <airmid-textbox fxFlex label="Pdf Mode Name" formControlName="pdfModeName" placeholder="Enter Pdf Mode Name..."
                                [formGroup]="SearchGroupForm"   [validations]="getValidationMessages().pdfModeName">
                               </airmid-textbox> 

                                <airmid-textbox fxFlex label="Field Name" formControlName="fieldName" placeholder="Enter Field name..."
                                [formGroup]="SearchGroupForm"   [validations]="getValidationMessages().fieldName">
                               </airmid-textbox> 

                                <mat-slide-toggle name="passwordProtectedPdf"  
                                    formControlName="passwordProtectedPdf"  >
                                         IsPasswordProtectedPdf
                                </mat-slide-toggle> 
                                </div>
                            </div>
                            </form> 
                        </div>
                    </div> 
                </div>
                </div> 
            </div> 
        
            <div class="modal-footer"  fxLayoutAlign="end">  
                <div class="modal-footer-buttons" fxLayoutGap="6px" >
                    <button class="btn btn-danger-outline" (click)="OnClose()">Close</button>
                    <button class="btn btn-primary"  (click)="OnSave()">Save</button>
                </div> 
            </div>
        </div>
