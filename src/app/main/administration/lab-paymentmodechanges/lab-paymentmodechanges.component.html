<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>

    <mat-toolbar style="height: 50px; justify-content: space-between;width: 100%;">
        <div fxLayout="row" fxLayoutAlign="start center">
            <mat-icon class="logo-icon mr-16" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}"
                style="color: white;">account_box</mat-icon>
            <span class="=logo-text h2" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}" style="color: white;">
                New Payment Mode Change
            </span>
        </div>
    </mat-toolbar>

    <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

        <ng-template #actionButtonTemplateOP1 let-element>
            <div fxLayout="row" fxLayoutAlign="center center">
                <button mat-icon-button matTooltip="Payment Date Update" (click)="PaymentDate(element,3)"
                    *ngIf="element.payAmount > 0">
                    <mat-icon> update </mat-icon>
                </button>

                <button mat-icon-button (click)="onEdit1(element)" matTooltip="Update PaymentMode"
                    *ngIf="element.payAmount > 0">
                    <img width="30" height="30" src="assets/images/logos/PaymentMode.png">
                </button>
            </div>
        </ng-template>

        <airmid-table [gridConfig]="gridConfigtPay" class="content">

            <ng-container filters>
                <form [formGroup]="_PaymentmodechangesService.tpayFormGroup" fxLayout="column" class="resize-form-fields">

                    <airmid-datepicker [formGroup]="_PaymentmodechangesService.tpayFormGroup" [isRangePicker]="true"
                        formStartControlName="startdate" formEndControlName="enddate"
                        [(fromValue)]="gridConfigtPay.filters[2].fieldValue"
                        [(toValue)]="gridConfigtPay.filters[3].fieldValue">
                    </airmid-datepicker>

                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>First Name</mat-label>
                        <input matInput placeholder="Search First Name" autocomplete="off" (input)="onChangetPay()"
                            formControlName="FirstName" />
                        <button matSuffix mat-icon-button aria-label="Clear" (click)=" ClearfiltertPay('FirstName')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>

                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>Last Name</mat-label>
                        <input matInput placeholder="Search Last Name" autocomplete="off" (input)="onChangetPay()"
                            formControlName="LastName" />
                        <button matSuffix mat-icon-button aria-label="Clear" (click)=" ClearfiltertPay('LastName')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>

                    <!-- <mat-form-field appearance="outline" fxFlex>
                        <mat-label>UHID No</mat-label>
                        <input matInput placeholder="Search UHID No" autocomplete="off" (input)="onChangetPay()"
                            formControlName="RegNo" />
                        <button matSuffix mat-icon-button aria-label="Clear" (click)=" ClearfiltertPay('RegNo')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field> -->

                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>PBill No</mat-label>
                        <input matInput placeholder="Search PBill No" autocomplete="off" (input)="onChangetPay()"
                            formControlName="PBillNo" />
                        <button matSuffix mat-icon-button aria-label="Clear" (click)=" ClearfiltertPay('PBillNo')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>

                    <mat-form-field appearance="outline" fxFlex>
                        <mat-label>Receipt No</mat-label>
                        <input matInput placeholder="Search Receipt No" autocomplete="off" (input)="onChangetPay()"
                            formControlName="ReceiptNo" />
                        <button matSuffix mat-icon-button aria-label="Clear" (click)="ClearfiltertPay('ReceiptNo')">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>

                </form>

            </ng-container>
        </airmid-table>
    </div>
</div>
