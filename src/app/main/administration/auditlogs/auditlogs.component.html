<div class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto">

    
    <!-- Header -->
    <mat-toolbar class="audit-header-toolbar">
        <span class="title">
            <mat-icon>history</mat-icon>
            Audit Logs
        </span>
        <span class="spacer"></span>
    </mat-toolbar>

     <div class="top-header accent">
            <div class="top-header-info">
                <mat-icon class="logo-icon"
                    [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}">medical_services</mat-icon>
                <mat-icon class="logo-icon mr-16" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}"
                    style="color: white;">menu
                </mat-icon>
                <div class="top-header-title" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    <span>CashLess Dashboard</span>
                </div>
            </div>

           

            <form [formGroup]="myformSearch" class="resize-form-fields">
                 
                <div class="date-filter-container">
                    <div class="info-badge-top p-12 border-bottom">
                        <div fxLayout="row wrap" fxLayoutAlign="space-between" flex>
                            <div fxLayout="row" fxLayoutAlign="start center" class="gap-8">
                                <div style="color: orange" fxLayout="row" fxLayoutAlign="start center" class="gap-4">
                                    <mat-icon class="pill orange-600 s-16">circle</mat-icon>
                                    <span class="orange-600-fg">OP Patient</span>
                                </div>
                                <div style="color: green" fxLayout="row" fxLayoutAlign="start center" class="gap-4">
                                    <mat-icon class="pill green-600 s-16">circle</mat-icon>
                                    <span class="green-600-fg">IP Patient</span>
                                </div>
                    
                            </div>
                        </div>
                    </div>
                    <mat-form-field appearance="outline">
                        <mat-label>Enter a date range</mat-label>
                        <mat-date-range-input [rangePicker]="picker">
                            <input matStartDate formControlName="fromDate" placeholder="Start date">
                            <input matEndDate formControlName="enddate" placeholder="End date">
                        </mat-date-range-input>
                        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-date-range-picker #picker></mat-date-range-picker>
                    </mat-form-field>
                    <button mat-raised-button color="primary" class="go-btn" (click)="onGetList()">Go</button>
                </div>
            </form>
        </div>



    <div class="audit-list" fusePerfectScrollbar>

        <mat-card class="audit-card" *ngFor="let log of pagedAuditLogs">

            <div class="audit-row">

                <span class="method-badge">
                    {{ getMethod(log.description) }}
                </span>

                <span class="audit-item">
                    <mat-icon>fingerprint</mat-icon>
                    {{ log.id }}
                </span>

                <span class="audit-item action-by">
                    <mat-icon>person</mat-icon>
                    {{ log.actionByName }}
                </span>

                <span class="audit-item entity-name" [matTooltip]="log.entityName">
                    <mat-icon>route</mat-icon>
                    {{ log.entityName }}
                </span>

                <span class="audit-item created-date">
                    <mat-icon>event</mat-icon>
                    {{ log.createdOn | date:'dd-MMM-yyyy hh:mm:ss a' }}
                </span>

            </div>

        </mat-card>

    </div>

    <mat-paginator [length]="totalRecords" [pageSize]="20" [pageSizeOptions]="[20, 50, 150, 200]" showFirstLastButtons
        (page)="onPageChange($event)">
    </mat-paginator>

</div>
