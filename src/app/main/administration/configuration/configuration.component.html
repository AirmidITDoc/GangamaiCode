<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" style="height: 100%;" fusePerfectScrollbar
    dynamicTableHeight>
    <mat-toolbar class="top-header accent">
        <div fxLayout="row" fxLayoutAlign="start center" class="top-header-info">
            <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                Config Manager
            </span>
        </div>
        <div>
            <button mat-raised-button (click)="getAutoservice()">
                <mat-icon>add</mat-icon>Auto Service
            </button>
        </div>
    </mat-toolbar>

    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">

        <mat-tab label="System Configuration List">

            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>

                <!-- <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
                    fxLayoutAlign.gt-xs="space-between center ">
                    <div class="top-header-info">
                        <div class="top-header-title">
                            <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                                System Configuration List
                            </span>
                        </div>
                    </div>
                </div> -->

                <div class="configuration-container" style="padding: 30px;">
                    <div style="width: 40%;">
                        <form [formGroup]="myConfigform">

                            <!-- Dynamic sections based on category names from data -->
                            <mat-card class="config-section-card" style="margin-bottom: 20px;"
                                *ngFor="let categoryName of getCategoryNames()">
                                <mat-card-header style="margin-bottom: 12px;">
                                    <mat-card-title style="font-size: 18px; font-weight: 500; color: #333;">
                                        {{ categoryName }}
                                    </mat-card-title>
                                </mat-card-header>
                                <mat-card-content>
                                    <mat-list>
                                        <mat-list-item *ngFor="let element of getConfigByName(categoryName)"
                                            style="height: auto; padding: 8px 0; border-bottom: 1px solid #f0f0f0;">
                                            <div
                                                style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                                                <div style="flex: 1;">
                                                    <span style="font-size: 14px; color: #555;">{{ element.SystemName
                                                        }}</span>
                                                    <mat-icon *ngIf="element.Description"
                                                        style="font-size: 18px; height: 18px; width: 18px; color: #999; margin-left: 8px; cursor: pointer; vertical-align: middle;"
                                                        [matTooltip]="element.Description">
                                                        info_outline
                                                    </mat-icon>
                                                </div>
                                                <div style="display: flex; align-items: center; gap: 16px;">
                                                    <!-- Input fields for specific configs -->
                                                    <mat-form-field
                                                        *ngIf="element.IsInputField && element.SystemName=='RegNo'"
                                                        appearance="outline" style="width: 200px;">
                                                        <input matInput [maxLength]="100"
                                                            (keypress)="keyPressCharater($event)"
                                                            formControlName="RegNo"
                                                            [(ngModel)]="element.SystemInputValue"
                                                            placeholder="Enter value" />
                                                    </mat-form-field>

                                                    <mat-form-field
                                                        *ngIf="element.IsInputField && element.SystemName=='OPDNo'"
                                                        appearance="outline" style="width: 200px;">
                                                        <input matInput [maxLength]="100"
                                                            (keypress)="keyPressCharater($event)"
                                                            formControlName="OPDNo"
                                                            [(ngModel)]="element.SystemInputValue"
                                                            placeholder="Enter value" />
                                                    </mat-form-field>

                                                    <div *ngIf="element.IsInputField && element.SystemName=='OPDDefaultDepartment'"
                                                        style="width: 250px;">
                                                        <airmid-dropdown label="OPD Department"
                                                            formControlName="opdDepartment" [formGroup]="myConfigform"
                                                            [(ngModel)]="element.SystemInputValue"
                                                            [mode]="autocompleteModeDepartment">
                                                        </airmid-dropdown>
                                                    </div>

                                                    <div *ngIf="element.IsInputField && element.SystemName=='OPDDefaultDoctor'"
                                                        style="width: 250px;">
                                                        <airmid-dropdown label="OPD Doctor"
                                                            formControlName="opdDoctorId" [formGroup]="myConfigform"
                                                            [(ngModel)]="element.SystemInputValue"
                                                            [mode]="autocompleteModedoctorty">
                                                        </airmid-dropdown>
                                                    </div>

                                                    <div *ngIf="element.IsInputField && element.SystemName=='IsPathDepartment'"
                                                        style="width: 250px;">
                                                        <airmid-dropdown label="Pathology Department"
                                                            formControlName="Department" [formGroup]="myConfigform"
                                                            [(ngModel)]="element.SystemInputValue"
                                                            [mode]="autocompleteModeDepartment">
                                                        </airmid-dropdown>
                                                    </div>

                                                    <div *ngIf="element.IsInputField && element.SystemName=='IsPathDoctorId'"
                                                        style="width: 250px;">
                                                        <airmid-dropdown label="Pathology Doctor"
                                                            formControlName="DoctorId" [formGroup]="myConfigform"
                                                            [(ngModel)]="element.SystemInputValue"
                                                            [mode]="autocompleteModedoctorty">
                                                        </airmid-dropdown>
                                                    </div>

                                                    <mat-form-field
                                                        *ngIf="element.IsInputField && element.SystemName=='OPSalesdisc'"
                                                        appearance="outline" style="width: 200px;">
                                                        <input matInput [maxLength]="100"
                                                            (keypress)="keyPressCharater($event)"
                                                            formControlName="OPSalesdisc"
                                                            [(ngModel)]="element.SystemInputValue"
                                                            placeholder="Enter discount %" />
                                                    </mat-form-field>

                                                    <mat-form-field
                                                        *ngIf="element.IsInputField && element.SystemName=='IPSalesdisc'"
                                                        appearance="outline" style="width: 200px;">
                                                        <input matInput [maxLength]="100"
                                                            (keypress)="keyPressCharater($event)"
                                                            formControlName="IPSalesdisc"
                                                            [(ngModel)]="element.SystemInputValue"
                                                            placeholder="Enter discount %" />
                                                    </mat-form-field>

                                                    <mat-form-field
                                                        *ngIf="element.IsInputField && element.SystemName=='SystemLogOutTime'"
                                                        appearance="outline" style="width: 200px;">
                                                        <input matInput (keypress)="keyPressCharater($event)"
                                                            formControlName="SystemLogOutTime"
                                                            [(ngModel)]="element.SystemInputValue"
                                                            placeholder="Enter time (mins)" />
                                                    </mat-form-field>

                                                    <!-- Toggle for all configs -->
                                                    <mat-slide-toggle (change)="tableElementChecked($event, element)"
                                                        [(ngModel)]="element.IsInputField"
                                                        [ngModelOptions]="{standalone: true}" color="primary">
                                                    </mat-slide-toggle>
                                                </div>
                                            </div>
                                        </mat-list-item>
                                    </mat-list>
                                </mat-card-content>
                            </mat-card>

                        </form>
                    </div>
                </div>

                <div style="padding: 16px 24px; display: flex; justify-content: flex-end; background: #f5f5f5;">
                    <button mat-raised-button color="primary" (click)="onSubmit()"
                        style="padding: 8px 32px; font-size: 14px;">
                        Save Configuration
                    </button>
                </div>
            </div>

        </mat-tab>


        <mat-tab label="SMS Configuration Detail List">

            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>
                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">


                    <ng-template #actionButtonTemplate let-element>
                        <div fxLayout="row" fxLayoutAlign="center center">

                                <mat-icon>edit</mat-icon>
                            </button>

                        </div>
                    </ng-template>

                    <airmid-table [gridConfig]="gridConfig" #smsgrid [ShowFilter]="false" [ShowButtons]="false">
                        <ng-container filters>
                            <!-- <form [formGroup]="smsSearchForm">
                                <airmid-datepicker [formGroup]="smsSearchForm" [isRangePicker]="true"
                                    formStartControlName="fromDate" formEndControlName="enddate"
                                    [(fromValue)]="gridConfig.filters[1].fieldValue"
                                    [(toValue)]="gridConfig.filters[2].fieldValue">
                                </airmid-datepicker>


                                <mat-form-field appearance="outline">
                                    <mat-label>User Name</mat-label>
                                    <input matInput placeholder="Search By User" autocomplete="off"
                                        [formGroup]="smsSearchForm" formControlName="UserName"
                                        (input)="onChangesmsuser()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)="Clearfiltersmsuser('UserName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>


                            </form> -->
                        </ng-container>
                    </airmid-table>
                </div>
            </div>

        </mat-tab>

        <mat-tab label="Email Configuration Detail List">

            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>
                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

                    <ng-template #actionAuthanticate let-element>
                        <div fxLayout="row" fxLayoutAlign="center center">

                            <mat-icon *ngIf="element.reqAuthenticate==true" matTooltip="SMTP Required Authentication">
                                <img width="30px" height="30px" src="assets/images/logos/Auth.png">
                            </mat-icon>

                        </div>
                    </ng-template>

                    <ng-template #actionAuthanticatepass let-element>
                        <div fxLayout="row" fxLayoutAlign="center center">

                            <mat-icon *ngIf="element.passauthenticate==true" matTooltip="Password Required
                                Authentication">
                                <img width="30px" height="30px" src="assets/images/logos/Password.png">
                            </mat-icon>

                        </div>
                    </ng-template>
                    <ng-template #actionButtonTemplate1 let-element>
                        <div fxLayout="row" fxLayoutAlign="center center">
                            <button mat-icon-button matTooltip="Edit Email" (click)="OnEditEmail(element)">
                                <mat-icon>edit</mat-icon>
                            </button>

                        </div>
                    </ng-template>


                    <airmid-table [gridConfig]="gridConfig1" #smsgrid [ShowFilter]="false" [ShowButtons]="false">

                        <ng-container filters>
                            <!-- <form [formGroup]="emailSearchForm">

                                <airmid-datepicker [formGroup]="emailSearchForm" [isRangePicker]="true"
                                    formStartControlName="fromDate" formEndControlName="enddate"
                                    [(fromValue)]="gridConfig1.filters[1].fieldValue"
                                    [(toValue)]="gridConfig1.filters[2].fieldValue">
                                </airmid-datepicker>

                                <mat-form-field appearance="outline">
                                    <mat-label>User Name</mat-label>
                                    <input matInput placeholder="Search By User" autocomplete="off"
                                        [formGroup]="emailSearchForm" formControlName="UserName"
                                        (input)="onChangeemailuser()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" Clearfilteremailuser('UserName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>
                            </form> -->
                        </ng-container>
                    </airmid-table>
                </div>
            </div>

        </mat-tab>



    </mat-tab-group>

</div>
