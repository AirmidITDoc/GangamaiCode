<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" style="height: 100%;" fusePerfectScrollbar
    dynamicTableHeight>

    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">

        <mat-tab label="System Configuration List">

            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>

                <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
                    fxLayoutAlign.gt-xs="space-between center ">
                    <div class="top-header-info">
                        <div class="top-header-title">
                            <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                                System Configuration List
                            </span>
                        </div>
                    </div>

                </div>
                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll"
                    style="padding: 10px;">


                    <mat-table #table matSort [dataSource]="DSServiceList" class="airmid-table"
                        [@animateStagger]="{ value: '50' }" style="overflow: auto;">

                        <ng-container matColumnDef="SystemConfigId">
                            <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm
                                class="w-150">SystemConfig</mat-header-cell>
                            <mat-cell *matCellDef="let element" fxHide fxShow.gt-sm class="w-150">{{
                                element.SystemConfigId }}</mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="Name">
                            <mat-header-cell *matHeaderCellDef mat-sort-header class="w-250">System
                                Category</mat-header-cell>
                            <mat-cell *matCellDef="let element" fxShow.gt-sm class="w-250">{{
                                element.Name }}</mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="SystemName">
                            <mat-header-cell *matHeaderCellDef class="w-460"
                                mat-sort-header>SystemName</mat-header-cell>
                            <mat-cell *matCellDef="let element" fxShow.gt-sm class="w-460">{{element.SystemName
                                }}</mat-cell>
                        </ng-container>
                        <!-- 
                                                <ng-container matColumnDef="IsInputField">
                                                    <mat-header-cell *matHeaderCellDef
                                                        mat-sort-header class="w-200">IsInputField</mat-header-cell>
                                                    <mat-cell *matCellDef="let element" fxShow.gt-sm class="w-200">{{
                                                        element.IsInputField }}</mat-cell>
                                                </ng-container> -->

                        <ng-container matColumnDef="IsInputField" sticky>
                            <mat-header-cell *matHeaderCellDef class="w-200">
                                IsInputField
                            </mat-header-cell>
                            <mat-cell *matCellDef="let element" class="w-200">
                                <mat-checkbox (change)="tableElementChecked($event, element)"
                                    [(ngModel)]="element.IsInputField"></mat-checkbox>
                            </mat-cell>


                        </ng-container>

                        <ng-container matColumnDef="SystemInputValue">
                            <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm
                                class="w-300">Value</mat-header-cell>
                            <mat-cell *matCellDef="let element" fxHide fxShow.gt-sm class="w-300">
                                <form [formGroup]="myConfigform">
                                    <!-- <ng-container
                            *ngIf="element.IsInputField && element.SystemName=='RegNo' || element.IsInputField && element.SystemName=='OPDNo' || element.IsInputField && element.SystemName=='OPSalesdisc' || element.IsInputField && element.SystemName=='IPSalesdisc'">
                            <mat-form-field appearance="fill">
                                <input matInput [maxLength]="100" (keypress)="keyPressCharater($event)"
                                    formControlName="Inputvalue" [(ngModel)]="element.SystemInputValue" />
                            </mat-form-field>
                        </ng-container> -->

                                    <ng-container
                                        *ngIf="element.IsInputField && element.SystemName=='SystemLogOutTime'">
                                        <mat-form-field appearance="fill">
                                            <input matInput (keypress)="keyPressCharater($event)"
                                                [formGroup]="myConfigform" formControlName="SystemLogOutTime"
                                                [(ngModel)]="element.SystemInputValue" />
                                        </mat-form-field>
                                    </ng-container>

                                    <ng-container *ngIf="element.IsInputField && element.SystemName=='RegNo'">
                                        <mat-form-field appearance="fill">
                                            <input matInput [maxLength]="100" (keypress)="keyPressCharater($event)"
                                                [formGroup]="myConfigform" formControlName="RegNo"
                                                [(ngModel)]="element.SystemInputValue" />
                                        </mat-form-field>
                                    </ng-container>
                                    <ng-container *ngIf="element.IsInputField && element.SystemName=='OPDNo'">
                                        <mat-form-field appearance="fill">
                                            <input matInput [maxLength]="100" (keypress)="keyPressCharater($event)"
                                                [formGroup]="myConfigform" formControlName="OPDNo"
                                                [(ngModel)]="element.SystemInputValue" />
                                        </mat-form-field>
                                    </ng-container>
                                    <ng-container *ngIf="element.IsInputField && element.SystemName=='OPSalesdisc'">
                                        <mat-form-field appearance="fill">
                                            <input matInput [maxLength]="100" (keypress)="keyPressCharater($event)"
                                                [formGroup]="myConfigform" formControlName="OPSalesdisc"
                                                [(ngModel)]="element.SystemInputValue" />
                                        </mat-form-field>
                                    </ng-container>
                                    <ng-container *ngIf="element.IsInputField && element.SystemName=='IPSalesdisc'">
                                        <mat-form-field appearance="fill">
                                            <input matInput [maxLength]="100" (keypress)="keyPressCharater($event)"
                                                [formGroup]="myConfigform" formControlName="IPSalesdisc"
                                                [(ngModel)]="element.SystemInputValue" />
                                        </mat-form-field>
                                    </ng-container>
                                    <ng-container
                                        *ngIf="element.IsInputField && element.SystemName=='IsPathDepartment'">
                                        <airmid-dropdown label="Pathology Department" formControlName="Department"
                                            [formGroup]="myConfigform" [(ngModel)]="element.SystemInputValue"
                                            [mode]="autocompleteModeDepartment">
                                        </airmid-dropdown>
                                    </ng-container>


                                    <ng-container *ngIf="element.IsInputField && element.SystemName=='IsPathDoctorId'">
                                        <airmid-dropdown label="Pathology Doctor" formControlName="DoctorId"
                                            [formGroup]="myConfigform" [(ngModel)]="element.SystemInputValue"
                                            [mode]="autocompleteModedoctorty">
                                        </airmid-dropdown>
                                    </ng-container>


                                    <ng-container
                                        *ngIf="element.IsInputField && element.SystemName=='OPDDefaultDepartment'">
                                        <airmid-dropdown label="OPD Department" formControlName="opdDepartment"
                                            [formGroup]="myConfigform" [(ngModel)]="element.SystemInputValue"
                                            [mode]="autocompleteModeDepartment">
                                        </airmid-dropdown>
                                    </ng-container>


                                    <ng-container
                                        *ngIf="element.IsInputField && element.SystemName=='OPDDefaultDoctor'">
                                        <airmid-dropdown label="OPD Doctor" formControlName="opdDoctorId"
                                            [formGroup]="myConfigform" [(ngModel)]="element.SystemInputValue"
                                            [mode]="autocompleteModedoctorty">
                                        </airmid-dropdown>
                                    </ng-container>
                                </form>
                            </mat-cell>
                        </ng-container>


                        <ng-container matColumnDef="noData">
                            <mat-footer-cell *matFooterCellDef colspan="6">no data found...</mat-footer-cell>
                        </ng-container>
                        <mat-header-row class="accent" *matHeaderRowDef="displayedColumns1;"></mat-header-row>
                        <mat-row *matRowDef="let row; columns: displayedColumns1" class="element"
                            [@animate]="{ value: '*', params: { y: '100%' } }" style="height:50px;"></mat-row>
                        <mat-footer-row *matFooterRowDef="['noData']"
                            [ngClass]="{ hide: !(DSServiceList != null && DSServiceList.data.length == 0) }"></mat-footer-row>

                    </mat-table>
                </div>


                <div class="modal-footer" style="margin-left: 1300px;">
                    <div class="footer-navigation-container">
                        <div class="modal-footer-buttons">
                            <!-- <button type="button" class="btn btn-danger-outline" (click)="onClose()">Close</button> -->
                            <button type="button" class="btn btn-primary" (click)="onSubmit()">Save</button>
                        </div>
                    </div>
                </div>
            </div>

        </mat-tab>


        <mat-tab label="SMS Configuration Detail List">

            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>
                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

                    <airmid-table [gridConfig]="gridConfig" #smsgrid [ShowFilter]="false" [ShowButtons]="false">
                        <ng-container filters>
                            <!-- <form [formGroup]="smsSearchForm">
                                <airmid-datepicker [formGroup]="smsSearchForm" [isRangePicker]="true"
                                    formStartControlName="fromDate" formEndControlName="enddate"
                                    [(fromValue)]="gridConfig.filters[1].fieldValue"
                                    [(toValue)]="gridConfig.filters[2].fieldValue">
                                </airmid-datepicker>


                                <mat-form-field appearance="outline">
                                    <mat-label>User Name</mat-label>
                                    <input matInput placeholder="Search By User" autocomplete="off"
                                        [formGroup]="smsSearchForm" formControlName="UserName"
                                        (input)="onChangesmsuser()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)="Clearfiltersmsuser('UserName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>


                            </form> -->
                        </ng-container>
                    </airmid-table>
                </div>
            </div>

        </mat-tab>

        <mat-tab label="Email Configuration Detail List">

            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>
                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

                    <ng-template #actionAuthanticate let-element>
                        <div fxLayout="row" fxLayoutAlign="center center">

                            <mat-icon *ngIf="element.reqAuthenticate==true" matTooltip="SMTP Required Authentication">
                                <img width="30px" height="30px" src="assets/images/logos/Auth.png">
                            </mat-icon>

                        </div>
                    </ng-template>

                    <ng-template #actionAuthanticatepass let-element>
                        <div fxLayout="row" fxLayoutAlign="center center">

                            <mat-icon *ngIf="element.passauthenticate==true" matTooltip="Password Required
                                Authentication">
                                <img width="30px" height="30px" src="assets/images/logos/Password.png">
                            </mat-icon>

                        </div>
                    </ng-template>



                    <airmid-table [gridConfig]="gridConfig1" #smsgrid [ShowFilter]="false" [ShowButtons]="false">

                        <ng-container filters>
                            <!-- <form [formGroup]="emailSearchForm">

                                <airmid-datepicker [formGroup]="emailSearchForm" [isRangePicker]="true"
                                    formStartControlName="fromDate" formEndControlName="enddate"
                                    [(fromValue)]="gridConfig1.filters[1].fieldValue"
                                    [(toValue)]="gridConfig1.filters[2].fieldValue">
                                </airmid-datepicker>

                                <mat-form-field appearance="outline">
                                    <mat-label>User Name</mat-label>
                                    <input matInput placeholder="Search By User" autocomplete="off"
                                        [formGroup]="emailSearchForm" formControlName="UserName"
                                        (input)="onChangeemailuser()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)=" Clearfilteremailuser('UserName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>
                            </form> -->
                        </ng-container>
                    </airmid-table>
                </div>
            </div>

        </mat-tab>

        <mat-tab label="Audit Log Detail List">

            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>
                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

                    <airmid-table [gridConfig]="gridConfig2" class="content" #auditgrid>
                        <ng-container filters>
                            <form [formGroup]="auditFilterForm">

                                <airmid-datepicker [formGroup]="auditFilterForm" [isRangePicker]="true"
                                    formStartControlName="fromDate" formEndControlName="enddate"
                                    [(fromValue)]="gridConfig2.filters[1].fieldValue"
                                    [(toValue)]="gridConfig2.filters[2].fieldValue">
                                </airmid-datepicker>

                                <mat-form-field appearance="outline">
                                    <mat-label>Search Name</mat-label>
                                    <input matInput placeholder="Search ByName" autocomplete="off"
                                        [formGroup]="auditFilterForm" formControlName="ActionByName"
                                        (input)="onChangeaudit()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)="Clearfilteraudit('ActionByName')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>


                            </form>
                        </ng-container>
                    </airmid-table>
                </div>
            </div>

        </mat-tab>

    </mat-tab-group>


</div>
