<div class="modal-page page-layout inner-scroll" fxLayout="column" fxFlexFill>
    <!-- Header -->
    <div class="modal-header accent" fxLayout="row" fxLayoutAlign="space-between center" fxLayout.lt-sm="column"
        style="padding: 8px 16px; color: white;">
        <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="8px">
            <button mat-icon-button style="color: white;">
                <mat-icon>menu</mat-icon>
            </button>
            <span class="logo-text h1">Auto Service</span>
        </div>

        <button mat-icon-button [mat-dialog-close]="true" aria-label="Close">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <!-- Body -->
    <div class="modal-body" fxFlex fxLayout="column" fxLayoutGap="16px" style="padding: 12px;">
        <!-- Search Form -->
        <mat-card fxFlex="none">
            <mat-card-content>
                <form [formGroup]="AutoServiceForm" fxLayout="row" fxLayoutGap="12px" fxLayout.lt-md="column"
                    fxLayoutAlign="start stretch"> 
                      
                   <airmid-dropdown label="Class Name" formControlName="classId" [formGroup]="AutoServiceForm"
                    [validations]="getValidationMessages().classId" [mode]="autocompleteModeClass"
                    (selectionChange)="getSelectedClassObj($event)"></airmid-dropdown> 
               
                    <airmid-autocomplete label="Enter Service Name" [formGroup]="AutoServiceForm"
                    formControlName="serviceName" placeholderText="Enter Service Name" fxFlex ApiUrl="{{ ApiURL }}"
                    (selectionChange)="onItemChange($event)" TextField="formattedText"></airmid-autocomplete> 

                    <div>
                     <button class="btn btn-primary btn-with-icon py-8"
                    (click)="OnAddService()"><mat-icon>add</mat-icon></button>
                    </div>
                    
                    
                </form>
            </mat-card-content>
        </mat-card>

        <!-- Table -->
        <mat-card fxFlex fxLayout="column">
            <div fxFlex class="table-scroll" style="overflow-x: auto;">
                <mat-table #table class="airmid-table" matSort [dataSource]="dsServicelist"
                    style="width: 100%; min-width: 500px;">

                    <ng-container matColumnDef="Status"> 
                          <mat-header-cell *matHeaderCellDef mat-sort-header class="w-100">Type</mat-header-cell>
                          <mat-cell *matCellDef="let contact" class="w-100">
                            <mat-icon *ngIf="contact.isRadiology == 1" matTooltip="IsRadiology">
                              <img width="15px" height="8px" src="assets/images/logos/radiology.png">
                            </mat-icon>
                            <mat-icon *ngIf="contact.isPathology == 1" matTooltip="IsPatholgy">
                              <img width="15px" height="9px" src="assets/images/logos/pathology.png">
                            </mat-icon>
                          </mat-cell>
                    </ng-container>

                    <ng-container matColumnDef="serviceName">
                        <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm>
                            Service Name
                        </mat-header-cell>
                        <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                            {{contact.serviceName}}
                        </mat-cell>
                    </ng-container>
                    <!-- Header & Rows -->
                    <mat-header-row class="accent" *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
                    <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
                </mat-table>
            </div>

            <mat-paginator [pageSizeOptions]="[5, 10, 25]" [pageSize]="10" showFirstLastButtons></mat-paginator>
        </mat-card>
    </div>
    <div class="modal-footer"  style="padding: 8px;">
        <div class="modal-footer-buttons" fxLayoutAlign="end" fxLayoutGap="6px">
            <button class="btn btn-danger-outline">Close</button>
            <button  class="btn btn-primary">Save</button>
        </div> 
    </div>
</div>
