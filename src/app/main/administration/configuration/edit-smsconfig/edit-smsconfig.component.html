<div class="modal-wrapper grid-container">

    <!-- Modal header -->
    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">SMS Configuration Edit</span>
            </div>
            <div class="modal-header-right">
                <div class="comman-date-container">
                    <div class="comman-date">
                        <app-common-date [screenFrom]="screenFromString"
                            (dateTimeEventEmitter)="getDateTime($event)"></app-common-date>
                    </div>
                    <div class="close-icon">
                        <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                            matTooltip="Close">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="modal-card-container">
        <mat-card>
            <div fxLayout="column" class="gap-8" style="padding: 15px;">

                <form [formGroup]="SmsForm" style="border: blue">
                    <div fxLayout="row wrap" fxLayoutGap="10px 10px grid">
                        <!-- [maxLength]="32" -->
                        <div fxFlex="32" fxFlex.xs="100" fxFlex.sm="33">
                            <airmid-textbox label="URL" formControlName="url" [formGroup]="SmsForm"
                                [validations]="getValidationMessages().url">
                            </airmid-textbox>
                        </div>

                        <div fxFlex="32" fxFlex.xs="100" fxFlex.sm="33">
                            <airmid-textbox label="Keys" formControlName="keys" [formGroup]="SmsForm"
                                [validations]="getValidationMessages().keys">
                            </airmid-textbox>
                        </div>

                        <div fxFlex="32" fxFlex.xs="100" fxFlex.sm="33">
                            <airmid-textbox label="Campaign" formControlName="campaign" [formGroup]="SmsForm"
                                [validations]="getValidationMessages().campaign">
                            </airmid-textbox>
                        </div>

                        <div fxFlex="32" fxFlex.xs="100" fxFlex.sm="33">
                            <airmid-textbox label="Sender" formControlName="senderId" [formGroup]="SmsForm"
                                [validations]="getValidationMessages().senderId">
                            </airmid-textbox>
                        </div>

                        <div fxFlex="32" fxFlex.xs="100" fxFlex.sm="33">
                            <airmid-textbox label="Route Id" formControlName="routeid" [formGroup]="SmsForm"
                                [validations]="getValidationMessages().routeid">
                            </airmid-textbox>
                        </div>

                        <div fxFlex="32" fxFlex.xs="100" fxFlex.sm="33">
                            <airmid-textbox label="User Name" formControlName="userName" [formGroup]="SmsForm"
                                [validations]="getValidationMessages().userName">
                            </airmid-textbox>
                        </div>
                        <div fxFlex="32" fxFlex.xs="100" fxFlex.sm="33">
                            <airmid-textbox label="Spassword" formControlName="spassword" [formGroup]="SmsForm"
                                [validations]="getValidationMessages().spassword">
                            </airmid-textbox>

                        </div>
                        <div fxFlex="32" fxFlex.xs="100" fxFlex.sm="33">
                            <airmid-textbox label="Storage LocLink" formControlName="storageLocLink"
                                [formGroup]="SmsForm" [validations]="getValidationMessages().storageLocLink">
                            </airmid-textbox>

                        </div>
                        <div fxFlex="32" fxFlex.xs="100" fxFlex.sm="33">
                            <airmid-dropdown label="Message Type" formControlName="conType" [formGroup]="SmsForm"
                                 [mode]="autocompleteModeMessagetype">
                            </airmid-dropdown>
                        </div>
                    </div>


                </form>
            </div>
        </mat-card>
    </div>

    <div class="modal-footer">
        <div class="footer-navigation-container">
            <div class="modal-footer-buttons">
                <button class="btn btn-danger-outline" (click)="onClose()">Close</button>
                <button type="button" class="btn btn-primary" (click)="OnSave()">Save</button>
            </div>
        </div>
    </div>
</div>
