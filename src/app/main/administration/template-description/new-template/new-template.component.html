<div class="page-layout modal-wrapper grid-container" fusePerfectScrollbar>

    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}"> Template Description </span>
            </div>
            <div class="modal-header-right">
                <div class="comman-date-container">
                    <div class="comman-date">
                        <!-- <app-common-date [screenFrom]="screenFromString" (dateTimeEventEmitter)="getDateTime($event)"></app-common-date> -->
                    </div>
                    <div class="close-icon">
                        <button mat-icon-button tabIndex="-1" (click)="onClose()" aria-label="Close dialog">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-body content">
        <div fxLayout="column" class="gap-8 h-100-p">
            <div class="modal-card-container">
                <form [formGroup]="templateForm">
                    <div fxFlexFill fxLayout="column" fxLayout.gt-xs="row" fxLayoutGap="4px">

                        <div fxFlex="25%" fxFlex.xs="100%" fxFlex.sm="33%">
                            <airmid-dropdown label="Department Name" formControlName="DepartmentId"
                                [formGroup]="templateForm" [validations]="getValidationMessages().DepartmentId"
                                [mode]="autocompleteModeDepartment" (selectionChange)="selectChangedepartment($event)">
                            </airmid-dropdown>
                        </div>

                        <div fxFlex="25%" fxFlex.xs="100%" fxFlex.sm="33%">
                            <airmid-dropdown label="Category" formControlName="CategoryId" [formGroup]="templateForm"
                                [validations]="getValidationMessages().CategoryId" [mode]="autocompleteModeDepartment"
                                (selectionChange)="selectChangedepartment($event)">
                            </airmid-dropdown>
                        </div>

                        <airmid-textbox label="Template Name" formControlName="templateName" [formGroup]="templateForm"
                            [validations]="getValidationMessages().templateName" fxFlex [(ngModel)]="vTemplateName">
                        </airmid-textbox>
                    </div>
                </form>
            </div>

            <div class="modal-card-container">
                <form [formGroup]="templateForm">

                    <div fxFlexFill fxLayout="row" fxLayout.gt-xs="column" fxLayoutGap="6px">
                        <div class="modal-card-header">
                            <span style="font-weight: bold;">Template Header</span>
                        </div>
                        <airmid-editor formControlName="Templateheader" [formGroup]="templateForm"
                            (valueChange)="onEditorValueChange($event)">
                        </airmid-editor>
                    </div>
                </form>
            </div>
            <div class="modal-card-container">
                <form [formGroup]="templateForm">

                    <div fxFlexFill fxLayout="row" fxLayout.gt-xs="column" fxLayoutGap="6px">
                        <div class="modal-card-header">
                            <span style="font-weight: bold;">Template Content</span>
                        </div>
                        <airmid-editor formControlName="TemplateBody" [formGroup]="templateForm"
                            (valueChange)="onEditorValueChange($event)">
                        </airmid-editor>
                    </div>
                </form>
            </div>
            <div class="modal-card-container">
                <form [formGroup]="templateForm">

                    <div fxFlexFill fxLayout="row" fxLayout.gt-xs="column" fxLayoutGap="6px">
                        <div class="modal-card-header">
                            <span style="font-weight: bold;">Template Footer</span>
                        </div>
                        <airmid-editor formControlName="TemplateFooter" [formGroup]="templateForm"
                            (valueChange)="onEditorValueChange($event)">
                        </airmid-editor>
                    </div>
                </form>
            </div>
        </div>

    </div>
    <div class="modal-footer" fxLayout="row" fxLayoutAlign="space-between">
        <form [formGroup]="templateForm">
            <div>
                <app-airmid-slider label="IsActive/Deactive" formControlName="isActive"
                    [formGroup]="templateForm"></app-airmid-slider>
            </div>
        </form>
        <div class="modal-footer-buttons">
            <button class="btn btn-danger-outline" (click)="onClear()">Close</button>
            <button class="btn btn-primary" (click)="onSubmit()" [disabled]="templateForm.invalid">Save</button>
        </div>
    </div>

</div>
