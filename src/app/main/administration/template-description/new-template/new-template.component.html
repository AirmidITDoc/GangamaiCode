<div class="page-layout modal-wrapper grid-container templateMain" fusePerfectScrollbar>

    <div class="modal-header accent templateHeader">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}"> Template Description </span>
            </div>
            <div class="modal-header-right">
                <div class="comman-date-container">
                    <div class="comman-date">
                        <!-- <app-common-date [screenFrom]="screenFromString" (dateTimeEventEmitter)="getDateTime($event)"></app-common-date> -->
                    </div>
                    <div class="close-icon">
                        <button mat-icon-button tabIndex="-1" (click)="onClose()" aria-label="Close dialog">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-body content templateMiddle">
        <div fxLayout="column" class="gap-8 h-100-p">
            <div class="modal-card-container">
                <form [formGroup]="TemplateSaveForm">
                    <div fxFlexFill fxLayout="column" fxLayout.gt-xs="row" fxLayoutGap="4px">

                        <div fxFlex="25%" fxFlex.xs="100%" fxFlex.sm="33%">
                            <airmid-dropdown label="Category" formControlName="categoryId"
                                [formGroup]="TemplateSaveForm" [validations]="getValidationMessages().CategoryId"
                                [mode]="autocompleteModeTemplateCat" (selectionChange)="selectChangeTemplate($event)">
                            </airmid-dropdown>
                        </div>

                        <airmid-textbox label="Template Name" formControlName="templateName"
                            [formGroup]="TemplateSaveForm" [validations]="getValidationMessages().templateName" fxFlex
                            [(ngModel)]="vTemplateName">
                        </airmid-textbox>
                    </div>

                    <div fxFlexFill fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start" class="gap-8">
                        <mat-slide-toggle name="isTemplateWithHeader" formControlName="isTemplateWithHeader">
                            isTemplateWithHeader
                        </mat-slide-toggle>

                        <mat-slide-toggle name="isTemplateHeaderWithImage" formControlName="isTemplateHeaderWithImage">
                            isTemplateHeaderWithImage
                        </mat-slide-toggle>
                    </div>

                    <mat-card fxLayout="column" style="padding: 5px; margin-top: 10px;"
                        *ngIf="TemplateSaveForm.get('isTemplateHeaderWithImage')?.value">
                        <div class="consultunt-title">
                            <span style="font-weight: 700;">
                                Upload Image
                            </span>
                        </div>
                        <div *ngIf="TemplateSaveForm.get('isTemplateHeaderWithImage')?.value" class="mt-2"
                            fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="10px">
                            <button mat-raised-button color="primary" (click)="fileInput.click()">Select Image</button>
                            <input type="file" #fileInput accept="image/*" style="display: none" id="fileInput"
                                (change)="onFileSelected($event)" />

                            <!-- Show selected image preview -->
                            <div *ngIf="selectedImage" class="image-preview">
                                <img [src]="selectedImage" alt="Selected Image" />
                            </div>
                            <!-- <div *ngIf="selectedFileName" class="file-name"> {{ selectedFileName }} </div> -->
                        </div>
                    </mat-card>

                </form>
            </div>

            <div class="modal-card-container">
                <form [formGroup]="TemplateSaveForm">

                    <div fxFlexFill fxLayout="row" fxLayout.gt-xs="column" fxLayoutGap="6px">
                        <div class="modal-card-header">
                            <span style="font-weight: bold;">Hospita Header</span>
                        </div>
                        <airmid-editor formControlName="hospitalHeader" [formGroup]="TemplateSaveForm"
                            (valueChange)="onEditorValueChange($event)">
                        </airmid-editor>
                    </div>
                </form>
            </div>

            <div class="modal-card-container">
                <form [formGroup]="TemplateSaveForm">

                    <div fxFlexFill fxLayout="row" fxLayout.gt-xs="column" fxLayoutGap="6px">
                        <div class="modal-card-header">
                            <span style="font-weight: bold;">Header Content</span>
                        </div>
                        <airmid-editor formControlName="templateHeader" [formGroup]="TemplateSaveForm"
                            (valueChange)="onEditorValueChange1($event)">
                        </airmid-editor>
                    </div>
                </form>
            </div>
            
            <div class="modal-card-container">
                <form [formGroup]="TemplateSaveForm">

                    <div fxFlexFill fxLayout="row" fxLayout.gt-xs="column" fxLayoutGap="6px">
                        <div class="modal-card-header">
                            <span style="font-weight: bold;">Template Content</span>
                        </div>
                        <airmid-editor formControlName="templateDescription" [formGroup]="TemplateSaveForm"
                            (valueChange)="onEditorValueChange2($event)">
                        </airmid-editor>
                    </div>
                </form>
            </div>

        </div>

    </div>

    <div class="modal-footer templatefooter" fxLayout="row" fxLayoutAlign="space-between">
        <form [formGroup]="TemplateSaveForm">
            <div>
                <!-- <app-airmid-slider label="IsActive/Deactive" formControlName="isActive"
                    [formGroup]="TemplateSaveForm"></app-airmid-slider> -->
            </div>
        </form>
        <div class="modal-footer-buttons">
            <button class="btn btn-danger-outline" (click)="onClear()">Close</button>
            <button class="btn btn-primary" (click)="onSubmit()">Save</button>
        </div>
    </div>

</div>
