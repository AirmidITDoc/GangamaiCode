<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>

    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">

        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Define Doctor Share
                </span>
            </div>
        </div>

        <div fxLayout="row" fxLayoutAlign="end" class="left-icon">
            <!-- <button mat-raised-button (click)="viewDocShareReport()" fxLayoutAlign="center center" class="py-8">
                <mat-icon>print</mat-icon><span>Doctor Share Report</span>
            </button>&nbsp;-->
            <!-- <button mat-raised-button (click)="Additiondocpay()" fxLayoutAlign="center center" class="py-8">
                <mat-icon>add</mat-icon> <span>AdditionDocpay</span>
            </button>&nbsp;&nbsp;
            <button mat-raised-button (click)="processDocShare()" fxLayoutAlign="center center" class="py-8">
                <span>Process Doctor Share</span>
            </button>&nbsp; -->
            <button mat-raised-button (click)="NewDocShare()" fxLayoutAlign="center center" class="py-8" *ngIf="IsAdd">
                <mat-icon>add</mat-icon> <span> Doctor Share</span>
            </button>
        </div>

    </div>

    <div class="content">
        <div class="center  pb-56" style="border-radius: 4px;padding: 6px 6px 6px 6px;">
            <div class="content-card">
                <div fxLayout="row" fxLayout="column" fxFlexFill fxLayoutGap="10px">
                    <mat-card style="padding: 5px;">
                        <form [formGroup]="_DoctorShareService.UserFormGroup">
                            <div fxLayout="row wrap" fxLayoutGap="12px grid">


                                <div fxFlex="19%" fxFlex.xs="100%" fxFlex.sm="33%">
                                    <div fxLayout="row" style="padding: 10px;">
                                        <mat-radio-group formControlName="OP_IP_Type" name="Radio"
                                            (change)="onChangeFirst()">
                                            <mat-radio-button value="2">ALL</mat-radio-button>&nbsp;
                                            <mat-radio-button value="0">OP</mat-radio-button>&nbsp;
                                            <mat-radio-button value="1">IP</mat-radio-button>&nbsp;
                                        </mat-radio-group>
                                    </div>
                                </div>

                                <div fxFlex="18%" fxFlex.xs="100%" fxFlex.sm="33%">
                                    <airmid-datepicker [formGroup]="_DoctorShareService.UserFormGroup"
                                        [isRangePicker]="true" formStartControlName="fromDate"
                                        formEndControlName="enddate" [(fromValue)]="gridConfig.filters[0].fieldValue"
                                        [(toValue)]="gridConfig.filters[1].fieldValue">
                                    </airmid-datepicker>

                                    
                                </div>

                                <div fxFlex="18%" fxFlex.xs="100%" fxFlex.sm="33%">
                                    <airmid-dropdown label="Select Doctor Name" formControlName="DoctorID"
                                        [formGroup]="_DoctorShareService.UserFormGroup"
                                        (selectionChange)="ListView($event)" (keyup)="ListView($event)"
                                        [mode]="autocompleteModedoctor">
                                    </airmid-dropdown>
                                </div>

                                <!-- <div fxFlex="18%" fxFlex.xs="100%" fxFlex.sm="33%">
                                    <airmid-dropdown 
                                        label="Select Group Name" 
                                        formControlName="GroupId"
                                        [formGroup]="_DoctorShareService.UserFormGroup"
                                        [mode]="autocompletedepartment">
                                    </airmid-dropdown>
                                </div> -->

                                <mat-form-field appearance="outline" fxFlex="220px">
                                    <mat-label>Pbill No.</mat-label>
                                    <input matInput placeholder="PbillNo" autocomplete="off" formControlName="PbillNo"
                                        (input)="onChangeFirst()" />
                                    <button matSuffix mat-icon-button aria-label="Clear"
                                        (click)="Clearfilter('PbillNo')">
                                        <mat-icon>close</mat-icon>
                                    </button>
                                </mat-form-field>

                                <div style="padding: 10px;">
                                    <button mat-raised-button class="searchButton" matTooltip="search"
                                        (click)="getfilterdata()">
                                        <mat-icon class="searchiconbutton">search</mat-icon>
                                    </button>
                                </div>

                            </div>
                        </form>
                    </mat-card>

                    <mat-card style="padding: 5px;">
                        <mat-tab-group>

                            <!-- 1st table -->
                            <mat-tab label="List">
                                <div fusePerfectScrollbar
                                    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                                    dynamicTableHeight>

                                    <ng-template #actionsTemplate1 let-element>
                                        <div fxLayout="row" fxLayoutAlign="center center">
                                            <mat-icon *ngIf="element.patientType=='Self'"
                                                matTooltip="Patient Category Self">account_box
                                            </mat-icon>
                                            <mat-icon *ngIf="!element.patientType=='Self'"
                                                matTooltip="Patient Category other">business
                                            </mat-icon>
                                        </div>

                                    </ng-template>
                                    <ng-template #actionsTemplate let-element>
                                        <div fxLayout="row" fxLayoutAlign="center center">

                                            <mat-icon *ngIf="element.opdipdtype=='0'" matTooltip="OPD"
                                                class="pill orange-600 s-16">circle</mat-icon>

                                            <mat-icon *ngIf="element.opdipdtype=='1'" matTooltip="IPD"
                                                class="pill green-600 s-16">circle</mat-icon>
                                        </div>
                                    </ng-template>

                                    <ng-template #actionButtonTemplate let-element>

                                        <div fxLayout="row" fxLayoutAlign="center center">
                                            <mat-icon *ngIf="element.isBillShrHold==false" (click)="onHold(element)"
                                                matTooltip="Hold Bill">
                                                <img width="50px" height="50px" src="assets/images/logos/hold.png">
                                            </mat-icon>

                                            <mat-icon (click)="billdetail(element)" matTooltip=" Bill Detail">
                                                edit
                                            </mat-icon>
                                        </div>

                                    </ng-template>

                                    <airmid-table [gridConfig]="gridConfig" #grid :ShowFilter="false">
                                        <ng-container filters>

                                        </ng-container>
                                    </airmid-table>
                                </div>
                            </mat-tab>

                            <!-- 2nd table -->
                            <mat-tab label="Additional Amount Pay">
                                <div fusePerfectScrollbar
                                    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                                    dynamicTableHeight>
                                    <ng-template #actionsTemplate1 let-element>
                                        <div fxLayout="row" fxLayoutAlign="center center">
                                            <mat-icon *ngIf="element.patientType=='Self'"
                                                matTooltip="Patient Category Self">account_box
                                            </mat-icon>
                                            <mat-icon *ngIf="!element.patientType=='Self'"
                                                matTooltip="Patient Category other">business
                                            </mat-icon>
                                        </div>

                                    </ng-template>
                                    <ng-template #actionsTemplate let-element>
                                        <div fxLayout="row" fxLayoutAlign="center center">

                                            <mat-icon *ngIf="element.opdipdtype=='0'" matTooltip="OPD"
                                                class="pill orange-600 s-16">circle</mat-icon>

                                            <mat-icon *ngIf="element.opdipdtype=='1'" matTooltip="IPD"
                                                class="pill green-600 s-16">circle</mat-icon>
                                        </div>
                                    </ng-template>

                                    <ng-template #actionButtonTemplate let-element>

                                        <div fxLayout="row" fxLayoutAlign="center center">
                                            <mat-icon *ngIf="element.isBillShrHold==false" (click)="onHold(element)"
                                                matTooltip="Hold Bill">
                                                <img width="50px" height="50px" src="assets/images/logos/hold.png">
                                            </mat-icon>
                                        </div>

                                    </ng-template>
                                    <airmid-table [gridConfig]="gridConfig1" #grid1 :ShowFilter="false">
                                        <ng-container filters>

                                        </ng-container>
                                    </airmid-table>
                                </div>
                            </mat-tab>
                        </mat-tab-group>
                    </mat-card>
                </div>
            </div>
        </div>
    </div>
</div>
