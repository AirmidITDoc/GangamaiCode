                <div class="modal-card-container">
                    <mat-card style="padding: 20px;">
                        <div fxLayout="column" class="gap-8">
                            <div class="form-title mb-2 border-bottom pb-2">
                                <span class="h3 font-weight-600">Addition Doctor pay Information</span>
                            </div>
                            <form [formGroup]="AdddocpayFormGroup" style="border: blue">
                                <div fxLayout="row wrap" fxLayoutGap="8px 0px grid">

                                    <div fxFlex="25" fxFlex.xs="100" fxFlex.sm="33">
                                        <mat-form-field appearance="outline" class="dateField" fxFlex>
                                            <mat-label>Bill Date</mat-label>
                                            <input matInput [matDatepicker]="picker1" [min]="minDate"
                                                formControlName="billDate" (dateChange)="onChangeDate($event.value)" />
                                            <mat-datepicker-toggle matSuffix [for]="picker1"
                                                [disabled]="isDatePckrDisabled"></mat-datepicker-toggle>
                                            <mat-datepicker #picker1></mat-datepicker>
                                        </mat-form-field>
                                    </div>

                                    <div fxFlex="25" fxFlex.xs="100" fxFlex.sm="33">
                                        <mat-form-field appearance="outline" class="timeField" fxFlex>
                                            <mat-label>Bill Time</mat-label>
                                            <input matTimepicker #t="matTimepicker" mode="12h"
                                                formControlName="billTime" (timeChange)="onChangeTime($event)"
                                                [disableDialogOpenOnClick]="isDatePckrDisabled" />
                                            <mat-icon matSuffix
                                                (click)="!isDatePckrDisabled ? t.showDialog() : ''">access_time</mat-icon>
                                        </mat-form-field>
                                    </div>
                                    <div fxFlex="25" fxFlex.xs="100" fxFlex.sm="33">

                                        <airmid-dropdown label="Select Doctor Name" formControlName="docId"
                                            [formGroup]="AdddocpayFormGroup"  (selectionChange)="selectChangedoctor($event)"
                                            [mode]="autocompleteModedoctor"  [validations]="getValidationMessages().docId">
                                        </airmid-dropdown>
                                    </div>
                                </div>
                                <div fxLayout="row wrap" fxLayoutGap="8px 0px grid">

                                    <div fxFlex="25" fxFlex.xs="100" fxFlex.sm="33">
                                        <airmid-textbox label="billno" formControlName="pbillNo"
                                            [formGroup]="AdddocpayFormGroup"
                                            [validations]="getValidationMessages().billno"
                                            [maxLength]="15"></airmid-textbox>
                                    </div>
                                    <div fxFlex="25" fxFlex.xs="100" fxFlex.sm="33">
                                        <airmid-textbox label="PatientName" formControlName="patientName"
                                            [formGroup]="AdddocpayFormGroup"
                                            [validations]="getValidationMessages().PatientName"
                                            [maxLength]="50"></airmid-textbox>
                                    </div>


                                    <div fxFlex="25" fxFlex.xs="100" fxFlex.sm="33">
                                        <airmid-autocomplete label="Enter Service Name" [formGroup]="AdddocpayFormGroup"
                                            (selectionChange)="selectChangeService($event)"
                                            formControlName="serviceName" placeholderText="Enter Service Name" fxFlex
                                            ApiUrl="{{ ApiURL }}" TextField="formattedText"></airmid-autocomplete>
                                    </div>

                                    <div fxFlex="25" fxFlex.xs="100" fxFlex.sm="33">
                                        <airmid-dropdown label="Company Name" formControlName="companyId"
                                            [formGroup]="AdddocpayFormGroup"
                                            [validations]="getValidationMessages().companyId"
                                            [mode]="autocompleteModeCompany">
                                        </airmid-dropdown>
                                    </div>
                                </div>

                                <div fxLayout="row wrap" fxLayoutGap="8px 0px grid">
                                    <div fxFlex="25" fxFlex.xs="100" fxFlex.sm="33">
                                        <airmid-textbox label="price" formControlName="price" [type]="'number'"
                                            [min]="0" [formGroup]="AdddocpayFormGroup"
                                            (valueChange)="calculateTotalamt()"
                                            [validations]="getValidationMessages().price"
                                            [maxLength]="7"></airmid-textbox>

                                    </div>

                                    <div fxFlex="25" fxFlex.xs="100" fxFlex.sm="33">
                                        <airmid-textbox label="qty" formControlName="qty" [type]="'number'" [min]="0"
                                            (valueChange)="calculateTotalamt()" [formGroup]="AdddocpayFormGroup"
                                            [validations]="getValidationMessages().qty"
                                            [maxLength]="5"></airmid-textbox>
                                    </div>

                                    <div fxFlex="25" fxFlex.xs="100" fxFlex.sm="33">
                                        <airmid-textbox label="total" formControlName="totalAmount" [type]="'number'"
                                            rea [formGroup]="AdddocpayFormGroup"
                                            [validations]="getValidationMessages().total" [value]="totalAmount"
                                            [min]="0" [maxLength]="7"></airmid-textbox>
                                    </div>

                                     <div fxFlex="25" fxFlex.xs="100" fxFlex.sm="33">
                                        <airmid-textbox label="docamt" formControlName="docAmount" [min]="0"
                                            [formGroup]="AdddocpayFormGroup"
                                            [validations]="getValidationMessages().docamt"
                                            [maxLength]="10"></airmid-textbox>
                                    </div>
                                </div>



                            </form>
                        </div>
                    </mat-card>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <div class="footer-navigation-container">
            <div class="modal-footer-buttons">
                <button class="btn btn-danger-outline" (click)="onClose()">Close</button>
                <button type="button" class="btn btn-primary" (click)="onSubmit()">Save</button>
            </div>
        </div>
    </div>
</div>
