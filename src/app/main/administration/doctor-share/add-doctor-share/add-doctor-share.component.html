                <div class="modal-card-container">
                    <mat-card>
                        <div fxLayout="column" class="gap-8">
                            <mat-card style="padding: 5px;">
                                <form [formGroup]="_DoctorShareService.DocFormGroup">
                                    <div fxLayout="column" fxLayoutGap="6px">

                                        <div fxFlex="50%" fxFlex.xs="100%" fxFlex.sm="33%">
                                            <airmid-dropdown label="Select Doctor Name" formControlName="DoctorName"
                                                [value]="data?.DoctorName"
                                                [formGroup]="_DoctorShareService.DocFormGroup"
                                                [validations]="getValidationMessages().DoctorName"
                                                (selectionChange)="ListView($event)" [mode]="autocompleteModeItem">
                                            </airmid-dropdown>
                                        </div>

                                        <div fxLayout="row" style="padding: 15px;">
                                            <mat-radio-group formControlName="Type" name="Type" (change)="onChange()">
                                                <mat-radio-button value="1">Service Wise</mat-radio-button>
                                                <mat-radio-button value="2">Group Wise</mat-radio-button>
                                            </mat-radio-group>
                                        </div>

                                        <div style="padding: 10px;">
                                            <button mat-raised-button class="searchButton" matTooltip="search"
                                                (click)="getAddDoctorList()">
                                                <mat-icon class="searchiconbutton">search</mat-icon>
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </mat-card>
                            <!-- 1st -->
                            <mat-card style="padding: 5px;">
                                <div fxFlex.gt-sm="100%" fxFlex>

                                    <div style="height: 250px;" fusePerfectScrollbar dynamicTableHeight
                                        class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto">
                                        <airmid-table [gridConfig]="gridConfig" #grid :ShowFilter="false"
                                            (onSelectRow)="OnEdit($event)">
                                            <ng-container filters>

                                            </ng-container>
                                        </airmid-table>
                                    </div>

                                </div>

                            </mat-card>

                            <!-- 2nd -->
                            <mat-card style="padding: 5px;">
                                <form [formGroup]="_DoctorShareService.DocFormGroup">
                                    <div fxLayout="column" fxLayoutGap="5px">
                                        <div fxLayout="row" fxLayoutGap="4px">
                                            <div fxLayout="row wrap" fxLayoutGap="12px grid">
                                                <mat-radio-group formControlName="ServiceOrgrpType"
                                                    name="ServiceOrgrpType" fxLayout="row">
                                                    <mat-radio-button value="1">Service Wise</mat-radio-button>
                                                    <mat-radio-button value="2">Group Wise</mat-radio-button>
                                                </mat-radio-group>
                                                <mat-divider [vertical]="true"></mat-divider>&nbsp;
                                                <mat-radio-group formControlName="PatientType" name="PatientType"
                                                    fxLayout="row">Patient Type
                                                    <mat-radio-button value="0">OP</mat-radio-button>
                                                    <mat-radio-button value="1">IP</mat-radio-button>
                                                </mat-radio-group>
                                            </div>
                                        </div>

                                        <div fxLayout="row wrap" fxLayoutGap="12px grid">

                                            <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="33%">
                                                <airmid-dropdown label="Select Doctor Name" formControlName="DoctorID"
                                                    [value]="data?.DoctorID"
                                                    [formGroup]="_DoctorShareService.DocFormGroup"
                                                    [validations]="getValidationMessages().DoctorID"
                                                    (selectionChange)="selectChangeDoctor($event)"
                                                    [mode]="autocompleteModeItem">
                                                </airmid-dropdown>
                                            </div>

                                            <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="33%"
                                                *ngIf="_DoctorShareService.DocFormGroup.get('ServiceOrgrpType').value=='1'">
                                                <airmid-dropdown label="Select Service Name" formControlName="ServiceID"
                                                    [value]="data?.ServiceID"
                                                    [formGroup]="_DoctorShareService.DocFormGroup"
                                                    [validations]="getValidationMessages().ServiceID"
                                                    (selectionChange)="selectChangeService($event)"
                                                    [mode]="autocompleteModeService">
                                                </airmid-dropdown>
                                            </div>

                                            <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="33%"
                                                *ngIf="_DoctorShareService.DocFormGroup.get('ServiceOrgrpType').value=='2'">
                                                <airmid-dropdown label="Select Group Name" formControlName="GroupWise"
                                                    [value]="data?.GroupWise"
                                                    [formGroup]="_DoctorShareService.DocFormGroup"
                                                    [validations]="getValidationMessages().GroupWise"
                                                    (selectionChange)="selectChangeGroup($event)"
                                                    [mode]="autocompletedepartment">
                                                </airmid-dropdown>
                                            </div>

                                            <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="33%">
                                                <airmid-dropdown label="Select Class Name" formControlName="ClassId"
                                                    [value]="data?.ClassId"
                                                    [formGroup]="_DoctorShareService.DocFormGroup"
                                                    [validations]="getValidationMessages().ClassId"
                                                    (selectionChange)="selectChangeClass($event)"
                                                    [mode]="autocompleteClass">
                                                </airmid-dropdown>
                                            </div>

                                            <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="33%">
                                                <div fxLayout="row" style="padding:15px 5px 15px 5px;">
                                                    <mat-radio-group formControlName="DocShareType" name="DocShareType"
                                                        fxLayout="row">
                                                        <mat-label>Doctor Share :</mat-label>&nbsp;&nbsp;
                                                        <mat-radio-button value="P">%</mat-radio-button> &nbsp;
                                                        <mat-radio-button value="A">Amount</mat-radio-button>
                                                    </mat-radio-group>
                                                </div>
                                            </div>

                                            <mat-form-field appearance="outline" fxFlex="11%"
                                                *ngIf="_DoctorShareService.DocFormGroup.get('DocShareType').value=='P'">
                                                <mat-label>%</mat-label>
                                                <input name="Percentage" formControlName="Percentage" matInput
                                                    [(ngModel)]="vServicePerc"
                                                    (keypress)="keyPressAlphanumeric($event)">
                                            </mat-form-field>

                                            <mat-form-field appearance="outline" fxFlex="11%"
                                                *ngIf="_DoctorShareService.DocFormGroup.get('DocShareType').value=='A'">
                                                <mat-label>Amount</mat-label>
                                                <input name="Amount" formControlName="Amount" matInput
                                                    [(ngModel)]="vServiceAmt" (keypress)="keyPressAlphanumeric($event)">
                                            </mat-form-field>

                                        </div>
                                    </div>
                                </form>
                            </mat-card>
                        </div>
                    </mat-card>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <div class="footer-navigation-container">
            <div class="modal-footer-buttons">
                <button class="btn btn-danger-outline" (click)="onClose()">Close</button>
                <button class="btn btn-primary" (click)="OnSave()">Save</button>
            </div>
        </div>
    </div>
</div>
