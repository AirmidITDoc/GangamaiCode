<div class="modal-wrapper grid-container">
    <!-- Modal header -->
    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <button mat-icon-button class="sidebar-toggle mr-12" style="color: white;">
                    <mat-icon>menu</mat-icon>
                </button>

                <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}"
                    style="color: white;">
                  Substitutes List
                </span>
            </div>
            <div class="modal-header-right">
                <div class="close-icon">
                    <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                        matTooltip="Close">
                        <mat-icon>close</mat-icon>
                    </button>
                </div>
            </div>
        </div>
    </div>

<div class="modal-body">
    <div class="h-100-p" fxLayout="column">

        <div class="modal-card-container">
            <!-- CONTENT -->
         
                <form [formGroup]="SubtituteForm">

                    <div fxFlexFill fxlayout="column" fxLayout="row" fxLayoutGap="6px">

                         <airmid-autocomplete label="Item Name (enter 2 char)" 
                            [formGroup]="SubtituteForm" formControlName="ItemId"
                            placeholderText="Item Name (enter 2 char)" fxFlex id="ItemId"
                            ApiUrl="ItemMaster/GetItemListforSalesPage?StoreId=2&ItemName=" TextField="itemName"
                            ValueField="itemId" (selectionChange)="onItemChange($event)"  
                            #ItemId></airmid-autocomplete>


                             <airmid-dropdown label="Item Generic Name" formControlName="itemGenericNameId"
                               [formGroup]="SubtituteForm"
                              [validations]="getValidationMessages().itemGenericNameId" [mode]="autocompleteModeItemGenericName"
                              fxFlex="30%">
                             </airmid-dropdown>
                       
                    </div>
                </form> 
        </div>
        <div class="modal-card-container">
            <div class="airmid-table-container py-12 h-100-p" fxLayout="column">

                <mat-table #table matSort class="airmid-table table3 h-100-p" [dataSource]="dsItemList">

                    <ng-container matColumnDef="ItemName">
                        <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm>
                            ItemName
                        </mat-header-cell>
                        <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                            {{contact.ItemName}}
                        </mat-cell>
                    </ng-container>

                    <ng-container matColumnDef="ItemGenericName">
                        <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm>
                            ItemGenericName</mat-header-cell>
                        <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                            {{contact.ItemGenericName}}
                        </mat-cell>
                    </ng-container>

                    <mat-header-row class="accent" *matHeaderRowDef="displayedColumns;sticky: true">
                    </mat-header-row>
                    <mat-row *matRowDef="let row;columns: displayedColumns" class="element"
                        [@animate]="{value: '*',params: { y: '100%' }}"></mat-row>
                </mat-table>
                <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [pageSize]="15" showFirstLastButtons>
                </mat-paginator>
            </div>
        </div>
    </div>
</div>
    <div class="modal-footer" fxLayoutAlign="end">
