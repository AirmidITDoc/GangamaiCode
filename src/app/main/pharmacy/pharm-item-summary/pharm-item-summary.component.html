 <div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start" style="width: 100%;"> 

        <mat-tab label="Item Summary BatchWise Stock">
            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight> 
               
                <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">  
                    <airmid-table [gridConfig]="gridConfig" class="content" #grid>
                        <ng-container filters>
                            <form [formGroup]="searchFormGroup" fxLayout="column"> 

                                <airmid-dropdown label="Store Name" formControlName="StoreId"
                                    [formGroup]="searchFormGroup"
                                    [validations]="getValidationMessages().StoreId" fxFlex [mode]="autocompletestore"
                                    (keyup)="selectChangeStore($event)">
                                </airmid-dropdown> 
                                 
                                  <airmid-textbox fxFlex label="NonMoving Day" formControlName="NonMovingDay"
                                    [formGroup]="searchFormGroup" (keyup)="onChangeNonMoving()"
                                    [validations]="getValidationMessages().NonMovingDay"></airmid-textbox> 


                                    <mat-radio-group aria-label="Select an option" formControlName="BatchRadio" name="BatchRadio"
                                        (change)="onChangeNonMoving()" fxFlex="100%" fxFlex.xs="100%">
                                        <mat-radio-button value="Batch">With BatchExp </mat-radio-button>
                                        <mat-radio-button value="NoBatch">Without BatchExp</mat-radio-button>
                                    </mat-radio-group>

                            </form>
                        </ng-container>
                    </airmid-table>
                </div> 
            </div>
        </mat-tab>

       <mat-tab label="Item ExpReport MonthWise">
            <div fusePerfectScrollbar
                class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                dynamicTableHeight>
                <div class="page-layout simple left-sidebar inner-sidebar inner-scroll"> 
                
 
                    <airmid-table [gridConfig]="gridConfig2" class="content">
                        <ng-container filters>
                            <form [formGroup]="searchFormGroup" fxLayout="column"> 
                              
                                  <!-- <mat-form-field appearance="outline" fxFlex>
                                            <input matInput [matDatepicker]="picker" placeholder="Choose a date"
                                                formControlName="startdate">
                                            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                                            <mat-datepicker #picker startView="multi-year"
                                                (yearSelected)="chosenYearHandler($event)"
                                                (monthSelected)="chosenMonthHandler($event)"></mat-datepicker>
                                  </mat-form-field> -->

                              <airmid-dropdown label="Store Name" formControlName="ExpStoreId"
                                    [formGroup]="searchFormGroup"
                                    [validations]="getValidationMessages().ExpStoreId" fxFlex [mode]="autocompletestore"
                                    (keyup)="selectChangeStoreExp($event)">
                                </airmid-dropdown> 

                                <airmid-textbox fxFlex label="Exp Month" formControlName="ExpMonth"
                                    [formGroup]="searchFormGroup"
                                    (keyup)="onChangeExplist()"
                                    [validations]="getValidationMessages().ExpMonth"></airmid-textbox>

                                <airmid-textbox fxFlex label="Exp Year" formControlName="ExpYear"
                                    [formGroup]="searchFormGroup"
                                    (keyup)="onChangeExplist()"
                                    [validations]="getValidationMessages().ExpYear"></airmid-textbox> 

                            </form>
                        </ng-container>
                    </airmid-table>
                </div>
            </div>
        </mat-tab>  

    </mat-tab-group>
</div>
