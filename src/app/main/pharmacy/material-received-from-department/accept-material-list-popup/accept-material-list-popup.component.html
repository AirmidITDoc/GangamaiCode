<div class="page-layout modal-wrapper grid-container" fusePerfectScrollbar>

    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">    Material List </span>
            </div>
            <div class="modal-header-right">
                <div class="comman-date-container">

                    <div class="close-icon">
                        <button mat-icon-button tabIndex="-1" (click)="onClose()" aria-label="Close dialog">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="modal-body content">
        <div fxLayout="column" class="gap-8 h-100-p">

            <div class="modal-card-container h-100-p">
                <div fxLayout="row" fxLayoutAlign="start none" fxLayoutGap="8px">
                    <mat-table #table matSort [dataSource]="dsItemList" style="overflow: auto">

                        <ng-container matColumnDef="Action">
                            <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm class="w-100">

                                <mat-checkbox aria-label="Checked" [(ngModel)]="masterSelected"
                                    (change)="checkUncheckAll()">
                                </mat-checkbox>
                            </mat-header-cell>
                            <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-100">
                                <mat-checkbox aria-label="Checked" (change)="tableElementChecked($event, contact)"
                                    [(ngModel)]="contact.selected" [disabled]="contact.Status==1">
                                </mat-checkbox>
                            </mat-cell>
                        </ng-container>



                        <ng-container matColumnDef="Status">
                            <mat-header-cell *matHeaderCellDef class="w-100">Status</mat-header-cell>

                            <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-100">
                                <mat-icon *ngIf="contact.status=='A'" matTooltip="Verified" style="color: green;">assignment_turned_in</mat-icon>
                                
                            </mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="ItemName">
                            <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm class="w-350">
                                ItemName
                            </mat-header-cell>
                            <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-350">
                                {{contact.itemName}}
                            </mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="BatchNo">
                            <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm class="w-100">
                                BatchNo</mat-header-cell>
                            <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-100">
                                {{contact.batchNo}}
                            </mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="BatchExpDate">
                            <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm class="w-100">
                                BatchExpDate</mat-header-cell>
                            <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-100">
                                {{contact.batchExpDate | date:'shortDate'}}
                            </mat-cell>
                        </ng-container>
                        <ng-container matColumnDef="IssueQty">
                            <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm class="w-100">
                                Qty</mat-header-cell>
                            <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-100">
                                {{contact.issueQty}}
                            </mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="PerUnitLandedRate">
                            <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm class="w-100">
                                Rate</mat-header-cell>
                            <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-100">
                                {{contact.perUnitLandedRate}}
                            </mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="LandedTotalAmount">
                            <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm class="w-100">
                                Total Amount</mat-header-cell>
                            <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-100">
                                {{contact.landedTotalAmount}}
                            </mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="VatPercentage">
                            <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm class="w-100">
                                GST %</mat-header-cell>
                            <mat-cell *matCellDef="let contact" fxShow.gt-sm class="w-100">
                                {{contact.vatPercentage}}
                            </mat-cell>
                        </ng-container>

                        <mat-header-row class="accent" *matHeaderRowDef="displayedColumns;sticky: true">
                        </mat-header-row>
                        <mat-row *matRowDef="let row;columns: displayedColumns" class="element"
                            [@animate]="{value: '*',params: { y: '100%' }}"></mat-row>
                    </mat-table>

                </div>

            </div>
        </div>
    </div>
    <div class="modal-footer" fxLayout="column">

        <div class="modal-footer-buttons">
            <button class="btn btn-primary " (click)="onSubmit()" >Save</button>
            <button class="btn btn-danger-outline" (click)="onClose()">Reset</button>

        </div>
    </div>
</div>
