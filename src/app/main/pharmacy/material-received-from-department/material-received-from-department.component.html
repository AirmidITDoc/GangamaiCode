<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" style="height: 100%;" fusePerfectScrollbar
    dynamicTableHeight>
    <mat-toolbar class="top-header accent">
        <div fxLayout="row" fxLayoutAlign="start center" class="top-header-info">

            <mat-icon class="logo-icon" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}">account_box
            </mat-icon>
            <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                Matarial Received By Department List
            </span>
        </div>

    </mat-toolbar>
<div class="info-badge-top pb-2 border-bottom" style="padding-left: 5px;">
        <div fxLayout="row" fxLayoutAlign="start center" class="gap-8">
            <div fxLayout="row" fxLayoutAlign="start center" class="gap-4">
                <mat-icon class="pill green-600 s-16">circle</mat-icon>
                <span>:Accepted</span>
            </div>
            <div fxLayout="row" fxLayoutAlign="start center" class="gap-4">
                <mat-icon class="pill orange-600 s-16">circle</mat-icon>
                <span>: Pending </span>
            </div>
            <div fxLayout="row" fxLayoutAlign="start center" class="gap-4">
                <mat-icon class="pill red-600 s-16">circle</mat-icon>
                <span>:Rejected</span>
            </div>
        </div>
    </div>

    <div fusePerfectScrollbar
        class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
        dynamicTableHeight>

        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
            <ng-template #actionButtonTemplate let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <button mat-icon-button matTooltip="Print IssueToDept"
                        (click)="viewgetIssuetodeptReportPdf(element)">
                        <mat-icon> print</mat-icon>
                    </button>
                    <!-- *ngIf="element.isAccepted=='0'" pendingByDepartment -->
                    <button mat-icon-button matTooltip="Edit" (click)="onEdit(element)"
                        *ngIf="element.pendingByDepartment!='0'">
                        <img width="40" height="40" src="assets/images/logos/Accept.png">

                    </button>
                </div>
            </ng-template>

            <ng-template #Astatus let-element>
                <!-- <div fxLayout="row" fxLayoutAlign="center center">

                    <button mat-icon-button>
                        <mat-icon matTooltip="Accepted" *ngIf="element.acceptedByDepartment>0"
                            class="pill green-600 s-18">circle</mat-icon>{{element.acceptedByDepartment}}
                    </button>
                </div> -->
                <div matTooltip="Accepted" class="pill1 green-600 s-18">
                    {{element.acceptedByDepartment}}
                </div>
            </ng-template>




            <ng-template #Rstatus let-element>
                <!-- <div fxLayout="row" fxLayoutAlign="center center">
                <mat-icon class="pill red-600 s-16" matTooltip="Rejected" >circle</mat-icon>{{element.rejetcedByDepartment}}
                </div> -->
                <div matTooltip="Rejected" class="pill1 red-600 s-18">
                    {{element.rejetcedByDepartment}}
                </div>
            </ng-template>

            <ng-template #Pstatus let-element>
                <!-- <div fxLayout="row" fxLayoutAlign="center center">
                <mat-icon matTooltip="Pending" class="pill orange-600 s-16" >circle</mat-icon>{{element.pendingByDepartment}}
                </div> -->
                <div matTooltip="Pending" class="pill1 orange-600 s-18">
                    {{element.pendingByDepartment}}
                </div>
            </ng-template>


            <!-- <ng-template #isVerifiedstatus let-element>
                <div fxLayout="row" fxLayoutAlign="center center">

                    <mat-icon *ngIf="element.isverify=='1';" matTooltip="Is Verify"
                        style="color: green;">check_circle</mat-icon>
                    <mat-icon *ngIf="!element.isverify=='1';" matTooltip="Not Verify"
                        style="color: rgb(128, 0, 30);">hourglass_empty</mat-icon>
                </div>
            </ng-template> -->

            <airmid-table [gridConfig]="gridConfig" class="content" (onSelectRow)="GetDetails1($event)" #grid>

                <ng-container filters>
                    <form [formGroup]="IssueSearchGroup" fxLayout="column">

                        <!-- <airmid-datepicker [formGroup]="IssueSearchGroup" [isRangePicker]="true"
                            formStartControlName="startdate" formEndControlName="enddate"
                            [(fromValue)]="gridConfig.filters[0].fieldValue" (dateChange)="onChangeFirst($event)"
                            [(toValue)]="gridConfig.filters[1].fieldValue">
                        </airmid-datepicker> -->

                        <airmid-datepicker [formGroup]="IssueSearchGroup" [isRangePicker]="true"
                            formStartControlName="startdate" formEndControlName="enddate"
                            [(fromValue)]="gridConfig.filters[1].fieldValue"
                            [(toValue)]="gridConfig.filters[2].fieldValue">
                        </airmid-datepicker>

                        <airmid-dropdown label="To Store Name" formControlName="ToStoreId"
                            (selectionChange)="ListView1($event)" [formGroup]="IssueSearchGroup"
                            [mode]="autocompletestore" [(ngModel)]="gridConfig.filters[0].fieldValue">
                        </airmid-dropdown>

                        <!-- [(ngModel)]="Status" -->
                        <mat-slide-toggle name="IsVerify" (change)="onChangeFirst($event)" formControlName="IsVerify">
                            Pending/Close
                        </mat-slide-toggle>

                    </form>
                </ng-container>
            </airmid-table>

        </div>
        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll" *ngIf="isShowDetailTable">
            <ng-template #detailstatus let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <mat-icon *ngIf="element.status=='1'" matTooltip="Status True"
                        class="pill green-600 s-16">circle</mat-icon>

                    <mat-icon *ngIf="element.status=='0'" matTooltip="Status False"
                        class="pill red-600 s-16">circle</mat-icon>
                </div>
            </ng-template>
            <airmid-table [gridConfig]="gridConfig1" class="content" #grid1 :ShowFilter="false">
            </airmid-table>
        </div>
    </div>
    
</div>
