<div class="modal-page page-layout inner-scroll" fxLayout="column" fxFlexFill>
  <!-- Header -->
<div class="modal-header accent" fxLayout="row" fxLayoutAlign="space-between center" fxLayout.lt-sm="column"
    style="padding: 8px 16px; color: white;">
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="8px">
        <button mat-icon-button style="color: white;">
            <mat-icon>menu</mat-icon>
        </button>
        <span class="logo-text h1">Substitutes List</span>
    </div>

    <button mat-icon-button [mat-dialog-close]="true" aria-label="Close">
        <mat-icon>close</mat-icon>
    </button>
</div>

  <!-- Body -->
  <div class="modal-body" fxFlex fxLayout="column" fxLayoutGap="16px" style="padding: 12px;">
    <!-- Search Form -->
    <mat-card fxFlex="none">
        <mat-card-content>
            <form [formGroup]="SubtituteForm" fxLayout="row" fxLayoutGap="12px" fxLayout.lt-md="column"
                fxLayoutAlign="start stretch">
                <airmid-autocomplete fxFlex fxFlex.lt-md="100%" label="Item Name (enter 2 char)" [formGroup]="SubtituteForm"
                    formControlName="ItemId" placeholderText="Item Name (enter 2 char)"
                    ApiUrl="ItemMaster/GetItemListforSalesPage?StoreId=2&ItemName=" TextField="itemName"
                    (selectionChange)="onItemChange($event)"  ValueField="itemId">
                </airmid-autocomplete>
    
                <airmid-dropdown fxFlex="35%" fxFlex.lt-md="100%" label="Item Generic Name" [formGroup]="SubtituteForm"
                    formControlName="itemGenericNameId" (selectionChange)="getSelectedObjGeneric($event)"
                    [validations]="getValidationMessages().itemGenericNameId" [mode]="autocompleteModeItemGenericName">
                </airmid-dropdown>
            </form>
        </mat-card-content>
    </mat-card>

    <!-- Table -->
    <mat-card fxFlex fxLayout="column">
        <div fxFlex class="table-scroll" style="overflow-x: auto;">
            <mat-table #table class="airmid-table" matSort [dataSource]="dsItemList" style="width: 100%; min-width: 500px;">
                <ng-container matColumnDef="ItemName">
                    <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm>
                        ItemName
                    </mat-header-cell>
                    <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                        {{contact.itemName}}
                    </mat-cell>
                </ng-container>
            
                <ng-container matColumnDef="ItemGenericName">
                    <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm>
                        ItemGenericName</mat-header-cell>
                    <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                        {{contact.itemGenericName}}
                    </mat-cell>
                </ng-container>
            
                <!-- Header & Rows -->
                <mat-header-row class="accent" *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
                <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
            </mat-table>
        </div>
    
        <mat-paginator [pageSizeOptions]="[5, 10, 25]" [pageSize]="10" showFirstLastButtons></mat-paginator>
    </mat-card>
  </div>
</div>
