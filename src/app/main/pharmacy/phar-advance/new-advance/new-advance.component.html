<div class="page-layout modal-wrapper grid-container" fusePerfectScrollbar>

    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">Pharmacy Advance</span>
            </div>
            <div class="modal-header-right">
                <div class="comman-date-container">
                    <div class="comman-date">
                        <app-common-date [screenFrom]="screenFromString"
                            (dateTimeEventEmitter)="getDateTime($event)"></app-common-date>
                    </div>
                    <div class="close-icon">
                        <button mat-icon-button tabIndex="-1" (click)="OnReset()" aria-label="Close dialog">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-body content">
        <div class="modal-body-container">
            <div fxLayout="column" class="gap-8 h-100-p">
                <div class="modal-card-container">
                    <form [formGroup]="MainForm">

                        <div fxLayout="row" fxLayoutAlign="start center" class="gap-8">
                            <div class="radio-container">
                                <mat-radio-group formControlName="Op_ip_id" fxFlex="5%">
                                    <mat-radio-button value="1" [checked]="true">IP</mat-radio-button>
                                </mat-radio-group>
                            </div>

                            <div class="input-container gap-8" fxFlex="50%">

                                <airmid-autocomplete lbl="RgId" [formGroup]="MainForm" formControlName="RegID"
                                    placeholderText="IP-RegNo/Patient Name/Mobile No"
                                    label="Search Reg No / Patient Name / Mobile No"
                                    ApiUrl="Admission/search-patient?Keyword="
                                    (selectionChange)="getSelectedObjIP($event)" ValueField="admissionID"
                                    TextField="formattedText">
                                </airmid-autocomplete>

                            </div>
                        </div>

                    </form>
                </div>
                <!-- Patient Info Section -->
                <div class="modal-card-container mt-0" style="margin-top: -4px;">
                    <div fxFlex.gt-sm="100%" fxFlex>
                        <mat-card fxFlex.gt-sm="100%" fxFlex style="padding: 2px 10px;">
                            <div class="patient-info-sales">
                                <div class="patient-info-title border-bottom pb-1 mb-1">
                                    <span class="h1 m-0" style="line-height: normal;">Patient Information</span>
                                </div>
                                <div class="Ipd-patient-info w-100-p">
                                    <app-patient-information [uhidNo]="regObj?.regNo" [patientName]="vPatienName"
                                        [doctorName]="regObj?.doctorName" [departmentName]="regObj?.departmentName"
                                        [doa]="regObj?.admissionDate" [ipdNo]="regObj?.ipdNo || regObj?.ipdno"
                                        [ageString]="(regObj?.age !== undefined ? regObj?.age + 'Y|' + regObj?.ageMonth + 'M|' + regObj?.ageDay + 'D | ' + regObj?.genderName : '')"
                                        [refDocName]="regObj?.refDocName"
                                        [wardBedName]="(regObj?.roomName && regObj?.bedName) ? (regObj?.roomName + ' | ' + regObj?.bedName) : ''"
                                        [patientType]="regObj?.patientType" [tariffName]="regObj?.tariffName"
                                        [companyName]="regObj?.companyName"></app-patient-information>
                                </div>
                            </div>
                        </mat-card>
                    </div>
                </div>
                <div class="modal-card-container h-100-p">
                    <div fxFlex.gt-sm="100%" fxFlex class="dynamic-table-wrapper">

                        <airmid-table [gridConfig]="gridConfig" #grid :ShowFilter="false">
                        </airmid-table>

                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="modal-footer" fxLayout="column">
        <div class="modal-card-container">
            <form [formGroup]="MainForm">
                <div fxLayout="column" fxLayout.gt-xs="row" fxLayoutGap="4px" fxLayoutAlign="start">
                    <!-- Advance Amount -->
                    <div fxFlex="25%">
                        <airmid-textbox label="Advance Amount" formControlName="advanceAmt" type="number" min="1"
                            [formGroup]="MainForm">
                        </airmid-textbox>
                    </div>
                    <!-- Reason of Advance -->
                    <div fxFlex="100%">
                        <airmid-textbox label="Reason of Advance" formControlName="comment" type="text"
                            [formGroup]="MainForm"></airmid-textbox>
                    </div>
                </div>
            </form>
            <div>
                <div class="modal-footer-buttons" fxLayoutGap="6px">
                    <button class="btn btn-danger-outline" (click)="OnReset()">Close</button>
                    <button class="btn btn-primary" (click)="onSave()">Save</button>
                </div>
            </div>

        </div>
    </div>
</div>
