<div class="modal-page page-layout inner-scroll"  dynamicTableHeight>
    <div class="modal-wrapper grid-container">
        <div class="modal-header accent">
            <div class="modal-header-content">
                <div class="modal-header-title">
                    <mat-icon class="logo-icon mr-16" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}"
                        style="color: white;">account_box
                    </mat-icon>
                    <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}"
                        style="color: white;">
                        Reorder Level Summary
                    </span>
                </div>

                <div class="modal-header-right" fxLayout="row" fxLayoutGap="10px">
                    <button mat-raised-button (click)="RaiseIndent()">Raise Indent</button>
                    <!-- <div class="comman-date-container">
            <app-common-date [screenFrom]="screenFromString"
              (dateTimeEventEmitter)="getDateTime($event)"></app-common-date>
          </div> -->
                </div>
            </div>
        </div> 

        <div class="modal-body">
            <div fxLayout="column" class="gap-8 h-100-p">
                <div class="modal-body-container">
                    <div class="modal-card-container">
                        <form [formGroup]="_Reorderlevelsummery.SearchFrom">
                            <div fxLayout="row" fxLayoutGap="8px">

                                <!-- <div fxFlex="50%" fxFlex.sm="100%" *ngIf="!vCheckBox">
                                            <airmid-autocomplete label="IP RegNo / First Name / Last Name / Mobile No"
                                                [formGroup]="_Reorderlevelsummery.SearchFrom" formControlName="PatientName"
                                                placeholderText="IP RegNo / First Name / Last Name / Mobile No" fxFlex
                                                ApiUrl="Admission/search-patient?Keyword="
                                                (selectionChange)="getSelectedObjRegIP($event)" TextField="formattedText"
                                                ValueField="regId"></airmid-autocomplete>
                                        </div>
        
                                        <div fxFlex="50%" fxFlex.sm="100%" *ngIf="vCheckBox">
                                            <airmid-autocomplete lbl="RegID" [formGroup]="_Reorderlevelsummery.SearchFrom"
                                                label="Search Reg No / Patient Name / Mobile No(DC)"
                                                formControlName="PatientName" fxFlex
                                                placeholderText="RegNo / First Name / Last Name / Mobile No(DC)"
                                                ApiUrl="Admission/Dischargesearch-patient?Keyword="
                                                (selectionChange)="getSelectedObjRegIP($event)" TextField="formattedText"
                                                ValueField="regId">
                                            </airmid-autocomplete>
                                        </div>  -->

                                <!-- <airmid-dropdown label="Reorder Type" formControlName="Type" [formGroup]="_Reorderlevelsummery.SearchFrom"
                                    [validations]="getValidationMessages().Type" fxFlex="30%" [mode]="autocompleteReorderType">
                                </airmid-dropdown>

                                <airmid-dropdown label="Reorder Qty" formControlName="ReorderQty" [formGroup]="_Reorderlevelsummery.SearchFrom"
                                    [validations]="getValidationMessages().ReorderQty" fxFlex="30%" [mode]="autocompleteReorderQty">
                                </airmid-dropdown> -->

                                <mat-form-field appearance="outline" fxFlex="20%">
                                    <mat-label>Type</mat-label>
                                    <mat-select formControlName="Type">
                                        <mat-option>--Select--</mat-option>
                                        <mat-option value="Qty">Qty Wise</mat-option>
                                        <mat-option value="Strip">Strip Wise</mat-option>
                                    </mat-select>
                                </mat-form-field>

                                <mat-form-field appearance="outline" fxFlex="20%">
                                    <mat-label>Reorder Qty</mat-label>
                                    <mat-select formControlName="ReorderQty">
                                        <mat-option>--Select--</mat-option>
                                        <mat-option value="10">10</mat-option>
                                        <mat-option value="30">30</mat-option>
                                        <mat-option value="50">50</mat-option>
                                        <mat-option value="70">70</mat-option>
                                        <mat-option value="100">100</mat-option>
                                    </mat-select>
                                </mat-form-field>

                                <button mat-raised-button class="clearbutton" matTooltip="close" (click)="OnClear()">
                                    <mat-icon class="cleariconbutton">close</mat-icon>
                                </button>
                                <button mat-raised-button class="searchButton" matTooltip="search"
                                    (click)="getReorderlvlList()">
                                    <mat-icon class="searchiconbutton">search</mat-icon>
                                </button>&nbsp;
                            </div>
                        </form>
                    </div>

                    <div class="modal-card-container">
                        <div class="airmid-table-container py-12 h-100-p" fxLayout="column">
                            <mat-card> 
                            <mat-table #table matSort class="table" [dataSource]="dsReorderlevelSummery"
                                [@animateStagger]="{value:'50'}" style="overflow: auto;">

                                <ng-container matColumnDef="Action" sticky>
                                    <mat-header-cell *matHeaderCellDef mat-sort-header>
                                        <span class="material-icons">
                                            cached
                                        </span>
                                    </mat-header-cell>
                                    <mat-cell *matCellDef="let contact" required>
                                        <mat-checkbox aria-label="Checked"
                                            (change)="tableElementChecked($event, contact)">
                                        </mat-checkbox>
                                    </mat-cell>

                                </ng-container>

                                <ng-container matColumnDef="ItemName">
                                    <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm>
                                        ItemName
                                    </mat-header-cell>
                                    <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                                        {{contact.itemName}}
                                    </mat-cell>
                                </ng-container>

                                <ng-container matColumnDef="Packing">
                                    <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm>
                                        Packing
                                    </mat-header-cell>
                                    <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                                        {{contact.packing}}
                                    </mat-cell>
                                </ng-container>

                                <ng-container matColumnDef="BalQty">
                                    <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm>
                                        BalQty
                                    </mat-header-cell>
                                    <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                                        {{contact.balQty}}
                                    </mat-cell>
                                </ng-container>

                                <ng-container matColumnDef="ReorderQty">
                                    <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm>
                                        StripQty
                                    </mat-header-cell>
                                    <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                                        {{contact.stripQty}}
                                    </mat-cell>
                                </ng-container>

                                <ng-container matColumnDef="loading">
                                    <mat-header-cell *matFooterCellDef colspan="6" style="display: none;">
                                    </mat-header-cell>
                                </ng-container>

                                <ng-container matColumnDef="noData">
                                    <mat-footer-cell *matFooterCellDef colspan="6">
                                        no data found...
                                    </mat-footer-cell>
                                </ng-container>

                                <mat-header-row class="accent" *matHeaderRowDef="displayedColumns; sticky: true">
                                </mat-header-row>

                                <mat-row *matRowDef="let contact; columns: displayedColumns;" class="contact"
                                    [@animate]="{value:'*',params:{y:'100%'}}"></mat-row>
                                <mat-footer-row *matFooterRowDef="['loading']"
                                    [ngClass]="{'hide':!(sIsLoading == 'loading-data')}"></mat-footer-row>
                                <mat-footer-row *matFooterRowDef="['noData']"
                                    [ngClass]="{'hide':!(dsReorderlevelSummery!=null && dsReorderlevelSummery.data.length==0)}"></mat-footer-row>
                            </mat-table>
                            <mat-paginator #paginator [pageSizeOptions]="[25,35, 50, 100]" [pageSize]="25"
                                showFirstLastButtons>
                            </mat-paginator>
                            </mat-card>
                        </div> 
                    </div>
                </div>
            </div>
        </div> 
    </div>
</div>
