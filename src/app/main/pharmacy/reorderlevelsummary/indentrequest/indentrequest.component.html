<div class="modal-page page-layout inner-scroll"  dynamicTableHeight>
    <div class="modal-wrapper grid-container">
        <div class="modal-header accent">
            <div class="modal-header-content">
                <div class="modal-header-title">
                    <mat-icon class="logo-icon mr-16" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}"
                        style="color: white;">account_box
                    </mat-icon>
                    <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}"
                        style="color: white;">
                        Indent Request
                    </span>
                </div>

                <div class="modal-header-right" fxLayout="row" fxLayoutGap="10px">
                    <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog" matTooltip="Close">
                <mat-icon>close</mat-icon>
              </button> 
                     <!-- <div class="comman-date-container">
            <app-common-date [screenFrom]="screenFromString"
              (dateTimeEventEmitter)="getDateTime($event)"></app-common-date>
          </div> -->
                </div>
            </div>
        </div>


        <div class="modal-body">
            <div fxLayout="column"  class="gap-8 h-100-p">
                <div class="modal-body-container">
                    <div class="modal-card-container">
                        <form [formGroup]="_Reorderlevelsummery.RaisedIndentFrom">
                            <div fxLayout="row" fxLayoutGap="8px">
                            
                                <!-- <div fxFlex="50%" fxFlex.sm="100%" *ngIf="!vCheckBox">
                                                                        <airmid-autocomplete label="IP RegNo / First Name / Last Name / Mobile No"
                                                                            [formGroup]="_Reorderlevelsummery.SearchFrom" formControlName="PatientName"
                                                                            placeholderText="IP RegNo / First Name / Last Name / Mobile No" fxFlex
                                                                            ApiUrl="Admission/search-patient?Keyword="
                                                                            (selectionChange)="getSelectedObjRegIP($event)" TextField="formattedText"
                                                                            ValueField="regId"></airmid-autocomplete>
                                                                    </div>
                                    
                                                                    <div fxFlex="50%" fxFlex.sm="100%" *ngIf="vCheckBox">
                                                                        <airmid-autocomplete lbl="RegID" [formGroup]="_Reorderlevelsummery.SearchFrom"
                                                                            label="Search Reg No / Patient Name / Mobile No(DC)"
                                                                            formControlName="PatientName" fxFlex
                                                                            placeholderText="RegNo / First Name / Last Name / Mobile No(DC)"
                                                                            ApiUrl="Admission/Dischargesearch-patient?Keyword="
                                                                            (selectionChange)="getSelectedObjRegIP($event)" TextField="formattedText"
                                                                            ValueField="regId">
                                                                        </airmid-autocomplete>
                                                                    </div>  -->
                            
                                <airmid-dropdown label="Store Name" formControlName="ToStoreId" [formGroup]="_Reorderlevelsummery.RaisedIndentFrom"
                                    [validations]="getValidationMessages().ToStoreId" fxFlex="30%" [mode]="autocompletestore">
                                </airmid-dropdown>
                            
                                <div fxLayout="row" fxLayoutGap="6px" style="padding-top: 5px;">
                                    <button mat-raised-button class="clearbutton" matTooltip="close">
                                        <mat-icon class="cleariconbutton">close</mat-icon>
                                    </button>
                                    <button mat-raised-button class="searchButton" matTooltip="search">
                                        <mat-icon class="searchiconbutton">search</mat-icon>
                                    </button>&nbsp;
                                </div>
                            </div>
                        </form>
                    </div>

                    <div class="modal-card-container">
                        <div class="airmid-table-container" fxLayout="column">
                            <mat-card>  
                                 <mat-table #table matSort [dataSource]="dsRaisedIndent"  class="airmid-table"
                                        [@animateStagger]="{value:'50'}" style="overflow:auto;"> 

                                        <ng-container matColumnDef="ItemName">
                                            <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm>
                                                Item Name
                                            </mat-header-cell>
                                            <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                                                {{contact.itemName}}
                                            </mat-cell>
                                        </ng-container>

                                        <ng-container matColumnDef="Packing">
                                            <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm>
                                                Packing
                                            </mat-header-cell>
                                            <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                                                {{contact.packing}}
                                            </mat-cell>
                                        </ng-container>

                                        <ng-container matColumnDef="BalQty">
                                            <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm>
                                                BalQty
                                            </mat-header-cell>
                                            <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                                                {{contact.balQty}}
                                            </mat-cell>
                                        </ng-container>

                                        <ng-container matColumnDef="StripQty">
                                            <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm>
                                                StripQty
                                            </mat-header-cell>
                                            <mat-cell *matCellDef="let contact" fxShow.gt-sm>
                                                {{contact.stripQty}}
                                            </mat-cell>
                                        </ng-container>

                                        <ng-container matColumnDef="IndentQty">
                                            <mat-header-cell *matHeaderCellDef mat-sort-header fxShow.gt-sm
                                               >IndentQty
                                            </mat-header-cell>
                                            <mat-cell   *matCellDef="let contact" fxShow.gt-sm>
                                                <mat-form-field appearance="fill">
                                                    <input matInput [(ngModel)]="contact.indentQty" type="text"
                                                   OnlyNumber >
                                                </mat-form-field>
                                            </mat-cell>
                                        </ng-container>

                                          <ng-container matColumnDef="Action">
                                            <mat-header-cell *matHeaderCellDef style="color: white;">
                                                Action</mat-header-cell>
                                            <mat-cell *matCellDef="let row">
                                                <button mat-icon-button (click)="deleteTableRow(row)" color="warn">
                                                    <mat-icon>delete_outline</mat-icon>
                                                </button>
                                            </mat-cell>
                                        </ng-container> 

                                        <ng-container matColumnDef="loading">
                                            <mat-header-cell *matFooterCellDef colspan="6" style="display: none;">
                                            </mat-header-cell>
                                        </ng-container>

                                        <ng-container matColumnDef="noData">
                                            <mat-footer-cell *matFooterCellDef colspan="6">
                                                no data found...
                                            </mat-footer-cell>
                                        </ng-container>

                                        <mat-header-row class="accent"
                                            *matHeaderRowDef="displayedColumns; sticky: true">
                                        </mat-header-row>
                                        <mat-row *matRowDef="let contact; columns: displayedColumns;" class="contact"
                                            [@animate]="{value:'*',params:{y:'100%'}}"></mat-row>
                                        <mat-footer-row *matFooterRowDef="['loading']"
                                            [ngClass]="{'hide': !(sIsLoading == 'loading-data')}">
                                        </mat-footer-row>
                                        <mat-footer-row *matFooterRowDef="['noData']"
                                            [ngClass]="{'hide':!(dsRaisedIndent!=null && dsRaisedIndent.data.length==0)}">
                                        </mat-footer-row>
                                 </mat-table>
                            <mat-paginator #paginator [pageSizeOptions]="[25,35, 50, 100]" [pageSize]="15"
                                showFirstLastButtons>
                            </mat-paginator>
                            </mat-card>
                        </div> 
                    </div>
                </div>
            </div>
        </div> 



        <div class="modal-footer">
            <div class="modal-footer-container" fxLayout="row" fxLayoutAlign="end">
            <div class="modal-footer-buttons" fxLayoutGap="6px">
                <button class="btn btn-danger-outline" (click)="OnReset()">Close</button>
                <button class="btn btn-primary" (click)="OnSave()">Save</button>
            </div>
        </div>
        </div>
    </div>
</div>
