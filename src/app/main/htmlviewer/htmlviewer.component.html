<div fxlayout="row" fxFlex.gt-sm="100%" fxFlex class="page-layout simple right-sidebar" *ngIf="false">
    <div class="center" fusePerfectScrollbar style="overflow: auto;">
        <div fxlayout="row" fxlayoutalign="start center" class="accent header p-12 ng-tns-c409-38" style="width:100%;">
            <span class="h5 ng-tns-c409-38" style="font-size: 17px;">{{title}}</span>
            <!-- <button mat-icon-button (click)="onClose()" tabIndex="-1" aria-label="Close dialog" style="float:right;margin-top:-7px;">
        <mat-icon>close</mat-icon>
      </button> -->
        </div>

        <div style="padding:10px;" fxLayoutGap="2px">
            <div class="dialog-content-wrapper" style="align-items: flex-end;margin-right:10px;">
                <ngx-extended-pdf-viewer [base64Src]="base64" [zoom]="100"></ngx-extended-pdf-viewer>
            </div>
        </div>
    </div>
</div>

<div class="modal-wrapper grid-container">
    <!-- Modal header -->
    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span>{{title}}</span>
            </div>
            <div class="modal-header-right">
                <span class="qty-label">Qty</span>
                <input type="number" min="1" [(ngModel)]="qty" class="qty-input" matTooltip="Number of copies" />
                <button mat-icon-button matTooltip="Print (Thermal)" (click)="onPrintThermal()"
                    style="color: white; margin-right: 8px;">
                    <mat-icon>print</mat-icon>
                </button>
                <span tabIndex="-1" aria-label="Close dialog" matTooltip="Close" (click)="onClose()" class="close-icon">
                    <mat-icon>close</mat-icon>
                </span>
            </div>
        </div>
    </div>

    <!-- Modal body -->
    <div class="modal-body" fusePerfectScrollbar>
        <div class="modal-body-container">
            <!-- <div [innerHTML]="html"></div> -->
            <iframe #frame class="print-frame"></iframe>
        </div>
    </div>
</div>
