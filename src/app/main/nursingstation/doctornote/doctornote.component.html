<div class="simple page-layout inner-scroll inner-sidebar left-sidebar" dynamicTableHeight> <mat-toolbar
        style="width: 100%;justify-content: space-between;">
        <div fxLayout="row" fxLayoutAlign="start center"> <span class="logo-text h1"
                [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}" style="color: white;"> Doctor Note </span>
        </div>

        <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog" matTooltip="Close"
            (click)="closeDialog()" *ngIf="openedFromClinical">
            <mat-icon>close</mat-icon>
        </button>
    </mat-toolbar>
    <div class="content full-height-content" fxFlex>
        <div class="center p-12 pb-56" style="border-radius: 4px;">
            <div class="modal-card-container">
                <div fxFlexFill fxLayout="row" fxLayoutGap="4px" fxLayoutAlign="space-between" style="width: 50%;">
                    <div class="layout-card-container">
                        <form [formGroup]="myform">
                            <div class="patient-search">
                                <div fxLayout="row" fxLayoutAlign="start start" class="gap-8">
                                    <div fxFlexFill fxLayout="row" fxLayoutGap="4px" fxLayoutAlign="space-between">
                                        <airmid-autocomplete class="w-500" lbl="RgId" [formGroup]="myform"
                                            formControlName="RegID" label="Search Reg No / Patient Name / Mobile No"
                                            ApiUrl="Admission/search-patient?Keyword="
                                            placeholderText="Search UHID / Patient Name / Mobile No"
                                            (selectionChange)="getSelectedObjIP($event)" ValueField="admissionID"
                                            TextField="formattedText"> </airmid-autocomplete>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <form [formGroup]="myform">
                    <div fxFlexFill fxLayout="column" fxLayoutGap="10px">
  <!-- Patient Info Section -->
                    <div class="modal-card-container mt-0" style="margin-top: -4px;">
                        <div fxFlex.gt-sm="100%" fxFlex>
                            <mat-card fxFlex.gt-sm="100%" fxFlex style="padding: 2px 10px;">
                                <div class="patient-info-sales">
                                    <div class="patient-info-title border-bottom pb-1 mb-1">
                                        <span class="h1 m-0" style="line-height: normal;">Patient Information</span>
                                    </div>
                                    <div class="Ipd-patient-info w-100-p">
                                        <app-patient-information [uhidNo]="registerObj?.regNo"
                                            [patientName]="vPatientName" [doctorName]="registerObj?.doctorName"
                                            [departmentName]="registerObj?.departmentName" [doa]="vDOA"
                                            [ipdNo]="registerObj?.ipdNo || registerObj?.ipdno"
                                            [ageString]="(registerObj?.age !== undefined ? registerObj?.age + 'Y|' + registerObj?.ageMonth + 'M|' + registerObj?.ageDay + 'D | ' + registerObj?.genderName : '')"
                                            [refDocName]="vRefDocName"
                                            [wardBedName]="(vWardName && vBedName) ? (vWardName + ' | ' + vBedName) : ''"
                                            [patientType]="vPatientType" [tariffName]="vTariffName"
                                            [companyName]="vCompanyName"></app-patient-information>
                                    </div>
                                </div>
                            </mat-card>
                        </div>
                    </div>
                       <div fxFlex.gt-sm="100%" fxFlex>
                            <mat-tab-group>
                                <mat-tab label="Doctor Note">
                                    <div class="content" style="overflow: auto;">
                                        <div class="center pb-56" style="border-radius: 4px;padding: 10px;">
                                            <div class="content-card">
                                                <div fxFlexFill fxLayout="column" fxLayoutGap="10px">
                                                    <div fxLayout="row" fxLayoutGap="10px" fxFlex fxFlexFill
                                                        class="mat-elevation-z0">
                                                        <div fxFlex.gt-sm="40%" fxFlex fxFlexFill>
                                                            <mat-card class="mat-elevation-z2" fxLayout="column"
                                                                fxFlexFill style="padding: 5px; min-height: 400px;">
                                                                <div id="contacts" fxFlex="1 1 auto"
                                                                    style="overflow: auto; min-height: 350px;"
                                                                    class="page-layout simple left-sidebar inner-sidebar inner-scroll">
                                                                    <airmid-table [gridConfig]="gridConfig" #docNote
                                                                        :ShowFilter="false" :ShowButtons="false">
                                                                    </airmid-table>
                                                                </div>
                                                            </mat-card>
                                                        </div>
                                                        <div fxFlex.gt-sm="60%" fxFlex fxFlexFill>
                                                            <form [formGroup]="myNoteform" fxLayout="column" fxFlexFill>
                                                                <input type="hidden" formControlName="doctNoteId">
                                                                <div fxLayout="column" fxLayoutGap="2px" fxFlex
                                                                    fxFlexFill>
                                                                    <form [formGroup]="myform">
                                                                        <div fxLayout="row" fxLayoutGap="10px">
                                                                            <airmid-dropdown label="Template Name"
                                                                                *ngIf="showDropdown"
                                                                                formControlName="TemplateId"
                                                                                [formGroup]="myform" fxFlex="50%"
                                                                                ValueField="docNoteTempId"
                                                                                TextField="docsTempName"
                                                                                (selectionChange)="onChangetemplate($event)"
                                                                                ApiUrl="Pathology/get-DoctorNotesTemplateMaster">
                                                                            </airmid-dropdown>
                                                                            <div class="input-add-button">
                                                                                <div>
                                                                                    <button #addbutton
                                                                                        class="btn btn-primary btn-with-icon"
                                                                                        (click)="OnAdd()" id="btnAdd"
                                                                                        [disabled]="IsAddFlag">
                                                                                        <span class="btn-icon">
                                                                                            <mat-icon> add </mat-icon>
                                                                                        </span>
                                                                                        <span>Add</span>
                                                                                    </button>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </form>
                                                                    <mat-card class="mat-elevation-z2" fxLayout="column"
                                                                        fxFlex fxFlexFill>
                                                                        <div fxLayout="column" fxFlexFill>
                                                                            <div fxFlex fxFlexFill
                                                                                style="min-height: 400px;">
                                                                                <airmid-editor
                                                                                    formControlName="doctorsNotes"
                                                                                    [formGroup]="myNoteform"
                                                                                    (valueChange)="onEditorValueChange($event)">
                                                                                </airmid-editor>
                                                                            </div>
                                                                        </div>
                                                                    </mat-card>
                                                                    <div fxLayout="row"
                                                                        fxLayoutAlign="space-between center"
                                                                        fxLayoutGap="6px" class="mt-16">
                                                                        <div>
                                                                            <button class="btn btn-primary-outline"
                                                                                (click)="NewTemplate()">
                                                                                New Template
                                                                            </button>
                                                                        </div>
                                                                        <div fxLayout="row" fxLayoutGap="6px">
                                                                            <button class="btn btn-danger-outline"
                                                                                (click)="onClear()">
                                                                                Reset
                                                                            </button>
                                                                            <button class="btn btn-primary"
                                                                                (click)="onSubmit()">
                                                                                Save
                                                                            </button>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </form>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </mat-tab>

                                <mat-tab label="Patien Handover Note">
                                    <div class="content" style="overflow: auto;">
                                        <div class="center p-12 pb-56" style="border-radius: 4px;">
                                            <form [formGroup]="myform">
                                                <div fxFlexFill fxLayout="column" fxLayoutGap="10px">
                                                    <form [formGroup]="myHandOverform">
                                                        <input name="docHandId" formControlName="docHandId"
                                                            type="hidden">

                                                        <div fxLayout="row" fxLayoutGap="20px">

                                                            <!-- staffName -->
                                                            <span
                                                                style="font-size:40px;padding: 10px 10px 0 0;">I</span>
                                                            <mat-form-field appearance="outline" fxFlex="30%">
                                                                <textarea rows="4" matInput name="patHandI"
                                                                    formControlName="patHandI"
                                                                    [(ngModel)]="vStaffNursName"
                                                                    [maxLength]="500"></textarea>
                                                            </mat-form-field>

                                                            <!-- SYMPTOMS -->
                                                            <span style="font-size:40px;padding: 10px 0px 0 0;">B</span>
                                                            <mat-form-field appearance="outline" fxFlex="30%">
                                                                <textarea rows="4" matInput name="patHandB"
                                                                    formControlName="patHandB" [(ngModel)]="vSYMPTOMS"
                                                                    [maxLength]="500"></textarea>
                                                            </mat-form-field>

                                                            <!-- Instruction -->
                                                            <span style="font-size:40px;padding: 10px 0px 0 0;">R</span>
                                                            <mat-form-field appearance="outline" fxFlex="30%">
                                                                <textarea rows="4" matInput name="patHandR"
                                                                    formControlName="patHandR"
                                                                    [(ngModel)]="vInstruction"
                                                                    [maxLength]="500"></textarea>
                                                            </mat-form-field>
                                                        </div>

                                                        <div fxLayout="row" fxLayoutGap="20px">

                                                            <!-- Stable -->
                                                            <span style="font-size:40px;padding-top: 10px;">S</span>
                                                            <mat-form-field appearance="outline" fxFlex="29.5%">
                                                                <textarea rows="4" matInput name="patHandS"
                                                                    formControlName="patHandS" [(ngModel)]="VStable"
                                                                    [maxLength]="500"></textarea>
                                                            </mat-form-field>

                                                            <!-- Assessment -->
                                                            <span style="font-size:40px;padding-top: 10px;">A</span>
                                                            <mat-form-field appearance="outline" fxFlex="29%">
                                                                <textarea rows="4" matInput name="patHandA"
                                                                    formControlName="patHandA" [(ngModel)]="VAssessment"
                                                                    [maxLength]="500"></textarea>
                                                            </mat-form-field>

                                                            <div fxLayout="column" fxLayoutGap="6px"
                                                                style="padding: 10px 10px 0 60px;">
                                                                <mat-radio-group name="shiftInfo"
                                                                    formControlName="shiftInfo" fxLayout="row"
                                                                    [(ngModel)]="vHandOverType">
                                                                    <mat-radio-button
                                                                        value="morning">Morning</mat-radio-button>
                                                                    <mat-radio-button value="Evening">
                                                                        Evening</mat-radio-button>
                                                                    <mat-radio-button
                                                                        value="Night">Night</mat-radio-button>
                                                                </mat-radio-group>
                                                            </div> &nbsp;&nbsp;

                                                            <div style="height: 50px;" fxLayout="row"
                                                                fxLayoutGap="10px">
                                                                <button class="btn btn-danger-outline" type="button"
                                                                    (click)="onClose()">Reset</button>
                                                                <button class="btn btn-primary btn-with-icon" #addbutton
                                                                    id="btnAdd" type="button"
                                                                    (click)="onSubmitHandOver()">
                                                                    Save
                                                                </button>
                                                            </div>


                                                        </div>
                                                    </form>

                                                    <div fxFlex.gt-sm="100%" fxFlex>
                                                        <mat-card style="padding: 5px;">

                                                            <div id="contacts"
                                                                class="page-layout simple left-sidebar inner-sidebar inner-scroll">
                                                                <airmid-table [gridConfig]="gridConfig1" #Handover
                                                                    :ShowFilter="false" :ShowButtons="false">
                                                                    <ng-container filters>

                                                                    </ng-container>
                                                                </airmid-table>
                                                            </div>


                                                        </mat-card>
                                                    </div>
                                                    <!-- <div fxLayout="row" fxLayoutGap="6px" fxLayoutAlign="end">
                                                    <button class="btn btn-danger-outline">Reset</button>
                                                    <button class="btn btn-primary ">Save</button>
                                                </div> -->
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </mat-tab>
                            </mat-tab-group>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
