<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" style="height: 100%;" 
    dynamicTableHeight>
    <mat-toolbar class="top-header accent">
        <div fxLayout="row" fxLayoutAlign="start center" class="top-header-info">
            <!-- <button mat-icon-button class="sidebar-toggle ">
                <mat-icon>menu</mat-icon>
            </button>
            <mat-icon class="logo-icon" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}">account_box
            </mat-icon> -->
            <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                Prescription Return List
            </span>
        </div>
        <!-- *ngIf="IsAdd" -->
        <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
            <button mat-raised-button (click)="onSave()" >New Prescription Return
            </button>
        </div>

    </mat-toolbar>

    <div fusePerfectScrollbar
        class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
        dynamicTableHeight>
        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">
            <ng-template #actionButtonTemplate let-element>
                <div fxLayout="row" fxLayoutAlign="center center">

                    <button mat-icon-button (click)="viewgetIpprescriptionreturnReportPdf(element)" matTooltip="Prescription Retrun Print">
                        <mat-icon title="Request Print">print</mat-icon>
                    </button>
                    <button mat-icon-button (click)="Prescretruncancle(element)" matTooltip="Prescription ReturnCancel"
                    *ngIf="element.isclosed==false">
                        <mat-icon title="Cancel Prescription Return">cancel</mat-icon>
                    </button>

                </div>
            </ng-template>
          <ng-template #iconisCompeleted let-element>
                        <div fxLayout="row" fxLayoutAlign="center center">  
                             <button mat-icon-button *ngIf="element.isClosed === 'true' " matTooltip="Prescription Retrun Print">
                         <mat-icon matTooltip="isclosed" style="color: green;">check_circle</mat-icon>
                    </button>
                              <mat-icon *ngIf="!element.isclosed" matTooltip="Pending"
                                 style="color: rgb(128, 0, 30);">hourglass_empty</mat-icon> 
                        </div>
                    </ng-template>
            <airmid-table [gridConfig]="gridConfig" class="content" (onSelectRow)="GetDetails2($event)" #grid>

                <ng-container filters>
                    <form [formGroup]="_PrescriptionReturnService.mySearchForm" fxLayout="column">
                        <airmid-datepicker [formGroup]="_PrescriptionReturnService.mySearchForm" [isRangePicker]="true"
                            formStartControlName="startdate" formEndControlName="enddate"
                            (dateChange)="getfilterdata1()">
                        </airmid-datepicker>

                        <mat-form-field appearance="outline" fxFlex>
                            <mat-label>UHID</mat-label>
                            <input matInput placeholder="Search UHID" autocomplete="off"
                                (keypress)="keyPressAlphanumeric($event)"
                                [formGroup]="_PrescriptionReturnService.mySearchForm" formControlName="RegNo"
                                (input)="onChangeFirst1()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter1('RegNo')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <mat-form-field appearance="outline" fxFlex>
                            <mat-label>First Name</mat-label>
                            <input matInput placeholder="Search First Name" autocomplete="off"
                                [formGroup]="_PrescriptionReturnService.mySearchForm" formControlName="fName"
                                (input)="onChangeFirst1()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter1('fName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <mat-form-field appearance="outline" fxFlex>
                            <mat-label>Last Name</mat-label>
                            <input matInput placeholder="Search Last Name" autocomplete="off"
                                [formGroup]="_PrescriptionReturnService.mySearchForm" formControlName="lName"
                                (input)="onChangeFirst1()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter1('lName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>


                    </form>

                </ng-container>
            </airmid-table>
        </div>

        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll" *ngIf="isShowDetailTable">
           
            <airmid-table [gridConfig]="gridConfig1" class="content" #grid1 :ShowFilter="false" >
            </airmid-table>
        </div>  
 
    </div>

    <!--         
                 <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll"
                    *ngIf="isShowDetailTable">
                    <airmid-table [gridConfig]="gridConfig1" class="content" #grid1 [ShowFilter]="false" [ShowButtons]="false">
                    </airmid-table>
                </div> -->
</div>
