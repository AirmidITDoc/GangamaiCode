<div class="page-layout simple inner-sidebar inner-scroll right-sidebar" style="height: 100%;" dynamicTableHeight>

    <ng-template mat-tab-label>
        IP Browse Prescription List
    </ng-template>

    <div fusePerfectScrollbar
        class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
        dynamicTableHeight>

        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

            <div class="top-header">
                <div class="top-header-info">

                    <div class="top-header-title" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                        <span>IP Prescription </span>
                    </div>
                </div>
                <div class="top-header-right">
                    <div class="header-add-button">
                        <!-- -->
                        <button mat-raised-button (click)="onSave()" *ngIf="IsAdd" >Add Prescription</button>
                    </div>
                </div>
            </div>
            <ng-template #actionButtonTemplate let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <button mat-icon-button (click)="onSave(element)" matTooltip="Prescription Edit">
                        <mat-icon>edit</mat-icon>
                    </button>

                    <button mat-icon-button (click)="viewgetIpprescriptionReportPdf(element)"
                        matTooltip="IP Prescription Print">
                        <mat-icon title="Prescription Print">print</mat-icon>
                    </button>

                    <button mat-icon-button (click)="Presccancle(element)" matTooltip="Prescription Cancel"
                        *ngIf="element.isCancelled==false">
                        <mat-icon title="Cancel Appointment">cancel</mat-icon>
                    </button>
                </div>
            </ng-template>
            <airmid-table [gridConfig]="gridConfig" #grid class="content" :ShowButtons="false"
                (onSelectRow)="GetDetails1($event)">
                <ng-container filters>
                    <form [formGroup]="_PrescriptionService.mysearchform" fxLayout="column">
                        <airmid-datepicker [formGroup]="_PrescriptionService.mysearchform" [isRangePicker]="true"
                            formStartControlName="startdate" formEndControlName="enddate"
                            (dateChange)="getfilterdata()">
                        </airmid-datepicker>

                        <mat-form-field appearance="outline" fxFlex>
                            <mat-label>UHID</mat-label>
                            <input matInput placeholder="Search UHID" autocomplete="off"
                                (keypress)="keyPressAlphanumeric($event)"
                                [formGroup]="_PrescriptionService.mysearchform" formControlName="RegNo"
                                (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('RegNo')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <mat-form-field appearance="outline" fxFlex>
                            <mat-label>First Name</mat-label>
                            <input matInput placeholder="Search First Name" autocomplete="off"
                                [formGroup]="_PrescriptionService.mysearchform" formControlName="fName"
                                (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('fName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>



                        <mat-form-field appearance="outline" fxFlex>
                            <mat-label>Last Name</mat-label>
                            <input matInput placeholder="Search Last Name" autocomplete="off"
                                [formGroup]="_PrescriptionService.mysearchform" formControlName="lName"
                                (input)="onChangeFirst()" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('lName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>
                    </form>

                </ng-container>
            </airmid-table>
        </div>

        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll" *ngIf="isShowDetailTable">

            <!-- <ng-template #iconisClosed let-element>
                        <div fxLayout="row" fxLayoutAlign="center center">
        
                            <mat-icon *ngIf="element.isClosed == false" matTooltip="Pending"
                            class="active-icon red-500 s-16">hourglass_empty
                            </mat-icon>
                            
                            <mat-icon *ngIf="element.isClosed == true" matTooltip="Accepted"
                            class="active-icon green-500 s-16">check_circle
                            </mat-icon>
                            
                        </div>
                    </ng-template> -->

            <airmid-table [gridConfig]="gridConfig1" class="content" #grid1 [ShowFilter]="false" [ShowButtons]="false">
            </airmid-table>
        </div>
    </div>


</div>
