<div class="simple page-layout inner-scroll inner-sidebar left-sidebar" dynamicTableHeight>
    <mat-toolbar style="width: 100%;justify-content: space-between;">
        <div fxLayout="row" fxLayoutAlign="start center">
            <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}" style="color: white;">
                Nursing Note
            </span>
        </div>
        <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog" matTooltip="Close"
            (click)="closeDialog()" *ngIf="openedFromClinical">
            <mat-icon>close</mat-icon>
        </button>
    </mat-toolbar>
    <div class="content">
        <div class="center p-12 pb-56" style="border-radius: 4px;">

            <div class="content-card">

                <form [formGroup]="myform">
                    <div fxFlexFill fxLayout="column" fxLayoutGap="10px">

                        <div class="layout-card-container">
                            <form [formGroup]="myform">
                                <div class="patient-search">
                                    <div fxLayout="row" fxLayoutAlign="start start" class="gap-8">

                                        <div fxFlexFill fxLayout="row" fxLayoutGap="4px" fxLayoutAlign="space-between">

                                            <airmid-autocomplete class="w-500" lbl="RgId" [formGroup]="myform"
                                                formControlName="RegID" label="Search Reg No / Patient Name / Mobile No"
                                                ApiUrl="Admission/search-patient?Keyword="
                                                placeholderText="Search Reg No / Patient Name / Mobile No"
                                                (selectionChange)="getSelectedObjIP($event)" ValueField="admissionID"
                                                TextField="formattedText">
                                            </airmid-autocomplete>
                                            <button #addbutton class="btn btn-primary btn-with-icon"
                                                (click)="onredirect()">
                                                <span class="btn-icon">
                                                    <mat-icon> add </mat-icon>
                                                </span>
                                                <span>Go TO Drug Schedule Dashboard</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <!-- Patient Info Section -->
                        <div class="modal-card-container mt-0" style="margin-top: -4px;">
                            <div fxFlex.gt-sm="100%" fxFlex>
                                <mat-card fxFlex.gt-sm="100%" fxFlex style="padding: 2px 10px;">
                                    <div class="patient-info-sales">
                                        <div class="patient-info-title border-bottom pb-1 mb-1">
                                            <span class="h1 m-0" style="line-height: normal;">Patient
                                                Information</span>
                                        </div>
                                        <div class="Ipd-patient-info w-100-p">
                                            <app-patient-information [uhidNo]="registerObj?.regNo"
                                                [patientName]="vPatientName" [doctorName]="registerObj?.doctorName"
                                                [departmentName]="registerObj?.departmentName" [doa]="vDOA"
                                                [ipdNo]="registerObj?.ipdNo || registerObj?.ipdno"
                                                [ageString]="(registerObj?.age !== undefined ? registerObj?.age + 'Y|' + registerObj?.ageMonth + 'M|' + registerObj?.ageDay + 'D | ' + registerObj?.genderName : '')"
                                                [refDocName]="vRefDocName"
                                                [wardBedName]="(vWardName && vBedName) ? (vWardName + ' | ' + vBedName) : ''"
                                                [patientType]="vPatientType" [tariffName]="vTariffName"
                                                [companyName]="vCompanyName"></app-patient-information>
                                        </div>
                                    </div>
                                </mat-card>
                            </div>
                        </div>
                        <div fxFlex.gt-sm="100%" fxFlex>
                            <mat-tab-group>
                                <mat-tab label="Doctor Note">
                                    <div class="content" style="overflow: auto;">
                                        <div class="center pb-56" style="border-radius: 4px;padding: 10px;">
                                            <div class="content-card">
                                                <div fxFlexFill fxLayout="column" fxLayoutGap="10px">
                                                    <div fxLayout="row" fxLayoutGap="10px" fxFlex fxFlexFill
                                                        class="mat-elevation-z0" style="min-height: 600px;">
                                                        <div fxFlex.gt-sm="40%" fxFlex fxFlexFill>
                                                            <mat-card class="mat-elevation-z2" fxLayout="column"
                                                                fxFlexFill style="padding: 5px; min-height: 400px;">

                                                                <div id="contacts" fxFlex="1 1 auto"
                                                                    style="overflow: auto; min-height: 350px;"
                                                                    class="page-layout simple left-sidebar inner-sidebar inner-scroll">
                                                                    <airmid-table [gridConfig]="gridConfig" #docNote
                                                                        :ShowFilter="false" :ShowButtons="false">
                                                                    </airmid-table>
                                                                </div>

                                                            </mat-card>
                                                        </div>

                                                        <div fxFlex.gt-sm="60%" fxFlex fxFlexFill>

                                                            <form [formGroup]="myNursingForm" fxLayout="column"
                                                                fxFlexFill>

                                                                <div fxLayout="column" fxLayoutGap="2px" fxFlex
                                                                    fxFlexFill>

                                                                    <form [formGroup]="myform">
                                                                        <div fxLayout="row" fxLayoutGap="10px">

                                                                            <airmid-dropdown label="Template Name"
                                                                                *ngIf="showDropdown"
                                                                                formControlName="TemplateId"
                                                                                [formGroup]="myform" fxFlex="70%"
                                                                                ValueField="nursingId"
                                                                                TextField="nursTempName"
                                                                                (selectionChange)="onChangetemplate($event)"
                                                                                ApiUrl="Pathology/get-NursingTemplateMaster">
                                                                            </airmid-dropdown>

                                                                            <div class="input-add-button">
                                                                                <div>
                                                                                    <button #addbutton
                                                                                        class="btn btn-primary btn-with-icon"
                                                                                        (click)="onAddTemp()"
                                                                                        id="btnAdd"
                                                                                        [disabled]="IsAddFlag">
                                                                                        <span class="btn-icon">
                                                                                            <mat-icon> add </mat-icon>
                                                                                        </span>
                                                                                        <span>Add</span>
                                                                                    </button>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </form>

                                                                    <mat-card class="mat-elevation-z2"
                                                                        style="padding: 0; overflow: hidden; flex: 1 1 auto; display: flex; flex-direction: column;">
                                                                        <div fxLayout="column" fxFlexFill
                                                                            style="height: 100%;">
                                                                            <!-- Editor Container with proper height -->
                                                                            <div fxFlex="1 1 auto"
                                                                                style="min-height: 400px;">
                                                                                <airmid-editor
                                                                                    formControlName="nursingNotes"
                                                                                    [formGroup]="myNursingForm"
                                                                                    (valueChange)="onEditorValueChange($event)">
                                                                                </airmid-editor>
                                                                            </div>
                                                                        </div>
                                                                    </mat-card>
                                                                    <div fxLayout="row"
                                                                        fxLayoutAlign="space-between center"
                                                                        fxLayoutGap="6px" class="mt-16">
                                                                        <div>
                                                                            <button class="btn btn-primary-outline"
                                                                                (click)="onTemplate()">
                                                                                New Template
                                                                            </button>
                                                                        </div>
                                                                        <div fxLayout="row" fxLayoutGap="6px">
                                                                            <button class="btn btn-danger-outline"
                                                                                (click)="onClear()">
                                                                                Reset
                                                                            </button>
                                                                            <button class="btn btn-primary"
                                                                                (click)="onSubmit()">
                                                                                Save
                                                                            </button>
                                                                        </div>
                                                                    </div>

                                                                </div>
                                                            </form>

                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </mat-tab>

                                <mat-tab label="Patient Handover Note">
                                    <div class="content" style="overflow: auto;">
                                        <div class="center pb-56" style="border-radius: 4px;padding: 10px;">
                                            <!-- <div class="content-card"> -->
                                            <form [formGroup]="myform">

                                                <div fxFlexFill fxLayout="column" fxLayoutGap="10px">

                                                    <form [formGroup]="myHandOverForm">
                                                        <input name="patHandId" formControlName="patHandId"
                                                            type="hidden">

                                                        <div fxLayout="row" fxLayoutGap="20px">

                                                            <!-- staffName -->
                                                            <span
                                                                style="font-size:40px;padding: 10px 10px 0 0;">I</span>
                                                            <mat-form-field appearance="outline" fxFlex="30%">
                                                                <textarea rows="4" matInput name="patHandI"
                                                                    formControlName="patHandI"
                                                                    [(ngModel)]="vStaffNursName"
                                                                    [maxLength]="500"></textarea>
                                                            </mat-form-field>

                                                            <!-- SYMPTOMS -->
                                                            <span style="font-size:40px;padding: 10px 0px 0 0;">B</span>
                                                            <mat-form-field appearance="outline" fxFlex="30%">
                                                                <textarea rows="4" matInput name="patHandB"
                                                                    formControlName="patHandB" [(ngModel)]="vSYMPTOMS"
                                                                    [maxLength]="500"></textarea>
                                                            </mat-form-field>

                                                            <!-- Instruction -->
                                                            <span style="font-size:40px;padding: 10px 0px 0 0;">R</span>
                                                            <mat-form-field appearance="outline" fxFlex="30%">
                                                                <textarea rows="4" matInput name="patHandR"
                                                                    formControlName="patHandR"
                                                                    [(ngModel)]="vInstruction"
                                                                    [maxLength]="500"></textarea>
                                                            </mat-form-field>

                                                        </div>
                                                        <div fxLayout="row" fxLayoutGap="20px">

                                                            <!-- Stable -->
                                                            <span style="font-size:40px;padding-top: 10px;">S</span>
                                                            <mat-form-field appearance="outline" fxFlex="30%">
                                                                <textarea rows="4" matInput name="patHandS"
                                                                    formControlName="patHandS" [(ngModel)]="VStable"
                                                                    [maxLength]="500"></textarea>
                                                            </mat-form-field>

                                                            <!-- Assessment -->
                                                            <span style="font-size:40px;padding-top: 10px;">A</span>
                                                            <mat-form-field appearance="outline" fxFlex="30%">
                                                                <textarea rows="4" matInput name="patHandA"
                                                                    formControlName="patHandA" [(ngModel)]="VAssessment"
                                                                    [maxLength]="500"></textarea>
                                                            </mat-form-field>

                                                            <span style="font-size:80px;padding-top: 10px;">
                                                            </span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

                                                            <div fxLayout="column" fxLayoutGap="10px">
                                                                <mat-form-field appearance="outline" fxFlex="31%">
                                                                    <mat-label>Comment</mat-label>
                                                                    <input matInput name="comments"
                                                                        formControlName="comments"
                                                                        [(ngModel)]="vcomments" [maxLength]="500">
                                                                </mat-form-field>

                                                                <div fxLayout="row" fxLayoutGap="10px"
                                                                    style="padding: 10px;">
                                                                    <mat-radio-group name="shiftInfo"
                                                                        formControlName="shiftInfo" fxLayout="row"
                                                                        [(ngModel)]="vHandOverType">
                                                                        <mat-radio-button
                                                                            value="Morning">Morning</mat-radio-button>
                                                                        <mat-radio-button value="Evening">
                                                                            Evening</mat-radio-button>
                                                                        <mat-radio-button
                                                                            value="Night">Night</mat-radio-button>
                                                                    </mat-radio-group>

                                                                    <button class="btn btn-danger-outline" type="button"
                                                                        (click)="onClose()">Reset</button>
                                                                    <button type="button"
                                                                        class="btn btn-primary btn-with-icon py-8"
                                                                        #addbutton id="btnAdd"
                                                                        (click)="onSubmitHandOver()">
                                                                        Save </button>
                                                                </div>
                                                            </div>

                                                        </div>
                                                    </form>

                                                    <div fxFlex.gt-sm="100%" fxFlex>
                                                        <mat-card style="padding: 5px;">

                                                            <div id="contacts"
                                                                class="page-layout simple left-sidebar inner-sidebar inner-scroll">
                                                                <airmid-table [gridConfig]="gridConfig3" #Handover
                                                                    :ShowFilter="false" :ShowButtons="false">
                                                                    <ng-container filters>

                                                                    </ng-container>
                                                                </airmid-table>
                                                            </div>

                                                        </mat-card>
                                                    </div>

                                                </div>
                                            </form>
                                            <!-- </div> -->
                                        </div>
                                    </div>
                                </mat-tab>

                                <mat-tab label="MEDICINE AT THE TIME OF DISCHARGE">
                                    <div class="form-container h-100-p" fxLayout="column">
                                        <div class="modal-card-container">
                                            <div class="form-title mb-2 pb-2 border-bottom">
                                                <span class="h3 font-weight-600">MEDICINE AT THE TIME OF
                                                    DISCHARGE</span>
                                            </div>

                                            <div fxLayout="column" fxLayoutGap="10px">
                                                <div fxFlex.gt-sm="100%" fxFlex>
                                                    <form [formGroup]="MedicineItemForm">
                                                        <div fxFlexFill fxLayout="column" fxLayout.gt-xs="row"
                                                            class="gap-8">
                                                            <airmid-autocomplete label="Enter Item Name" fxFlex="25%"
                                                                [formGroup]="MedicineItemForm" formControlName="ItemId"
                                                                placeholderText="Enter Item Name"
                                                                [ApiUrl]="'ItemMaster/GetItemListForPrescription?StoreId=' + vstoreId + '&ItemName='"
                                                                (selectionChange)="getSelectedserviceObj($event)"
                                                                TextField="itemName" ValueField="itemId"
                                                                (onClearSelection)="ItemFromReset()"></airmid-autocomplete>

                                                            <airmid-dropdown label="Frequency" formControlName="DoseId"
                                                                fxFlex="7%" [formGroup]="MedicineItemForm"
                                                                [validations]="getValidationMessages().DoseId"
                                                                (selectionChange)="getdose($event)"
                                                                [mode]="autocompleteModeDose" [(ngModel)]="doseId"
                                                                *ngIf="showDoseDropdownRefresh"></airmid-dropdown>

                                                            <airmid-dropdown label="Timing" formControlName="TimeId"
                                                                fxFlex="7%" [formGroup]="MedicineItemForm"
                                                                [validations]="getValidationMessages().TimeId"
                                                                (selectionChange)="getime($event)"
                                                                [mode]="autocompleteModeime" [(ngModel)]="TimeId"
                                                                *ngIf="showDoseDropdownRefresh"></airmid-dropdown>

                                                            <airmid-textbox label="Day" formControlName="Day"
                                                                fxFlex="7%" [value]="vDay"
                                                                [formGroup]="MedicineItemForm" [type]="'text'"
                                                                (keypress)="keyPressCharater($event)"></airmid-textbox>

                                                            <div class="input-add-button">
                                                                <div matTooltip="Select Itemname to enable this button!!"
                                                                    [matTooltipPosition]="'above'" fxLayoutGap="10px"
                                                                    fxLayout="row">
                                                                    <button #addbutton
                                                                        class="btn btn-primary btn-with-icon"
                                                                        (click)="onAdd()">
                                                                        <span class="btn-icon">
                                                                            <mat-icon>add</mat-icon>
                                                                        </span>
                                                                        <span>Add</span>
                                                                    </button>
                                                                </div>
                                                            </div>

                                                            <mat-divider [vertical]="true"></mat-divider>&nbsp;
                                                            <airmid-dropdown label="Template List"
                                                                *ngIf="showTemplateRefresh" formControlName="TemplateId"
                                                                [formGroup]="MedicineItemForm"
                                                                [mode]="autocompleteModeTemplate"
                                                                (selectionChange)="selectChangeTemplateName($event)"
                                                                ValueField="presId" TextField="presTemplateName"
                                                                ApiUrl="OPDPrescriptionMedical/GetTemplatePrescriptionList?TemplateCategory=DischargeSummeryTemplate">
                                                            </airmid-dropdown>

                                                            <button mat-raised-button (click)="getDosemaster()">
                                                                <mat-icon>add</mat-icon>
                                                                Dose</button>

                                                            <!-- <button mat-raised-button (click)="TemplateList()">
                                                                <mat-icon>save</mat-icon>
                                                                Template List</button> -->



                                                            <button mat-raised-button (click)="getSchedular()">
                                                                <mat-icon>save</mat-icon>
                                                                Schduler</button>

                                                            <button mat-raised-button (click)="SaveTemplate()">
                                                                <mat-icon>save</mat-icon>
                                                                Save Template</button>



                                                            <div class="input-add-button">
                                                                <!-- <div matTooltip="Select Drug to enable this button!!"
                                                                    [matTooltipPosition]="'above'">
                                                                    <button #addbutton
                                                                        class="btn btn-primary btn-with-icon"
                                                                        (click)="onTemplDetAdd()">
                                                                        <span class="btn-icon">
                                                                            <mat-icon> add </mat-icon>
                                                                        </span>
                                                                    </button>
                                                                </div> -->
                                                            </div>

                                                        </div>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="modal-card-container table-container overflow-auto">
                                            <!-- Table 1 -->
                                            <div class="airmid-table-container">
                                                <div class="content-card">
                                                    <mat-table class="airmid-table" matSort [dataSource]="dsItemList"
                                                        [@animateStagger]="{ value: '50' }" style="overflow: auto;">
                                                        <ng-container matColumnDef="itemName">
                                                            <mat-header-cell *matHeaderCellDef mat-sort-header fxHide
                                                                fxShow.gt-sm>ItemName</mat-header-cell>
                                                            <mat-cell *matCellDef="let element" fxHide fxShow.gt-sm>
                                                                <span>{{ element.itemName }}</span>
                                                            </mat-cell>
                                                        </ng-container>

                                                        <ng-container matColumnDef="doseName">
                                                            <mat-header-cell *matHeaderCellDef mat-sort-header fxHide
                                                                fxShow.gt-sm>Frequency</mat-header-cell>
                                                            <mat-cell *matCellDef="let element" fxHide fxShow.gt-sm>
                                                                <span>{{ element.doseName }}</span>
                                                            </mat-cell>
                                                        </ng-container>

                                                        <ng-container matColumnDef="time">
                                                            <mat-header-cell *matHeaderCellDef mat-sort-header fxHide
                                                                fxShow.gt-sm>Timing</mat-header-cell>
                                                            <mat-cell *matCellDef="let element" fxHide fxShow.gt-sm>
                                                                <span>{{ element.timename }}</span>
                                                            </mat-cell>
                                                        </ng-container>


                                                        <ng-container matColumnDef="day">
                                                            <mat-header-cell *matHeaderCellDef mat-sort-header fxHide
                                                                fxShow.gt-sm>Day</mat-header-cell>
                                                            <mat-cell *matCellDef="let element" fxHide fxShow.gt-sm>
                                                                <span>{{ element.days }}</span>
                                                            </mat-cell>
                                                        </ng-container>

                                                        <ng-container matColumnDef="Action" stickyEnd>
                                                            <mat-header-cell *matHeaderCellDef

                                                            </mat-cell>
                                                        </ng-container>

                                                        <mat-header-row class="accent"

                                                        <mat-row *matRowDef="let row; columns: displayedColumns"

                                                            [@animate]="{ value: '*', params: { y: '100%' } }"></mat-row>
