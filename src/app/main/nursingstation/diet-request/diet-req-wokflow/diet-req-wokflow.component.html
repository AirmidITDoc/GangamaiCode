  <div
    class="request-list"

<div
      class="request-card"
      *ngFor="let request of requests">


      <div class="request-header">

          <div class="request-title">

            <span class="request-number">

              {{ request.dietReqNo }}

              {{ getOverallStatus(request) }}

            </span>

          </div>


          <h3>

            {{ request.dietMenuName }}

          </h3>


          <div class="request-meta">

            <span>

              <b>Request Date:</b>

              {{ request.date | date:'dd MMM yyyy' }}

            </span>


            <span>

              <b>Created:</b>

              {{ request.createdDate |
                 date:'dd MMM yyyy, hh:mm a' }}

            </span>


            <span>

              <b>Created By:</b>

              {{ request.createdByUser }}

            </span>

          </div>

        </div>


        <div class="summary">

          <div class="summary-box">

            <strong>
              {{ request.totalDetailCount }}
            </strong>

            <small>
              Total Meals
            </small>

          </div>


          <div class="summary-box accepted">

            <strong>
              {{ request.acceptedCount }}
            </strong>

            <small>
              Accepted
            </small>

          </div>


          <div class="summary-box delivered">

            <strong>
              {{ request.deliveredCount }}
            </strong>

            <small>
              Delivered
            </small>

          </div>

        </div>

      </div>

              !== 'completed'
            ">
              1
            </span>

            <span *ngIf="

            isStepComplete(request,1)

        </div>


        <div

          </div>

        </div>


        <div

            isStepComplete(request,2)
          ">
        </div>

      </div>


      <div class="progress-container">

        <div class="progress-header">

          <span>
            Workflow Progress
          </span>

          <strong>

            {{ getProgress(request) }}%

          </strong>

        </div>


        <div class="progress-track">

          <div
            class="progress-fill"
            [style.width.%]="
              getProgress(request)
            ">
          </div>

        </div>

      </div>

      <div class="counter-area">

        <div class="counter">

          <span class="counter-label">
            Kitchen Acceptance
          </span>

          <div class="mini-progress">

            <div
              class="mini-fill green"
              [style.width.%]="
                getAcceptedPercentage(request)
              ">
            </div>

          </div>

          <span>

            {{ request.acceptedCount }}
            /
            {{ request.totalDetailCount }}

          </span>

        </div>


        <div class="counter">

          <span class="counter-label">
            Meal Delivery
          </span>

          <div class="mini-progress">

            <div
              class="mini-fill blue"
              [style.width.%]="
                getDeliveredPercentage(request)
              ">
            </div>

          </div>

          <span>

            {{ request.deliveredCount }}
            /
            {{ request.totalDetailCount }}

          </span>

        </div>

      </div>


      <div class="request-footer">

        <div>

          <span
            *ngIf="!request.isCancelled">

            Not Accepted:
            <b>
              {{ request.notAcceptedCount }}
            </b>

            &nbsp;&nbsp;

            Not Delivered:
            <b>
              {{ request.notDeliveredCount }}
            </b>

          </span>


          <span
            class="cancelled-text"
            *ngIf="request.isCancelled">

            Cancelled

            <span
              *ngIf="request.cancelledUser">

              by {{ request.cancelledUser }}

            </span>

          </span>

        </div>


        <button
          type="button"
          class="details-btn"
          (click)="viewDetails(request)">

          View Details

        </button>

      </div>

    </div>


    <div
      class="empty-state"
      *ngIf="requests.length === 0">

      <div class="empty-icon">
        📋
      </div>

      <h3>
        No Diet Requests Found
      </h3>

      <p>
        Try changing the date range or request number.
      </p>

    </div>

  </div>


  <div
    class="pagination"
    *ngIf="
      !loading &&
      requests.length > 0 &&
      totalPages > 1
    ">

    <button
      type="button"
      [disabled]="page === 0"
      (click)="previousPage()">

      ‹ Previous

    </button>


    <span>

      Page
      <b>{{ currentPage }}</b>
      of
      <b>{{ totalPages }}</b>

    </span>


    <button
      type="button"
      [disabled]="
        page + 1 >= totalPages
      "
      (click)="nextPage()">

      Next ›

    </button>

  </div>
