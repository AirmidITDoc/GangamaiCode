<div class="modal-wrapper grid-container">

    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{ value: '*', params: { delay: '100ms', x: '-25px' } }"> New Request</span>
            </div>
            <div class="modal-header-right">
                <div class="comman-date-container">

                    <div class="close-icon">
                        <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                            matTooltip="Close">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-body overflow-hidden">
        <div class="modal-body-container">
            <div class="personal-panel fix-panel">
                <form [formGroup]="CanteenInsertForm">
                    <div fxLayout="column" class="gap-10">
                        <div class="modal-card-container">

                            <div fxLayout="row" fxLayout.sm="column" class="gap-16" fxLayoutAlign="start center">
                                <div class="radio-container">
                                    <!-- <mat-radio-group formControlName="opIpType" fxFlex="5%">
                                        <mat-radio-button value="1">IP</mat-radio-button>
                                    </mat-radio-group> -->


                                    <mat-radio-group formControlName="opIpType" name="Type"
                                        (change)="customertype($event)" style="padding: 10px 0px 10px 10px;">
                                        <mat-radio-button style="margin-right: 5px;"
                                            value="1">Patient</mat-radio-button>
                                        <!-- <mat-radio-button style="margin-right: 5px;"
                                            value="0">Employee</mat-radio-button> -->
                                    </mat-radio-group>

                                </div>
                                <div class="input-container gap-2" fxFlex="90%">


                                    <!-- <airmid-autocomplete lbl="RegID" [formGroup]="CanteenInsertForm" *ngIf="!custflag"
                                        label="Search UHID / Patient Name / Mobile No(DC)" formControlName="RegID"
                                        fxFlex placeholderText="UHID / First Name / Last Name / Mobile No(DC)"
                                        ApiUrl="Admission/search-patient?Keyword="
                                        (selectionChange)="getSelectedObj($event)" TextField="formattedText"
                                        ValueField="regId">
                                    </airmid-autocomplete> -->

                                    <airmid-autocomplete lbl="RgId" [formGroup]="CanteenInsertForm" fxFlex="38%"
                                        formControlName="RegID" placeholderText="IP-RegNo/FirstName/LastName"
                                        *ngIf="!custflag" label="Search UHID / Patient Name / Mobile No"
                                        ApiUrl="Admission/search-patient?Keyword="
                                        (selectionChange)="getSelectedObjIP($event)" ValueField="admissionID"
                                        TextField="formattedText">
                                    </airmid-autocomplete>


                                    <!-- (keydown)="onEnterCustomer($event)" -->
                                    <mat-form-field appearance="outline" fxFlex="38%" *ngIf="custflag">
                                        <mat-label>Customer Name</mat-label>
                                        <input matInput name="CustomerName" #CustomerName
                                            formControlName="CustomerName">
                                    </mat-form-field>&nbsp;&nbsp;&nbsp;

                                    <airmid-dropdown label="Ward Name" formControlName="wardId" *ngIf="!custflag"
                                        fxFlex="38%" [formGroup]="CanteenInsertForm"
                                        [validations]="getValidationMessages().WardName"
                                        [mode]="autocompleteModewardName">
                                    </airmid-dropdown>


                                </div>
                            </div>

                        </div>

                            <!-- Patient Info Section -->
                            
                        <!-- </div> -->

                        <div class="modal-card-container mt-0" style="margin-top: -4px;">
                                <div fxFlex.gt-sm="100%" fxFlex>
                                    <mat-card fxFlex.gt-sm="100%" fxFlex style="padding: 2px 10px;">
                                        <div class="patient-info-sales">
                                            <div class="patient-info-title border-bottom pb-1 mb-1">
                                                <span class="h1 m-0" style="line-height: normal;">Patient
                                                    Information</span>
                                            </div>
                                            <div class="Ipd-patient-info w-100-p">
                                                <app-patient-information [uhidNo]="registerObj?.regNo" [patientName]="vPatientName" [doctorName]="registerObj?.doctorName"
                                                    [departmentName]="registerObj?.departmentName"
                                                    [doa]="registerObj?.admissionDate"
                                                    [ipdNo]="registerObj?.ipdNo"
                                                    [ageString]="(registerObj?.age !== undefined ? registerObj?.age + 'Y|' + registerObj?.ageMonth + 'M|' + registerObj?.ageDay + 'D | ' + registerObj?.genderName : '')"
                                                    [refDocName]="registerObj?.refDocName"
                                                    [wardBedName]="(registerObj?.roomName && registerObj?.bedName) ? (registerObj?.roomName + ' | ' + registerObj?.bedName) : ''"
                                                    [patientType]="registerObj?.patientType"
                                                    [tariffName]="registerObj?.tariffName"
                                                    [companyName]="registerObj?.companyName"></app-patient-information>

                                                    
                                            </div>
                                        </div>
                                    </mat-card>
                                </div>
                            </div>
                        <mat-card style="padding: 6px;">
                            <!-- <div class="modal-card-container">

                                <div fxLayout="row wrap" fxLayoutGap="12px grid">
                                  
                                    <div fxFlex="25%" fxFlex.xs="100%" fxFlex.sm="33%">
                                        <airmid-dropdown label="Ward Name" formControlName="wardId"
                                            [formGroup]="CanteenInsertForm"
                                            [validations]="getValidationMessages().WardName"
                                            [mode]="autocompleteModewardName">
                                        </airmid-dropdown>
                                    </div>
                                </div>

                            </div> -->
                            <div class="modal-card-container">
                                <div fxFlex.gt-sm="100%" fxFlex>
                                    <form [formGroup]="_CanteenRequestservice.ItemForm">

                                        <div fxLayout="row wrap" fxLayoutGap="12px grid">
                                            <div fxFlex="30%" fxFlex.xs="100%" fxFlex.sm="33%">

                                                <airmid-autocomplete lbl="Item"
                                                    [formGroup]="_CanteenRequestservice.ItemForm"
                                                    label="Search Item Name" formControlName="ItemId"
                                                    placeholderText="Enter Item Name" fxFlex
                                                    ApiUrl="CanteenRequest/GetItemListforCanteen?ItemName="
                                                    (selectionChange)="getSelectedserviceObj($event)"
                                                    (onClearSelection)="ItemFromReset()" TextField="itemName"
                                                    ValueField="itemID"></airmid-autocomplete>
                                            </div>

                                            <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="33%">
                                                <airmid-textbox label="Qty" formControlName="Qty" [value]="data?.Qty"
                                                    [formGroup]="_CanteenRequestservice.ItemForm"
                                                    [validations]="getValidationMessages().Qty"
                                                    (keypress)="keyPressAlphanumeric($event)" [maxLength]="50">
                                                </airmid-textbox>
                                            </div>
                                            <!-- <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="33%">
                                                <airmid-textbox label="Price" formControlName="Price" [value]="price"
                                                    [formGroup]="_CanteenRequestservice.ItemForm"
                                                    [validations]="getValidationMessages().Price"
                                                    (keypress)="keyPressAlphanumeric($event)" [maxLength]="50">
                                                </airmid-textbox>
                                            </div> -->
                                            <div fxFlex="20%" fxFlex.xs="100%" fxFlex.sm="33%">
                                                <airmid-textbox label="Remark" formControlName="Remark"
                                                    [value]="data?.Remark" [formGroup]="_CanteenRequestservice.ItemForm"
                                                    [validations]="getValidationMessages().Remark" [maxLength]="50">
                                                </airmid-textbox>
                                            </div>
                                            <!-- [disabled]="!add" -->
                                            <div class="input-add-button">
                                                <div matTooltip="Select  name to enable this button!!"
                                                    [matTooltipDisabled]="!_CanteenRequestservice.ItemForm.invalid"
                                                    [matTooltipPosition]="'above'">
                                                    <button class="btn btn-primary btn-with-icon" (click)="onAdd()">
                                                        <span class="btn-icon">
                                                            <mat-icon> add </mat-icon>
                                                        </span>
                                                        <span>Add</span>
                                                    </button>
                                                    <!-- [disabled]="_salesService.IndentSearchGroup.invalid" -->
                                                </div>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </mat-card>

                        <div class="modal-card-container table-container">
                            <div class="table-row gap-12" fxLayout="column" fxLayout.gt-md="row">

                                <div class="table-left" fxFlex="70%" fxFlex.xs="100%" fxFlex.sm="70%">
                                    <mat-card>

                                        <div fusePerfectScrollbar
                                            class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                                            dynamicTableHeight>

                                        </div>
                                        <mat-table class="mat-table-1 h-250" matSort [dataSource]="dsItemList"
                                            [@animateStagger]="{value:'50'}">

                                            <ng-container matColumnDef="ItemName">
                                                <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm>
                                                    ItemName</mat-header-cell>
                                                <mat-cell *matCellDef="let element" fxHide fxShow.gt-sm>
                                                    <span> {{element.ItemName}}</span>
                                                </mat-cell>
                                            </ng-container>

                                            <ng-container matColumnDef="Qty">
                                                <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm>
                                                    Total Qty</mat-header-cell>
                                                <mat-cell *matCellDef="let element" fxHide fxShow.gt-sm>
                                                    <span> {{element.Qty}}</span>
                                                </mat-cell>
                                            </ng-container>

                                            <ng-container matColumnDef="Remark">
                                                <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm>
                                                    Remark</mat-header-cell>
                                                <mat-cell *matCellDef="let element" fxHide fxShow.gt-sm>
                                                    <span> {{element.Remark}}</span>
                                                </mat-cell>
                                            </ng-container>

                                            <ng-container matColumnDef="buttons" stickyEnd>
                                                <mat-header-cell *matHeaderCellDef class="table-actions">Action
                                                </mat-header-cell>
                                                <mat-cell *matCellDef="let contact">
                                                    <ng-container class="actions">
                                                        <mat-icon (click)="deleteTableRow($event ,contact)"
                                                            color="warn">
                                                            delete
                                                        </mat-icon>
                                                    </ng-container>
                                                </mat-cell>
                                            </ng-container>

                                            <mat-header-row class="accent"
                                                *matHeaderRowDef="displayedVisitColumns2; sticky: true">
                                            </mat-header-row>
                                            <mat-row *matRowDef="let row; columns: displayedVisitColumns2;"
                                                class="element" [@animate]="{value:'*',params:{y:'100%'}}"></mat-row>
                                        </mat-table>
                                    </mat-card>

                                </div>

                                <div class="table-right" fxFlex="30%" fxFlex.xs="100%" fxFlex.sm="30%">
                                    <mat-card>

                                        <div fusePerfectScrollbar
                                            class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
                                            dynamicTableHeight>

                                        </div>
                                        <mat-table class="mat-table-2 h-250" matSort [dataSource]="dsCanteenDateList"
                                            [@animateStagger]="{value:'50'}">

                                            <ng-container matColumnDef="Date">
                                                <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm>
                                                    Date
                                                </mat-header-cell>
                                                <mat-cell *matCellDef="let element" fxHide fxShow.gt-sm>
                                                    <span> {{element.Date}}</span>
                                                </mat-cell>
                                            </ng-container>

                                            <ng-container matColumnDef="Time">
                                                <mat-header-cell *matHeaderCellDef mat-sort-header fxHide fxShow.gt-sm>
                                                    Time </mat-header-cell>
                                                <mat-cell *matCellDef="let element" fxHide fxShow.gt-sm>
                                                    <span> {{element.Time}}</span>
                                                </mat-cell>
                                            </ng-container>
                                            <mat-header-row class="accent"
                                                *matHeaderRowDef="displayedVisitColumns; sticky: true">
                                            </mat-header-row>
                                            <mat-row *matRowDef="let row; columns: displayedVisitColumns;"
                                                class="element" [@animate]="{value:'*',params:{y:'100%'}}"></mat-row>
                                        </mat-table>
                                    </mat-card>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal-footer">
        <div class="footer-navigation-container">
            <div class="modal-footer-buttons">
                <button type="button" class="btn btn-danger-outline" (click)="onClose()">Close</button>
                <button type="button" class="btn btn-primary" (click)="OnSave()">Save</button>
            </div>
        </div>
    </div>
</div>
