<div class="modal-wrapper grid-container resize-form-fields padding-fix">

    <!-- Modal header -->
    <div class="modal-header accent">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">New Diet Plan Creation for
                    Patient</span>
            </div>
            <div class="modal-header-right">
                <div class="comman-date-container">
                    <div class="comman-date">
                        <app-common-date [screenFrom]="screenFromString"
                            (dateTimeEventEmitter)="getDateTime($event)"></app-common-date>
                    </div>
                    <div class="close-icon">
                        <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                            matTooltip="Close">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal body -->
    <div class="modal-body">
        <div class="modal-body-container">
            <div fxLayout="column" fxLayoutGap="12px">

                <form [formGroup]="searchFormGroup" fxLayoutAlign="space-between start">
                    <div fxLayout="column" fxLayoutAlign="start none" style="width: 100%;" fxLayoutGap="6px">

                        <div fxLayout="row" fxLayoutGap="8px">
                            <div fxFlex="90%" fxFlex.sm="100%">
                                <airmid-autocomplete lbl="RgId" [formGroup]="searchFormGroup" fxFlex="50%"
                                    formControlName="RegID" placeholderText="IP-RegNo/FirstName/LastName"
                                    label="Search UHID / Patient Name / Mobile No"
                                    ApiUrl="Admission/search-patient?Keyword="
                                    (selectionChange)="getSelectedObjIP($event)" ValueField="admissionID"
                                    TextField="formattedText">
                                </airmid-autocomplete>
                            </div>
                        </div>
                    </div>
                </form>
                <mat-card class="patient-card">
                    <div class="patient-info-title border-bottom pb-1 mb-1">
                        <span class="h1 m-0" style="line-height: normal;">Patient Information</span>
                    </div>
                    <div class="Ipd-patient-info w-100-p">
                        <app-patient-information [uhidNo]="data?.regNo"
                            [patientName]="(data?.firstName || '') + (data?.middleName ? ' ' + data.middleName : '') + (data?.lastName ? ' ' + data.lastName : '') || data?.patientName"
                            [doctorName]="data?.doctorname" [departmentName]="data?.departmentName"
                            [doa]="data?.admissionDate" [ipdNo]="data?.ipdno"
                            [ageString]="(data?.age !== undefined ? data?.age + 'Y|' + data?.ageMonth + 'M|' + data?.ageDay + 'D | ' + data?.genderName : '')"
                            [refDocName]="data?.refDocName"
                            [wardBedName]="(data?.roomName && data?.bedName) ? (data?.roomName + ' | ' + data?.bedName) : ''"
                            [patientType]="data?.patientType" [tariffName]="data?.tariffName"
                            [companyName]="data?.companyName"></app-patient-information>
                    </div>
                </mat-card>

                <!-- Assessment form -->
                <mat-card class="form-card">
                    <form [formGroup]="DietForm" class="assessment-form">


                        <h4 class="group-title">Diet Plan Details</h4>
                        <div fxLayout="row wrap" fxLayoutGap="12px grid">
                            <mat-form-field appearance="outline" fxFlex="25" fxFlex.lt-md="50">
                                <mat-label>Plan Start Date</mat-label>
                                <input matInput [matDatepicker]="planstartDate" formControlName="planstartDate" />
                                <mat-datepicker-toggle matSuffix [for]="planstartDate"></mat-datepicker-toggle>
                                <mat-datepicker #planstartDate></mat-datepicker>
                            </mat-form-field>


                            <mat-form-field appearance="outline" fxFlex="25" fxFlex.lt-md="50">
                                <mat-label>Plan End Date</mat-label>
                                <input matInput [matDatepicker]="planendDate" formControlName="planendDate" />
                                <mat-datepicker-toggle matSuffix [for]="planendDate"></mat-datepicker-toggle>
                                <mat-datepicker #planendDate></mat-datepicker>
                            </mat-form-field>


                            <mat-slide-toggle name="IsActive" formControlName="isActive" [(ngModel)]="isActive">
                                IsActive
                            </mat-slide-toggle>
                        </div>

                    </form>
                </mat-card>

                <div class="modal-card-container mt-2">
                    <div fxLayout="column" fxLayout.gt-xs="row" class="gap-8">
                        <mat-card fxFlex="98%" fxFlex.sm="98%" fxFlex.xs="100%" class="table-left">
                            <form [formGroup]="ItemForm">
                                <div fxLayout="column" fxLayout.gt-xs="row" class="gap-8 resize-form-fields"
                                    fxLayoutAlign="start start">

                                    <airmid-dropdown label="Diet Type" formControlName="dietTypeId"
                                        (selectionChange)="ChangedietType($event)" [formGroup]="ItemForm"
                                        [mode]="autocompleteModedietType" fxFlex="25%">
                                    </airmid-dropdown>
                                    <airmid-dropdown label="Meal Type" formControlName="mealTypeId"
                                        (selectionChange)="ChangemealType($event)" [formGroup]="ItemForm"
                                        [mode]="autocompleteModemealType" fxFlex="25%">
                                    </airmid-dropdown>
                                    <airmid-dropdown label="Diet Menu" formControlName="dietMenuId"
                                        [formGroup]="ItemForm" [mode]="autocompleteModedietMenu"
                                        (selectionChange)="ChangedietMenu($event)">
                                    </airmid-dropdown>

                                    <airmid-textbox label="Instruction" formControlName="Instruction" [maxLength]="200"
                                        [formGroup]="ItemForm" [(ngModel)]="vInstruction" fxFlex="30%">
                                    </airmid-textbox>

                                    <div class="input-add-button">
                                        <div matTooltip="Select name to enable this button!!"
                                            [matTooltipDisabled]="!ItemForm.invalid" [matTooltipPosition]="'above'">
                                            <button #addbutton class="btn btn-primary btn-with-icon" (click)="onAdd()">
                                                <span class="btn-icon">
                                                    <mat-icon> add </mat-icon>
                                                </span>
                                                <span>Add</span>
                                            </button>
                                        </div>
                                    </div>

                                </div>
                            </form>
                            <!-- Item Table Section -->
                            <div class="modal-card-container table-container">
                                <div class="table-row gap-12" fxLayout="column" fxLayout.gt-md="row">
                                    <div class="airmid-table-container" fxFlex fxFlex.xs="100%" fxFlex.sm="70%">
                                        <mat-card>
                                            <mat-table class="h-90" matSort [dataSource]="dsItemList"
                                                [@animateStagger]="{value:'50'}" class="airmid-table">


                                                <ng-container matColumnDef="mealType">
                                                    <mat-header-cell *matHeaderCellDef mat-sort-header fxHide
                                                        fxShow.gt-sm class="w-200">
                                                        Meal Type
                                                    </mat-header-cell>
                                                    <mat-cell *matCellDef="let element" fxHide fxShow.gt-sm
                                                        class="w-200">
                                                        <span> {{element.mealType}}</span>
                                                    </mat-cell>
                                                </ng-container>

                                                <ng-container matColumnDef="dietType">
                                                    <mat-header-cell *matHeaderCellDef mat-sort-header fxHide
                                                        class="w-200" fxShow.gt-sm>
                                                        Diet Type
                                                    </mat-header-cell>
                                                    <mat-cell *matCellDef="let element" fxHide fxShow.gt-sm
                                                        class="w-200">
                                                        <span> {{element.dietType}}</span>
                                                    </mat-cell>
                                                </ng-container>


                                                <ng-container matColumnDef="dietMenu">
                                                    <mat-header-cell *matHeaderCellDef mat-sort-header fxHide
                                                        class="w-200" fxShow.gt-sm>
                                                        Diet Menu
                                                    </mat-header-cell>
                                                    <mat-cell *matCellDef="let element" fxHide fxShow.gt-sm
                                                        class="w-200">
                                                        <span> {{element.dietMenu}}</span>
                                                    </mat-cell>
                                                </ng-container>

                                                <ng-container matColumnDef="Instruction">
                                                    <mat-header-cell *matHeaderCellDef mat-sort-header fxHide
                                                        class="w-300" fxShow.gt-sm>
                                                        Instruction
                                                    </mat-header-cell>
                                                    <mat-cell *matCellDef="let element" fxHide fxShow.gt-sm
                                                        class="w-300">
                                                        <span> {{element.Instruction}}</span>
                                                    </mat-cell>
                                                </ng-container>

                                                <ng-container matColumnDef="Action" stickyEnd>
                                                    <mat-header-cell *matHeaderCellDef class="table-actions">Action
                                                    </mat-header-cell>
                                                    <mat-cell *matCellDef="let contact">
                                                        <ng-container class="actions">
                                                            <mat-icon (click)="deleteTableRow($event ,contact)"
                                                                color="warn">
                                                                delete
                                                            </mat-icon>
                                                        </ng-container>
                                                    </mat-cell>
                                                </ng-container>

                                                <mat-header-row class="accent"
                                                    *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
                                                <mat-row *matRowDef="let row; columns: displayedColumns;"
                                                    class="element"
                                                    [@animate]="{value:'*',params:{y:'100%'}}"></mat-row>
                                            </mat-table>
                                        </mat-card>
                                    </div>
                                </div>
                            </div>
                        </mat-card>


                    </div>
                </div>

            </div>
        </div>
    </div>


    <div class="modal-footer" fxLayout="column">
        <div class="modal-card-container">
            <div fxLayout="row" fxLayoutAlign="end center" class="dialog-footer">
                <div fxLayout="row" fxLayoutGap="10px">
                    <button type="button" class="btn btn-danger-outline" (click)="onClose()">Cancel</button>
                    <button type="button" class="btn btn-primary" [disabled]="DietForm.invalid"
                        (click)="onDietForm()">Save</button>
                </div>
            </div>
        </div>
    </div>

</div>
