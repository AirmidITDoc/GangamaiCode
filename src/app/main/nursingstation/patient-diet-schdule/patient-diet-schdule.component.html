<div fusePerfectScrollbar
    class="page-layout simple left-sidebar inner-sidebar inner-scroll update-grn mat-form-field-auto"
    dynamicTableHeight>
    <div class="top-header header accent p-16" fxLayout="column" fxLayoutAlign="start" fxLayout.gt-xs="row"
        fxLayoutAlign.gt-xs="space-between center ">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Admitted Patient List for Diet Schedule
                </span>
            </div>
        </div>
    </div>

    <div class="content">
        <div id="contacts" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

            <ng-template #iconPatientCategory let-element>
                <div fxLayout="row" fxLayoutAlign="center center">

                    <mat-icon *ngIf="element.patientType =='Self'" matTooltip="Patient Category Self">account_box
                    </mat-icon>

                    <mat-icon *ngIf="element.patientType !== 'Self'" matTooltip="Patient Category Company">business
                    </mat-icon>

                </div>
            </ng-template>
            <ng-template #actionButtonTemplate let-element>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
                        <button mat-raised-button color="primary" (click)="NewDietPlanAessessment(element)">
                            <mat-icon class="btn-icon">assignment</mat-icon>

                        </button>
                    </div>

                    <div class="gap-8" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="start center">
                        <button mat-raised-button color="primary" (click)="NewDietPlanCreate(element)">
                            <mat-icon class="btn-icon">restaurant_menu</mat-icon>

                        </button>
                    </div>
                </div>
            </ng-template>
            <airmid-table [gridConfig]="gridConfig" class="content" #grid>
                <ng-container filters>
                    <form [formGroup]="myFilterform">

                        <mat-form-field appearance="outline">
                            <mat-label>Enter a date range</mat-label>
                            <mat-date-range-input [rangePicker]="picker">
                                <input matStartDate formControlName="fromDate" placeholder="Start date">
                                <input matEndDate formControlName="enddate" placeholder="End date"
                                    (dateChange)="getchangeDate()">
                            </mat-date-range-input>
                            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                            <mat-date-range-picker #picker></mat-date-range-picker>
                        </mat-form-field>


                        <mat-form-field appearance="outline">
                            <mat-label>UHID No</mat-label>
                            <input matInput placeholder="Search UHID No" autocomplete="off" [formGroup]="myFilterform"
                                formControlName="RegNo" (input)="onChangeFirst($event)" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('RegNo')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <mat-form-field appearance="outline">
                            <mat-label>First Name</mat-label>
                            <input matInput placeholder="Search First Name" autocomplete="off"
                                [formGroup]="myFilterform" formControlName="FirstName"
                                (input)="onChangeFirst($event)" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('FirstName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <mat-form-field appearance="outline">
                            <mat-label>Middle Name</mat-label>
                            <input matInput placeholder="Search Middle Name" autocomplete="off"
                                [formGroup]="myFilterform" formControlName="MiddleName"
                                (input)="onChangeFirst($event)" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('MiddleName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>


                        <mat-form-field appearance="outline">
                            <mat-label>Last Name</mat-label>
                            <input matInput placeholder="Search Last Name" autocomplete="off" [formGroup]="myFilterform"
                                formControlName="LastName" (input)="onChangeFirst($event)" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('LastName')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>

                        <airmid-dropdown label="Doctor Name" formControlName="searchDoctorId" [formGroup]="myFilterform"
                            [(ngModel)]="gridConfig.filters[3].fieldValue"
                            [validations]="getValidationdoctorMessages().searchDoctorId"
                            [mode]="autocompleteModedeptdoc">
                        </airmid-dropdown>

                        <mat-form-field appearance="outline">
                            <mat-label>IPDNo</mat-label>
                            <input matInput placeholder="Search IPDNo" autocomplete="off" [formGroup]="myFilterform"
                                formControlName="IPDNo" (input)="onChangeFirst($event)" />
                            <button matSuffix mat-icon-button aria-label="Clear" (click)="Clearfilter('IPDNo')">
                                <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>


                    </form>
                </ng-container>
            </airmid-table>
        </div>
    </div>

</div>
