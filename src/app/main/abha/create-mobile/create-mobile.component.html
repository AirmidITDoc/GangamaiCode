<div class="page">
  <mat-card class="card">
    <mat-card-header>
      <mat-card-title>Create ABHA via Mobile</mat-card-title>
      <mat-card-subtitle>Quick registration using mobile OTP</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-stepper #stepper linear>
        <!-- Step 1: Mobile -->
        <mat-step [stepControl]="mobileForm" label="Mobile">
          <form [formGroup]="mobileForm" (ngSubmit)="sendOtp()">
            <mat-form-field appearance="outline" class="full">
              <mat-label>Mobile number</mat-label>
              <input matInput formControlName="mobile" maxlength="10" inputmode="numeric" />
              <mat-error *ngIf="mobileForm.get('mobile')?.hasError('pattern')">
                Enter a valid 10-digit mobile number
              </mat-error>
            </mat-form-field>
            <div class="actions">
              <button mat-flat-button color="primary" type="submit" [disabled]="loading || mobileForm.invalid">
                <mat-spinner *ngIf="loading" diameter="18"></mat-spinner>
                <span *ngIf="!loading">Send OTP</span>
              </button>
              <button mat-button matStepperNext type="button" [disabled]="!txnId">Next</button>
            </div>
          </form>
        </mat-step>

        <!-- Step 2: OTP -->
        <mat-step [stepControl]="otpForm" label="OTP">
          <p class="hint">Enter the 6-digit OTP sent to your mobile.</p>
          <app-otp-input [formControl]="$any(otpForm.get('otp'))"></app-otp-input>
          <div class="actions">
            <button mat-button matStepperPrevious type="button">Back</button>
            <button mat-flat-button color="primary" matStepperNext [disabled]="otpForm.invalid">Next</button>
          </div>
        </mat-step>

        <!-- Step 3: Profile -->
        <mat-step [stepControl]="profileForm" label="Profile">
          <form [formGroup]="profileForm" (ngSubmit)="submit()">
            <div class="grid">
              <mat-form-field appearance="outline">
                <mat-label>First name</mat-label>
                <input matInput formControlName="firstName" />
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Middle name</mat-label>
                <input matInput formControlName="middleName" />
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Last name</mat-label>
                <input matInput formControlName="lastName" />
              </mat-form-field>

              <mat-form-field appearance="outline">
                <mat-label>Day</mat-label>
                <input matInput formControlName="dayOfBirth" maxlength="2" inputmode="numeric" />
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Month</mat-label>
                <input matInput formControlName="monthOfBirth" maxlength="2" inputmode="numeric" />
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Year</mat-label>
                <input matInput formControlName="yearOfBirth" maxlength="4" inputmode="numeric" />
              </mat-form-field>

              <mat-form-field appearance="outline">
                <mat-label>Gender</mat-label>
                <mat-select formControlName="gender">
                  <mat-option *ngFor="let g of genders" [value]="g.v">{{ g.l }}</mat-option>
                </mat-select>
              </mat-form-field>

              <mat-form-field appearance="outline">
                <mat-label>Email (optional)</mat-label>
                <input matInput type="email" formControlName="email" />
              </mat-form-field>

              <mat-form-field appearance="outline" class="span-2">
                <mat-label>Address</mat-label>
                <input matInput formControlName="address" />
              </mat-form-field>

              <mat-form-field appearance="outline">
                <mat-label>PIN code</mat-label>
                <input matInput formControlName="pinCode" maxlength="6" inputmode="numeric" />
              </mat-form-field>
            </div>

            <div class="actions">
              <button mat-button matStepperPrevious type="button">Back</button>
              <button mat-flat-button color="primary" type="submit" [disabled]="loading || profileForm.invalid">
                <mat-spinner *ngIf="loading" diameter="18"></mat-spinner>
                <span *ngIf="!loading">Create ABHA</span>
              </button>
            </div>
          </form>
        </mat-step>
      </mat-stepper>
    </mat-card-content>
  </mat-card>
</div>
