<div id="report-generation" fusePerfectScrollbar class="page-layout simple left-sidebar inner-sidebar inner-scroll">
    <!-- HEADER -->
    <div class="top-header accent" fxLayout="row" fxLayoutAlign="space-between center">
        <div class="top-header-info">
            <div class="top-header-title">
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    REPORTS
                </span>
            </div>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="content full-height">
        <div class="center p-24 pb-56 full-height">
            <div class="content-card full-height" fxLayout="column" fxLayout.gt-sm="row" fxLayoutGap="16px">
                <!-- Left Panel (Tree View) -->
                <div fxFlex="35%" fxFlex.xs="100%" fxFlex.sm="50%" class="tree-panel">
                    <mat-card class="tree-card h-100-p">
                        <mat-card-header class="mb-3">
                            <mat-card-title>Report Categories</mat-card-title>
                        </mat-card-header>
                        <mat-divider></mat-divider>
                        <mat-card-content>
                            <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="example-tree">
                                <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding
                                    (click)="GetReportDeails(node)" [class.selected]="selectedNode === node">
                                    <button mat-icon-button></button>
                                    {{node.name }}
                                </mat-tree-node>
                                <mat-tree-node *matTreeNodeDef="let node; when: hasChild" matTreeNodePadding>
                                    <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'toggle ' + node.name">
                                        <mat-icon class="mat-icon-rtl-mirror">
                                            {{ treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
                                        </mat-icon>
                                    </button>
                                    {{ node.name }}
                                </mat-tree-node>
                            </mat-tree>
                        </mat-card-content>
                    </mat-card>
                </div>

                <!-- Right Panel (Form) -->
                <div fxFlex="75%" fxFlex.xs="100%" fxFlex.sm="50%" class="form-panel"
                    [ngClass]="{'disabled-div': !ReportName}">
                    <mat-card class="form-card h-100-p">
                        <mat-card-header class="mb-3">
                            <mat-card-title>Report Details</mat-card-title>
                        </mat-card-header>

                        <mat-divider></mat-divider>
                        <mat-card-content>
                            <form [formGroup]="_ReportService.userForm" class="report-form" fusePerfectScrollbar>
                                <!-- Report & User Info -->
                                <div class="report-header my-12" fxLayout="row" fxLayoutAlign="space-between center">
                                    <span class="h2">Selected Report: <strong>{{ ReportName }}</strong></span>
                                    <span class="h2">Current User: <strong>{{ UId }} | {{ UserName }}</strong></span>
                                </div>

                                <!-- Date Range -->
                                <div fxLayout="row" fxLayoutAlign="start none">
                                    <mat-form-field appearance="outline" class="date-field full-width">
                                        <mat-label>Enter a date range</mat-label>
                                        <mat-date-range-input [rangePicker]="picker">
                                            <input matStartDate formControlName="StartDate" placeholder="Start date">
                                            <input matEndDate formControlName="EndDate" placeholder="End date">
                                        </mat-date-range-input>
                                        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                                        <mat-date-range-picker #picker></mat-date-range-picker>
                                    </mat-form-field>
                                </div>

                                <!-- AutoComplete Fields -->
                                <div fxLayout="column" fxLayoutAlign="start none" class="autocomplete-section">
                                    <ng-container *ngIf="flagUserSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="User" [formGroup]="_ReportService.userForm"
                                                formControlName="UserId" placeholderText="Enter User"
                                                ApiUrl="Report/UserList/auto-complete?Keyword="
                                                (selectionChange)="SelectedUserObj($event)"
                                                (onClearSelection)="clearUser()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>
                                    <ng-container *ngIf="flagDoctorSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Doctor" [formGroup]="_ReportService.userForm"
                                                formControlName="DoctorId" placeholderText="Enter Doctor"
                                                ApiUrl="Report/DoctorList/auto-complete?Keyword="
                                                (selectionChange)="SelectedDoctorObj($event)"
                                                (onClearSelection)="clearDoctor()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>
                                    <ng-container *ngIf="flagRefDoctorSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="RefDoctor" [formGroup]="_ReportService.userForm"
                                                formControlName="RefDoctorId" placeholderText="Enter RefDoctor"
                                                ApiUrl="Report/RefDoctorList/auto-complete?Keyword="
                                                (selectionChange)="SelectedRefDoctorObj($event)"
                                                (onClearSelection)="clearRefDoctor()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>
                                    <ng-container *ngIf="flagServiceSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Service Name"
                                                [formGroup]="_ReportService.userForm" formControlName="ServiceId"
                                                placeholderText="Enter Service Name"
                                                ApiUrl="Report/ServiceList/auto-complete?Keyword="
                                                (selectionChange)="SelectedServiceObj($event)"
                                                (onClearSelection)="clearService()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>
                                    <ng-container *ngIf="flagDepartmentSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Department Name"
                                                [formGroup]="_ReportService.userForm" formControlName="DepartmentId"
                                                placeholderText="Enter Department Name"
                                                ApiUrl="Report/DepartmentList/auto-complete?Keyword="
                                                (selectionChange)="SelectedDepartmentObj($event)"
                                                (onClearSelection)="clearDepartment()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>
                                    <ng-container *ngIf="flagCashcounterSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Cash Counter"
                                                [formGroup]="_ReportService.userForm" formControlName="CashCounterId"
                                                placeholderText="Enter Cash Counter"
                                                ApiUrl="Report/CashCounterList/auto-complete?Keyword="
                                                (selectionChange)="SelecteCashCounterObj($event)"
                                                (onClearSelection)="clearCashCounter()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="flagGroupSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Group Name"
                                                [formGroup]="_ReportService.userForm" formControlName="GroupId"
                                                placeholderText="Select Group Name"
                                                ApiUrl="Report/GroupMasterList/auto-complete?Keyword="
                                                (selectionChange)="SelectedGroupObj($event)"
                                                (onClearSelection)="clearGroup()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="flagClassSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Class Name"
                                                [formGroup]="_ReportService.userForm" formControlName="ClassId"
                                                placeholderText="Select Class Name"
                                                ApiUrl="Report/ClassMasterList/auto-complete?Keyword="
                                                (selectionChange)="SelectedClassObj($event)"
                                                (onClearSelection)="clearClass()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="flagWardSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Ward Name" [formGroup]="_ReportService.userForm"
                                                formControlName="WardId" placeholderText="Select Ward Name"
                                                ApiUrl="Report/WardList/auto-complete?Keyword="
                                                (selectionChange)="SelectedWardObj($event)"
                                                (onClearSelection)="clearWard()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="flagDischargeTypeSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Discharge Type"
                                                [formGroup]="_ReportService.userForm" formControlName="dischargeTypeId"
                                                placeholderText="Select Discharge Type"
                                                ApiUrl="Report/DischargeTypeList/auto-complete?Keyword="
                                                (selectionChange)="SelectedDischargeObj($event)"
                                                 (onClearSelection)="clearDischarge()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="flagCompanySelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Company Name"
                                                [formGroup]="_ReportService.userForm" formControlName="CompanyId"
                                                placeholderText="Select Company Name"
                                                ApiUrl="Report/CompanyList/auto-complete?Keyword="
                                                (selectionChange)="SelectedCompanyObj($event)"
                                                 (onClearSelection)="clearCompany()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="flagStoreSelected">
                                        <div style="max-width: 265px;">
                                            <!-- <airmid-autocomplete label="Store Name"
                                                [formGroup]="_ReportService.userForm" formControlName="StoreId"
                                                placeholderText="Select Store Name"
                                                ApiUrl="Report/MStoreMasterList/auto-complete?Keyword="
                                                (selectionChange)="SelectedStoreObj($event)">
                                            </airmid-autocomplete> -->

                                            <airmid-dropdown label="Store Name" formControlName="StoreId"
                                                [formGroup]="_ReportService.userForm" [mode]="autocompletestore"
                                                (selectionChange)="SelectedStoreObj($event)">
                                            </airmid-dropdown>

                                        </div>
                                        <!-- <mat-error
                                            *ngIf="flagStoreRequired && _ReportService.userForm.get('StoreId')?.hasError('required') && _ReportService.userForm.get('StoreId')?.touched">
                                            Store selection is required for {{ReportName}}.
                                        </mat-error> -->
                                    </ng-container>

                                    <ng-container *ngIf="flagSupplierelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Supplier Name"
                                                [formGroup]="_ReportService.userForm" formControlName="SupplierId"
                                                placeholderText="Select Supplier Name"
                                                ApiUrl="Report/MSupplierMasterList/auto-complete?Keyword="
                                                (selectionChange)="SelectedSupplierObj($event)"
                                                (onClearSelection)="clearSupplier()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="flagPaymentSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Payment Mode"
                                                [formGroup]="_ReportService.userForm" formControlName="PaymentId"
                                                placeholderText="Select Payment Mode"
                                                ApiUrl="Report/PaymentList/auto-complete?Keyword="
                                                (selectionChange)="SelectedPaymentObj($event)"
                                                (onClearSelection)="clearPayment()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="flagDrugTypeSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Drug Type" [formGroup]="_ReportService.userForm"
                                                formControlName="DrugTypeId" placeholderText="Select Drug Type"
                                                ApiUrl="Report/MItemDrugTypeMasterList/auto-complete?Keyword="
                                                (selectionChange)="SelectedDrugTypeObj($event)"
                                                (onClearSelection)="cleardrugType()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="flagItemSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Item Name" [formGroup]="_ReportService.userForm"
                                                formControlName="ItemId" placeholderText="Select Item Name"
                                                ApiUrl="Report/MItemMasterList/auto-complete?Keyword="
                                                (selectionChange)="SelectedItemObj($event)"
                                                (onClearSelection)="clearItem()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="flagCreditReasonSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Credit Reason"
                                                [formGroup]="_ReportService.userForm" formControlName="CreditId"
                                                placeholderText="Select Credit Reason"
                                                ApiUrl="Report/MCreditReasonMasterList/auto-complete?Keyword="
                                                (selectionChange)="SelectedCreditObj($event)"
                                                (onClearSelection)="clearCredit()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="flagPaymentModeSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Payment Mode"
                                                [formGroup]="_ReportService.userForm" formControlName="paymentId"
                                                placeholderText="Select Payment Mode"
                                                ApiUrl="Report/MModeOfPaymentList/auto-complete?Keyword="
                                                (selectionChange)="SelectedPaymentObj($event)"
                                                (onClearSelection)="clearPayment()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="flagFromStoreSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-dropdown label="FromStore Name" formControlName="FromStoreId"
                                                [formGroup]="_ReportService.userForm" [mode]="autocompletestore"
                                                (selectionChange)="SelectedFromStoreObj($event)">
                                            </airmid-dropdown>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="flagToStoreSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-dropdown label="ToStore Name" formControlName="ToStoreId"
                                                [formGroup]="_ReportService.userForm" [mode]="autocompletestore"
                                                (selectionChange)="SelectedToStoreObj($event)">
                                            </airmid-dropdown>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="flagUnitSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Hospital Name"
                                                [formGroup]="_ReportService.userForm" formControlName="HospitalId"
                                                placeholderText="Select Hospital"
                                                ApiUrl="Report/HospitalMaster/auto-complete?Keyword="
                                                (selectionChange)="SelectedHospitalObj($event)"
                                                (onClearSelection)="ClearHospital()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="FlaExpHeadSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Expenses Head"
                                                [formGroup]="_ReportService.userForm" formControlName="expHeadId"
                                                placeholderText="Select Expenses Head "
                                                ApiUrl="Report/Expensesheadmaster/auto-complete?Keyword="
                                                (selectionChange)="SelectedExpheadObj($event)"
                                                (onClearSelection)="resetExpHead()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="FlaExpCategorySelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Expenses Category"
                                                [formGroup]="_ReportService.userForm" formControlName="expCategoryId"
                                                placeholderText="Select Expenses category "
                                                ApiUrl="Report/MExpensesCategoryMaster/auto-complete?Keyword="
                                                (selectionChange)="SelectedExpCatObj($event)"
                                                (onClearSelection)="resetExpCat()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                     <ng-container *ngIf="flagExecSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Executive Name"
                                                [formGroup]="_ReportService.userForm" formControlName="ExecutiveId"
                                                placeholderText="Select Executive"
                                                ApiUrl="Report/MCompanyEmployeInfo/auto-complete?Keyword="
                                                (selectionChange)="SelectedExecObj($event)"
                                                (onClearSelection)="clearExecutive()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>
                                    
                                     <ng-container *ngIf="flagLoginUserSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Login User Name"
                                                [formGroup]="_ReportService.userForm" formControlName="LoginUserId"
                                                placeholderText="Select Login User"
                                                ApiUrl="Report/LoginUser/auto-complete?Keyword="
                                                (selectionChange)="SelectedLoginUserObj($event)"
                                                (onClearSelection)="clearLoginUser()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="flagPatientSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Patient Name"
                                                [formGroup]="_ReportService.userForm" formControlName="LabPatientId"
                                                placeholderText="Select Patient"
                                                ApiUrl="Report/SearchPatient/auto-complete?Keyword="
                                                (selectionChange)="SelectedPatientObj($event)"
                                                (onClearSelection)="clearPatientSearch()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                     <ng-container *ngIf="flagRegSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Reg No"
                                                [formGroup]="_ReportService.userForm" formControlName="RegNo"
                                                placeholderText="Select RegNo"
                                                ApiUrl="Report/SearchRegNo/auto-complete?Keyword="
                                                (selectionChange)="SelectedRegObj($event)"
                                                (onClearSelection)="clearRegNo()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="flagPatientTypeSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="Patient Type"
                                                [formGroup]="_ReportService.userForm" formControlName="PatientType"
                                                placeholderText="Select PatientType"
                                                ApiUrl="Report/PatientTypeMaster/auto-complete?Keyword="
                                                (selectionChange)="SelectedPatientTypeObj($event)"
                                                (onClearSelection)="clearPatientType()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>

                                    <ng-container *ngIf="flagstatusSelected">
                                        <div style="max-width: 265px;">
                                            <airmid-autocomplete label="status"
                                                [formGroup]="_ReportService.userForm" formControlName="status"
                                                placeholderText="Select status"
                                                ApiUrl="Report/LabReportStatus/auto-complete?Keyword="
                                                (selectionChange)="SelectedstatusObj($event)"
                                                (onClearSelection)="clearstatus()">
                                            </airmid-autocomplete>
                                        </div>
                                    </ng-container>
                                    <!-- sales dd remaining -->
                                </div>

                                <div fxLayout="row" fxLayoutAlign="start none">
                                    <span *ngIf="flagOPIPTypeSelected"
                                        style="font-weight: bold;margin-left: 2%;">Patient Type</span>
                                    <mat-radio-group aria-label="Select an option" formControlName="OPIPType"
                                        *ngIf="flagOPIPTypeSelected" style="margin-left:2%;" name="OPIPType">

                                        <mat-radio-button value="0">OP</mat-radio-button>
                                        <mat-radio-button value="1">IP</mat-radio-button>
                                        <mat-radio-button value="2">All</mat-radio-button>
                                    </mat-radio-group>
                                </div>

                                <div fxLayout="row" fxLayoutAlign="start none">
                                    <span *ngIf="flagTypeSelected"
                                        style="font-weight: bold;margin-left: 2%;">Type</span>
                                    <mat-radio-group aria-label="Select an option" formControlName="type"
                                        *ngIf="flagTypeSelected" style="margin-left:2%;" name="type">

                                        <mat-radio-button value="0">Summary</mat-radio-button>
                                        <mat-radio-button value="1">Detail</mat-radio-button>
                                    </mat-radio-group>
                                </div>

                                <!-- Print Button -->
                                <div fxLayout="row" fxLayoutAlign="start none">
                                    <button mat-fab extended color="primary" [disabled]="!ReportName"
                                        (click)="CallReportData(1)">
                                        <mat-icon>print</mat-icon>
                                        <span>Print</span>
                                    </button>
                                    <button mat-fab extended color="primary" [disabled]="!ReportName"
                                        (click)="CallReportData(2)">
                                        <mat-icon>insert_drive_file</mat-icon>
                                        <span>Export Excel</span>
                                    </button>
                                </div>



                            </form>
                        </mat-card-content>

                        <mat-card-footer>
                            <div fxLayout="row" fxLayoutAlign="start Left" class="footer-section">
                                <span class="text-sm text-gray-600" style="font-size: 18px;">
                                    <strong>Report Summary:</strong>{{ ReportSummary }}
                                </span>
                            </div>
                        </mat-card-footer>
                    </mat-card>


                </div>
            </div>
        </div>
    </div>
</div>
