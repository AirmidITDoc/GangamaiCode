<div [formGroup]="itemForm" fxLayout="row" fxLayoutGap="10px" class=" store-unit-dropdown-container">
    <airmid-dropdown label="Unit" formControlName="unitId" [formGroup]="itemForm"
        (selectionChange)="onChange($event,'Unit')" [validations]="getValidationMessages().unitId" [value]="unitId"
        [options]="Units" TextField="unitName" ValueField="unitId" fxFlex="50%">
    </airmid-dropdown>
     <airmid-dropdown label="Store" formControlName="storeId" [formGroup]="itemForm"
        (selectionChange)="onChange($event,'Store')" [validations]="getValidationMessages().storeId" [value]="storeId"
        [options]="Stores" TextField="storeName" ValueField="storeId" fxFlex="50%">
    </airmid-dropdown>
</div>
