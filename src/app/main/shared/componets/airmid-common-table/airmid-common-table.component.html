<div class="mb-2">
    <button mat-raised-button color="primary" (click)="exportExcel()"
        *ngIf="sampleReportDataSource.filteredData.length>0">
        Export Excel
    </button>
</div>

<div class="mat-elevation-z8">
    <table mat-table [dataSource]="sampleReportDataSource" *ngIf="sampleReportDataSource.filteredData.length>0">
        <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
            <th mat-header-cell *matHeaderCellDef>
                {{column}}
            </th>
            <td mat-cell *matCellDef="let element">
                {{element[column]}}
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"> </tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"> </tr>
    </table>
    <mat-paginator [pageSize]="10" [pageSizeOptions]="[10,25,50,100]" showFirstLastButtons>
    </mat-paginator>
</div>
