  
        <div class="simple page-layout modal-wrapper grid-container"> 
            <div class="modal-header accent">
                <div class="modal-header-content">
                    <div class="modal-header-title">
                        <button mat-icon-button class="sidebar-toggle mr-12" style="color: white;">
                            <mat-icon>menu</mat-icon>
                        </button>
        
                        <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}"
                            style="color: white;">
                           Patient Search
                        </span>
                    </div>
                    <div class="modal-header-right">
                        <div class="close-icon">
                            <button mat-icon-button tabIndex="-1" [mat-dialog-close]="true" aria-label="Close dialog"
                                matTooltip="Close">
                                <mat-icon>close</mat-icon>
                            </button>
                        </div>
                    </div>
                </div>
            </div> 
            <div class="modal-body">
                 <div class="modal-body-container">
                <div class="h-100-p" fxLayout="column">
                    <div class="modal-card-container">
                        <form [formGroup]="SearchGroupForm">
                            <div fxLayout="column" class="gap-8 h-100-p">
                                <div fxFlexFill fxLayout="column">
                                    <airmid-autocomplete fxFlex label="Search Reg No / Patient Name / Mobile No" [formGroup]="SearchGroupForm"
                                        formControlName="RegId" placeholderText="Search Reg No / Patient Name / Mobile No"
                                        ApiUrl="OutPatient/auto-complete?Keyword="
                                        (selectionChange)="getSelectedObj($event)"></airmid-autocomplete>
                                </div>
                            </div>
                        </form> 
                    </div>
                    <div class="modal-card-container">
                        <div fxLayout="column" class="gap-8 h-100-p">
                            <mat-card fxFlex.gt-sm="100%" fxFlex>
                                <div fxFlexFill fxLayout="column" fxLayout.gt-xs="row" fxLayoutGap="5px">
                                    <div fxFlex.gt-sm="100%" fxFlex>
                                        <div fxlayout="row" style="background-color: white">
                                            <div class="patient-info-patient my-8">
                                                <div class="patient-patient-info-title">
                                                    <span style="font-weight: 700">Patient
                                                        Information</span>
                                                </div> 
                                                  <hr>
                                                <div class="sales-patient-info" fxFlexFill fxLayout="row"
                                                    fxLayoutAlign="space-between center" class="patient-info">
                                                    <div class="patient-sub">
                                                        <div class="patient-info-row patient-info-1-111 pt-8" fxLayout="row"
                                                       fxLayoutAlign="space-between">
                                                            <div fxLayout="column" fxLayoutGap="6px">
                                                                <div class="patient-col">
                                                                    <span class="patient-col-key">UHID No</span>
                                                                    <span>:</span>
                                                                    <span class="patient-col-value">{{registerObj?.regNo}}</span>
                                                                </div>

                                                                  <div class="patient-col">
                                                                    <span class="patient-col-key">Patient Name</span>
                                                                    <span>:</span>
                                                                    <span class="patient-col-value">{{registerObj?.patientName}}</span>
                                                                </div> 
                                                            </div>
            
                                                            <div fxLayout="column" fxLayoutGap="6px"> 
            
                                                                <div class="patient-col">
                                                                    <span class="patient-col-key">Mobile No</span>
                                                                    <span>:</span>
                                                                    <span class="patient-col-value">{{registerObj?.mobileNo
                                                                        }}</span>
                                                                </div>
                                                                <div class="patient-col">
                                                                    <span class="patient-col-key">Email</span>
                                                                    <span>:</span>
                                                                    <span
                                                                        class="patient-col-value">{{registerObj?.emailId}}</span>
                                                                </div>   
                                                            </div>
            
                                                           <div fxLayout="column" fxLayoutGap="6px">

                                                             <div class="patient-col">
                                                                    <span class="patient-col-key">Age </span>
                                                                    <span>:</span>
                                                                    <span class="patient-col-value">{{registerObj?.ageYear}}Y |
                                                                        {{registerObj?.ageMonth}}M | {{registerObj?.ageDay}}D
                                                                    </span>
                                                                </div>

                                                                   
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div> 
                            </mat-card>

                            <form [formGroup]="SearchGroupForm">
                            <div fxLayout="column" class="gap-8 h-100-p">
                                <div fxFlexFill fxLayout="column">
                                <airmid-textbox fxFlex label="Mobile No" formControlName="mobileNo" 
                                placeholder="Enter 10 digit Mobile No" [formGroup]="SearchGroupForm"  
                                   [maxLength]="10"  [validations]="getValidationMessages().mobileNo"
                                (keypress)="keyPressAlphanumeric($event)"></airmid-textbox>   

                                <airmid-textbox fxFlex label="Mail Id" formControlName="emailId" placeholder="Enter Mail Id"
                                [formGroup]="SearchGroupForm"   type="email"  [validations]="getValidationMessages().emailId"></airmid-textbox> 
                            
                                <airmid-textbox fxFlex  label="NationalId \ Aadhaar No" formControlName="aadharCardNo" placeholder="Enter NationalID \ Aadhaar No"
                                [formGroup]="SearchGroupForm"   type="text"  [validations]="getValidationMessages().aadharCardNo"
                                [maxLength]="Is9_Digit_National_Id ? 9 : 12"  (keypress)="keyPressAlphanumeric($event)"></airmid-textbox>
                                </div>
                            </div>
                            </form> 
                        </div>
                    </div> 
                </div>
                </div> 
            </div> 
        
            <div class="modal-footer"  fxLayoutAlign="end">  
                <div class="modal-footer-buttons" fxLayoutGap="6px" >
                    <button class="btn btn-danger-outline" (click)="OnClose()">Close</button>
                    <button class="btn btn-primary"  (click)="OnSave()">Save</button>
                </div> 
            </div>
        </div>
