<div class="modal-wrapper grid-container inOperMain">
    <div class="modal-header accent inOperHeader">
        <div class="modal-header-content">
            <div class="modal-header-title">
                <!-- <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}"> Consent Form
                </span> -->
                <span [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}"> {{ data.title }}
                </span>
            </div>
            <div class="modal-header-right">
                <div class="close-icon">
                    <button mat-icon-button tabIndex="-1" aria-label="Close dialog" (click)="onClose()"
                        matTooltip="Close">
                        <mat-icon>close</mat-icon>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-body inOperMiddle" fusePerfectScrollbar>
        <div class="modal-body-container">
            <form [formGroup]="myForm">
                <!-- <input type="hidden" name="ConsentId" formControlName="ConsentId"> -->
                <div fxLayout="column" fxLayoutGap="12px grid">
                    <mat-card *ngIf="hideFlag">
                        <div fxLayout="row" fxLayoutGap="16px" fxLayoutAlign="start center center">
                            <div class="radio-container">
                                <mat-radio-group formControlName="PatientType" [(ngModel)]="vSelectedOption"
                                    (change)="onChangePatientType($event)">
                                    <mat-radio-button value="OP" [disabled]="vCheckBox == true" *ngIf="data?.labelType !== 'Nursing'">OP</mat-radio-button>
                                    <mat-radio-button value="IP">IP</mat-radio-button>
                                </mat-radio-group>
                            </div>

                            <div class="input-container gap-8" fxFlex *ngIf="!vCheckBox">
                                <airmid-autocomplete *ngIf="myForm.get('PatientType').value == 'OP'" lbl="RgId"
                                    [formGroup]="myForm" formControlName="RegID" label="OP-RegNo/FirstName/LastName"
                                    fxFlex="60" placeholderText="OP-RegNo/FirstName/LastName"
                                    ApiUrl="VisitDetail/search-patient?Keyword="
                                    (selectionChange)="getSelectedObjOP($event)" TextField="formattedText"
                                    ValueField="regId">
                                </airmid-autocomplete>

                                <airmid-autocomplete *ngIf="myForm.get('PatientType').value == 'IP'" lbl="RgId"
                                    [formGroup]="myForm" formControlName="RegID" label="IP-RegNo/FirstName/LastName"
                                    fxFlex="60" placeholderText="IP-RegNo/FirstName/LastName"
                                    ApiUrl="Admission/search-patient?Keyword="
                                    (selectionChange)="getSelectedObjIP($event)" TextField="formattedText"
                                    ValueField="admissionID">
                                </airmid-autocomplete>
                            </div>

                            <div class="input-container gap-8" fxFlex *ngIf="vCheckBox">

                                <airmid-autocomplete lbl="RegID" [formGroup]="myForm" formControlName="RegID"
                                    fxFlex="50%" placeholderText="Search DC-RegNo/Patient Name/Mobile No"
                                    label="Search DC-Reg No / Patient Name / Mobile No(AD)"
                                    ApiUrl="Admission/Dischargesearch-patient?Keyword="
                                    (selectionChange)="getSelectedObjDC($event)" ValueField="admissionID"
                                    TextField="formattedText">
                                </airmid-autocomplete>

                            </div>

                            <mat-checkbox fxFlex="15%" formControlName="IsDischargedit"
                                (change)="getDischargedList($event)">IsDischarged
                            </mat-checkbox>

                        </div>

                    </mat-card>

                   
 <div class="modal-card-container mt-0" style="margin-top: -4px;">
                        <div fxFlex.gt-sm="100%" fxFlex>
                            <mat-card fxFlex.gt-sm="100%" fxFlex style="padding: 2px 10px;">
                                <div class="patient-info-sales">
                                    <div class="patient-info-title border-bottom pb-1 mb-1">
                                        <span class="h1 m-0" style="line-height: normal;">Patient Information</span>
                                    </div>
                                    <div class="Ipd-patient-info w-100-p">
                                        <app-patient-information [uhidNo]="registerObj?.regNo"
                                            [patientName]=" (registerObj?.firstName || '') +
                                        (registerObj?.middleName ? ' ' + registerObj.middleName : '') +
                                        (registerObj?.lastName ? ' ' + registerObj.lastName : '')
                                        || registerObj?.patientName
                                        " [doctorName]="registerObj?.doctorName"
                                            [departmentName]="registerObj?.departmentName" [doa]="registerObj?.admissionDate"
                                            [ipdNo]="registerObj?.ipdNo || registerObj?.ipdno"
                                            [ageString]="(registerObj?.age !== undefined ? registerObj?.age + 'Y|' + registerObj?.ageMonth + 'M|' + registerObj?.ageDay + 'D | ' + registerObj?.genderName : '')"
                                            [refDocName]="registerObj?.refDocName"
                                            [wardBedName]="(registerObj?.roomName && registerObj?.bedName) ? (registerObj?.roomName + ' | ' + registerObj?.bedName) : ''"
                                            [patientType]="registerObj?.patientType" [tariffName]="registerObj?.tariffName"
                                            [companyName]="registerObj?.companyName"></app-patient-information>
                                    </div>
                                </div>
                            </mat-card>
                        </div>
                    </div>

                    

                    <!-- Department, Template, Language -->
                    <mat-card class="mt-16" style="padding: 10px;" fxLayout="row wrap" fxLayoutGap="16px">
                        <airmid-dropdown fxFlex="40%" label="Template" formControlName="ConsentTempId"
                            [formGroup]="myForm" (selectionChange)="onTemplateSelect($event)" ValueField="consentId"
                            TextField="consentName"
                            [ApiUrl]="'NursingConsent/GetMConsentMasterList?ConsentTypeName=' + ConsentTy"></airmid-dropdown>

                        <div fxFlex="auto">
                            <button class="btn btn-primary" (click)="addTemplateDescription()"
                                [disabled]="isButtonDisabled">Add</button>
                        </div>
                    </mat-card>

                    <!-- Template Description Editor -->
                    <mat-card class="mt-16" style="padding: 10px;">
                        <form [formGroup]="myForm">
                            <airmid-editor label="Consent Details" formControlName="ConsentDescription"
                                [formGroup]="myForm" (valueChange)="onEditorValueChange($event)">
                            </airmid-editor>
                        </form>
                    </mat-card>
                </div>

                <div class="modal-footer inOperfooter" style="margin-top: 10px;">
                    <div class="footer-navigation-container">
                        <div class="modal-footer-buttons inOperbtn">
                            <button class="btn btn-danger-outline" (click)="onClear(false)">Close</button>
                            <button class="btn btn-primary " color="accent" (click)="onSubmit()">
                                <span>Save</span>
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
