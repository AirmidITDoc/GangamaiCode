<div class="relative-container">

  <!-- INPUT BOX + MIC OUTSIDE -->
  <div class="input-mic-row">

    <!-- Main Chip / Input Box -->
    <div class="chip-wrapper">

      <!-- Selected Chips -->
      <div class="chip" *ngFor="let chip of chips">

        <span>
          {{ chip[displayKey] }}
        </span>

        <button type="button" class="remove-btn" (click)="removeChip(chip)">
          ×
        </button>

      </div>

      <!-- Input -->
      <div class="input-container">

        <input [(ngModel)]="inputValue" (keydown)="onKeyDown($event)" (input)="filterOptions()" (focus)="onInputFocus()"
          (blur)="hideDropdownWithDelay()" [placeholder]="placeholder" autocomplete="off" />

      </div>

    </div>

    <button mat-icon-button type="button" (click)="startSpeechRecognition()" aria-label="Toggle speech recognition"  [class.listening]="isListening"
        [disabled]="!speechSupported" aria-label="Speech recognition">

     <mat-icon>{{ isListening ? 'mic_off' : 'mic' }}</mat-icon>

    </button>


  </div>


  <div class="autocomplete-list" *ngIf="showDropdown">

    <div class="autocomplete-item" *ngFor="let option of filteredOptions; let i = index"
      [class.active]="i === focusedIndex" (mousedown)="selectOption(option)">

      {{ option[displayKey] }}

    </div>

    <div *ngIf="filteredOptions.length === 0" class="no-results">

      No results found

    </div>

  </div>

</div>
