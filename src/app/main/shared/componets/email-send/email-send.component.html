<div class="modal-page page-layout inner-scroll" >
    <div class="modal-wrapper grid-container">
        <div class="modal-header accent">
            <div class="modal-header-content">
                <div class="modal-header-title">
                    <mat-icon class="logo-icon mr-16" [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}"
                        style="color: white;">account_box
                    </mat-icon>
                    <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}"
                        style="color: white;">
                       Mail Information
                    </span>
                </div>

                <div class="modal-header-right" fxLayout="row" fxLayoutGap="10px">
                     <button mat-icon-button (click)="onClose()" tabIndex="-1" aria-label="Close dialog">
                <mat-icon>close</mat-icon>
            </button>
                    <!-- <div class="comman-date-container">
            <app-common-date [screenFrom]="screenFromString"
              (dateTimeEventEmitter)="getDateTime($event)"></app-common-date>
          </div> -->
                </div>
            </div>
        </div>


        <div class="modal-body">
            <div fxLayout="column" class="gap-8 h-100-p">
                <div class="modal-body-container">
                    <div class="modal-card-container">
                        <form [formGroup]="EmailFrom">
                            <div fxLayout="column" fxLayoutGap="6px">

                               <airmid-textbox fxFlex label="To Mail Id" formControlName="ToMailId" placeholder="To Mail Id"
                                [formGroup]="EmailFrom" id="ToMailId" type="email" required></airmid-textbox> 

                                <airmid-textbox fxFlex label="To Mail Id CC" formControlName="CCName" placeholder="CC Mail Id"
                                [formGroup]="EmailFrom" id="CCName" type="email" ></airmid-textbox> 
                            
                                <airmid-textbox fxFlex  label="To Mail Id bcc" formControlName="bccName" placeholder="To Mail Id bcc"
                                [formGroup]="EmailFrom" id="bccName" type="email" ></airmid-textbox>

                                 <airmid-textbox fxFlex  label="Subject" formControlName="Subject" placeholder="Subject"
                                [formGroup]="EmailFrom" id="Subject" type="text" ></airmid-textbox> 


                                <mat-form-field appearance="outline" fxFlex>
                                    <mat-label>Body</mat-label>
                                    <textarea rows="6" matInput name="Body" formControlName="Body" placeholder="Write......"
                                        id="Body" type="text"  required ></textarea>
                                </mat-form-field>  
                            </div>
                        </form>
                    </div> 
                </div>
            </div>
        </div> 
        <div class="modal-footer">
            <div class="modal-footer-buttons" fxLayout="row" fxLayoutAlign="end" fxLayoutGap="6px">
                <button class="btn btn-primary" (click)="OnSend()">Send</button>
                <button class="btn btn-danger-outline" (click)="OnReset()">Reset</button>
            </div>
        </div>
    </div>
</div>
